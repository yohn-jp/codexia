packages:
  - packages/*
  - modules/*
  - app
  - profiles/*
  - scripts/ci/evidence
catalogs:
  # Types and test/build-only dependencies remain in devDependencies.
  development:
    '@types/react': ^19.3.2
    '@types/react-dom': ^19.3.0
  # Catalog ownership does not override package.json dependencies boundaries.
  production:
    '@better-auth/oauth-provider': 1.7.28
    '@better-auth/passkey': 1.7.28
    better-auth: 1.7.28
    react: ^19.3.1
    react-dom: ^19.3.1
    yaml: ^2.9.1
    zod: 4.6.7
allowBuilds:
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
# Transformers uses sharp transitively; keep the native dependency on a patched release.
overrides:
  "@huggingface/transformers>sharp": 0.35.5
