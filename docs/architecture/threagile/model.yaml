individual_risk_categories:
  BOLA project isolation:
    id: codexia-bola-project-isolation
    description: Project and object authorization must remain bound at every API read and mutation.
    impact: Cross-project access could expose or alter strictly confidential manuscript data.
    asvs: V4 - Access Control
    cheat_sheet: https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
    action: Reject object access unless principal, project, object, revision and effect all match.
    mitigation: Central Fastify admission and the PostgreSQL project scope remain authoritative.
    check: REQ-AUTH-002; REQ-DATA-003; negative cross-project API tests against a disposable PostgreSQL database.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Review request object identifiers and project-scoped SQL reads/writes for fail-closed authorization.
    risk_assessment: Design risk retained until independent implementation and runtime tests prove the boundary.
    false_positives: Read-only access to the same public design artifact is not manuscript access.
    model_failure_possible_reason: false
    cwe: 639
    risks_identified:
      Cross-project manuscript access at the API:
        severity: high
        exploitation_likelihood: likely
