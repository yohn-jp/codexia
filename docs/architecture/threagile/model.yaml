  False database receipt:
    id: codexia-false-db-receipt
    description: A mutation receipt must be evidence of a committed PostgreSQL revision.
    impact: A false receipt can cause the author to lose or overwrite uncommitted manuscript changes.
    asvs: V8 - Data Protection
    cheat_sheet: https://owasp.org/www-project-application-security-verification-standard/
    action: Confirm the transaction commit and durable revision receipt before reporting success.
    mitigation: PostgreSQL owns the revision and receipt transaction; response loss remains reconcilable by operation identity.
    check: REQ-DATA-002; REQ-API-002; injected database failure and response-loss receipt tests.
    function: architecture
    stride: repudiation
    detection_logic: Trace receipt creation to the same PostgreSQL transaction and reject success on rollback or unknown commit.
    risk_assessment: This model describes the failure mode and does not assert current runtime proof.
    false_positives: A committed transaction with a delayed response is unknown until reconciled, not a failed or false success.
    model_failure_possible_reason: false
    cwe: 345
    risks_identified:
      Uncommitted manuscript mutation reported as successful:
        severity: critical
        exploitation_likelihood: unlikely
        exploitation_impact: very-high
        data_breach_probability: possible
        data_breach_technical_assets:
          - codexia-api
          - postgresql
        most_relevant_data_asset: manuscript
        most_relevant_technical_asset: codexia-api
