  Backup key and restore integrity:
    id: codexia-backup-key-restore
    description: Off-VM backup integrity, independent receipts and age key separation must be maintained.
    impact: Key loss, ciphertext substitution or a false receipt can make a recovery point unusable or unsafe.
    asvs: V8 - Data Protection
    cheat_sheet: https://age-encryption.org/
    action: Keep age recovery keys and S3 credentials outside public artifacts; compare downloaded bytes and protected receipt before isolated drill.
    mitigation: Reuse backup.sh, host lock, age-encrypted v2 artifact and isolated restore drill; Web and MCP cannot restore production.
    check: REQ-OPS-003; REQ-OPS-004; REQ-OPS-005; BACKUP-S3-001 through BACKUP-S3-005 remain runtime acceptance.
    function: operations
    stride: tampering
    detection_logic: Compare backup ID, source identity, ciphertext digest, manifest and independent receipt; exercise key loss and altered objects.
    risk_assessment: S3 upload, retrieval and isolated restore remain unimplemented targets until separate execution evidence exists.
    false_positives: Object storage's ETag or checksum alone is not an independent restore receipt.
    model_failure_possible_reason: false
    cwe: 522
    risks_identified:
      Backup ciphertext or key separation failure:
        severity: critical
        exploitation_likelihood: unlikely
        exploitation_impact: very-high
        data_breach_probability: possible
        data_breach_technical_assets:
          - backup-executor
          - s3-storage
        most_relevant_data_asset: backup-ciphertext
        most_relevant_technical_asset: backup-executor
