threagile_version: 1.0.0

title: Codexia architecture and threat inventory
date: 2026-11-23
author:
  name: Codexia maintainers
  homepage: https://github.com/yohn-jp/codexia
management_summary_comment: >
  Static design-time risk inventory for the approved Codexia architecture.
  Risk tracking is unchecked until the corresponding implementation and runtime
  verification are independently evidenced; this model does not certify them.
business_criticality: critical
business_overview:
  description: >
    Codexia stores an author's manuscript and related creative project data.
    PostgreSQL is the only canonical manuscript authority.
  images:
technical_overview:
  description: >
    Desktop Web and native iOS client targets use Cloudflare edge routing and
    the authenticated Fastify API. External AI clients use the restricted MCP
    adapter. Protected GitHub Actions, Tailscale, SSH and Ansible form a
    separate operations path.
  images:
questions:
  Is Cloudflare Access the Codexia object-authorization authority?: >
    No. API admission independently validates the principal, project, object,
    revision and effect.
  Is the S3-compatible backup path certified as deployed or restorable?: >
    No. S3 transfer and isolated restore remain design targets and require
    independent implementation evidence.
  Is public Pages output permitted to contain credentials or private data?: >
    No. Only static public design material is in scope; credentials and private
    repository data are excluded.
abuse_cases:
  Cross-project manuscript access: >
    An authenticated principal substitutes an object identifier from another
    project to read or mutate manuscript data.
  MCP issuer or resource confusion: >
    A client presents a token at the wrong issuer or resource boundary or uses
    a grant broader than its assigned project and scope.
  Session or reader scope confusion: >
    A browser session, MCP client, owner, or public reader is confused with a
    different principal or disclosure scope.
  False persistence receipt: >
    A caller is told that a manuscript mutation committed when PostgreSQL did
    not commit the corresponding revision and receipt.
  Edge and operator plane confusion: >
    Public Cloudflare routing is confused with the protected Tailscale, SSH,
    Ansible and host-operations plane.
  Backup key or restore compromise: >
    Ciphertext, object identity, age recovery keys, credentials or independent
    restore receipts are exposed or confused.
  Public Pages disclosure: >
    A generated public documentation artifact contains a credential or private
    source material.
security_requirements:
  Object authorization: >
    Bind every request to the authenticated principal and authorized project,
    object, revision and effect. Fail closed when any scope is missing.
  Restricted MCP: >
    Limit MCP to assigned-project read, compute and propose operations. Keep
    approval, apply, owner-only operations and deployment outside MCP.
  Canonical persistence receipt: >
    Treat a mutation as confirmed only after the PostgreSQL transaction commits
    the revision and its durable receipt.
  Separate edge and operations planes: >
    Cloudflare UI/API routing does not grant project authorization or host
    administration. Keep the Tailscale/SSH/Ansible path protected.
  Backup separation: >
    Encrypt backup artifacts with age before off-VM transfer. Keep recovery keys
    and S3 credentials outside public artifacts and verify downloaded bytes and
    an independent receipt before isolated restore.
  Public artifact hygiene: >
    Scan public architecture source and generated material for credential-like
    values and exclude private repository data.
tags_available:
  - codexia
  - architecture-model
  - public-static-design
  - age-encrypted-backup

data_assets:
