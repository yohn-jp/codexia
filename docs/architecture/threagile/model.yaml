    description: Canonical author manuscript, revisions, Knowledge, Evidence and project records
    usage: business
    tags:
      - codexia
    origin: Author
    owner: Codexia author
    quantity: many
    confidentiality: strictly-confidential
    integrity: mission-critical
    availability: critical
    justification_cia_rating: >
      PostgreSQL is the sole canonical authority for manuscript and project
      records. Cross-project isolation and durable revision receipts are required.
  Session and OAuth state:
    id: session-state
    description: Better Auth sessions, OAuth grants and server-side identity state
    usage: business
    tags:
      - codexia
    origin: Codexia API
    owner: Codexia author
    quantity: very-few
    confidentiality: strictly-confidential
    integrity: critical
    availability: critical
    justification_cia_rating: >
      Session and grant state determines access to the author and assigned MCP
      client surfaces and must not be confused across principals.
  Age-encrypted backup artifacts:
    id: backup-ciphertext
    description: Age-encrypted PostgreSQL, history and manifest artifacts
    usage: devops
    tags:
      - age-encrypted-backup
    origin: Protected Codexia backup executor
    owner: Codexia operators
    quantity: many
    confidentiality: confidential
    integrity: mission-critical
    availability: critical
    justification_cia_rating: >
      Ciphertext is a disaster-recovery input. Integrity, backup identity,
      independent receipt and key separation must be verified before restore.
  Public design artifacts:
    id: public-design
    description: Approved architecture diagrams and public design documentation
    usage: devops
    tags:
      - public-static-design
    origin: Public repository
    owner: Codexia maintainers
    quantity: many
    confidentiality: public
    integrity: critical
    availability: important
    justification_cia_rating: >
      These static documents are intentionally public, but must not contain
      credentials, private repository data or authorization claims.

