  Edge and operator plane confusion:
    id: codexia-edge-operations-plane
    description: Public Cloudflare routing must not be confused with the protected host operations path.
    impact: Confusion can expose host administration or treat Access identity as Codexia object authorization.
    asvs: V4 - Access Control
    cheat_sheet: https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
    action: Keep Workers/Tunnel routing, Fastify project authorization and Tailscale/SSH/Ansible administration separate.
    mitigation: Cloudflare carries UI/API traffic only; host state changes use the protected GitHub Actions to Ansible path.
    check: REQ-EXT-001; REQ-OPS-001; REQ-OPS-002; verify deny of web, MCP and Cloudflare access to operator actions.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Check for any route from public UI/MCP to SSH, Ansible, backup executor or Tailscale administration.
    risk_assessment: Edge configuration and production network policies require separate runtime evidence.
    false_positives: HTTPS API forwarding does not itself grant a host command or owner permission.
    model_failure_possible_reason: false
    cwe: 284
