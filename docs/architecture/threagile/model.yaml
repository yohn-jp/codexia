  Public Pages disclosure:
    id: codexia-public-pages-disclosure
    description: Public architecture artifacts must not disclose credentials or private repository data.
    impact: A public secret can enable unauthorized access; private source disclosure can expose author data.
    asvs: V14 - Configuration
    cheat_sheet: https://owasp.org/www-project-application-security-verification-standard/
    action: Publish only allowlisted static design and scan source inputs and generated public files for secrets.
    mitigation: Keep one Repository Audit Pages publisher, public static diagrams and no API, MCP, VM or repository credentials.
    check: REQ-EXT-002; REQ-QUAL-002; injected secret-like artifact must fail the G5 public-artifact scanner.
    function: development
    stride: information-disclosure
    detection_logic: Scan the threat model, LikeC4 source, generated Mermaid and architecture docs before publishing.
    risk_assessment: Static generation is not an authorization boundary; only the public artifact allowlist is in scope.
    false_positives: Deliberately public architecture labels are not private source or credentials.
    model_failure_possible_reason: false
    cwe: 200
