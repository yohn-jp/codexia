      <path d="M22 158 C57 142 93 145 128 173 C168 142 200 142 234 158 L234 207 C195 190 159 201 128 226 C91 200 60 189 22 207 Z" fill="#BD854D"/>
      <path d="M23 154 C59 137 96 145 128 172 C164 145 200 138 233 154 L233 202 C190 186 162 200 128 221 C94 200 66 186 23 202 Z" fill="#F1C67D"/>
