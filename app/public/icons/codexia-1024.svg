      <path d="M107 138 C134 83 168 50 196 29" fill="none" stroke="#6A3F47" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M107 138 C131 97 164 57 193 30" fill="none" stroke="#FFE2A5" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M140 86 L162 81 M129 101 L150 99 M154 66 L174 62" fill="none" stroke="#6A3F47" stroke-width="2" stroke-linecap="round"/>
      <path d="M107 138 L98 159" fill="none" stroke="#BD854D" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M107 138 L100 154" fill="none" stroke="#FFE2A5" stroke-width="1.5" stroke-linecap="round"/></g></svg>
