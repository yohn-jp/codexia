      <path d="M39 107 C70 99 101 112 125 135 L125 196 C91 172 66 168 39 176 Q41 140 39 107 Z" fill="url(#codexia-1024-leftPage)"/>
      <path d="M131 135 C157 112 187 99 217 107 Q215 140 217 176 C190 168 166 172 131 196 Z" fill="url(#codexia-1024-rightPage)"/>
      <path d="M39 110 Q79 99 125 138 M131 138 Q174 100 217 110" stroke="#FFF4DC" stroke-width="2.3" fill="none" opacity=".75"/>
      <path d="M125 135 C125 156 126 177 126 199 M131 135 C130 155 130 177 130 199" fill="none" stroke="#CE9F75" stroke-width="1.35"/>
      <path d="M128 139 L128 216" stroke="#BD854D" stroke-width="4" stroke-linecap="round"/>
      <!-- Gold gilding under the open folios -->
      <path d="M30 200 C63 191 92 198 125 218 M131 218 C165 198 194 191 226 200" fill="none" stroke="#FFE2A5" stroke-width="2" stroke-linecap="round"/>
      <path d="M34 195 C69 185 95 199 120 210 M136 210 C160 198 189 185 222 195" fill="none" stroke="#BD854D" stroke-width="1.3" opacity=".85"/><path d="M107 138 C107 103 127 74 150 55 C165 41 181 33 196 29 C190 53 186 65 171 84 C156 105 132 128 107 138 Z" fill="url(#codexia-1024-feather)" stroke="#BD854D" stroke-width="1.35" stroke-linejoin="round"/>
      <!-- Three swept barbs give the silhouette the distinctive 'writing feather' profile -->
      <path d="M124 109 C128 86 150 63 176 47 C171 66 154 84 135 96 Z" fill="#FFE6B0" opacity=".92"/>
      <path d="M133 109 C152 95 174 84 181 73 C178 92 158 109 131 123 Z" fill="#FFE6B0" opacity=".96"/>
      <path d="M154 68 C168 56 183 47 192 32" fill="none" stroke="#FFF4DC" stroke-width="2.3" stroke-linecap="round" opacity=".75"/>
