<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-label="革装の古書を開き、羽根ペンで物語を書き始めるCodexiaのアイコン">
<title>革装の古書を開き、羽根ペンで物語を書き始めるCodexiaのアイコン</title><defs>
      <linearGradient id="codexia-1024-leftPage" x1=".12" y1=".07" x2=".91" y2="1" objectBoundingBox="true"><stop offset="0" stop-color="#FFF4DC"/><stop offset=".60" stop-color="#FFF4DC"/><stop offset="1" stop-color="#F3DDB8"/></linearGradient>
      <linearGradient id="codexia-1024-rightPage" x1=".86" y1=".08" x2=".2" y2="1" objectBoundingBox="true"><stop offset="0" stop-color="#FFF4DC"/><stop offset=".60" stop-color="#FFF4DC"/><stop offset="1" stop-color="#F3DDB8"/></linearGradient>
      <linearGradient id="codexia-1024-feather" x1=".15" y1="1" x2=".88" y2=".1" objectBoundingBox="true"><stop offset="0" stop-color="#D5A35D"/><stop offset=".42" stop-color="#FFE6B0"/><stop offset="1" stop-color="#FFE2A5"/></linearGradient>
     </defs><rect width="256" height="256" fill="#24152F"/><g>
