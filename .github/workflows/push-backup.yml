name: Verify Push Backup
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/shared/python-env.sh
      - deploy/backup/**
      - deploy/ansible/deploy.yml
      - deploy/ansible/deploy-transaction.yml
      - deploy/ansible/codexia-api-gate*
      - deploy/ansible/backup-postgres-socket.sh
      - deploy/ansible/backup-runtime.yml
      - deploy/ansible/backup-release.yml
      - deploy/systemd/**
      - deploy/ansible/restore-drill.yml
      - deploy/ansible/push-deployment-recover.sh
      - scripts/deployment/recovery/backup.test.mjs
      - scripts/deployment/recovery/recovery.test.mjs
      - .github/workflows/push-backup.yml
  push:
    branches: [main]
    paths:
      - scripts/shared/python-env.sh
      - deploy/backup/**
      - deploy/ansible/deploy.yml
      - deploy/ansible/deploy-transaction.yml
      - deploy/ansible/codexia-api-gate*
      - deploy/ansible/backup-postgres-socket.sh
      - deploy/ansible/backup-runtime.yml
      - deploy/ansible/backup-release.yml
      - deploy/systemd/**
      - deploy/ansible/restore-drill.yml
      - deploy/ansible/push-deployment-recover.sh
      - scripts/deployment/recovery/backup.test.mjs
      - scripts/deployment/recovery/recovery.test.mjs
      - .github/workflows/push-backup.yml
permissions:
  contents: read
concurrency:
  group: push-backup-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backup-contract:
    name: Verify push backup locks, writer quiescence and interrupted deployment recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Resolve reusable independent PR proof
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/certification/reuse-merged-pr.mjs dedicated
      - uses: actions/setup-python@v6.1.0
        if: steps.reuse.outputs.eligible != 'true'
        with:
          python-version: '3.12.12'
      - name: Check backup and recovery shell syntax
        if: steps.reuse.outputs.eligible != 'true'
        run: |
          bash -n deploy/backup/backup.sh
          bash -n deploy/ansible/push-deployment-recover.sh
      - name: Verify push backup lock and recovery contract
        if: steps.reuse.outputs.eligible != 'true'
        run: node --test scripts/deployment/recovery/backup.test.mjs scripts/deployment/recovery/recovery.test.mjs
      - name: Verify S3 transfer unit contract
        if: steps.reuse.outputs.eligible != 'true'
        run: python3 -m unittest deploy/backup/test_s3_transfer.py -v
      - name: Verify S3 destination probe over pinned TLS transport
        if: steps.reuse.outputs.eligible != 'true'
        run: |
          runtime="$RUNNER_TEMP/codexia-s3-probe-runtime"
          bash deploy/backup/install-s3-runtime.sh "$runtime"
          (cd deploy/backup && "$runtime/bin/python" -m unittest test_s3_probe.py test_s3_probe_tls_fixture.py -v)
      - name: Verify pinned S3-compatible transfer and isolated restore fixture
        if: steps.reuse.outputs.eligible != 'true'
        run: bash deploy/backup/s3-fixture.sh
