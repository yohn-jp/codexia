name: Verify isolated Swift contract regeneration
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["feat/665-backup-console"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'codex/verify-897-swift-regeneration' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container: swift:6.2.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install the OpenAPI normalization prerequisites
        run: |
          apt-get update
          apt-get install --no-install-recommends -y python3 python3-yaml
          python3 -c 'import yaml; print(yaml.__version__)'
      - name: Regenerate from the pinned OpenAPI and Swift package lock
        run: |
          swift --version
          old="$(mktemp -d)"
          cp -a ios/CodexiaTransport/Sources/CodexiaAPI/. "$old/"
          bash ios/CodexiaTransport/generate.sh
          bash ios/CodexiaTransport/generate.sh --check
          : > swift-regeneration.patch
          for file in ios/CodexiaTransport/Sources/CodexiaAPI/*.swift; do
            name="$(basename "$file")"
            rc=0
            diff -u --label "a/$file" --label "b/$file" "$old/$name" "$file" >> swift-regeneration.patch || rc=$?
            test "$rc" -le 1
            printf 'SWIFT_OUTPUT_SHA %s %s\n' "$(git hash-object "$file")" "$file"
          done
          test -s swift-regeneration.patch
          echo CODEXIA_SWIFT_PATCH_BEGIN
          cat swift-regeneration.patch
          echo CODEXIA_SWIFT_PATCH_END
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: swift-regeneration-patch
          path: swift-regeneration.patch
          retention-days: 1
          if-no-files-found: error
