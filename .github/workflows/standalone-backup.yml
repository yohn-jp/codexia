name: Verify encrypted standalone backup and restore drill
on:
  pull_request:
    branches: [main]
    paths:
      - deploy/updater/standalone-backup.sh
      - deploy/updater/codexia-updater
      - deploy/updater/test-standalone-backup-lock.sh
      - deploy/updater/test-standalone-backup.sh
      - deploy/updater/standalone-host.mjs
      - deploy/updater/standalone-updater.mjs
      - scripts/standalone-update-controller.mjs
      - scripts/standalone-backup-controller.test.mjs
      - deploy/ansible/backup.yml
      - deploy/ansible/restore-drill.yml
      - deploy/quadlet/codexia-db.container
      - docs/deployment/STANDALONE-BACKUP.md
      - .github/workflows/standalone-backup.yml
  push:
    branches: [main]
    paths:
      - deploy/updater/standalone-backup.sh
      - deploy/updater/codexia-updater
      - deploy/updater/test-standalone-backup-lock.sh
      - deploy/updater/test-standalone-backup.sh
      - deploy/updater/standalone-host.mjs
      - deploy/updater/standalone-updater.mjs
      - scripts/standalone-update-controller.mjs
      - scripts/standalone-backup-controller.test.mjs
      - deploy/ansible/backup.yml
      - deploy/ansible/restore-drill.yml
      - deploy/quadlet/codexia-db.container
      - docs/deployment/STANDALONE-BACKUP.md
      - .github/workflows/standalone-backup.yml
permissions:
  contents: read
jobs:
  backup-drill:
    name: Verify encrypted backup and isolated PostgreSQL restore
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Prepare a fresh rootless Podman fixture account
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap netavark aardvark-dns slirp4netns fuse-overlayfs age
          fixture_user=codexia-phase-e-test
          test -z "$(id -u "$fixture_user" 2>/dev/null || true)"
          sudo useradd --create-home --shell /bin/bash "$fixture_user"
          sudo usermod --groups '' "$fixture_user"
          touch "$RUNNER_TEMP/codexia-phase-e-fixture-created"
          subuid_max=$(awk -F: 'BEGIN { max = 100000 } { end = $2 + $3; if (end > max) max = end } END { print max }' /etc/subuid)
          subgid_max=$(awk -F: 'BEGIN { max = 100000 } { end = $2 + $3; if (end > max) max = end } END { print max }' /etc/subgid)
          subuid_start=$(( (subuid_max + 65535) / 65536 * 65536 ))
          subgid_start=$(( (subgid_max + 65535) / 65536 * 65536 ))
          sudo usermod --add-subuids "$subuid_start-$((subuid_start + 65535))" --add-subgids "$subgid_start-$((subgid_start + 65535))" "$fixture_user"
          fixture_uid=$(id -u "$fixture_user")
          fixture_home=$(getent passwd "$fixture_user" | cut -d: -f6)
          sudo install -d -m 0700 -o "$fixture_user" -g "$fixture_user" "/run/user/$fixture_uid"
          sudo -u "$fixture_user" env HOME="$fixture_home" XDG_RUNTIME_DIR="/run/user/$fixture_uid" podman info --format '{{.Host.Security.Rootless}}'
      - name: Verify controller fence, encrypted artifact integrity and isolated restore
        run: |
          fixture_user=codexia-phase-e-test
          fixture_uid=$(id -u "$fixture_user")
          fixture_home=$(getent passwd "$fixture_user" | cut -d: -f6)
          sudo -u "$fixture_user" env HOME="$fixture_home" USER="$fixture_user" LOGNAME="$fixture_user" PATH="$PATH" XDG_RUNTIME_DIR="/run/user/$fixture_uid" TMPDIR=/tmp CODEXIA_DISPOSABLE_BACKUP_TEST=true bash deploy/updater/test-standalone-backup.sh
          sudo -u "$fixture_user" env HOME="$fixture_home" USER="$fixture_user" LOGNAME="$fixture_user" PATH="$PATH" XDG_RUNTIME_DIR="/run/user/$fixture_uid" TMPDIR=/tmp CODEXIA_DISPOSABLE_BACKUP_TEST=true bash deploy/updater/test-standalone-backup-lock.sh
          node --test scripts/standalone-backup-controller.test.mjs
      - name: Remove the disposable backup test user
        if: always()
        run: |
          fixture_user=codexia-phase-e-test
          fixture_marker="$RUNNER_TEMP/codexia-phase-e-fixture-created"
          if test -f "$fixture_marker"; then
            if id "$fixture_user" >/dev/null 2>&1; then
              fixture_uid=$(id -u "$fixture_user")
              sudo userdel --remove "$fixture_user" || true
              sudo rmdir "/run/user/$fixture_uid" 2>/dev/null || true
            fi
            rm -f "$fixture_marker"
          fi
