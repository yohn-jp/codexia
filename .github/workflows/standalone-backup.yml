name: Verify encrypted standalone backup and restore drill
on:
  pull_request:
    branches: [main]
    paths:
      - deploy/updater/standalone-backup.sh
      - deploy/updater/codexia-updater
      - deploy/updater/test-standalone-backup-lock.sh
      - deploy/updater/test-standalone-backup-startup-fence.sh
      - deploy/updater/test-standalone-backup.sh
      - Dockerfile.backend
      - package.json
      - pnpm-lock.yaml
      - packages/api/package.json
      - packages/api/tsconfig.json
      - packages/api/src/job-history-store.ts
      - deploy/updater/standalone-host.mjs
      - deploy/updater/standalone-updater.mjs
      - scripts/standalone-update-controller.mjs
      - scripts/standalone-backup-controller.test.mjs
      - deploy/ansible/backup.yml
      - deploy/ansible/verify-updater-inputs.yml
      - deploy/ansible/verify-updater-units.yml
      - deploy/ansible/lifecycle.yml
      - deploy/ansible/restore-drill.yml
      - deploy/ansible/rotate-app-password.yml
      - deploy/ansible/rotate-preflight-password.yml
      - deploy/ansible/validate-preflight-password-rotation-inputs.yml
      - deploy/ansible/test-preflight-password-rotation-gate.yml
      - deploy/ansible/test-preflight-password-rotation-inputs.yml
      - deploy/ansible/rotate-api-auth-token.yml
      - deploy/ansible/rotate-tunnel-token.yml
      - deploy/ansible/validate-api-auth-token-rotation-inputs.yml
      - deploy/ansible/test-api-auth-token-rotation.yml
      - deploy/ansible/test-api-auth-token-rotation-inputs.yml
      - deploy/ansible/validate-tunnel-token-rotation-inputs.yml
      - deploy/ansible/test-tunnel-token-rotation-gate.yml
      - deploy/ansible/test-tunnel-token-rotation-inputs.yml
      - deploy/ansible/validate-app-password-rotation-inputs.yml
      - deploy/ansible/test-app-password-rotation.yml
      - deploy/ansible/test-app-password-rotation-gate.yml
      - deploy/ansible/test-lifecycle-contract.sh
      - deploy/ansible/test-lifecycle-contract.yml
      - deploy/quadlet/codexia-db.container
      - deploy/ansible/site.yml
      - deploy/ansible/README.md
      - deploy/ansible/inventory.example.yml
      - docs/deployment/IAC.md
      - deploy/ansible/validate-runtime.yml
      - deploy/ansible/requirements.txt
      - .github/workflows/standalone-backup.yml
  push:
    branches: [main]
    paths:
      - deploy/updater/standalone-backup.sh
      - deploy/updater/codexia-updater
      - deploy/updater/test-standalone-backup-lock.sh
      - deploy/updater/test-standalone-backup-startup-fence.sh
      - deploy/updater/test-standalone-backup.sh
      - Dockerfile.backend
      - package.json
      - pnpm-lock.yaml
      - packages/api/package.json
      - packages/api/tsconfig.json
      - packages/api/src/job-history-store.ts
      - deploy/updater/standalone-host.mjs
      - deploy/updater/standalone-updater.mjs
      - scripts/standalone-update-controller.mjs
      - scripts/standalone-backup-controller.test.mjs
      - deploy/ansible/backup.yml
      - deploy/ansible/verify-updater-inputs.yml
      - deploy/ansible/verify-updater-units.yml
      - deploy/ansible/lifecycle.yml
      - deploy/ansible/restore-drill.yml
      - deploy/ansible/rotate-app-password.yml
      - deploy/ansible/rotate-preflight-password.yml
      - deploy/ansible/validate-preflight-password-rotation-inputs.yml
      - deploy/ansible/test-preflight-password-rotation-gate.yml
      - deploy/ansible/test-preflight-password-rotation-inputs.yml
      - deploy/ansible/rotate-api-auth-token.yml
      - deploy/ansible/rotate-tunnel-token.yml
      - deploy/ansible/validate-api-auth-token-rotation-inputs.yml
      - deploy/ansible/test-api-auth-token-rotation.yml
      - deploy/ansible/test-api-auth-token-rotation-inputs.yml
      - deploy/ansible/validate-tunnel-token-rotation-inputs.yml
      - deploy/ansible/test-tunnel-token-rotation-gate.yml
      - deploy/ansible/test-tunnel-token-rotation-inputs.yml
      - deploy/ansible/validate-app-password-rotation-inputs.yml
      - deploy/ansible/test-app-password-rotation.yml
      - deploy/ansible/test-app-password-rotation-gate.yml
      - deploy/ansible/test-lifecycle-contract.sh
      - deploy/ansible/test-lifecycle-contract.yml
      - deploy/quadlet/codexia-db.container
      - deploy/ansible/site.yml
      - deploy/ansible/README.md
      - deploy/ansible/inventory.example.yml
      - docs/deployment/IAC.md
      - deploy/ansible/validate-runtime.yml
      - deploy/ansible/requirements.txt
      - .github/workflows/standalone-backup.yml
permissions:
  contents: read
concurrency:
  group: standalone-backup-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backup-drill:
    name: Verify encrypted backup and isolated PostgreSQL restore
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Build the backend history writer fixture
        run: |
          corepack enable
          corepack prepare pnpm@12.21.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter '@codexia/api...' build
      - name: Resolve reusable independent PR proof
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reuse-pr-verification.mjs dedicated
      - name: Install the pinned Ansible runner
        if: steps.reuse.outputs.eligible != 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/codexia-ansible"
          "$RUNNER_TEMP/codexia-ansible/bin/pip" install -r deploy/ansible/requirements.txt
      - name: Verify pause, resume and rollback Ansible contracts
        if: steps.reuse.outputs.eligible != 'true'
        run: PATH="$RUNNER_TEMP/codexia-ansible/bin:$PATH" bash deploy/ansible/test-lifecycle-contract.sh
      - name: Prepare a fresh rootless Podman fixture account
        if: steps.reuse.outputs.eligible != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap netavark aardvark-dns slirp4netns fuse-overlayfs age dbus-user-session
          cd /tmp
          fixture_user=codexia-phase-e-test
          test -z "$(id -u "$fixture_user" 2>/dev/null || true)"
          sudo useradd --create-home --shell /bin/bash "$fixture_user"
          sudo usermod --groups '' "$fixture_user"
          touch "$RUNNER_TEMP/codexia-phase-e-fixture-created"
          fixture_uid=$(id -u "$fixture_user")
          fixture_home=$(getent passwd "$fixture_user" | cut -d: -f6)
          fixture_repo="$fixture_home/codexia-phase-e-fixture-repo"
          test ! -e "$fixture_repo" && test ! -L "$fixture_repo"
          touch "$RUNNER_TEMP/codexia-phase-e-fixture-repo-created"
          sudo -u "$fixture_user" install -d -m 0700 "$fixture_repo"
          git -C "$GITHUB_WORKSPACE" archive HEAD | sudo -u "$fixture_user" tar -xf - -C "$fixture_repo"
          printf '%s\n' 'codexia-phase-e-fixture-repo/v1' | sudo -u "$fixture_user" tee "$fixture_repo/.codexia-phase-e-fixture" >/dev/null
          sudo -u "$fixture_user" install -d -m 0755 "$fixture_repo/packages/api/dist"
          sudo -u "$fixture_user" install -m 0644 "$GITHUB_WORKSPACE/packages/api/dist/job-history-store.js" "$fixture_repo/packages/api/dist/job-history-store.js"
          test "$(sudo stat -c '%u' "$fixture_repo")" = "$fixture_uid"
          test "$(sudo stat -c '%u' "$fixture_repo/.codexia-phase-e-fixture")" = "$fixture_uid"
          subuid_max=$(awk -F: 'BEGIN { max = 100000 } { end = $2 + $3; if (end > max) max = end } END { print max }' /etc/subuid)
          subgid_max=$(awk -F: 'BEGIN { max = 100000 } { end = $2 + $3; if (end > max) max = end } END { print max }' /etc/subgid)
          subuid_start=$(( (subuid_max + 65535) / 65536 * 65536 ))
          subgid_start=$(( (subgid_max + 65535) / 65536 * 65536 ))
          sudo usermod --add-subuids "$subuid_start-$((subuid_start + 65535))" --add-subgids "$subgid_start-$((subgid_start + 65535))" "$fixture_user"
          sudo loginctl enable-linger "$fixture_user"
          sudo install -d -m 0755 "/run/systemd/system/user@${fixture_uid}.service.d"
          cat <<EOF | sudo tee "/run/systemd/system/user@${fixture_uid}.service.d/10-codexia-backup-ci.conf" >/dev/null
          [Service]
          Environment=HOME=$fixture_home
          Environment=XDG_CONFIG_HOME=$fixture_home/.config
          Environment=XDG_RUNTIME_DIR=/run/user/$fixture_uid
          EOF
          sudo systemctl daemon-reload
          sudo systemctl start "user@${fixture_uid}.service"
          sudo install -d -m 0700 -o "$fixture_user" -g "$fixture_user" "/run/user/$fixture_uid"
          for attempt in $(seq 1 20); do
            if sudo -u "$fixture_user" env HOME="$fixture_home" XDG_CONFIG_HOME="$fixture_home/.config" XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" systemctl --user show --property=Version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          sudo -u "$fixture_user" env HOME="$fixture_home" XDG_CONFIG_HOME="$fixture_home/.config" XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" systemctl --user show --property=Version >/dev/null
          sudo -u "$fixture_user" env HOME="$fixture_home" XDG_CONFIG_HOME="$fixture_home/.config" XDG_RUNTIME_DIR="/run/user/$fixture_uid" podman info --format '{{.Host.Security.Rootless}}'
          user_environment_generator_dir=/run/systemd/user-environment-generators
          user_environment_generator_path="$user_environment_generator_dir/90-codexia-backup-ci-$fixture_uid"
          if sudo test -d "$user_environment_generator_dir"; then
            sudo test ! -L "$user_environment_generator_dir"
            sudo test "$(sudo realpath -- "$user_environment_generator_dir")" = "$user_environment_generator_dir"
          else
            sudo install -d -m 0755 "$user_environment_generator_dir"
            touch "$RUNNER_TEMP/codexia-phase-e-user-env-generator-dir-created"
          fi
          sudo test ! -e "$user_environment_generator_path" && sudo test ! -L "$user_environment_generator_path"
          cat > "$RUNNER_TEMP/codexia-phase-e-user-env-generator.expected" <<EOF
          #!/bin/sh
          if [ "\$(id -u)" = "$fixture_uid" ]; then
            printf '%s\\n' 'XDG_CONFIG_HOME=$fixture_home/.config' 'XDG_RUNTIME_DIR=/run/user/$fixture_uid'
          fi
          EOF
          touch "$RUNNER_TEMP/codexia-phase-e-user-env-generator-created"
          sudo install -m 0755 "$RUNNER_TEMP/codexia-phase-e-user-env-generator.expected" "$user_environment_generator_path"
      - name: Verify controller fence, encrypted artifact integrity and isolated restore
        if: steps.reuse.outputs.eligible != 'true'
        run: |
          fixture_user=codexia-phase-e-test
          fixture_uid=$(id -u "$fixture_user")
          fixture_home=$(getent passwd "$fixture_user" | cut -d: -f6)
          fixture_repo="$fixture_home/codexia-phase-e-fixture-repo"
          cd /tmp
          sudo -u "$fixture_user" env HOME="$fixture_home" USER="$fixture_user" LOGNAME="$fixture_user" PATH="$PATH" XDG_CONFIG_HOME="$fixture_home/.config" XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" TMPDIR=/tmp CODEXIA_DISPOSABLE_BACKUP_TEST=true bash -c '
            set -euo pipefail
            cd "$1"
            bash deploy/updater/test-standalone-backup.sh
            bash deploy/updater/test-standalone-backup-lock.sh
            bash deploy/updater/test-standalone-backup-startup-fence.sh
          ' bash "$fixture_repo"
          node --test "$GITHUB_WORKSPACE/scripts/standalone-backup-controller.test.mjs"
      - name: Remove the disposable backup test user
        if: always() && steps.reuse.outputs.eligible != 'true'
        run: |
          set +e
          cleanup_failed=0
          fixture_user=codexia-phase-e-test
          fixture_marker="$RUNNER_TEMP/codexia-phase-e-fixture-created"
          if test -f "$RUNNER_TEMP/codexia-phase-e-fixture-repo-created"; then
            fixture_uid=$(id -u "$fixture_user" 2>/dev/null || true)
            fixture_home=$(getent passwd "$fixture_user" 2>/dev/null | cut -d: -f6)
            fixture_repo="$fixture_home/codexia-phase-e-fixture-repo"
            if test -n "$fixture_uid" \
              && sudo test -d "$fixture_repo" && sudo test ! -L "$fixture_repo" \
              && test "$(sudo realpath -- "$fixture_repo")" = "$fixture_repo" \
              && test "$(sudo stat -c '%u' "$fixture_repo")" = "$fixture_uid" \
              && sudo test -f "$fixture_repo/.codexia-phase-e-fixture" \
              && sudo test ! -L "$fixture_repo/.codexia-phase-e-fixture" \
              && test "$(sudo cat -- "$fixture_repo/.codexia-phase-e-fixture")" = codexia-phase-e-fixture-repo/v1 \
              && test "$(sudo stat -c '%u' "$fixture_repo/.codexia-phase-e-fixture")" = "$fixture_uid"; then
              sudo rm -rf --one-file-system -- "$fixture_repo" || cleanup_failed=1
              rm -f "$RUNNER_TEMP/codexia-phase-e-fixture-repo-created" || cleanup_failed=1
            else
              echo 'Refusing to remove an unexpected or replaced Phase E checkout copy' >&2
              sudo stat -c 'fixture checkout: %n owner=%u mode=%a type=%F' "$fixture_repo" "$fixture_repo/.codexia-phase-e-fixture" >&2 || true
              sudo cat -- "$fixture_repo/.codexia-phase-e-fixture" >&2 || true
              cleanup_failed=1
            fi
          fi
          if test -f "$RUNNER_TEMP/codexia-phase-e-user-env-generator-created"; then
            fixture_uid=$(id -u "$fixture_user" 2>/dev/null || true)
            user_environment_generator_path="/run/systemd/user-environment-generators/90-codexia-backup-ci-$fixture_uid"
            if test -n "$fixture_uid" \
              && sudo test -f "$user_environment_generator_path" \
              && sudo test ! -L "$user_environment_generator_path" \
              && test "$(sudo stat -c '%u' "$user_environment_generator_path")" = 0 \
              && test "$(sudo stat -c '%a' "$user_environment_generator_path")" = 755 \
              && sudo cmp -s "$RUNNER_TEMP/codexia-phase-e-user-env-generator.expected" "$user_environment_generator_path"; then
              sudo rm -- "$user_environment_generator_path" || cleanup_failed=1
              rm -f "$RUNNER_TEMP/codexia-phase-e-user-env-generator-created" "$RUNNER_TEMP/codexia-phase-e-user-env-generator.expected" || cleanup_failed=1
            elif test -n "$fixture_uid" && sudo test ! -e "$user_environment_generator_path" && sudo test ! -L "$user_environment_generator_path"; then
              rm -f "$RUNNER_TEMP/codexia-phase-e-user-env-generator-created" "$RUNNER_TEMP/codexia-phase-e-user-env-generator.expected" || cleanup_failed=1
            else
              echo 'Refusing to remove an unexpected Phase E user environment generator' >&2
              sudo stat -c 'user environment generator: %n owner=%u mode=%a type=%F' "$user_environment_generator_path" >&2 || true
              cleanup_failed=1
            fi
          fi
          if test -f "$RUNNER_TEMP/codexia-phase-e-user-env-generator-dir-created"; then
            if sudo test -d /run/systemd/user-environment-generators \
              && sudo test ! -L /run/systemd/user-environment-generators \
              && test "$(sudo realpath -- /run/systemd/user-environment-generators)" = /run/systemd/user-environment-generators \
              && test -z "$(sudo find /run/systemd/user-environment-generators -mindepth 1 -maxdepth 1 -print -quit)"; then
              sudo rmdir -- /run/systemd/user-environment-generators || cleanup_failed=1
              rm -f "$RUNNER_TEMP/codexia-phase-e-user-env-generator-dir-created" || cleanup_failed=1
            else
              echo 'Refusing to remove a nonempty or replaced user environment generator directory' >&2
              cleanup_failed=1
            fi
          fi
          if test -f "$fixture_marker"; then
            if id "$fixture_user" >/dev/null 2>&1; then
              fixture_uid=$(id -u "$fixture_user")
              sudo loginctl disable-linger "$fixture_user" || true
              sudo systemctl stop "user@${fixture_uid}.service" || true
              sudo rm -f "/run/systemd/system/user@${fixture_uid}.service.d/10-codexia-backup-ci.conf"
              sudo rmdir "/run/systemd/system/user@${fixture_uid}.service.d" 2>/dev/null || true
              sudo userdel --remove "$fixture_user" || true
              sudo rmdir "/run/user/$fixture_uid" 2>/dev/null || true
            fi
            rm -f "$fixture_marker"
          fi
          exit "$cleanup_failed"
