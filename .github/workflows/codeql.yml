name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 19 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Select exact-source security scope
        id: scope
        env:
          CODEXIA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CODEXIA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/ci/impact/security-admission.mjs
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.codeql == 'true'
        with:
          node-version: 24.22.3
      - name: Materialize the Desktop HTTP client for analysis
        if: steps.scope.outputs.codeql == 'true'
        run: |
          corepack enable
          pnpm --filter '@codexia/app...' --fail-if-no-match install --frozen-lockfile
          pnpm --filter @codexia/app generate:http
      - uses: github/codeql-action/init@v4
        if: steps.scope.outputs.codeql == 'true'
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        if: steps.scope.outputs.codeql == 'true'
        with:
          category: /language:javascript-typescript
