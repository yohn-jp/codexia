name: Experiment StrictDoc prebuilt CI runtime
on:
  pull_request:
    paths:
      - .github/docker/strictdoc-ci.Dockerfile
      - .github/workflows/strictdoc-runtime-experiment.yml
      - scripts/strictdoc/requirements.lock.txt
  push:
    branches: [main]
    paths:
      - .github/docker/strictdoc-ci.Dockerfile
      - .github/workflows/strictdoc-runtime-experiment.yml
      - scripts/strictdoc/requirements.lock.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build pinned StrictDoc runtime
        run: |
          docker build -f .github/docker/strictdoc-ci.Dockerfile -t codexia-strictdoc-ci:experiment .
      - name: Verify pinned tools and Chromium under non-root identity
        run: |
          docker run --rm codexia-strictdoc-ci:experiment sh -ec '
            test "$(id -u)" -ne 0
            test "$(node --version)" = v24.22.3
            /opt/strictdoc/bin/strictdoc --version
            test -d /ms-playwright
            corepack pnpm@12.21.0 --version
          '
      - name: Report local build size
        run: |
          docker image inspect --format 'StrictDoc runtime uncompressed bytes: {{.Size}}' codexia-strictdoc-ci:experiment >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and smoke-test immutable StrictDoc runtime
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/strictdoc-ci"
          metadata="$RUNNER_TEMP/strictdoc-image.json"
          docker buildx build --platform linux/amd64 -f .github/docker/strictdoc-ci.Dockerfile \
            -t "$image:strictdoc-0.32.1" --metadata-file "$metadata" --push .
          digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$image@$digest"
          docker run --rm "$image@$digest" sh -ec '
            test "$(id -u)" -ne 0
            test "$(node --version)" = v24.22.3
            test "$(/opt/strictdoc/bin/strictdoc --version)" = 0.32.1
            test -d /ms-playwright
          '
          echo "Published and verified: $image@$digest" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect --format 'Uncompressed image size: {{.Size}} bytes' "$image@$digest" >> "$GITHUB_STEP_SUMMARY"
