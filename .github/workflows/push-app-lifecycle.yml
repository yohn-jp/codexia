name: Push deployment app lifecycle
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/shared/python-env.sh
      - Dockerfile.backend
      - .dockerignore
      - Dockerfile.backend.dockerignore
      - deploy/backend/**
      - deploy/fixtures/sshfs-server/**
      - scripts/verification/artifacts/sshfs-fixture*.mjs
      - packages/**
      - modules/**
      - '!modules/story/src/browser.tsx'
      # Test-only files are not source-bound runtime or host-lifecycle inputs.
      - '!modules/**/test/**'
      - '!modules/**/tests/**'
      - '!modules/**/*.test.*'
      - '!packages/**/test/**'
      - '!packages/**/tests/**'
      - '!packages/**/*.test.*'
      - 'modules/**/src/**/test/**'
      - 'modules/**/src/**/tests/**'
      - 'packages/**/src/**/test/**'
      - 'packages/**/src/**/tests/**'
      # Build-emitted source and test files remain runtime package inputs.
      - 'packages/api/src/**'
      - 'packages/persistence-contracts/src/**'
      - profiles/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - deploy/postgres/**
      - scripts/build/packaging/profile-build.mjs
      - scripts/build/packaging/profile-package.mjs
      - scripts/verification/dependencies/runtime-package-closure.mjs
      - scripts/verification/runtime/backend-image.sh
      - scripts/release/backend/update-identity*.mjs
      - scripts/release/components/version*.mjs
      - scripts/release/backend/verify-image-identity.mjs
      - .github/workflows/push-app-lifecycle.yml
      - .github/workflows/backend-release.yml
      - deploy/ansible/site.yml
      - deploy/ansible/host.yml
      - deploy/ansible/host-validate.yml
      - deploy/ansible/backup-*
      - deploy/ansible/base-*.yml
      - deploy/ansible/deploy*.yml
      - deploy/ansible/auth-runtime*
      - deploy/ansible/bootstrap-auth-registration.sh
      - deploy/ansible/grant-passkey-owner.sh
      - deploy/ansible/require-clean-api-target.sh
      - deploy/ansible/test-push-*-lifecycle.sh
      - deploy/ansible/push-deployment-recover.sh
      - deploy/ansible/requirements.txt
      - deploy/ansible/callback_plugins/**
      - deploy/backup/**
      - deploy/quadlet/**
      - deploy/update-compatibility.json
      - scripts/deployment/lifecycle/app*.mjs
      - scripts/deployment/lifecycle/auth-oidc.mjs
      - scripts/deployment/admission/contract.test.mjs
      - scripts/deployment/admission/documentation.test.mjs
      - scripts/verification/artifacts/backend.mjs
      - scripts/ci/evidence/artifact-selection.mjs
      - scripts/ci/evidence/download-artifacts*.mjs
      - scripts/ci/evidence/package.json
      - scripts/release/components/policy.mjs
      - scripts/release/backend/image-inspection.mjs
      - scripts/deployment/admission/validate.mjs
      - scripts/deployment/admission/certificate.mjs
      - scripts/deployment/handoff/verify-push.mjs
      - scripts/deployment/handoff/verify-push.test.mjs
      - scripts/release/backend/verify-existing.mjs
      - scripts/release/backend/verify-existing.test.mjs
      - scripts/release/components/record-model.mjs
      - docs/deployment/PUSH-DEPLOYMENT.md
      - docs/deployment/IAC.md
permissions:
  contents: read
concurrency:
  group: push-app-lifecycle-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  fixture:
    name: Prebuild and smoke-test source-bound SSHFS fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Build and test SSHFS image with temporary SSH credentials
        env:
          CODEXIA_LIFECYCLE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash deploy/fixtures/sshfs-server/build.sh
      - name: Upload immutable producer archive and manifest
        id: archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sshfs-fixture-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lifecycle-sshfs/sshfs-fixture.tar
            ${{ runner.temp }}/lifecycle-sshfs/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  lifecycle:
    name: Verify ${{ matrix.scenario }} state transitions on disposable rootless host
    needs: fixture
    strategy:
      fail-fast: false
      matrix:
        scenario: [app, auth]
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Initialize run-bound lifecycle outcome artifact
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCENARIO: ${{ matrix.scenario }}
          REPORT_FILE: ${{ runner.temp }}/codexia-push-app-lifecycle/outcome.json
        run: |
          mkdir -p "$(dirname "$REPORT_FILE")"
          python3 - <<'PY'
          import json, os
          keys = ['first_activation', 'same_digest_reapply', 'compatible_update', 'failed_candidate_rollback',
                  'durable_interruption_recovery', 'database_volume_writer_quadlet_release_continuity',
                  'backup_remote_filesystem', 'better_auth_activation', 'better_auth_same_digest',
                  'better_auth_compatible_update', 'better_auth_rollback', 'fixture_cleanup']
          value = {'schemaVersion': 1, 'sourceSha': os.environ['SOURCE_SHA'],
                   'runId': int(os.environ['GITHUB_RUN_ID']), 'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                   'status': 'NOT_CHECKED', 'scenario': os.environ['SCENARIO'], 'detail': 'workflow bootstrap; lifecycle fixture has not started',
                   'states': {key: {'status': 'NOT_CHECKED'} for key in keys}, 'images': [],
                   'observations': {}, 'capabilities': {}, 'logs': []}
          with open(os.environ['REPORT_FILE'], 'w', encoding='utf8') as target:
              json.dump(value, target, indent=2)
              target.write('\n')
          os.chmod(os.environ['REPORT_FILE'], 0o600)
          PY
      - name: Check out exact PR source without persistent credentials
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Download source-bound prebuilt SSHFS archive
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.fixture.outputs.artifact_id }}
          path: ${{ runner.temp }}/lifecycle-sshfs
      - name: Verify exact-run archive manifest and digest
        env:
          CODEXIA_LIFECYCLE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verification/artifacts/sshfs-fixture.mjs "$RUNNER_TEMP/lifecycle-sshfs"
      - name: Install disposable host and filesystem capabilities
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_FILE: ${{ runner.temp }}/codexia-push-app-lifecycle/outcome.json
        run: |
          set -euo pipefail
          setup_log="$(dirname "$REPORT_FILE")/host-setup.log"
          record_unavailable() {
            local reason="$1"
            sed -E -e 's/(Bearer )[A-Za-z0-9._~-]+/\1[REDACTED]/g' -e 's/((password|token)([=: ]+))[^[:space:]]+/\1[REDACTED]/Ig' "$setup_log" | tail -n 160 > "$(dirname "$REPORT_FILE")/host-setup-bounded.log"
            rm -f "$setup_log"
            python3 - "$REPORT_FILE" "$reason" <<'PY'
          import json, os, sys
          path, reason = sys.argv[1:]
          with open(path, encoding='utf8') as source:
              value = json.load(source)
          for key in value['states']:
              value['states'][key] = {'status': 'CAPABILITY_UNAVAILABLE', 'detail': reason}
          value['states']['fixture_cleanup'] = {'status': 'PASS', 'detail': 'fixture resources were not created'}
          value.update({'status': 'NOT_CHECKED', 'detail': reason, 'failure': reason,
                        'cleanup': {'status': 'PASS', 'exitCode': 0},
                        'logs': [{'file': 'host-setup-bounded.log', 'redacted': True}]})
          with open(path, 'w', encoding='utf8') as target:
              json.dump(value, target, indent=2)
              target.write('\n')
          os.chmod(path, 0o600)
          PY
          }
          if ! sudo apt-get update -qq >"$setup_log" 2>&1; then
            record_unavailable 'runner could not provision required disposable host packages'
            exit 78
          fi
          if ! sudo apt-get install -y --no-install-recommends podman uidmap netavark aardvark-dns passt slirp4netns fuse-overlayfs dbus-user-session age sshfs fuse3 python3-venv jq acl ca-certificates lsb-release iproute2 openssh-client curl openssl >>"$setup_log" 2>&1; then
            record_unavailable 'runner could not install required disposable host and SSHFS capabilities'
            exit 78
          fi
          if ! bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/codexia-ansible" -r deploy/ansible/requirements.txt mitogen==0.3.55 >>"$setup_log" 2>&1; then
            record_unavailable 'runner could not provision the Ansible deployment capability'
            exit 78
          fi
          rm -f "$setup_log"
          # Base Secrets CI already proves this pinned strategy on rootless
          # local become; the lifecycle lane previously installed it but ran linear.
          python="$RUNNER_TEMP/codexia-ansible/bin/python"
          plugin_dir=$("$python" -c 'import ansible_mitogen, os; print(os.path.join(os.path.dirname(ansible_mitogen.__file__), "plugins", "strategy"))')
          test -f "$plugin_dir/mitogen_linear.py"
          "$python" -c 'from importlib.metadata import version; assert version("mitogen") == "0.3.55"'
          # ansible-doc requires plugin documentation even when a strategy is
          # loadable. Mitogen does not ship that metadata, so check the pinned
          # module and strategy file directly instead (as Base Secrets CI does).
          callback_dir="$GITHUB_WORKSPACE/deploy/ansible/callback_plugins"
          "$python" -m py_compile "$callback_dir/codexia_profile.py"
          {
            echo "ANSIBLE_PLAYBOOK=$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook"
            echo "ANSIBLE_STRATEGY=mitogen_linear"
            echo "ANSIBLE_STRATEGY_PLUGINS=$plugin_dir"
            echo "ANSIBLE_CALLBACK_PLUGINS=$callback_dir"
            echo "ANSIBLE_CALLBACKS_ENABLED=codexia_profile"
          } >> "$GITHUB_ENV"
          echo "LIFECYCLE_ANSIBLE_PROFILE strategy=mitogen_linear callback=codexia_profile"
          for script in deploy/ansible/test-push-{app,auth}-lifecycle.sh; do bash -n "$script"; done
          node --check scripts/deployment/lifecycle/auth-oidc.mjs
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Run exact-source image selection and real app lifecycle fixture
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_LIFECYCLE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CODEXIA_LIFECYCLE_SCENARIO: ${{ matrix.scenario }}
          CODEXIA_LIFECYCLE_FIXTURE_DIR: ${{ runner.temp }}/lifecycle-sshfs
          CODEXIA_LIFECYCLE_REPORT_FILE: ${{ runner.temp }}/codexia-push-app-lifecycle/outcome.json
          CODEXIA_LIFECYCLE_EVIDENCE_FILE: ${{ runner.temp }}/codexia-push-app-lifecycle/evidence.json
        run: bash deploy/ansible/test-push-app-lifecycle.sh
      - name: Upload run-bound lifecycle outcome and bounded logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: push-app-lifecycle-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/codexia-push-app-lifecycle/outcome.json
            ${{ runner.temp }}/codexia-push-app-lifecycle/evidence.json
            ${{ runner.temp }}/codexia-push-app-lifecycle/*-bounded.log
          if-no-files-found: warn
          retention-days: 14
