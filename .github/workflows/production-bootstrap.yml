name: Protected production bootstrap
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Production bootstrap [{0}] Preflight {1}', inputs.mode, inputs.preflight_run_id || 'none') || 'Protected production bootstrap' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: SSH preflight, R4/R5, or backup provisioning on an ACTIVE installation
        type: choice
        options: [preflight, bootstrap, owner-setup, prepare-activation, provision-backups]
        default: preflight
        required: true
      initialize_database:
        description: Approve fresh Codexia schema initialization (no data deletion)
        type: boolean
        default: false
      preflight_run_id:
        description: Run ID that produced the reviewed lifecycle Preflight plan
        type: string
        required: false
      approval_phrase:
        description: Enter BOOTSTRAP_CODEXIA for R4 or OWNER_SETUP_CODEXIA for R5
        type: string
        required: false
  pull_request:
    branches: [main]
    paths:
      - scripts/shared/python-env.sh
      - .github/workflows/production-bootstrap.yml
      - .github/actions/reviewed-preflight/**
      - deploy/production.json
      - deploy/ansible/*managed*secret*
      - deploy/ansible/test_preflight_observe.py
      - deploy/ansible/prepare-production-bootstrap.py
      - deploy/ansible/test_production_bootstrap.py
      - deploy/ansible/prepare-owner-activation.yml
      - deploy/ansible/owner-setup*
      - deploy/ansible/test_owner_setup.py
      - deploy/ansible/auth-runtime*
      - deploy/ansible/preflight-observe*
      - deploy/ansible/preflight-writer-observe.sh
      - deploy/ansible/test-preflight-writer-observe.sh
      - scripts/release/frontend/initial-publication*.mjs
      - scripts/deployment/bootstrap/**
      - scripts/deployment/preflight/**
      - deploy/ansible/site.yml
      - deploy/ansible/host.yml
      - deploy/ansible/deploy-ssh-key.yml
      - deploy/ansible/prepare-deploy-ssh.sh
      - docs/deployment/PRODUCTION-BOOTSTRAP.md
permissions:
  contents: read
# Keep the production queue across the runtime-key handoff, privileged R4
# convergence and independent runtime SSH acceptance; no nested queue.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'codexia-production' || format('codexia-bootstrap-contract-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
jobs:
  contract:
    name: Verify isolated bootstrap controller contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install the frozen GitHub evidence reader
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Install pinned Ansible Python dependencies
        run: |
          set -euo pipefail
          bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/codexia-ansible" -r deploy/ansible/requirements.txt
      - name: Verify protected controller inputs and Ansible syntax
        run: |
          set -euo pipefail
          node --test scripts/deployment/bootstrap/{activate-backend,admission}.test.mjs \
            scripts/deployment/preflight/{discover,observe,plan}.test.mjs
          for fixture in test_production_bootstrap.py test_managed_bootstrap_secrets.py test_owner_setup.py test_preflight_observe.py; do
            PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/codexia-ansible/bin/python" -m unittest discover -s deploy/ansible -p "$fixture" -v
          done
          for playbook in site preflight-observe prepare-owner-activation; do
            "$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" -i deploy/ansible/inventory.example.yml "deploy/ansible/$playbook.yml" --syntax-check
          done

      - name: Verify read-only writer observation
        run: bash deploy/ansible/test-preflight-writer-observe.sh

      - name: Reject bootstrap when a retired transaction remains
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/.local/state/codexia-deploy"
          printf '{}\n' > "$fixture/.local/state/codexia-deploy/cutover-transaction.json"
          printf '[codexia]\nlocalhost ansible_connection=local\n' > "$fixture/inventory"
          if "$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" -i "$fixture/inventory" deploy/ansible/site.yml \
            -e "codexia_stage=bootstrap codexia_service_home=$fixture codexia_service_user=$(id -un)" > "$fixture/result" 2>&1; then
            cat "$fixture/result"
            exit 1
          fi
          cat "$fixture/result"
          grep -F 'Retired deployment journal requires explicit operator recovery before ordinary convergence.' "$fixture/result"
          if grep -F 'TASK [Converge the rootless host account and dependencies]' "$fixture/result"; then exit 1; fi
      - name: Verify backup maintenance on an unconfigured host cannot enter a privileged stage
        env:
          ANSIBLE_DISPLAY_SKIPPED_HOSTS: 'false'
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          trap 'rm -rf -- "$fixture"' EXIT
          printf '[codexia]\nlocalhost ansible_connection=local\n' > "$fixture/inventory"
          if "$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" -i "$fixture/inventory" deploy/ansible/site.yml \
            -e '{"codexia_stage":"base","codexia_backup_runtime_approved":true,"codexia_database_initialization_approved":false}' \
            -e "codexia_service_home=$fixture codexia_service_user=$(id -un)" > "$fixture/result" 2>&1; then
            echo 'Missing VM policy unexpectedly admitted backup provisioning.' >&2; exit 1
          fi
          grep -Fq 'included: ' "$fixture/result"
          grep -Fq '/backup-runtime.yml for localhost' "$fixture/result"
          grep -Eq 'changed=0 .*failed=1' "$fixture/result"
          if grep -Eq 'included: .*/(host|base-secrets|base-runtime|auth-runtime|deploy|owner-setup)\.yml ' "$fixture/result"; then
            echo 'Backup maintenance entered an unrelated convergence stage.' >&2; exit 1
          fi

  runtime-identity:
    name: Derive the existing runtime SSH public key before R4
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'yohn-jp/codexia' && inputs.mode == 'bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: codexia-production
    outputs:
      public-key: ${{ steps.public-key.outputs.key }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare existing protected runtime SSH identity
        id: runtime
        env:
          CODEXIA_DEPLOY_HOST: ${{ vars.CODEXIA_DEPLOY_HOST }}
          CODEXIA_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_DEPLOY_SSH_PRIVATE_KEY }}
          CODEXIA_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash deploy/ansible/prepare-deploy-ssh.sh
      - name: Export only the public half of the existing runtime credential
        id: public-key
        run: |
          set -euo pipefail
          key=$(ssh-keygen -y -P '' -f "$RUNNER_TEMP/codexia-ssh/id_ed25519" | awk '{print $1 " " $2}')
          [[ "$key" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,2}$ ]]
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - name: Remove the temporary runtime identity
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/codexia-ssh"

  bootstrap:
    needs: runtime-identity
    name: Protected production controller (${{ inputs.mode }})
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'yohn-jp/codexia' && inputs.mode != 'provision-backups' && (inputs.mode != 'bootstrap' || needs.runtime-identity.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: codexia-bootstrap
    outputs:
      host-id: ${{ steps.bound-host.outputs.host-id }}
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    steps:
      - name: Validate reviewed main and independent approvals before acquiring privileged credentials
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_MODE: ${{ inputs.mode }}
          BOOTSTRAP_ENABLED: ${{ vars.CODEXIA_BOOTSTRAP_ENABLED }}
          DATABASE_GATE: ${{ vars.CODEXIA_DATABASE_INITIALIZATION_APPROVED }}
          INIT_REQUESTED: ${{ inputs.initialize_database }}
          PREFLIGHT_RUN: ${{ inputs.preflight_run_id }}
          APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$GITHUB_SHA" ]] || { echo 'Main advanced after dispatch; review the new source before retrying.' >&2; exit 1; }
          if [[ "$BOOTSTRAP_MODE" == preflight ]]; then
            [[ "$INIT_REQUESTED" == false ]]
            exit 0
          fi
          [[ "$BOOTSTRAP_ENABLED" == true && "$PREFLIGHT_RUN" =~ ^[1-9][0-9]{0,15}$ ]] || {
            echo 'Protected enablement and reviewed lifecycle plan are required.' >&2; exit 1;
          }
          case "$BOOTSTRAP_MODE" in
            bootstrap)
              [[ "$APPROVAL_PHRASE" == BOOTSTRAP_CODEXIA ]] || exit 1
              [[ "$INIT_REQUESTED" == false || "$DATABASE_GATE" == true ]] || {
                echo 'Separate database initialization approval is missing.' >&2; exit 1;
              }
              ;;
            owner-setup|prepare-activation)
              [[ "$APPROVAL_PHRASE" == OWNER_SETUP_CODEXIA && "$INIT_REQUESTED" == false ]] || exit 1
              ;;
            *) exit 1 ;;
          esac
      - name: Check out the exact reviewed main source without persisted credentials
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load the reviewed Preflight candidate and plan
        id: preflight
        if: inputs.mode != 'preflight'
        uses: ./.github/actions/reviewed-preflight
        with:
          run-id: ${{ inputs.preflight_run_id }}
          management: bootstrap
      - uses: actions/setup-node@v7.1.0
        if: inputs.mode != 'preflight'
        with:
          node-version: '24.22.3'
      - name: Load reviewed production OAuth settings
        run: node scripts/deployment/bootstrap/public-env.mjs
      - name: Install frozen evidence-reader dependencies
        if: inputs.mode != 'preflight'
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - uses: docker/login-action@v4.8.0
        if: inputs.mode != 'preflight'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify candidate pair, Full OCI identity and current main before opening SSH
        if: inputs.mode != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_REPOSITORY_ID: ${{ github.repository_id }}
          CODEXIA_PREFLIGHT_REQUEST: ${{ steps.preflight.outputs.request }}
        run: node scripts/deployment/preflight/run.mjs candidate
      - name: Install the pinned Ansible control environment
        run: |
          set -euo pipefail
          bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/codexia-ansible" -r deploy/ansible/requirements.txt
          echo "$RUNNER_TEMP/codexia-ansible/bin" >> "$GITHUB_PATH"
      - name: Prepare private inventory, exact secret inputs, pinned SSH identity, and run-scoped approvals
        id: control
        env:
          CODEXIA_BOOTSTRAP_MODE: ${{ inputs.mode }}
          CODEXIA_BOOTSTRAP_HOST: ${{ vars.CODEXIA_BOOTSTRAP_HOST }}
          CODEXIA_BOOTSTRAP_SSH_USER: ${{ vars.CODEXIA_BOOTSTRAP_SSH_USER }}
          CODEXIA_BOOTSTRAP_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_BOOTSTRAP_SSH_KNOWN_HOSTS }}
          CODEXIA_BOOTSTRAP_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_BOOTSTRAP_SSH_PRIVATE_KEY }}
          CODEXIA_TUNNEL_TOKEN: ${{ inputs.mode == 'bootstrap' && secrets.CODEXIA_TUNNEL_TOKEN || '' }}
          CODEXIA_OWNER_SETUP_AGE_RECIPIENT: ${{ inputs.mode == 'owner-setup' && vars.CODEXIA_OWNER_SETUP_AGE_RECIPIENT || '' }}
          CODEXIA_RUNTIME_SSH_PUBLIC_KEY: ${{ needs.runtime-identity.outputs.public-key }}
          CODEXIA_BOOTSTRAP_DATABASE_INITIALIZATION_APPROVED: ${{ inputs.mode == 'bootstrap' && inputs.initialize_database && vars.CODEXIA_DATABASE_INITIALIZATION_APPROVED == 'true' }}
        run: |
          "$RUNNER_TEMP/codexia-ansible/bin/python" deploy/ansible/prepare-production-bootstrap.py
      - name: Connect to the protected Tailnet with GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ format('api.tailscale.com/{0}', vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID) }}
          tags: tag:ci
          ping: ${{ steps.control.outputs.host }}
      - name: Verify the independent bootstrap identity and noninteractive sudo
        env:
          CONTROL_SSH_CONFIG: ${{ steps.control.outputs.ssh_config }}
          EXPECTED_USER: ${{ steps.control.outputs.user }}
        run: |
          set -euo pipefail
          actual=$(ssh -F "$CONTROL_SSH_CONFIG" codexia-bootstrap-target 'id -un')
          [[ "$actual" == "$EXPECTED_USER" ]] || { echo 'The VM returned an unexpected SSH identity.' >&2; exit 1; }
          ssh -F "$CONTROL_SSH_CONFIG" codexia-bootstrap-target 'sudo -n true'
      - name: Verify read-only controller inventory and Ansible syntax
        if: inputs.mode == 'preflight'
        env:
          CONTROL: ${{ steps.control.outputs.control }}
        run: |
          set -euo pipefail
          ansible-playbook -i "$CONTROL/inventory.yml" deploy/ansible/site.yml --extra-vars "@$CONTROL/runtime-vars.json" --syntax-check
          ansible-playbook -i "$CONTROL/inventory.yml" deploy/ansible/site.yml --extra-vars "@$CONTROL/runtime-vars.json" --list-hosts
      - name: Observe the pinned host after entering the production queue
        if: inputs.mode != 'preflight'
        env:
          CODEXIA_PREFLIGHT_TARGET_HOST: ${{ steps.control.outputs.host }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: node scripts/deployment/preflight/run.mjs bootstrap-host
      - name: Bind runtime SSH acceptance to the observed VM
        if: inputs.mode != 'preflight'
        id: bound-host
        run: |
          set -euo pipefail
          host_id=$(jq -er '.host.hostId | select(test("^[a-f0-9]{64}$"))' "$RUNNER_TEMP/codexia-lifecycle-host.json")
          printf 'host-id=%s\n' "$host_id" >> "$GITHUB_OUTPUT"
      - name: Resolve current edge state and match the approved Preflight plan
        if: inputs.mode != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_PREFLIGHT_REQUEST: ${{ steps.preflight.outputs.request }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN }}
          CODEXIA_ACCESS_CLIENT_ID: ${{ secrets.CODEXIA_ACCESS_CLIENT_ID }}
          CODEXIA_ACCESS_CLIENT_SECRET: ${{ secrets.CODEXIA_ACCESS_CLIENT_SECRET }}
          CODEXIA_BOOTSTRAP_MODE: ${{ inputs.mode }}
          CODEXIA_BOOTSTRAP_PLAN_SHA256: ${{ steps.preflight.outputs.plan-sha256 }}
          CODEXIA_BOOTSTRAP_PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          CODEXIA_BOOTSTRAP_PREFLIGHT_ATTEMPT: ${{ steps.preflight.outputs.attempt }}
          CODEXIA_BOOTSTRAP_DATABASE_INITIALIZATION_APPROVED: ${{ inputs.mode == 'bootstrap' && inputs.initialize_database && vars.CODEXIA_DATABASE_INITIALIZATION_APPROVED == 'true' }}
          CODEXIA_BOOTSTRAP_AUTH_CONTINUATION_APPROVED: ${{ inputs.mode == 'bootstrap' && !inputs.initialize_database && vars.CODEXIA_DATABASE_INITIALIZATION_APPROVED == 'true' }}
        run: node scripts/deployment/preflight/run.mjs bootstrap-admission
      - name: Execute only the admitted R4 or R5 operation through Ansible
        if: inputs.mode != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL: ${{ steps.control.outputs.control }}
          OPERATION: ${{ inputs.mode }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$GITHUB_SHA" ]] || { echo 'Main advanced during bootstrap preflight; no mutation was attempted.' >&2; exit 1; }
          if [[ "$OPERATION" == bootstrap ]]; then
            playbook=site
          else
            playbook=prepare-owner-activation
          fi
          ansible-playbook -i "$CONTROL/inventory.yml" "deploy/ansible/$playbook.yml" \
            --limit codexia --extra-vars "@$CONTROL/runtime-vars.json" --extra-vars "@$CONTROL/admission.json"
      - name: Remove private controller inputs from the runner
        if: always()
        run: |
          set -euo pipefail
          controller="$RUNNER_TEMP/codexia-bootstrap"
          if [[ -d "$controller" && ! -L "$controller" ]]; then
            rm -rf -- "$controller"
          fi

  runtime-acceptance:
    name: Protected runtime operation (${{ inputs.mode }})
    needs: bootstrap
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'yohn-jp/codexia' && ((inputs.mode == 'bootstrap' && needs.bootstrap.result == 'success') ||
      (inputs.mode == 'provision-backups' && needs.bootstrap.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: codexia-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit post-ACTIVE backup maintenance on current main
        if: inputs.mode == 'provision-backups'
        env:
          GH_TOKEN: ${{ github.token }}
          INIT_REQUESTED: ${{ inputs.initialize_database }}
          LIFECYCLE_PLAN: ${{ inputs.preflight_run_id }}
          LIFECYCLE_APPROVAL: ${{ inputs.approval_phrase }}
        run: |
          set -euo pipefail
          [[ "$INIT_REQUESTED" == false && -z "$LIFECYCLE_PLAN" && -z "$LIFECYCLE_APPROVAL" ]] ||
            { echo 'Backup maintenance cannot consume lifecycle approvals.' >&2; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/codexia-ansible" -r deploy/ansible/requirements.txt
      - name: Prepare existing protected runtime SSH identity
        id: runtime
        env:
          CODEXIA_DEPLOY_HOST: ${{ vars.CODEXIA_DEPLOY_HOST }}
          CODEXIA_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_DEPLOY_SSH_PRIVATE_KEY }}
          CODEXIA_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash deploy/ansible/prepare-deploy-ssh.sh
      - name: Connect the existing protected management plane
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ format('api.tailscale.com/{0}', vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID) }}
          tags: tag:ci
          ping: ${{ steps.runtime.outputs.host }}
      - name: Prove the runtime credential reaches the same rootless service account and VM
        if: inputs.mode == 'bootstrap'
        env:
          EXPECTED_HOST_ID: ${{ needs.bootstrap.outputs.host-id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HOST_ID" =~ ^[a-f0-9]{64}$ ]]
          ssh_config="$RUNNER_TEMP/codexia-ssh/config"
          [[ "$(ssh -F "$ssh_config" codexia-target 'id -un')" == codexia ]]
          machine=$(ssh -F "$ssh_config" codexia-target 'cat /etc/machine-id')
          [[ "$machine" =~ ^[a-f0-9]{32}$ ]]
          actual=$(printf '%s' "$machine" | sha256sum | cut -d' ' -f1)
          [[ "$actual" == "$EXPECTED_HOST_ID" ]]
          echo 'R4 runtime SSH identity and host binding verified.'
      - name: Provision the VM-local backup runtime on the existing writer
        if: inputs.mode == 'provision-backups'
        env:
          GH_TOKEN: ${{ github.token }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: |
          set -euo pipefail
          umask 077
          control="$RUNNER_TEMP/codexia-ssh"
          export ANSIBLE_SSH_COMMON_ARGS="-F $control/config"
          [[ "$(ssh -F "$control/config" codexia-target 'id -un')" == codexia ]]
          printf 'codexia ansible_host=codexia-target ansible_user=codexia\n' > "$control/inventory"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          "$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" -i "$control/inventory" deploy/ansible/site.yml \
            --limit codexia --extra-vars '{"codexia_stage":"base","codexia_service_user":"codexia","codexia_service_home":"/home/codexia","codexia_backup_runtime_approved":true,"codexia_database_initialization_approved":false}'
      - name: Remove the temporary runtime identity
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/codexia-ssh"
