name: Format native Podman contract fixture
on:
  push:
    branches: [verify/native-podman-biome-format]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.6.8
      - name: Format changed fixture and print exact result
        run: |
          biome check --write packages/persistence-postgres/tests/db-contract/run.mjs
          biome ci packages/persistence-postgres/tests/db-contract/run.mjs
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const s=readFileSync("packages/persistence-postgres/tests/db-contract/run.mjs","utf8"); for(let i=0;i<s.length;i+=2000) console.log("FORMAT_CHUNK "+JSON.stringify(s.slice(i,i+2000))); console.log("FORMAT_LENGTH "+s.length);'
