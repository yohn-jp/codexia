name: Auto release CodexiaCTL
on:
  workflow_run:
    workflows: ['Verify Codexia']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: codexiactl-auto-release
  cancel-in-progress: false
jobs:
  tag:
    # Publication hold during the approved headless authentication / Tunnel migration.
    # Remove this hold only with the integrated acceptance required by CODEXIACTL.sdoc.
    if: >-
      false &&
      github.repository == 'yohn-jp/codexia' &&
      github.event.workflow_run.path == '.github/workflows/verify.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.repository.id == github.repository_id &&
      github.event.workflow_run.repository.owner.id == github.repository_owner_id &&
      github.event.workflow_run.head_repository.id == github.repository_id &&
      github.event.workflow_run.head_repository.owner.id == github.repository_owner_id &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish or resume immutable v0.1.x for verified CLI changes
        uses: actions/github-script@v8
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const script = pathToFileURL(path.join(process.env.GITHUB_WORKSPACE,
              'scripts/release/components/codexiactl-automation.mjs')).href;
            const { releaseVerifiedCodexiactl } = await import(script);
            await releaseVerifiedCodexiactl({
              github, context, core, sha: process.env.VERIFIED_SHA,
            });
