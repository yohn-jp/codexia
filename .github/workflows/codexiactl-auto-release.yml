name: Auto release CodexiaCTL
on:
  workflow_run:
    workflows: ['Verify Codexia']
    types: [completed]
permissions:
  contents: write
  actions: write
concurrency:
  group: codexiactl-auto-release
  cancel-in-progress: false
jobs:
  tag:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Publish next immutable v0.1.x tag for changed CLI
        uses: actions/github-script@v8
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const sha = process.env.VERIFIED_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid verified SHA');
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            if (main.data.commit.sha !== sha) {
              core.info('Superseded main verification: no tag');
              return;
            }
            const commit = await github.rest.repos.getCommit({owner, repo, ref: sha});
            if (commit.data.parents.length !== 1 && commit.data.parents.length !== 2) {
              throw new Error('Unexpected commit parent count; review manually');
            }
            const parent = commit.data.parents[0].sha;
            const diff = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${parent}...${sha}`, per_page: 100
            });
            if (diff.data.total_commits > 250 || diff.data.files.length >= 100) {
              throw new Error('Comparison too large; manual release review required');
            }
            const cliPath = p => p.startsWith('cmd/codexiactl/') ||
              p === 'scripts/ci/execution/verify-codexiactl.sh' ||
              p.startsWith('scripts/release/components/codexiactl-release') ||
              p === '.github/workflows/publish-codexiactl.yml' ||
              p === '.github/workflows/codexiactl-auto-release.yml';
            if (!diff.data.files.some(f => cliPath(f.filename))) {
              core.info('No CodexiaCTL changes: no release');
              return;
            }
            const tags = await github.paginate(github.rest.repos.listTags, {owner, repo, per_page: 100});
            const versions = tags.map(t => /^v0\.1\.(\d+)$/.exec(t.name))
              .filter(Boolean).map(m => Number(m[1]));
            const next = Math.max(0, ...versions) + 1;
            if (!Number.isSafeInteger(next)) throw new Error('Invalid release sequence');
            const tag = `v0.1.${next}`;
            await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha});
            // GITHUB_TOKEN-created tag pushes do not start workflows. Dispatch the
            // publisher explicitly against the immutable tag instead.
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'publish-codexiactl.yml', ref: tag
            });
            core.notice(`Dispatched Publish CodexiaCTL at ${tag} (${sha})`);
