name: Ansible performance A/B (experimental)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ansible-performance-ab.yml
      - scripts/ansible-ab/**
  workflow_dispatch:
    inputs:
      repetitions:
        description: Number of paired SSH benchmark repetitions (1-5)
        type: number
        required: false
        default: 2

permissions:
  contents: read

concurrency:
  group: ansible-performance-ab-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Experimental only. No production Environment, secrets, Tailscale, GHCR or deploy.
# The SSH probe is a synthetic workload; the separate rootless fixture checks
# existing production Ansible contracts under local connection and become.
jobs:
  ssh-ab:
    name: SSH strategies and task-shape A/B
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install isolated test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client sudo
          python3 -m venv "$RUNNER_TEMP/codexia-ansible-ab-venv"
          "$RUNNER_TEMP/codexia-ansible-ab-venv/bin/pip" install -r deploy/ansible/requirements.txt mitogen==0.3.55
          "$RUNNER_TEMP/codexia-ansible-ab-venv/bin/ansible-playbook" --version
          "$RUNNER_TEMP/codexia-ansible-ab-venv/bin/python" -c 'import importlib.metadata as m; assert m.version("mitogen") == "0.3.55"'
      - name: Create locked-down disposable loopback SSH target
        run: bash scripts/ansible-ab/ssh-fixture.sh create
      - name: Run matched A/B matrix and publish timings
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/codexia-ansible-ab-venv"
          plugin_path=$("$venv/bin/python" -c 'import ansible_mitogen, os; print(os.path.join(os.path.dirname(ansible_mitogen.__file__), "plugins", "strategy"))')
          python3 scripts/ansible-ab/benchmark.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/codexia-ansible-ab-results" \
            --fixture "$RUNNER_TEMP/codexia-ansible-ab-ssh" \
            --playbook scripts/ansible-ab/benchmark-fixture.yml \
            --ansible-playbook "$venv/bin/ansible-playbook" \
            --mitogen-strategy-path "$plugin_path" \
            --mitogen-version 0.3.55 \
            --repetitions "${{ inputs.repetitions || 2 }}"
      - name: Archive machine-readable measurements and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ansible-ssh-ab-measurements
          path: ${{ runner.temp }}/codexia-ansible-ab-results
          if-no-files-found: warn
          retention-days: 30
      - name: Remove disposable SSH identities
        if: always()
        run: bash scripts/ansible-ab/ssh-fixture.sh cleanup

  base-contract-ab:
    name: Rootless Podman contract A/B (linear vs Mitogen)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install existing disposable runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap netavark aardvark-dns passt slirp4netns fuse-overlayfs dbus-user-session jq
          python3 -m venv "$RUNNER_TEMP/codexia-ansible-ab-venv"
          "$RUNNER_TEMP/codexia-ansible-ab-venv/bin/pip" install -r deploy/ansible/requirements.txt mitogen==0.3.55
          "$RUNNER_TEMP/codexia-ansible-ab-venv/bin/ansible-playbook" --version
      - name: Prepare disposable rootless service and systemd manager
        run: |
          set -euo pipefail
          fixture_user=codexia-ab-rootless
          if getent passwd "$fixture_user" >/dev/null; then
            echo 'Refusing to adopt an existing rootless fixture account' >&2
            exit 1
          fi
          fixture_skel=$(mktemp -d "$RUNNER_TEMP/codexia-ab-skel.XXXXXX")
          sudo useradd --create-home --skel "$fixture_skel" --user-group --groups '' --shell /bin/bash \
            --key SUB_UID_COUNT=65536 --key SUB_GID_COUNT=65536 "$fixture_user"
          touch "$RUNNER_TEMP/codexia-ab-rootless-owned"
          rmdir "$fixture_skel"
          fixture_uid=$(id -u "$fixture_user")
          fixture_home=$(getent passwd "$fixture_user" | cut -d: -f6)
          test "$(id -G "$fixture_user")" = "$(id -g "$fixture_user")"
          for mappings in /etc/subuid /etc/subgid; do
            awk -F: -v user="$fixture_user" '$1 == user && $3 >= 65536 { found=1 } END { exit !found }' "$mappings"
          done
          sudo install -d -m 0755 "/run/systemd/system/user@$fixture_uid.service.d"
          cat <<EOF | sudo tee "/run/systemd/system/user@$fixture_uid.service.d/10-codexia-ci-xdg.conf" >/dev/null
          [Service]
          Environment=HOME=$fixture_home
          Environment=XDG_CONFIG_HOME=$fixture_home/.config
          Environment=XDG_RUNTIME_DIR=/run/user/$fixture_uid
          EOF
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$fixture_user"
          sudo systemctl start "user@$fixture_uid.service"
          if sudo -u "$fixture_user" sudo -n true 2>/dev/null; then
            echo 'Rootless fixture account unexpectedly has sudo access' >&2
            exit 1
          fi
          for attempt in $(seq 1 20); do
            if sudo -u "$fixture_user" env HOME="$fixture_home" XDG_RUNTIME_DIR="/run/user/$fixture_uid" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" systemctl --user show --property=Version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          sudo -u "$fixture_user" env HOME="$fixture_home" XDG_CONFIG_HOME="$fixture_home/.config" \
            XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" \
            systemctl --user import-environment HOME XDG_CONFIG_HOME XDG_RUNTIME_DIR
          manager_pid=$(sudo systemctl show --property=MainPID --value "user@$fixture_uid.service")
          test "$manager_pid" -gt 1
          manager_process_env=$(sudo cat "/proc/$manager_pid/environ" | tr '\0' '\n')
          manager_env=$(sudo -u "$fixture_user" env HOME="$fixture_home" XDG_RUNTIME_DIR="/run/user/$fixture_uid" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" systemctl --user show-environment)
          for expected in "HOME=$fixture_home" "XDG_CONFIG_HOME=$fixture_home/.config" "XDG_RUNTIME_DIR=/run/user/$fixture_uid"; do
            grep -Fxq "$expected" <<<"$manager_env"
            grep -Fxq "$expected" <<<"$manager_process_env"
          done
      - name: Run unchanged rootless contracts under both Ansible strategies
        env:
          CODEXIA_SERVICE_USER: codexia-ab-rootless
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/codexia-ansible-ab-contract"
          mkdir -p "$out"
          venv="$RUNNER_TEMP/codexia-ansible-ab-venv"
          plugin_path=$("$venv/bin/python" -c 'import ansible_mitogen, os; print(os.path.join(os.path.dirname(ansible_mitogen.__file__), "plugins", "strategy"))')
          export ANSIBLE_REAL_PLAYBOOK="$venv/bin/ansible-playbook"
          cp scripts/ansible-ab/time-playbook.sh "$out/ansible-playbook-wrapper"
          chmod 0700 "$out/ansible-playbook-wrapper"
          export ANSIBLE_PLAYBOOK="$out/ansible-playbook-wrapper"
          export ANSIBLE_STRATEGY_PLUGINS="$plugin_path"
          export CODEXIA_DISPOSABLE_HOST=base-integration
          fixture_uid=$(id -u "$CODEXIA_SERVICE_USER")
          export XDG_RUNTIME_DIR="/run/user/$fixture_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          printf 'arm,seconds,secrets,runtime,invocations,playbook_ms\n' > "$out/contract.csv"
          run_contract() {
            arm=$1
            export ANSIBLE_STRATEGY="$arm"
            export ANSIBLE_AB_ARM="$arm"
            export ANSIBLE_AB_METRIC_FILE="$out/$arm-invocations.csv"
            printf 'arm,duration_ms,exit_code\n' > "$ANSIBLE_AB_METRIC_FILE"
            start=$SECONDS
            secret_status=fail
            runtime_status=not_run
            if bash deploy/ansible/test-base-secrets-integration.sh > "$out/$arm-secrets.log" 2>&1; then
              secret_status=pass
              if bash deploy/ansible/test-base-runtime-integration.sh > "$out/$arm-runtime.log" 2>&1; then
                runtime_status=pass
              else
                runtime_status=fail
              fi
            fi
            seconds=$((SECONDS - start))
            calls=$(awk 'END { print NR - 1 }' "$ANSIBLE_AB_METRIC_FILE")
            playbook_ms=$(awk -F, 'NR > 1 { total += $2 } END { printf "%.0f", total }' "$ANSIBLE_AB_METRIC_FILE")
            printf '%s,%s,%s,%s,%s,%s\n' "$arm" "$seconds" "$secret_status" "$runtime_status" "$calls" "$playbook_ms" >> "$out/contract.csv"
            printf 'ANSIBLE_CONTRACT_AB strategy=%s seconds=%s secrets=%s runtime=%s calls=%s playbook_ms=%s\n' \
              "$arm" "$seconds" "$secret_status" "$runtime_status" "$calls" "$playbook_ms"
            test "$secret_status" = pass && test "$runtime_status" = pass
          }
          # A failed baseline is fatal. Mitogen incompatibility is recorded, not
          # misreported as a valid speedup or enabled in production.
          run_contract linear
          if ! run_contract mitogen_linear; then
            echo 'Mitogen did not meet the full existing base contract. Experimental arm rejected.' >&2
          fi
          {
            echo '### Ansible rootless contract A/B (disposable local-connection fixture)'
            echo ''
            echo 'The upstream scripts are unchanged. This checks contract compatibility; it is not an SSH benchmark.'
            echo ''
            echo '| Strategy | Total seconds | Playbook calls | Playbook ms | Secrets | Runtime |'
            echo '| --- | ---: | ---: | ---: | --- | --- |'
            tail -n +2 "$out/contract.csv" | while IFS=, read -r arm seconds secrets runtime calls playbook_ms; do
              echo "| $arm | $seconds | $calls | $playbook_ms | $secrets | $runtime |"
            done
            echo ''
            echo 'A candidate with any failed contract is not eligible for adoption.'
          } | tee "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive synthetic fixture contract evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ansible-base-contract-ab
          path: ${{ runner.temp }}/codexia-ansible-ab-contract
          if-no-files-found: warn
          retention-days: 30
      - name: Remove disposable rootless service fixture
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/codexia-ab-rootless-owned"; then
            fixture_user=codexia-ab-rootless
            if id "$fixture_user" >/dev/null 2>&1; then
              fixture_uid=$(id -u "$fixture_user")
              sudo loginctl disable-linger "$fixture_user" || true
              sudo systemctl stop "user@$fixture_uid.service" || true
              sudo rm -f "/run/systemd/system/user@$fixture_uid.service.d/10-codexia-ci-xdg.conf"
              sudo rmdir "/run/systemd/system/user@$fixture_uid.service.d" 2>/dev/null || true
              sudo systemctl daemon-reload
              sudo userdel --remove "$fixture_user" || true
            fi
            rm -f "$RUNNER_TEMP/codexia-ab-rootless-owned"
          fi
