name: Coordinated API epoch maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Reviewed maintenance phase
        required: true
        type: choice
        options: [preflight, stage, checkpoint, apply, promote, recover-quiesce, recover, finish, abort-fence]
      request:
        description: Digest-only phase request JSON. Never include credentials or private evidence.
        default: '{}'
        required: true
        type: string

permissions:
  contents: read

jobs:
  maintenance:
    name: Protected coordinated API epoch maintenance
    if: github.repository == 'yohn-jp/codexia' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: codexia-production
    concurrency:
      group: codexia-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Require the separately enabled maintenance workflow
        env:
          CUTOVER_ENABLED: ${{ vars.CODEXIA_EPOCH_CUTOVER_ENABLED }}
        run: test "$CUTOVER_ENABLED" = true
      - name: Prepare the pinned SSH target
        id: target
        env:
          CODEXIA_DEPLOY_HOST: ${{ vars.CODEXIA_DEPLOY_HOST }}
          CODEXIA_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_DEPLOY_SSH_PRIVATE_KEY }}
          CODEXIA_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash deploy/ansible/prepare-deploy-ssh.sh
      - name: Connect to the Tailnet using GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: api.tailscale.com/Ts4P9VFjmJ11CNTRL-khX5P9DgL421CNTRL
          tags: tag:ci
          ping: ${{ steps.target.outputs.host }}
      - name: Verify the pinned management path and prepare the Ansible controller
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/codexia-ssh/config" codexia-target 'test "$(id -un)" = codexia'
          python3 -m venv "$RUNNER_TEMP/codexia-ansible"
          "$RUNNER_TEMP/codexia-ansible/bin/pip" install -r deploy/ansible/requirements.txt
          echo "$RUNNER_TEMP/codexia-ansible/bin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/codexia-cutover-inventory.yml" <<EOF_INVENTORY
          all:
            hosts:
              codexia:
                ansible_host: codexia-target
                ansible_user: codexia
                ansible_ssh_use_tty: false
                ansible_ssh_common_args: '-F "$RUNNER_TEMP/codexia-ssh/config"'
                codexia_service_home: /home/codexia
          EOF_INVENTORY
      - uses: docker/login-action@v4.8.0
        if: inputs.operation == 'preflight' || inputs.operation == 'stage'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install the pinned Wrangler used by the frontend release
        if: inputs.operation == 'stage'
        run: npm ci --prefix edge/frontend
      - name: Execute and verify the selected maintenance phase
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_REPOSITORY_ID: ${{ github.repository_id }}
          CODEXIA_CUTOVER_OPERATION: ${{ inputs.operation }}
          CODEXIA_CUTOVER_INPUT: ${{ inputs.request }}
          CODEXIA_CUTOVER_RECOVERY_RECEIPT: ${{ inputs.operation == 'apply' && secrets.CODEXIA_CUTOVER_RECOVERY_RECEIPT || '' }}
          CODEXIA_CUTOVER_RESTORE_RECEIPT: ${{ inputs.operation == 'recover' && secrets.CODEXIA_CUTOVER_RESTORE_RECEIPT || '' }}
          CODEXIA_CUTOVER_ACCEPTANCE: ${{ (inputs.operation == 'finish' || inputs.operation == 'abort-fence') && secrets.CODEXIA_CUTOVER_ACCEPTANCE || '' }}
          CODEXIA_EPOCH_CUTOVER_PAUSED: ${{ vars.CODEXIA_EPOCH_CUTOVER_PAUSED }}
          CODEXIA_CUTOVER_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_CUTOVER_CLOUDFLARE_TARGET }}
          CODEXIA_CUTOVER_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_CUTOVER_CLOUDFLARE_READ_TOKEN }}
          CODEXIA_CUTOVER_WORKER_TOKEN: ${{ inputs.operation != 'preflight' && secrets.CODEXIA_CUTOVER_WORKER_TOKEN || '' }}
          CODEXIA_CUTOVER_FENCE_TOKEN: ${{ inputs.operation != 'preflight' && secrets.CODEXIA_CUTOVER_FENCE_TOKEN || '' }}
          CODEXIA_PUBLIC_ORIGIN: ${{ vars.CODEXIA_PUBLIC_ORIGIN }}
          CODEXIA_ACCESS_CLIENT_ID: ${{ secrets.CODEXIA_ACCESS_CLIENT_ID }}
          CODEXIA_ACCESS_CLIENT_SECRET: ${{ secrets.CODEXIA_ACCESS_CLIENT_SECRET }}
          CODEXIA_BACKUP_DESTINATION: ${{ vars.CODEXIA_BACKUP_DESTINATION || '/home/codexia/backups' }}
          CODEXIA_BACKUP_AGE_RECIPIENT: ${{ vars.CODEXIA_BACKUP_AGE_RECIPIENT }}
          VITE_CODEXIA_OAUTH_ISSUER: ${{ vars.VITE_CODEXIA_OAUTH_ISSUER }}
          VITE_CODEXIA_OAUTH_CLIENT_ID: ${{ vars.VITE_CODEXIA_OAUTH_CLIENT_ID }}
          VITE_CODEXIA_API_AUDIENCE: ${{ vars.VITE_CODEXIA_API_AUDIENCE }}
          VITE_CODEXIA_OAUTH_DESKTOP_REDIRECT_URI: ${{ vars.VITE_CODEXIA_OAUTH_DESKTOP_REDIRECT_URI }}
          VITE_CODEXIA_OAUTH_MOBILE_REDIRECT_URI: ${{ vars.VITE_CODEXIA_OAUTH_MOBILE_REDIRECT_URI }}
          VITE_CODEXIA_OAUTH_SCOPES: ${{ vars.VITE_CODEXIA_OAUTH_SCOPES }}
        run: node scripts/deployment/cutover/run.mjs
      - name: Retain redacted phase evidence for Issue 168
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: epoch-cutover-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexia-cutover-evidence.json
          if-no-files-found: ignore
          retention-days: 30
