name: Repository Audit Pages
on:
  pull_request:
    paths:
      - 'scripts/audit/**'
      - 'scripts/ci-dashboard/**'
      - 'scripts/graphify-pages/**'
      - 'scripts/architecture-diagrams/**'
      - 'docs/architecture/SYSTEM-DESIGN.md'
      - 'docs/architecture/DATA-MODEL.md'
      - 'docs/design/USER-SCREEN-FLOW.md'
      - 'docs/design/ADMIN-SCREEN-FLOW.md'
      - 'docs/design/SCREEN-STATE-ATLAS.md'
      - 'docs/design/SCREEN-CONTROL-CATALOG.md'
      - 'docs/architecture/ROUTE-AUTHORIZATION-CONTRACT.md'
      - 'docs/verification/ARCHITECTURE-ATLAS.md'
      - 'docs/deployment/INITIAL-DEPLOYMENT-FLOW.md'
      - 'docs/deployment/UPDATE-FLOW.md'
      - 'docs/verification/GRAPHIFY-PAGES.md'
      - 'scripts/ci-timing.mjs'
      - 'scripts/ci-contract.mjs'
      - '.github/workflows/repository-audit.yml'
      - 'docs/verification/CI-DASHBOARD.md'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      OCR_NO_UPDATE: '1'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'
      - name: Install the isolated audit tool
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-tool" --ignore-scripts --no-audit --no-fund repomix@1.19.0 playwright-core@1.64.1
          echo "CODEXIA_AUDIT_REPOMIX_BIN=$RUNNER_TEMP/audit-tool/node_modules/.bin/repomix" >> "$GITHUB_ENV"
          echo "CODEXIA_AUDIT_TOOL_DIR=$RUNNER_TEMP/audit-tool" >> "$GITHUB_ENV"
      - name: Install pinned OCR delegation CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-ocr" --ignore-scripts --no-audit --no-fund @alibaba-group/open-code-review@1.13.13
          echo "CODEXIA_AUDIT_OCR_BIN=$RUNNER_TEMP/audit-ocr/node_modules/.bin/ocr" >> "$GITHUB_ENV"
      - name: Test audit exporter, delegation and browser portal
        run: node --test scripts/audit/*.test.mjs scripts/ci-dashboard/*.test.mjs scripts/graphify-pages/pack.test.mjs scripts/architecture-diagrams/pack.test.mjs
      - name: Restore previous verified HEAD exports
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/audit-cache
          key: audit-pages-v1-${{ hashFiles('scripts/audit/export.mjs', 'scripts/audit/repomix.config.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            audit-pages-v1-${{ hashFiles('scripts/audit/export.mjs', 'scripts/audit/repomix.config.json') }}-
      - name: Pack every remote branch HEAD with the same policy
        run: |
          node scripts/audit/export.mjs "$RUNNER_TEMP/audit-site" "$RUNNER_TEMP/audit-cache" "$CODEXIA_AUDIT_REPOMIX_BIN"
      - name: Generate deterministic per-file OCR Delegate inputs
        run: |
          node scripts/audit/delegate.mjs "$RUNNER_TEMP/audit-site" "$CODEXIA_AUDIT_OCR_BIN"
      - name: Bundle CI dashboard in the existing Pages artifact
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/ci-dashboard/collect.mjs "$RUNNER_TEMP/audit-site" --preview
          else
            node scripts/ci-dashboard/collect.mjs "$RUNNER_TEMP/audit-site"
          fi
      - name: Install pinned static Mermaid renderer
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/architecture-renderer" --ignore-scripts --no-audit --no-fund @mermaid-js/mermaid-cli@12.2.0 puppeteer@25.17.0
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -x "$CHROME"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Render all canonical architecture diagrams and verify actual browser interaction
        run: |
          node scripts/architecture-diagrams/pack.mjs \
            "$RUNNER_TEMP/audit-site" "$(git rev-parse HEAD)" \
            "$RUNNER_TEMP/architecture-renderer/node_modules/.bin/mmdc"
          node scripts/architecture-diagrams/smoke.mjs \
            "$RUNNER_TEMP/audit-site/architecture" \
            "$RUNNER_TEMP/audit-tool/node_modules/playwright-core"
      - name: Generate main source graph for Pages
        env:
          GRAPHIFY_BACKEND: none
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'graphifyy[sql,terraform]==0.9.115'
          timeout 600s graphify extract . --code-only \
            --out "$RUNNER_TEMP/graphify-out" \
            --max-workers 2 \
            --exclude 'tests/**' \
            --exclude 'evidence/**' \
            --exclude '.agents/**' \
            --exclude 'docs/**' \
            --exclude '**/*.test.*' \
            --exclude '**/*.spec.*'
          timeout 120s graphify cluster-only "$RUNNER_TEMP/graphify-out" --no-label
          node scripts/graphify-pages/pack.mjs \
            "$RUNNER_TEMP/graphify-out/graphify-out" "$RUNNER_TEMP/audit-site" "$(git rev-parse HEAD)"
      - name: Require current PR's review materials
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node -e 'const m=require(process.argv[1]); const r=m.reviews?.[process.env.REVIEW_SHA]; if(!r || !["ready","partial","no-diff"].includes(r.status) || (r.selected > 0 && r.published === 0)) throw Error("Current PR has no usable OCR-selected source material");' "$RUNNER_TEMP/audit-site/manifest.json"
      - name: Require usable main snapshot in PR preview
        if: github.event_name == 'pull_request'
        run: node -e 'const m=require(process.argv[1]); const main=m.branches.find(x=>x.branch==="main"); if(!main || m.snapshots[main.sha].status==="blocked") throw new Error("Main audit snapshot is unavailable");' "$RUNNER_TEMP/audit-site/manifest.json"
      - name: Save verified HEAD exports
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/audit-cache
          key: audit-pages-v1-${{ hashFiles('scripts/audit/export.mjs', 'scripts/audit/repomix.config.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/audit-site
      - name: Upload non-publishing PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: repository-audit-preview
          path: ${{ runner.temp }}/audit-site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy audit portal
        id: deployment
        uses: actions/deploy-pages@v5.0.1
