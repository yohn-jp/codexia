name: Repository Audit Pages
on:
  # Full portal is published on main; PR previews are reserved for changes to
  # its generators, renderers, direct evidence consumers and portal contracts.
  # Ordinary product/Verify/host changes get their own checks and the next
  # full main Pages publication, without a redundant preview.
  pull_request:
    paths:
      - '.gitignore'
      - '.graphifyignore'
      - 'scripts/shared/python-env.sh'
      - 'scripts/shared/read-regular-file.mjs'
      - 'scripts/audit/**'
      - 'scripts/strictdoc/**'
      - 'docs/requirements/**'
      - 'docs/architecture/likec4/**'
      - 'scripts/ci/dashboard/**'
      - 'scripts/graphify-pages/**'
      - 'scripts/architecture-diagrams/**'
      - 'scripts/architecture/**'
      - 'scripts/pages-ui/**'
      - 'scripts/ux-simulator/**'
      - 'scripts/pages-api/**'
      - 'scripts/code-scanning-pages/**'
      - 'scripts/verification/artifacts/pages-*.mjs'
      - 'scripts/ci/evidence/trace-receipt*.mjs'
      - 'scripts/ci/evidence/artifact-selection.mjs'
      - 'scripts/ci/evidence/download-artifacts.mjs'
      - 'scripts/ci/evidence/github-rest-sdk.mjs'
      - 'scripts/ci/evidence/job-name.mjs'
      - 'scripts/github/octokit.mjs'
      - 'scripts/github/paginate-actions.mjs'
      - '.github/workflows/repository-audit.yml'
      - 'docs/**/*.sdoc'
      - 'docs/**/*.sgra'
      - 'docs/**/_assets/**'
      - 'docs/architecture/diagrams/**'
      - 'docs/design/screen-*.json'
      - 'app/DESIGN.md'
      - 'app/PRODUCT.md'
      - 'app/.impeccable/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      OCR_NO_UPDATE: '1'
    steps:
      - name: Require the canonical public repository
        env:
          REPOSITORY: ${{ github.event.repository.full_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$REPOSITORY" = 'yohn-jp/codexia'
          test "$REPOSITORY_PRIVATE" = 'false'
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Install frozen workspace dependencies
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          pnpm install --frozen-lockfile
      - name: Install the isolated audit tool
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-tool" --ignore-scripts --no-audit --no-fund repomix@1.19.0 playwright-core@1.64.1
          echo "CODEXIA_AUDIT_REPOMIX_BIN=$RUNNER_TEMP/audit-tool/node_modules/.bin/repomix" >> "$GITHUB_ENV"
          echo "CODEXIA_AUDIT_TOOL_DIR=$RUNNER_TEMP/audit-tool" >> "$GITHUB_ENV"
      - name: Install pinned OCR delegation CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-ocr" --ignore-scripts --no-audit --no-fund @alibaba-group/open-code-review@1.13.13
          echo "CODEXIA_AUDIT_OCR_BIN=$RUNNER_TEMP/audit-ocr/node_modules/.bin/ocr" >> "$GITHUB_ENV"
      - name: Test Pages generators, analysis and component interactions
        run: |
          node --test scripts/audit/*.test.mjs scripts/ci/dashboard/*.test.mjs \
            scripts/graphify-pages/*.test.mjs scripts/architecture-diagrams/*.test.mjs scripts/pages-ui/*.test.mjs \
            scripts/code-scanning-pages/*.test.mjs
      - name: Restore previous verified HEAD exports
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/audit-cache
          key: audit-pages-v1-${{ hashFiles('scripts/audit/export.mjs', 'scripts/audit/repomix.config.json', 'scripts/audit/publication-policy.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            audit-pages-v1-${{ hashFiles('scripts/audit/export.mjs', 'scripts/audit/repomix.config.json', 'scripts/audit/publication-policy.mjs') }}-
      - name: Pack every remote branch HEAD with the same policy
        run: |
          node scripts/audit/export.mjs "$RUNNER_TEMP/site" "$RUNNER_TEMP/audit-cache" "$CODEXIA_AUDIT_REPOMIX_BIN"
      - name: Generate deterministic per-file OCR Delegate inputs
        run: |
          node scripts/audit/delegate.mjs "$RUNNER_TEMP/site" "$CODEXIA_AUDIT_OCR_BIN"
      - name: Bundle CI dashboard in the existing Pages artifact
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/ci/dashboard/collect.mjs "$RUNNER_TEMP/site" --preview
          else
            node scripts/ci/dashboard/collect.mjs "$RUNNER_TEMP/site"
          fi
      - name: Stamp audit source and content digest
        run: node scripts/audit/assemble-parts.mjs stamp "$RUNNER_TEMP/site" audit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: pages-audit-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Save verified HEAD exports
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/audit-cache
          key: audit-pages-v1-${{ hashFiles('scripts/audit/export.mjs', 'scripts/audit/repomix.config.json', 'scripts/audit/publication-policy.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Require the canonical public repository
        env:
          REPOSITORY: ${{ github.event.repository.full_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$REPOSITORY" = 'yohn-jp/codexia'
          test "$REPOSITORY_PRIVATE" = 'false'
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Prepare architecture output
        run: mkdir -p "$RUNNER_TEMP/site"
      - name: Detect the installed Chromium browser
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -x "$CHROME"
          echo "CODEXIA_E2E_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Install pinned static Mermaid renderer
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/architecture-renderer" --ignore-scripts --no-audit --no-fund @mermaid-js/mermaid-cli@12.2.0 puppeteer@25.17.0
      - name: Install locked LikeC4 CLI
        run: npm ci --prefix scripts/architecture --ignore-scripts --no-audit --no-fund
      - name: Render all canonical architecture diagrams
        run: |
          node scripts/architecture-diagrams/pack.mjs \
            "$RUNNER_TEMP/site" "$(git rev-parse HEAD)" \
            "$RUNNER_TEMP/architecture-renderer/node_modules/.bin/mmdc"
      - name: Stamp architecture source and content digest
        run: node scripts/audit/assemble-parts.mjs stamp "$RUNNER_TEMP/site" architecture "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: pages-architecture-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  specification:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      producer-attempt: ${{ steps.producer.outputs.attempt }}
    steps:
      - name: Require the canonical public repository
        env:
          REPOSITORY: ${{ github.event.repository.full_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$REPOSITORY" = 'yohn-jp/codexia'
          test "$REPOSITORY_PRIVATE" = 'false'
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install frozen workspace dependencies
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          pnpm install --frozen-lockfile
      - name: Install pinned StrictDoc dependencies
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          pnpm install --frozen-lockfile
          bash scripts/shared/python-env.sh create python "$RUNNER_TEMP/strictdoc" -r scripts/strictdoc/requirements.lock.txt
      - name: Detect the installed Chromium browser
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -x "$CHROME"
          echo "CODEXIA_E2E_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Prepare specification output
        run: mkdir -p "$RUNNER_TEMP/site"
      - name: Generate the HTTP surfaces for requirements trace
        run: pnpm --filter @codexia/http-contract generate
      - name: Verify and stage StrictDoc requirements
        env:
          CODEXIA_STRICTDOC_CHROMIUM: ${{ env.CODEXIA_E2E_CHROMIUM }}
          CODEXIA_CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CODEXIA_CI_TASK: pages-requirements-trace
          CODEXIA_STRICTDOC_PUBLIC: '1'
        run: |
          node scripts/strictdoc/verify.mjs --strictdoc "$RUNNER_TEMP/strictdoc/bin/strictdoc" --output-dir "$RUNNER_TEMP/strictdoc-output"
      - name: Generate source graph for the checkout
        env:
          GRAPHIFY_BACKEND: none
        run: |
          bash scripts/shared/python-env.sh create python "$RUNNER_TEMP/graphify" 'graphifyy[sql,terraform]==0.9.120'
          # Graphify honors .gitignore for generated contract outputs.
          excludes=('tests/**' 'evidence/**' '.agents/**' 'docs/**' '**/*.test.*' '**/*.spec.*')
          exclude_args=()
          for pattern in "${excludes[@]}"; do
            exclude_args+=(--exclude "$pattern")
          done
          timeout 600s "$RUNNER_TEMP/graphify/bin/graphify" extract . --code-only \
            --out "$RUNNER_TEMP/graphify-out" \
            --max-workers 2 "${exclude_args[@]}"
          timeout 120s "$RUNNER_TEMP/graphify/bin/graphify" cluster-only "$RUNNER_TEMP/graphify-out"
          "$RUNNER_TEMP/graphify/bin/python" scripts/graphify-pages/candidates.py \
            "$RUNNER_TEMP/graphify-out/graphify-out/candidates.json" "${exclude_args[@]}"
          node scripts/graphify-pages/pack.mjs \
            "$RUNNER_TEMP/graphify-out/graphify-out" "$RUNNER_TEMP/site" "$(git rev-parse HEAD)" \
            "$RUNNER_TEMP/graphify-out/graphify-out/candidates.json"
      - name: Read exact-source Verify artifact receipt and stage specifications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEXIA_TRACE_VERIFY_WAIT_SECONDS: '600'
        run: |
          VERIFY_EVENT="$GITHUB_EVENT_NAME"
          if [[ "$VERIFY_EVENT" == workflow_dispatch ]]; then VERIFY_EVENT=push; fi
          node scripts/ci/evidence/trace-receipt.mjs "$(git rev-parse HEAD)" "$VERIFY_EVENT" "$RUNNER_TEMP/verify-receipt.json"
          node scripts/audit/specifications.mjs "$RUNNER_TEMP/site" "$RUNNER_TEMP/strictdoc-output" "$(git rev-parse HEAD)" "$RUNNER_TEMP/verify-receipt.json"
      - name: Build Japanese search for the staged public specifications
        run: |
          npm ci --prefix scripts/audit/pagefind --ignore-scripts --no-audit --no-fund
          scripts/audit/pagefind/node_modules/.bin/pagefind \
            --site "$RUNNER_TEMP/site/requirements/html" \
            --output-path "$RUNNER_TEMP/site/design-search" \
            --glob 'docs/**/*.sdoc.html' --root-selector main --force-language ja
          cp scripts/audit/design-search.js "$RUNNER_TEMP/site/design-search/init.js"
      - name: Stamp specification source and content digest
        run: node scripts/audit/assemble-parts.mjs stamp "$RUNNER_TEMP/site" specification "$(git rev-parse HEAD)"
      - name: Record specification producer attempt
        id: producer
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: pages-specification-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  pack:
    needs: [audit, architecture, specification]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-name: ${{ steps.publication.outputs.artifact-name }}
      producer-attempt: ${{ steps.publication.outputs.producer-attempt }}
      manifest-sha256: ${{ steps.publication.outputs.manifest-sha256 }}
    env:
      PAGES_ORIGIN: https://yohn-jp.github.io/codexia
    steps:
      - name: Require the canonical public repository
        env:
          REPOSITORY: ${{ github.event.repository.full_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$REPOSITORY" = 'yohn-jp/codexia'
          test "$REPOSITORY_PRIVATE" = 'false'
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Install frozen workspace dependencies
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          pnpm install --frozen-lockfile
      - name: Install locked Scalar static reference builder
        run: npm ci --prefix scripts/pages-api --ignore-scripts --no-audit --no-fund
      - name: Test Scalar publication policy
        run: node --test scripts/pages-api/*.test.mjs
      - name: Generate and verify deterministic HTTP contract artifacts
        run: pnpm --filter @codexia/http-contract check-generated
      - name: Install the isolated audit tool
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-tool" --ignore-scripts --no-audit --no-fund repomix@1.19.0 playwright-core@1.64.1
          echo "CODEXIA_AUDIT_REPOMIX_BIN=$RUNNER_TEMP/audit-tool/node_modules/.bin/repomix" >> "$GITHUB_ENV"
          echo "CODEXIA_AUDIT_TOOL_DIR=$RUNNER_TEMP/audit-tool" >> "$GITHUB_ENV"
      - name: Detect the installed Chromium browser
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -x "$CHROME"
          echo "CODEXIA_E2E_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Install Japanese fonts for faithful Pages browser QA
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends fonts-noto-cjk
          # apt's fontconfig trigger already refreshes the cache; avoid a redundant full scan.
          fc-list :lang=ja family | grep -q 'Noto Sans CJK'
      - name: Require the exact Pages part artifacts
        env:
          AUDIT_ID: ${{ needs.audit.outputs.artifact-id }}
          ARCHITECTURE_ID: ${{ needs.architecture.outputs.artifact-id }}
          SPECIFICATION_ID: ${{ needs.specification.outputs.artifact-id }}
        run: |
          for id in "$AUDIT_ID" "$ARCHITECTURE_ID" "$SPECIFICATION_ID"; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || exit 1
          done
          [[ "$AUDIT_ID" != "$ARCHITECTURE_ID" && "$AUDIT_ID" != "$SPECIFICATION_ID" && "$ARCHITECTURE_ID" != "$SPECIFICATION_ID" ]]
      - name: Download the exact audit part
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.audit.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/pages-parts/pages-audit
      - name: Download the exact architecture part
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.architecture.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/pages-parts/pages-architecture
      - name: Download the exact specification part
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.specification.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/pages-parts/pages-specification
      - name: Verify source identity and assemble disjoint outputs
        env:
          CODEXIA_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/assemble-parts.mjs assemble "$RUNNER_TEMP/pages-parts" "$RUNNER_TEMP/audit-site"
      - name: Require current PR's review materials
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node -e 'const m=require(process.argv[1]); const r=m.reviews?.[process.env.REVIEW_SHA]; if(!r || !["ready","partial","no-diff"].includes(r.status) || (r.selected > 0 && r.published === 0)) throw Error("Current PR has no usable OCR-selected source material");' "$RUNNER_TEMP/audit-site/manifest.json"
      - name: Require usable main snapshot in PR preview
        if: github.event_name == 'pull_request'
        run: node -e 'const m=require(process.argv[1]); const main=m.branches.find(x=>x.branch==="main"); if(!main || m.snapshots[main.sha].status==="blocked") throw new Error("Main audit snapshot is unavailable");' "$RUNNER_TEMP/audit-site/manifest.json"
      - name: Bundle authenticated Code scanning export (no alert data)
        run: node scripts/code-scanning-pages/pack.mjs "$RUNNER_TEMP/audit-site"
      - name: Generate static Scalar OpenAPI reference
        run: node scripts/pages-api/pack.mjs "$RUNNER_TEMP/audit-site" "$(git rev-parse HEAD)"
      - name: Assemble the integrated Pages artifact
        env:
          UX_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          SITE="$RUNNER_TEMP/audit-site"
          compare=()
          if [[ "$UX_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
            git grep -q -F 'const schemaVersion = 2;' "$UX_BASE_SHA" -- scripts/ux-simulator/generate.mjs &&
            git cat-file -e "$UX_BASE_SHA:scripts/ux-simulator/adapters/ios.mjs"; then
            base="$RUNNER_TEMP/ux-base-source"
            base_artifact="$RUNNER_TEMP/ux-base-artifact"
            git worktree add --detach "$base" "$UX_BASE_SHA"
            baseline_observation=()
            if test -f "$base/scripts/ux-simulator/adapters/desktop.mjs" &&
              test -f "$base/scripts/ux-simulator/execution.mjs" &&
              cmp -s "$base/pnpm-lock.yaml" pnpm-lock.yaml; then
              ln -s "$GITHUB_WORKSPACE/app/node_modules" "$base/app/node_modules"
              baseline_observation+=(--observe)
            fi
            (
              cd "$base"
              node scripts/ux-simulator/generate.mjs --output "$base_artifact" --source-sha "$UX_BASE_SHA" "${baseline_observation[@]}"
              node "$GITHUB_WORKSPACE/scripts/audit/ux-artifact.mjs" verify "$base_artifact" "$UX_BASE_SHA"
            )
            compare=(--comparison-base "$base_artifact")
          fi
          node scripts/ux-simulator/generate.mjs --output "$SITE/ux" --source-sha "$(git rev-parse HEAD)" --observe "${compare[@]}"
          node scripts/audit/portal.mjs generate "$SITE" "$(git rev-parse HEAD)" "$PAGES_ORIGIN"
          node scripts/pages-ui/navigation.mjs "$SITE"
          node scripts/audit/ux-artifact.mjs seal "$SITE/ux" "$(git rev-parse HEAD)"
          node scripts/audit/portal.mjs finalize "$SITE" "$PAGES_ORIGIN"
      - name: Verify generated Pages in Chromium
        env:
          PAGES_SCREENSHOTS: ${{ github.event_name == 'pull_request' && format('{0}/pages-screenshots', runner.temp) || '' }}
        run: |
          node scripts/architecture-diagrams/smoke.mjs \
            "$RUNNER_TEMP/audit-site/architecture" \
            "$CODEXIA_AUDIT_TOOL_DIR/node_modules/playwright-core"
          node scripts/verification/artifacts/pages-smoke.mjs "$RUNNER_TEMP/audit-site" \
            "$CODEXIA_AUDIT_TOOL_DIR/node_modules/playwright-core" "$CODEXIA_E2E_CHROMIUM" "$PAGES_SCREENSHOTS"
          node scripts/ux-simulator/projection.browser-test.mjs \
            "$CODEXIA_AUDIT_TOOL_DIR/node_modules/playwright-core" "$CODEXIA_E2E_CHROMIUM" \
            "$RUNNER_TEMP/audit-site" "$PAGES_SCREENSHOTS"
          CODEXIA_PAGES_SITE="$RUNNER_TEMP/audit-site" node --test scripts/audit/specifications.browser.mjs
      - name: Verify manifests, links and public artifact scope
        run: node scripts/audit/portal.mjs verify "$RUNNER_TEMP/audit-site" "$PAGES_ORIGIN"
      - name: Bind the validated Pages artifact to its specification producer
        id: publication
        if: github.event_name != 'pull_request'
        env:
          PAGES_PRODUCER_ATTEMPT: ${{ needs.specification.outputs.producer-attempt }}
        run: node scripts/verification/artifacts/pages-live-ux.mjs prepare "$RUNNER_TEMP/audit-site" "$GITHUB_SHA"
      - name: Upload Chromium screenshots for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: repository-audit-screenshots
          path: ${{ runner.temp }}/pages-screenshots
          if-no-files-found: error
          retention-days: 3
      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: ${{ steps.publication.outputs.artifact-name }}
          path: ${{ runner.temp }}/audit-site
      - name: Upload non-publishing PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: repository-audit-preview
          path: ${{ runner.temp }}/audit-site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the validated Pages artifact
        env:
          PAGES_ARTIFACT_NAME: ${{ needs.pack.outputs.artifact-name }}
          PAGES_PRODUCER_ATTEMPT: ${{ needs.pack.outputs.producer-attempt }}
          PAGES_MANIFEST_SHA256: ${{ needs.pack.outputs.manifest-sha256 }}
        run: |
          [[ "$PAGES_ARTIFACT_NAME" =~ ^github-pages-attempt-[1-9][0-9]*$ ]]
          [[ "$PAGES_PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PAGES_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy development portal
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ needs.pack.outputs.artifact-name }}
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/verification/artifacts/pages-live-ux.mjs
          sparse-checkout-cone-mode: false
      - name: Verify published Pages (${{ needs.pack.outputs.manifest-sha256 }})
        id: projection
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          PAGES_PRODUCER_ATTEMPT: ${{ needs.pack.outputs.producer-attempt }}
          PAGES_MANIFEST_SHA256: ${{ needs.pack.outputs.manifest-sha256 }}
        run: node scripts/verification/artifacts/pages-live-ux.mjs "$PAGES_URL" "$GITHUB_SHA"
