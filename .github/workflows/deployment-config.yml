name: Verify Deployment Configuration
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/shared/python-env.sh
      - deploy/ansible/**
      - deploy/backup/**
      - deploy/quadlet/**
      - deploy/postgres/**
      - deploy/cloudflare/**
      - .github/workflows/deployment-config.yml
  push:
    branches: [main]
    paths:
      - scripts/shared/python-env.sh
      - deploy/ansible/**
      - deploy/backup/**
      - deploy/quadlet/**
      - deploy/postgres/**
      - deploy/cloudflare/**
      - .github/workflows/deployment-config.yml
permissions:
  contents: read
concurrency:
  group: deployment-config-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  configuration:
    name: Verify Ansible and Terraform configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Resolve reusable independent PR proof
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/certification/reuse-merged-pr.mjs dedicated
      - name: Select independent infrastructure checks
        if: steps.reuse.outputs.eligible != 'true'
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Unknown history or workflow edits require both checks.
          ansible=true
          terraform=true
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] &&
             git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" -- > "$RUNNER_TEMP/infrastructure-paths"; then
            ansible=false
            terraform=false
            while IFS= read -r -d '' file; do
              case "$file" in
                deploy/ansible/*|deploy/backup/*|deploy/quadlet/*|deploy/postgres/*|scripts/shared/python-env.sh) ansible=true ;;
                deploy/cloudflare/*) terraform=true ;;
                .github/workflows/deployment-config.yml) ansible=true; terraform=true ;;
              esac
            done < "$RUNNER_TEMP/infrastructure-paths"
            # The workflow was selected: never skip everything on inconsistent event metadata.
            if [[ "$ansible" == false && "$terraform" == false ]]; then
              ansible=true
              terraform=true
            fi
          fi
          echo "ansible=$ansible" >> "$GITHUB_OUTPUT"
          echo "terraform=$terraform" >> "$GITHUB_OUTPUT"
      - name: Check Ansible configuration
        if: steps.reuse.outputs.eligible != 'true' && steps.impact.outputs.ansible == 'true'
        run: |
          bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/codexia-ansible" -r deploy/ansible/requirements.txt
          "$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" -i deploy/ansible/inventory.example.yml deploy/ansible/site.yml --syntax-check
          "$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" -i deploy/ansible/inventory.example.yml deploy/ansible/preflight-observe.yml --syntax-check
          python3 -B -m unittest discover -s deploy/ansible -p 'test_preflight_observe.py'
          ANSIBLE_PLAYBOOK="$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" bash deploy/ansible/test-base-secrets.sh
          ANSIBLE_PLAYBOOK="$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" bash deploy/ansible/test-inspect.sh
          python3 -m unittest discover -s deploy/ansible -p 'test_host_contract.py'
          ANSIBLE_PLAYBOOK="$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" bash deploy/ansible/test-host-validation.sh
      - name: Check all Terraform files
        if: steps.reuse.outputs.eligible != 'true' && steps.impact.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.2
      - name: Validate Cloudflare Terraform
        if: steps.reuse.outputs.eligible != 'true' && steps.impact.outputs.terraform == 'true'
        working-directory: deploy/cloudflare/terraform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          validate_configuration() {
            terraform validate
          }
          # The Registry's release signature URL can return GitHub 504.
          # Keep real provider-schema validation: fall back to the official
          # GitHub API release asset and verify its pinned publisher digest.
          if terraform init -backend=false; then
            validate_configuration
            exit 0
          fi
          provider_dir="$(mktemp -d)"
          trap 'rm -rf "$provider_dir"' EXIT
          archive="$provider_dir/cloudflare-provider.zip"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/cloudflare/terraform-provider-cloudflare/releases/assets/737220880" \
            --output "$archive"
          echo "800cf3c99cb3a40132eb73295cea67b99b8133162e464de58775332854b41a41  $archive" | sha256sum --check -
          plugin_path="$provider_dir/registry.terraform.io/cloudflare/cloudflare/5.29.0/linux_amd64"
          mkdir -p "$plugin_path"
          unzip -oq "$archive" -d "$plugin_path"
          terraform init -backend=false -plugin-dir="$provider_dir"
          validate_configuration
