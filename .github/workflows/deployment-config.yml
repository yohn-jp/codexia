name: Verify Deployment Configuration
on:
  pull_request:
    branches: [main]
    paths:
      - deploy/**
      - edge/frontend/**
      - Dockerfile.backend
      - app/public/**
      - scripts/build-frontend.mjs
      - scripts/verify-deployment-config.mjs
      - scripts/verify-frontend-compatibility*.mjs
      - scripts/component-release-version*.mjs
      - scripts/profile-package.mjs
      - scripts/profile-package.test.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docs/deployment/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - deploy/**
      - edge/frontend/**
      - Dockerfile.backend
      - app/public/**
      - scripts/build-frontend.mjs
      - scripts/verify-deployment-config.mjs
      - scripts/verify-frontend-compatibility*.mjs
      - scripts/component-release-version*.mjs
      - scripts/profile-package.mjs
      - scripts/profile-package.test.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docs/deployment/**
      - .github/workflows/**
permissions:
  contents: read
jobs:
  configuration:
    name: Verify route and service contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Prepare locked pnpm toolchain
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check deployment configuration consistency
        run: pnpm run verify:deployment
      - name: Test release identity probes and Access failure diagnostics
        run: node --test scripts/verify-frontend-compatibility.test.mjs scripts/component-release-version.test.mjs
      - name: Typecheck and test the Static Assets Worker
        run: pnpm run typecheck:deployment && pnpm run test:deployment
      - name: Check standalone Ansible configuration
        run: |
          python3 -m venv "$RUNNER_TEMP/codexia-ansible"
          "$RUNNER_TEMP/codexia-ansible/bin/pip" install -r deploy/ansible/requirements.txt
          "$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" -i deploy/ansible/inventory.example.yml deploy/ansible/site.yml --syntax-check
          ANSIBLE_PLAYBOOK="$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" bash deploy/ansible/test-preflight.sh
          ANSIBLE_PLAYBOOK="$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" bash deploy/ansible/test-inspect.sh
          python3 -m unittest discover -s deploy/ansible -p 'test_host_contract.py'
          ANSIBLE_PLAYBOOK="$RUNNER_TEMP/codexia-ansible/bin/ansible-playbook" bash deploy/ansible/test-host-validation.sh
      - name: Check all Terraform files
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.2
      - name: Validate Cloudflare Terraform
        working-directory: deploy/cloudflare/terraform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          # The Registry's release signature URL can return GitHub 504.
          # Keep real provider-schema validation: fall back to the official
          # GitHub API release asset and verify its pinned publisher digest.
          if terraform init -backend=false; then
            terraform validate
            exit 0
          fi
          provider_dir="$(mktemp -d)"
          trap 'rm -rf "$provider_dir"' EXIT
          archive="$provider_dir/cloudflare-provider.zip"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/cloudflare/terraform-provider-cloudflare/releases/assets/528010301" \
            --output "$archive"
          echo "2390fc5df95addfd47d3f638964a1f9f6192a8c84ad3b1eab554ef88e0ac4091  $archive" | sha256sum --check -
          plugin_path="$provider_dir/registry.terraform.io/cloudflare/cloudflare/5.24.0/linux_amd64"
          mkdir -p "$plugin_path"
          unzip -oq "$archive" -d "$plugin_path"
          terraform init -backend=false -plugin-dir="$provider_dir"
          terraform validate
  standalone-host:
    name: Verify real Ubuntu rootless host convergence
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install supported Ansible control environment
        run: |
          python3 -m venv "$RUNNER_TEMP/codexia-ansible"
          "$RUNNER_TEMP/codexia-ansible/bin/pip" install -r deploy/ansible/requirements.txt
      - name: Exercise actual host stage twice and run a rootless Quadlet
        env:
          ANSIBLE_PLAYBOOK: ${{ runner.temp }}/codexia-ansible/bin/ansible-playbook
        run: bash deploy/ansible/test-host-integration.sh
