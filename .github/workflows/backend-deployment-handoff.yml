name: Verify Backend Deployment Handoff
on:
  workflow_run:
    workflows: [Codexia Backend Image]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: codexia-backend-handoff-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  verify-handoff:
    name: Verify certified backend handoff without deployment
    if: >-
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify main workflow, receipt, artifact digest and OCI identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-backend-push-handoff.mjs
