name: Codexia Backend Deployment
on:
  workflow_dispatch:
    inputs:
      preflight_run_id:
        description: Reviewed runtime lifecycle Preflight run ID for R6 or restored R3
        type: string
        required: true
      approval_phrase:
        description: ACTIVATE_CODEXIA_BACKEND (fresh R6), ADOPT_EXISTING_CODEXIA_BACKEND (existing-owner R6) or PUBLISH_RESTORED_CODEXIA_BACKEND (R3)
        type: string
        required: true
  workflow_run:
    workflows: [Codexia Backend Image]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: codexia-backend-handoff-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
  queue: max
jobs:
  verify-handoff:
    name: Verify certified backend handoff (read-only)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.repository == 'yohn-jp/codexia' &&
       github.ref == 'refs/heads/main' &&
       (inputs.approval_phrase == 'ACTIVATE_CODEXIA_BACKEND' || inputs.approval_phrase == 'ADOPT_EXISTING_CODEXIA_BACKEND' || inputs.approval_phrase == 'PUBLISH_RESTORED_CODEXIA_BACKEND')) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      certified-full-image: ${{ steps.verify.outputs.full-image || steps.manual.outputs.full-image }}
      certified-full-api-epoch: ${{ steps.verify.outputs.full-api-epoch || steps.manual.outputs.full-api-epoch }}
      verified-main-sha: ${{ steps.verify.outputs.verified-main-sha || steps.manual.outputs.verified-main-sha }}
      producer-sha: ${{ steps.verify.outputs.producer-sha || steps.manual.outputs.producer-sha }}
      deployment-certificate: ${{ steps.verify.outputs.full-certificate || steps.manual.outputs.full-certificate }}
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Verify main workflow, receipt, artifact digest and OCI identities
        if: github.event_name == 'workflow_run'
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_PUBLISHER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/deployment/handoff/verify-push.mjs
      - name: Read the immutable runtime Preflight receipt
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/reviewed-preflight
        with:
          run-id: ${{ inputs.preflight_run_id }}
          management: runtime
      - name: Certify the selected published Backend for manual activation
        if: github.event_name == 'workflow_dispatch'
        id: manual
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_FIRST_ACTIVATION_APPROVAL: ${{ inputs.approval_phrase }}
        run: node scripts/deployment/bootstrap/activate-backend.mjs certify

  deploy-production:
    name: Deploy certified Full backend to production
    needs: [verify-handoff]
    if: >-
      ((github.event_name == 'workflow_dispatch' && github.repository == 'yohn-jp/codexia' &&
        github.ref == 'refs/heads/main' &&
        (inputs.approval_phrase == 'ACTIVATE_CODEXIA_BACKEND' || inputs.approval_phrase == 'ADOPT_EXISTING_CODEXIA_BACKEND' || inputs.approval_phrase == 'PUBLISH_RESTORED_CODEXIA_BACKEND')) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository)) &&
      needs.verify-handoff.result == 'success' &&
      needs.verify-handoff.outputs.certified-full-image != '' &&
      needs.verify-handoff.outputs.verified-main-sha != '' &&
      needs.verify-handoff.outputs.deployment-certificate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: codexia-production
    concurrency:
      group: codexia-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    steps:
      - name: Check protected backend push-deployment enablement
        id: deployment-gate
        shell: bash
        env:
          CODEXIA_PUSH_DEPLOYMENT_ENABLED: ${{ vars.CODEXIA_PUSH_DEPLOYMENT_ENABLED }}
          CODEXIA_MANUAL_ACTIVATION: ${{ github.event_name == 'workflow_dispatch' }}
          CODEXIA_FIRST_ACTIVATION_APPROVAL: ${{ inputs.approval_phrase }}
          CODEXIA_INITIAL_INSTALL_APPROVED: ${{ vars.CODEXIA_INITIAL_INSTALL_APPROVED }}
          CODEXIA_DATABASE_INITIALIZATION_APPROVED: ${{ vars.CODEXIA_DATABASE_INITIALIZATION_APPROVED }}
          CODEXIA_DATABASE_ADOPTION_APPROVED: ${{ vars.CODEXIA_DATABASE_ADOPTION_APPROVED }}
        run: |
          set -euo pipefail

          if [[ "${CODEXIA_MANUAL_ACTIVATION:-false}" == true &&
                "${CODEXIA_FIRST_ACTIVATION_APPROVAL:-}" != 'PUBLISH_RESTORED_CODEXIA_BACKEND' &&
                "${CODEXIA_FIRST_ACTIVATION_APPROVAL:-}" != 'ADOPT_EXISTING_CODEXIA_BACKEND' &&
                ( "${CODEXIA_INITIAL_INSTALL_APPROVED:-}" != true || "${CODEXIA_DATABASE_INITIALIZATION_APPROVED:-}" != true ) ]]; then
            echo 'Protected first Backend activation requires first-install and database-use approvals.' >&2
            exit 1
          fi
          if [[ "${CODEXIA_MANUAL_ACTIVATION:-false}" == true &&
                "${CODEXIA_FIRST_ACTIVATION_APPROVAL:-}" == 'ADOPT_EXISTING_CODEXIA_BACKEND' &&
                ( "${CODEXIA_DATABASE_ADOPTION_APPROVED:-}" != true ||
                  "${CODEXIA_INITIAL_INSTALL_APPROVED:-}" == true ||
                  "${CODEXIA_DATABASE_INITIALIZATION_APPROVED:-}" == true ) ]]; then
            echo 'Existing-owner adoption requires its own approval, without fresh installation or initialization authorization.' >&2
            exit 1
          fi
          if [[ "${CODEXIA_PUSH_DEPLOYMENT_ENABLED:-}" == 'true' ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Protected backend push deployment is enabled.'
          else
            if [[ "${CODEXIA_MANUAL_ACTIVATION:-false}" == true ]]; then
              echo 'Protected manual Backend activation requires CODEXIA_PUSH_DEPLOYMENT_ENABLED=true.' >&2
              exit 1
            fi
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            message='Protected backend push deployment safely skipped: codexia-production variable CODEXIA_PUSH_DEPLOYMENT_ENABLED is not set to true.'
            echo "$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out the exact certified main source
        if: steps.deployment-gate.outputs.enabled == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.verify-handoff.outputs.verified-main-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        if: steps.deployment-gate.outputs.enabled == 'true'
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        if: steps.deployment-gate.outputs.enabled == 'true'
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Recheck the certified backend against main inside the production slot
        id: freshness
        if: steps.deployment-gate.outputs.enabled == 'true'
        shell: bash
        env:
          CODEXIA_MANUAL_ACTIVATION: ${{ github.event_name == 'workflow_dispatch' }}
          CODEXIA_VERIFIED_MAIN_SHA: ${{ needs.verify-handoff.outputs.verified-main-sha }}
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && github.token || '' }}
        run: |
          set -euo pipefail
          if [[ "$CODEXIA_MANUAL_ACTIVATION" == true ]]; then
            node scripts/deployment/bootstrap/activate-backend.mjs freshness
          else
            node scripts/release/components/source-gate.mjs backend-deployment
          fi
      - name: Revalidate exact Backend Verify after entering the production queue
        if: github.event_name == 'workflow_run' && steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_DEPLOYMENT_CERTIFICATE_B64: ${{ needs.verify-handoff.outputs.deployment-certificate }}
          CODEXIA_VERIFIED_MAIN_SHA: ${{ needs.verify-handoff.outputs.verified-main-sha }}
        run: node scripts/deployment/handoff/recheck-verify.mjs
      - name: Load the public production origin and OAuth configuration
        if: steps.freshness.outputs.current == 'true'
        run: node scripts/deployment/bootstrap/public-env.mjs
      - name: Prepare pinned SSH identity
        id: target
        if: steps.freshness.outputs.current == 'true'
        env:
          CODEXIA_DEPLOY_HOST: ${{ vars.CODEXIA_DEPLOY_HOST }}
          CODEXIA_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_DEPLOY_SSH_PRIVATE_KEY }}
          CODEXIA_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash deploy/ansible/prepare-deploy-ssh.sh
      - name: Connect to the Tailnet using GitHub OIDC
        if: steps.freshness.outputs.current == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: api.tailscale.com/Ts4P9VFjmJ11CNTRL-khX5P9DgL421CNTRL
          tags: tag:ci
          ping: ${{ steps.target.outputs.host }}
      - name: Verify pinned public-key SSH as codexia
        if: steps.freshness.outputs.current == 'true'
        run: ssh -F "$RUNNER_TEMP/codexia-ssh/config" codexia-target 'test "$(id -un)" = codexia'
      - name: Verify deployed frontend epoch and Access boundary for certified backend recovery
        if: steps.freshness.outputs.current == 'true'
        id: live-ui
        shell: bash
        env:
          CODEXIA_ACCESS_CLIENT_ID: ${{ secrets.CODEXIA_ACCESS_CLIENT_ID }}
          CODEXIA_ACCESS_CLIENT_SECRET: ${{ secrets.CODEXIA_ACCESS_CLIENT_SECRET }}
          CODEXIA_EXPECTED_BACKEND_API_EPOCH: ${{ needs.verify-handoff.outputs.certified-full-api-epoch }}
        run: node scripts/release/frontend/verify-compatibility.mjs backend-preflight
      - name: Install the pinned Ansible control environment
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/codexia-ansible" -r deploy/ansible/requirements.txt
      - uses: docker/login-action@v4.8.0
        if: github.event_name == 'workflow_dispatch' && steps.freshness.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read the immutable runtime Preflight receipt
        if: github.event_name == 'workflow_dispatch' && steps.freshness.outputs.current == 'true'
        uses: ./.github/actions/reviewed-preflight
        with:
          run-id: ${{ inputs.preflight_run_id }}
          management: runtime
      - name: Reverify the reviewed deployment plan after entering the production queue
        if: github.event_name == 'workflow_dispatch' && steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_REPOSITORY_ID: ${{ github.repository_id }}
          CODEXIA_FIRST_ACTIVATION_APPROVAL: ${{ inputs.approval_phrase }}
          CODEXIA_DEPLOYMENT_CERTIFICATE_B64: ${{ needs.verify-handoff.outputs.deployment-certificate }}
          CODEXIA_PREFLIGHT_TARGET_HOST: ${{ steps.target.outputs.host }}
          CODEXIA_ACCESS_CLIENT_ID: ${{ secrets.CODEXIA_ACCESS_CLIENT_ID }}
          CODEXIA_ACCESS_CLIENT_SECRET: ${{ secrets.CODEXIA_ACCESS_CLIENT_SECRET }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN }}
          CODEXIA_INITIAL_INSTALL_APPROVED: ${{ vars.CODEXIA_INITIAL_INSTALL_APPROVED }}
          CODEXIA_DATABASE_INITIALIZATION_APPROVED: ${{ vars.CODEXIA_DATABASE_INITIALIZATION_APPROVED }}
          CODEXIA_DATABASE_ADOPTION_APPROVED: ${{ vars.CODEXIA_DATABASE_ADOPTION_APPROVED }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/codexia-first-activation-inventory.yml" <<EOF
          all:
            hosts:
              codexia:
                ansible_host: codexia-target
                ansible_user: codexia
                ansible_ssh_use_tty: false
                ansible_ssh_common_args: '-F "$RUNNER_TEMP/codexia-ssh/config"'
                codexia_service_home: /home/codexia
          EOF
          PATH="$RUNNER_TEMP/codexia-ansible/bin:$PATH" node scripts/deployment/bootstrap/activate-backend.mjs admit
      - name: Converge certified backend digest
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && github.token || '' }}
          CODEXIA_MANUAL_ACTIVATION: ${{ github.event_name == 'workflow_dispatch' }}
          CODEXIA_FIRST_ACTIVATION_APPROVAL: ${{ inputs.approval_phrase }}
          CODEXIA_CERTIFIED_FULL_IMAGE: ${{ needs.verify-handoff.outputs.certified-full-image }}
          CODEXIA_DEPLOYMENT_CERTIFICATE_B64: ${{ needs.verify-handoff.outputs.deployment-certificate }}
          CODEXIA_VERIFIED_MAIN_SHA: ${{ needs.verify-handoff.outputs.verified-main-sha }}
          CODEXIA_SOURCE_SHA: ${{ needs.verify-handoff.outputs.producer-sha }}
          CODEXIA_PROFILE: full
          CODEXIA_DEPLOYED_UI_EPOCH: ${{ steps.live-ui.outputs.frontendApiEpoch }}
          CODEXIA_INITIAL_INSTALL_APPROVED: ${{ vars.CODEXIA_INITIAL_INSTALL_APPROVED || 'false' }}
          CODEXIA_DATABASE_INITIALIZATION_APPROVED: ${{ vars.CODEXIA_DATABASE_INITIALIZATION_APPROVED || 'false' }}
          CODEXIA_DATABASE_ADOPTION_APPROVED: ${{ vars.CODEXIA_DATABASE_ADOPTION_APPROVED || 'false' }}
        run: |
          set -euo pipefail
          [[ "$CODEXIA_CERTIFIED_FULL_IMAGE" =~ ^ghcr\.io/yohn-jp/codexia-backend@sha256:[a-f0-9]{64}$ ]]
          test -n "$CODEXIA_DEPLOYMENT_CERTIFICATE_B64"
          [[ "$CODEXIA_VERIFIED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CODEXIA_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CODEXIA_DEPLOYED_UI_EPOCH" =~ ^[1-9][0-9]*$ ]]
          [[ "$CODEXIA_INITIAL_INSTALL_APPROVED" == true || "$CODEXIA_INITIAL_INSTALL_APPROVED" == false ]]
          [[ "$CODEXIA_DATABASE_INITIALIZATION_APPROVED" == true || "$CODEXIA_DATABASE_INITIALIZATION_APPROVED" == false ]]
          [[ "$CODEXIA_DATABASE_ADOPTION_APPROVED" == true || "$CODEXIA_DATABASE_ADOPTION_APPROVED" == false ]]
          if [[ "${CODEXIA_MANUAL_ACTIVATION:-false}" == true ]]; then
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            [[ "$current" == "$GITHUB_SHA" ]] || { echo 'Main changed after manual activation admission.' >&2; exit 1; }
          fi
          certificate="$RUNNER_TEMP/codexia-deployment-certificate.json"
          (umask 077; printf '%s' "$CODEXIA_DEPLOYMENT_CERTIFICATE_B64" | base64 --decode > "$certificate")
          chmod 0600 "$certificate"
          export CODEXIA_DEPLOYMENT_CERTIFICATE_FILE="$certificate"
          cat > "$RUNNER_TEMP/codexia-inventory.yml" <<EOF
          all:
            hosts:
              codexia:
                ansible_host: codexia-target
                ansible_user: codexia
                ansible_ssh_use_tty: false
                ansible_ssh_common_args: '-F "$RUNNER_TEMP/codexia-ssh/config"'
                codexia_stage: deploy
                codexia_service_user: codexia
                codexia_service_home: /home/codexia
          EOF
          node --input-type=module > "$RUNNER_TEMP/codexia-deploy-vars.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const env = process.env;
          const manual = env.CODEXIA_MANUAL_ACTIVATION === 'true';
          const recovery = manual && env.CODEXIA_FIRST_ACTIVATION_APPROVAL === 'PUBLISH_RESTORED_CODEXIA_BACKEND';
          const adoption = manual && env.CODEXIA_FIRST_ACTIVATION_APPROVAL === 'ADOPT_EXISTING_CODEXIA_BACKEND';
          const vars = {
            codexia_image: env.CODEXIA_CERTIFIED_FULL_IMAGE,
            codexia_source_sha: env.CODEXIA_SOURCE_SHA,
            codexia_profile: env.CODEXIA_PROFILE,
            codexia_verified_main_sha: env.CODEXIA_VERIFIED_MAIN_SHA,
            codexia_deployed_ui_epoch: Number(env.CODEXIA_DEPLOYED_UI_EPOCH),
            codexia_deployment_certificate_file: env.CODEXIA_DEPLOYMENT_CERTIFICATE_FILE,
            codexia_initial_install_approved: manual && !recovery && env.CODEXIA_INITIAL_INSTALL_APPROVED === 'true',
            codexia_database_initialization_approved: manual && !recovery && !adoption && env.CODEXIA_DATABASE_INITIALIZATION_APPROVED === 'true',
            codexia_database_adoption_approved: adoption && env.CODEXIA_DATABASE_ADOPTION_APPROVED === 'true',
          };
          if (recovery) {
            vars.codexia_expected_recovery_activation = JSON.parse(readFileSync(join(env.RUNNER_TEMP, 'codexia-recovery-activation.json'), 'utf8'));
          } else if (adoption) {
            vars.codexia_expected_adopt_activation = JSON.parse(readFileSync(join(env.RUNNER_TEMP, 'codexia-adopt-activation.json'), 'utf8'));
          } else if (manual) {
            vars.codexia_expected_first_activation = JSON.parse(readFileSync(join(env.RUNNER_TEMP, 'codexia-first-activation.json'), 'utf8'));
          }
          process.stdout.write(JSON.stringify(vars));
          NODE
          PATH="$RUNNER_TEMP/codexia-ansible/bin:$PATH" ansible-playbook \
            -i "$RUNNER_TEMP/codexia-inventory.yml" deploy/ansible/site.yml \
            --extra-vars "@$RUNNER_TEMP/codexia-deploy-vars.json"
          echo "Applied certified Full backend digest $CODEXIA_CERTIFIED_FULL_IMAGE from $CODEXIA_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
