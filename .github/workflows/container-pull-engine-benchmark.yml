name: Compare Docker, Podman and jobs.container startup

on:
  pull_request:
    paths:
      - .github/workflows/container-pull-engine-benchmark.yml
      - .github/docker/playwright-ubuntu-dual-benchmark.Dockerfile
      - scripts/ci-playwright-engine-benchmark.sh
      - scripts/ci-playwright-benchmark-db.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-engine-benchmark-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-pull:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.engine }} pull / trial ${{ matrix.trial }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman, podman-root]
        trial: [1, 2, 3]
    env:
      IMAGE: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - name: Record runner identity and baseline host telemetry
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner image: ${ImageOS:-unknown} / ${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "## Runner diagnostics"
          printf 'ImageOS=%s ImageVersion=%s RUNNER_ARCH=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "${RUNNER_ARCH:-unknown}"
          uname -a
          cat /etc/os-release
          nproc
          free -h
          df -h / /var/lib/docker /var/lib/containers 2>/dev/null || true
          lsblk -o NAME,SIZE,TYPE,ROTA,MODEL || true
          for metric in cpu memory io; do cat "/proc/pressure/$metric" || true; done
          ip -s link || true
          docker info --format 'Docker driver={{.Driver}} server={{.ServerVersion}}' || true
          if command -v podman >/dev/null 2>&1; then echo 'PODMAN_PREINSTALLED=true'; podman --version; else echo 'PODMAN_PREINSTALLED=false'; fi
      - name: Ensure Podman exists (fallback setup measured separately)
        if: startsWith(matrix.engine, 'podman')
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq podman
          fi
          echo "Podman fallback setup seconds: $((SECONDS-start))" >> "$GITHUB_STEP_SUMMARY"
          podman version
      - name: Measure cold pull and image startup
        shell: bash
        env:
          ENGINE: ${{ matrix.engine }}
          TRIAL: ${{ matrix.trial }}
        run: |
          set -euo pipefail
          if [[ "$ENGINE" == podman-root ]]; then
            engine=(sudo podman)
          else
            engine=("$ENGINE")
          fi
          "${engine[@]}" --version
          "${engine[@]}" info --format json | head -c 3000 || true
          echo
          echo '=== PRE-PULL SYSTEM ==='
          cat /proc/net/dev
          cat /proc/diskstats
          for metric in cpu memory io; do cat "/proc/pressure/$metric" || true; done
          "${engine[@]}" image rm "$IMAGE" >/dev/null 2>&1 || true
          start=$(date +%s%N)
          "${engine[@]}" pull "$IMAGE"
          pulled=$(date +%s%N)
          echo '=== POST-PULL SYSTEM ==='
          cat /proc/net/dev
          cat /proc/diskstats
          for metric in cpu memory io; do cat "/proc/pressure/$metric" || true; done
          "${engine[@]}" run --rm --entrypoint /bin/sh "$IMAGE" -c 'test -d /ms-playwright'
          finished=$(date +%s%N)
          pull_ms=$(( (pulled-start)/1000000 ))
          startup_ms=$(( (finished-pulled)/1000000 ))
          {
            echo "### $ENGINE trial $TRIAL"
            echo "- Pull: ${pull_ms} ms"
            echo "- Container start and smoke check: ${startup_ms} ms"
            echo "- Runner image: ${ImageOS:-unknown} / ${ImageVersion:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'BENCHMARK engine=%s trial=%s pull_ms=%s startup_ms=%s runner_image=%s\n' "$ENGINE" "$TRIAL" "$pull_ms" "$startup_ms" "${ImageVersion:-unknown}"

  job-container:
    if: github.event_name == 'workflow_dispatch'
    name: jobs.container / trial ${{ matrix.trial }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --ipc=host
    steps:
      - name: Smoke check and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test -d /ms-playwright
          echo '=== CONTAINER TELEMETRY (not host) ==='
          uname -a
          cat /proc/net/dev
          for metric in cpu memory io; do cat "/proc/pressure/$metric" || true; done
          echo "jobs.container trial ${{ matrix.trial }} ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner image: ${ImageOS:-unknown} / ${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          printf 'BENCHMARK engine=jobs.container trial=%s runner_image=%s\n' '${{ matrix.trial }}' "${ImageVersion:-unknown}"

  paired-pull:
    if: github.event_name == 'workflow_dispatch'
    name: Same-runner Docker vs Podman / ${{ matrix.order }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        order: [docker-first, podman-first]
    env:
      IMAGE: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - name: Compare engines on one host with reversed order
        shell: bash
        env:
          ORDER: ${{ matrix.order }}
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq podman
          fi
          echo "Runner image: ${ImageOS:-unknown} / ${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ORDER" == docker-first ]]; then engines=(docker podman); else engines=(podman docker); fi
          for engine in "${engines[@]}"; do
            "$engine" image rm "$IMAGE" >/dev/null 2>&1 || true
            start=$(date +%s%N)
            "$engine" pull "$IMAGE"
            pulled=$(date +%s%N)
            "$engine" run --rm --entrypoint /bin/sh "$IMAGE" -c 'test -d /ms-playwright'
            finished=$(date +%s%N)
            pull_ms=$(( (pulled-start)/1000000 ))
            startup_ms=$(( (finished-pulled)/1000000 ))
            printf 'PAIRED engine=%s order=%s pull_ms=%s startup_ms=%s runner_image=%s\n' "$engine" "$ORDER" "$pull_ms" "$startup_ms" "${ImageVersion:-unknown}"
            echo "- $engine ($ORDER): pull ${pull_ms} ms, startup ${startup_ms} ms" >> "$GITHUB_STEP_SUMMARY"
          done

  image-capability:
    name: Image completeness / ${{ matrix.engine }} / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        engine: [docker, podman]
        variant: [official, mirror, ubuntu-webkit, minimal-webkit]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Measure cold Pull, complete runtime capabilities and image size
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE: ${{ matrix.engine }}
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/ci-playwright-engine-benchmark.sh "$ENGINE" "$VARIANT" probe

  real-webkit:
    needs: image-capability
    name: Real four-shard WebKit / ${{ matrix.engine }} / ${{ matrix.variant }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        engine: [docker, podman]
        variant: [official, mirror]
        profile: [core, full]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: codexia_test
          POSTGRES_USER: codexia
          POSTGRES_PASSWORD: codexia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexia -d codexia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      CODEXIA_E2E_DATABASE_URL: postgres://codexia:codexia@postgres:5432/codexia_test
      CODEXIA_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@12.21.0 --version
          pnpm install --frozen-lockfile
      - name: Build exact profile outside timing
        run: pnpm build
      - name: Compare Pull and complete real acceptance suite
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE: ${{ matrix.engine }}
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/ci-playwright-engine-benchmark.sh "$ENGINE" "$VARIANT" acceptance
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: container-benchmark-trace-${{ matrix.engine }}-${{ matrix.variant }}-${{ matrix.profile }}
          path: tests/e2e/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3

  container-webkit-reference:
    needs: image-capability
    name: Reference jobs.container / four-shard WebKit / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        profile: [core, full]
    container:
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --ipc=host
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: codexia_test
          POSTGRES_USER: codexia
          POSTGRES_PASSWORD: codexia
        options: >-
          --health-cmd "pg_isready -U codexia -d codexia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      CODEXIA_E2E_DATABASE_URL: postgres://codexia:codexia@postgres:5432/codexia_test
      CODEXIA_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@12.21.0 --version
          pnpm install --frozen-lockfile
      - name: Build exact profile outside timing
        run: pnpm build
      - name: Execute matching real browser shards
        shell: bash
        run: bash scripts/ci-playwright-engine-benchmark.sh native official acceptance

  dual-webkit-local:
    needs: image-capability
    name: Local dual-browser minimal Podman / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        profile: [core, full]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: codexia_test
          POSTGRES_USER: codexia
          POSTGRES_PASSWORD: codexia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexia -d codexia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      CODEXIA_E2E_DATABASE_URL: postgres://codexia:codexia@postgres:5432/codexia_test
      CODEXIA_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@12.21.0 --version
          pnpm install --frozen-lockfile
      - name: Build exact profile outside timing
        run: pnpm build
      - name: Build unpublished dual-browser image and record build cost
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          podman build --file .github/docker/playwright-ubuntu-dual-benchmark.Dockerfile \
            --tag localhost/codexia-playwright-dual-benchmark:pw-1.65.1 .
          printf 'BENCHMARK_DUAL_BUILD runner=%s profile=%s build_ms=%s\n' \
            "${ImageVersion:-unknown}" "$CODEXIA_PROFILE" "$(( ($(date +%s%N)-start)/1000000 ))"
      - name: Verify both browsers and execute real CI suites
        shell: bash
        run: bash scripts/ci-playwright-engine-benchmark.sh podman dual-local acceptance
