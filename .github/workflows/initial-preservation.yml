name: Verify first activation recovery point
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# The calling Bootstrap already owns the production queue.
concurrency:
  group: ${{ github.workflow == 'Verify first activation recovery point' && 'codexia-production' || format('initial-preservation-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
jobs:
  capture:
    if: github.repository == 'yohn-jp/codexia' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == '1'
    environment: codexia-production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install evidence, Ansible, age and pinned transfer dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y age
          corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
          bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/ansible" -r deploy/ansible/requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          bash deploy/backup/install-s3-runtime.sh "$RUNNER_TEMP/bootstrap-s3"
      - id: target
        name: Prepare pinned service SSH
        env:
          CODEXIA_DEPLOY_HOST: ${{ vars.CODEXIA_DEPLOY_HOST }}
          CODEXIA_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_DEPLOY_SSH_KNOWN_HOSTS }}
          CODEXIA_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_DEPLOY_SSH_PRIVATE_KEY }}
        run: bash deploy/ansible/prepare-deploy-ssh.sh
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: api.tailscale.com/Ts4P9VFjmJ11CNTRL-khX5P9DgL421CNTRL
          tags: tag:ci
          ping: ${{ steps.target.outputs.host }}
      - name: Preserve prepared DB and history with the canonical backup producer
        env:
          CODEXIA_DEPLOY_HOST: ${{ steps.target.outputs.host }}
          CODEXIA_BOOTSTRAP_ESCROW_PROFILE: ${{ vars.CODEXIA_BOOTSTRAP_ESCROW_PROFILE }}
          CODEXIA_BOOTSTRAP_ESCROW_RECIPIENT: ${{ vars.CODEXIA_BOOTSTRAP_ESCROW_RECIPIENT }}
          CODEXIA_BOOTSTRAP_ESCROW_CREDENTIAL: ${{ secrets.CODEXIA_BOOTSTRAP_ESCROW_CREDENTIAL }}
          CODEXIA_BACKUP_AGE_RECIPIENT: ${{ vars.CODEXIA_BACKUP_AGE_RECIPIENT }}
          CODEXIA_INITIAL_BACKUP_PROFILE: ${{ vars.CODEXIA_INITIAL_BACKUP_PROFILE }}
          CODEXIA_INITIAL_BACKUP_CREDENTIAL: ${{ secrets.CODEXIA_INITIAL_BACKUP_CREDENTIAL }}
        run: node scripts/deployment/bootstrap/initial-preservation.mjs capture
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: encrypted-v2-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/initial-handoff/transfer.age
          if-no-files-found: error
          retention-days: 90
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/codexia-ssh" "$RUNNER_TEMP/initial-preservation"

  restore:
    needs: capture
    environment: codexia-bootstrap-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install isolated restore tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y age podman uidmap slirp4netns fuse-overlayfs
          corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
          bash deploy/backup/install-s3-runtime.sh "$RUNNER_TEMP/bootstrap-s3"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: encrypted-v2-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/initial-handoff
      - id: drill
        name: Restore DB and history independently and retain the verified encrypted receipt
        env:
          CODEXIA_BOOTSTRAP_ESCROW_PROFILE: ${{ vars.CODEXIA_BOOTSTRAP_ESCROW_PROFILE }}
          CODEXIA_BOOTSTRAP_ESCROW_CREDENTIAL: ${{ secrets.CODEXIA_BOOTSTRAP_ESCROW_CREDENTIAL }}
          CODEXIA_INITIAL_BACKUP_PROFILE: ${{ vars.CODEXIA_INITIAL_BACKUP_PROFILE }}
          CODEXIA_INITIAL_BACKUP_CREDENTIAL: ${{ secrets.CODEXIA_INITIAL_BACKUP_CREDENTIAL }}
          CODEXIA_INITIAL_BACKUP_IDENTITY: ${{ secrets.CODEXIA_INITIAL_BACKUP_IDENTITY }}
        run: node scripts/deployment/bootstrap/initial-preservation.mjs verify
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.drill.outputs.name }}
          path: ${{ runner.temp }}/initial-preservation/preservation.json
          if-no-files-found: error
          retention-days: 90
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/initial-preservation"
