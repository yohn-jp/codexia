name: Verify Codexia
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
# Only superseded revisions of the same PR may cancel each other.
# Main and manual runs retain their own exact-source certification.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.reuse.outputs.eligible }}
      plan: ${{ steps.taskproof.outputs.plan || steps.select.outputs.plan }}
      biome: ${{ steps.select.outputs.biome }}
      unit: ${{ steps.taskproof.outputs.unit || steps.select.outputs.unit }}
      types: ${{ steps.taskproof.outputs.types || steps.select.outputs.types }}
      build: ${{ steps.taskproof.outputs.build || steps.select.outputs.build }}
      oci: ${{ steps.taskproof.outputs.oci || steps.select.outputs.oci }}
      browser: ${{ steps.taskproof.outputs.browser || steps.select.outputs.browser }}
      full_model_oci: ${{ steps.select.outputs.full_model_oci }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          # Bootstrap only the shared input selector; checkout uses blobless
          # history for sparse mode. The selector expands the exact tree inputs.
          sparse-checkout: scripts
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Materialize exact evidence inputs
        env:
          CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/impact/evidence-checkout.mjs
      - name: Select affected validations
        id: select
        env:
          CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci/impact/plan.mjs
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Resolve exact-base task input proof
        id: taskproof
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci/evidence/reuse-coverage-proof.mjs plan
      - name: Resolve reusable merged PR source proof
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/certification/reuse-merged-pr.mjs plan
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan/ci-plan.json
          if-no-files-found: error
          retention-days: 7
  full_model_oci:
    name: full-model-oci
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.full_model_oci == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/full-model-oci-acceptance.yml
  biome:
    name: biome
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.reuse != 'true' && needs.plan.outputs.biome == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Install pinned Biome 2.6.8
        uses: biomejs/setup-biome@v2
        with:
          version: 2.6.8
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run exact-source Biome CI and emit Lint-only SARIF
        env:
          CODEXIA_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/biome
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci/execution/group.mjs biome
      - name: Publish Biome Lint results to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/ci-evidence/biome/biome-ci/biome-lint.sarif
          category: biome-lint
          # The analyzed checkout is the PR head, not GitHub's synthetic merge.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ci-evidence-biome
          path: ${{ runner.temp }}/ci-evidence/biome
          if-no-files-found: error
          retention-days: 7
  unit:
    name: unit-${{ matrix.group }}
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.reuse != 'true' && needs.plan.outputs.unit != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODEXIA_TEST_DATABASE_URL: postgres://codexia:codexia@127.0.0.1:5432/codexia_test
      CODEXIA_AUTH_TEST_DATABASE_URL: postgres://codexia:codexia@127.0.0.1:5432/codexia_auth_test
      CODEXIA_AUTH_TEST_DISPOSABLE: "1"
    services:
      postgres:
        image: ${{ matrix.group != 'architecture' && matrix.group != 'db' && 'docker.io/library/postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536' || '' }}
        env:
          POSTGRES_DB: codexia_test
          POSTGRES_USER: codexia
          POSTGRES_PASSWORD: codexia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexia -d codexia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.unit) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ matrix.group == 'core' && github.event_name == 'pull_request' && contains(fromJSON(needs.plan.outputs.plan).files, 'scripts/release/frontend/verify-mixed-version.mjs') && '0' || '1' }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Prepare exact pnpm toolchain
        id: pnpm
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore content-addressed dependency cache
        id: dependencies
        uses: actions/cache/restore@v6.1.0
        if: matrix.group != 'architecture' && matrix.group != 'api' && matrix.group != 'db'
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-node24-pnpm12.21.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        env:
          UNIT_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          case "$UNIT_GROUP" in
            architecture)
              pnpm --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
              ;;
            api)
              # unit-api integration tests import the public app adapter; install
              # its workspace importer so app/src runtime dependencies resolve.
              pnpm --filter '@codexia/api...' --filter @codexia/app --filter @codexia/ci-evidence --fail-if-no-match install --frozen-lockfile --prefer-offline
              ;;
            db)
              # Both tasks require the exact API dependency closure; the DB
              # contract also builds it before its isolated rootless fixture.
              pnpm --filter '@codexia/api...' --filter @codexia/ci-evidence --fail-if-no-match install --frozen-lockfile --prefer-offline
              ;;
            core|modules) pnpm install --frozen-lockfile --prefer-offline ;;
            *) exit 2 ;;
          esac
      - name: Materialize pinned DB contract restore image
        if: matrix.group == 'db'
        run: |
          set -euo pipefail
          image=$(node -p "require('./packages/persistence-postgres/tests/db-contract/toolchain.json').postgresImage")
          [[ "$image" =~ @sha256:[a-f0-9]{64}$ ]]
          docker pull "$image"
      - name: Create isolated Better Auth persistence database
        if: matrix.group == 'core' || matrix.group == 'api'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_CONTAINER" createdb -U codexia codexia_auth_test
      - name: Dependency cache hit=${{ steps.dependencies.outputs.cache-hit || 'false' }}
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise mixed-version runner against prior PR base
        if: matrix.group == 'core' && github.event_name == 'pull_request' && contains(fromJSON(needs.plan.outputs.plan).files, 'scripts/release/frontend/verify-mixed-version.mjs')
        env:
          PRIOR_SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CODEXIA_E2E_DATABASE_URL: postgres://codexia:codexia@127.0.0.1:5432/codexia_e2e_compat_test
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/prior-frontend" "$PRIOR_SOURCE_SHA"
          docker exec "$POSTGRES_CONTAINER" createdb -U codexia codexia_e2e_compat_test
          pnpm exec playwright install --with-deps chromium
          if node scripts/release/frontend/verify-mixed-version.mjs "$RUNNER_TEMP/prior-frontend" full; then
            echo "Mixed-version Chromium scenarios passed against the same API epoch." >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            if [[ "$status" != 78 ]]; then exit "$status"; fi
            echo "Mixed-version browser verification refused an API epoch change. Coordinated manual acceptance is required." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - uses: actions/setup-python@v6.1.0
        id: conformance_python
        if: matrix.group == 'api' && contains(fromJSON(needs.plan.outputs.plan).tasks, 'http-conformance')
        continue-on-error: true
        with:
          python-version: '3.12'
      # The group runner reports an unsuccessful setup as blocked for its own task.
      # Keep collecting evidence from the other selected tasks on this runner.
      - name: Prepare Schemathesis and its disposable database
        id: http_conformance_setup
        if: steps.conformance_python.outcome == 'success'
        continue-on-error: true
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/schemathesis" --require-hashes -r tests/conformance/http/requirements.lock.txt
          docker exec "$POSTGRES_CONTAINER" createdb -U codexia codexia_perf_http_conformance
          echo "SCHEMATHESIS_BIN=$RUNNER_TEMP/schemathesis/bin/schemathesis" >> "$GITHUB_ENV"
          echo 'CODEXIA_HTTP_CONFORMANCE_DATABASE_URL=postgres://codexia:codexia@127.0.0.1:5432/codexia_perf_http_conformance' >> "$GITHUB_ENV"
      - name: Prepare MCP conformance tools and their disposable database
        id: mcp_conformance_setup
        if: matrix.group == 'api' && contains(fromJSON(needs.plan.outputs.plan).tasks, 'mcp-conformance')
        continue-on-error: true
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          npm ci --prefix tests/conformance/mcp --ignore-scripts --no-audit --no-fund
          docker exec "$POSTGRES_CONTAINER" createdb -U codexia codexia_perf_mcp_conformance
          echo 'CODEXIA_MCP_CONFORMANCE_DATABASE_URL=postgres://codexia:codexia@127.0.0.1:5432/codexia_perf_mcp_conformance' >> "$GITHUB_ENV"
      - name: Run selected validations
        env:
          CODEXIA_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/unit-${{ matrix.group }}
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
          CODEXIA_CI_HTTP_CONFORMANCE_SETUP: ${{ steps.http_conformance_setup.outcome }}
          CODEXIA_CI_MCP_CONFORMANCE_SETUP: ${{ steps.mcp_conformance_setup.outcome }}
        run: node scripts/ci/execution/group.mjs "unit-${{ matrix.group }}"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ci-evidence-unit-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-evidence/unit-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 7
  types:
    name: types-${{ matrix.group }}
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.reuse != 'true' && needs.plan.outputs.types != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.types) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ matrix.group == 'trace' && '0' || '1' }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@v6.1.0
        # Use the canonical per-task plan; coverage/test-type checks do not need StrictDoc or Chromium.
        if: matrix.group == 'trace'
        with:
          python-version: '3.12'
      - name: Prepare exact pnpm toolchain
        id: pnpm
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore content-addressed dependency cache
        id: dependencies
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-node24-pnpm12.21.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install pinned StrictDoc and Chromium
        if: matrix.group == 'trace'
        run: |
          set -euo pipefail
          # Independent locked Python and browser prerequisites. The trace
          # acceptance launches Chromium headless; only its pinned shell is needed.
          (
            bash scripts/shared/python-env.sh create python "$RUNNER_TEMP/strictdoc" -r scripts/strictdoc/requirements.lock.txt
          ) &
          strictdoc_pid=$!
          browser_status=0
          pnpm exec playwright install --with-deps --only-shell chromium || browser_status=$?
          strictdoc_status=0
          wait "$strictdoc_pid" || strictdoc_status=$?
          if (( strictdoc_status != 0 || browser_status != 0 )); then
            echo "StrictDoc setup=$strictdoc_status Chromium setup=$browser_status" >&2
            exit 1
          fi
          echo "STRICTDOC_BIN=$RUNNER_TEMP/strictdoc/bin/strictdoc" >> "$GITHUB_ENV"
      - name: Dependency cache hit=${{ steps.dependencies.outputs.cache-hit || 'false' }}
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run selected validations
        env:
          CODEXIA_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/types-${{ matrix.group }}
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci/execution/group.mjs "types-${{ matrix.group }}"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ci-evidence-types-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-evidence/types-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 7
  build:
    name: build-${{ matrix.profile }}
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.reuse != 'true' && needs.plan.outputs.build != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Prepare exact pnpm toolchain
        id: pnpm
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore content-addressed dependency cache
        id: dependencies
        uses: actions/cache/restore@v6.1.0
        if: matrix.profile == 'full'
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-node24-pnpm12.21.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            core)
              pnpm --filter '@codexia/profile-core...' --filter '@codexia/app...' --filter @codexia/ci-evidence --fail-if-no-match install --frozen-lockfile --prefer-offline
              ;;
            full) pnpm install --frozen-lockfile --prefer-offline ;;
            *) exit 2 ;;
          esac
      - name: Dependency cache hit=${{ steps.dependencies.outputs.cache-hit || 'false' }}
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run selected validations
        env:
          CODEXIA_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/build-${{ matrix.profile }}
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci/execution/group.mjs "build-${{ matrix.profile }}"
      - name: Pack immutable profile build
        env:
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci/evidence/profile-artifact.mjs pack "${{ matrix.profile }}" "${{ runner.temp }}/profile-build/profile-build.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-profile-build-${{ matrix.profile }}
          path: ${{ runner.temp }}/profile-build/profile-build.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ci-evidence-build-${{ matrix.profile }}
          path: ${{ runner.temp }}/ci-evidence/build-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 7
  oci:
    name: oci-${{ matrix.profile }}
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.reuse != 'true' && needs.plan.outputs.oci != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.oci) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run selected validations
        env:
          CODEXIA_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/oci-${{ matrix.profile }}
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci/execution/group.mjs "oci-${{ matrix.profile }}"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ci-evidence-oci-${{ matrix.profile }}
          path: ${{ runner.temp }}/ci-evidence/oci-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 7
  browser:
    name: browser-${{ matrix.group }}
    needs:
      - plan
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.reuse != 'true' && needs.plan.outputs.browser != '[]'
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: docker.io/library/postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
        env:
          POSTGRES_DB: codexia_test
          POSTGRES_USER: codexia
          POSTGRES_PASSWORD: codexia
        options: >-
          --health-cmd "pg_isready -U codexia -d codexia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.browser) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Prepare exact pnpm toolchain
        id: pnpm
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # PR caches are scoped to that PR and cannot accelerate other PRs.
      # Browser shards restore main's trusted cache but never race to save it.
      - name: Restore content-addressed dependency cache
        id: dependencies
        uses: actions/cache/restore@v6.1.0
        if: matrix.profile == 'full'
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-node24-pnpm12.21.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu
          case "$PROFILE" in
            core)
              pnpm --filter '@codexia/profile-core...' --filter '@codexia/app...' --filter @codexia/ci-evidence --fail-if-no-match install --frozen-lockfile --prefer-offline
              ;;
            full) pnpm install --frozen-lockfile --prefer-offline ;;
            *) exit 2 ;;
          esac
      - name: Dependency cache hit=${{ steps.dependencies.outputs.cache-hit || 'false' }}
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      # Runner/container setup and dependency installation overlap build.
      # The exact same-profile producer must finish successfully before restore.
      - name: Restore exact profile producer
        id: restore-profile
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
          CODEXIA_CI_PROFILE_RECEIPT: ${{ runner.temp }}/profile-receipt.json
        run: node scripts/ci/evidence/profile-artifact.mjs restore "${{ matrix.profile }}" "$CODEXIA_CI_PROFILE_RECEIPT"
      - name: Observe browser runner before validation
        if: always() && !cancelled()
        continue-on-error: true
        run: node scripts/ci/dashboard/runner-observation.mjs before "${{ runner.temp }}/browser-runner-observation"
      - name: Run selected validations
        if: always() && !cancelled()
        env:
          CODEXIA_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/browser-${{ matrix.group }}
          CODEXIA_UI_REVIEW_CAPTURE_DIR: ${{ runner.temp }}/ui-review-screens
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
          CODEXIA_CI_PROFILE_RESTORE: ${{ steps.restore-profile.outcome }}
          CODEXIA_CI_PROFILE_RECEIPT: ${{ runner.temp }}/profile-receipt.json
        run: node scripts/ci/execution/group.mjs "browser-${{ matrix.group }}"
      - name: Observe browser runner after validation
        if: always() && !cancelled()
        continue-on-error: true
        run: node scripts/ci/dashboard/runner-observation.mjs after "${{ runner.temp }}/browser-runner-observation"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && !cancelled()
        continue-on-error: true
        with:
          name: browser-runner-observation-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-runner-observation
          if-no-files-found: warn
          retention-days: 7
      # Only one full-install main-push browser job populates the scoped cache after passing
      # every selected validation. A cache failure must not replace CI evidence.
      - name: Save browser pnpm cache from main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.group == 'full-reference' && steps.dependencies.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7.0.2
        if: always() && (matrix.group == 'core-reference' || matrix.group == 'full-reference')
        with:
          name: ui-refinement-visual-${{ matrix.group }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ui-review-screens
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: playwright-failure-${{ matrix.group }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tests/e2e/test-results/**/trace.zip
            tests/e2e/test-results/**/error-context.md
            tests/e2e/test-results/**/journal-draft-*-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ci-evidence-browser-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-evidence/browser-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 7
    # All browser lanes use the Git-capable immutable Chromium Ubuntu image.
    container:
      image: ${{ format('ghcr.io/{0}/playwright-ubuntu-chromium@sha256:d11b4fa1128d937fcda9dd0106d138b65c3e72cbad07d4801547aa66fc1c4725', github.repository) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --ipc=host
    env:
      CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CODEXIA_CI_BROWSER_GROUP: ${{ matrix.group }}
      CODEXIA_PLAYWRIGHT_IMAGE_DIGEST: sha256:d11b4fa1128d937fcda9dd0106d138b65c3e72cbad07d4801547aa66fc1c4725
      CODEXIA_E2E_DATABASE_URL: postgres://codexia:codexia@postgres:5432/codexia_test
  certification:
    name: certification
    if: ${{ always() && !cancelled() }}
    needs:
      - plan
      - biome
      - unit
      - types
      - build
      - oci
      - browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Verify the affected plan, fixture selection and compact proof against immutable Git boundaries.
          fetch-depth: 0
          # Bootstrap only the shared input selector; checkout uses blobless
          # history for sparse mode. The selector expands the exact tree inputs.
          sparse-checkout: scripts
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Materialize exact evidence inputs
        env:
          CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/impact/evidence-checkout.mjs
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Select latest exact-run plan and job inventory
        if: needs.plan.outputs.reuse != 'true'
        id: select-plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_TEMP: ${{ runner.temp }}
          CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/certification/select-plan.mjs
      - name: Download selected plan by exact artifact ID
        if: needs.plan.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CODEXIA_CI_INVENTORY_PATH: ${{ steps.select-plan.outputs.inventory-path }}
          CODEXIA_CI_ARTIFACT_IDS: ${{ steps.select-plan.outputs.artifact-id }}
          CODEXIA_CI_ARTIFACT_DIR: ${{ runner.temp }}/ci-plan
          CODEXIA_CI_ARTIFACT_KIND: plan
        run: node scripts/ci/evidence/download-artifacts.mjs
      - name: Select latest exact-run execution evidence
        if: needs.plan.outputs.reuse != 'true'
        id: select-evidence
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CODEXIA_CI_INVENTORY_PATH: ${{ steps.select-plan.outputs.inventory-path }}
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci/certification/select-evidence.mjs
      - name: Download selected execution evidence by exact artifact ID
        if: needs.plan.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CODEXIA_CI_INVENTORY_PATH: ${{ steps.select-plan.outputs.inventory-path }}
          CODEXIA_CI_ARTIFACT_IDS: ${{ steps.select-evidence.outputs.artifact-ids }}
          CODEXIA_CI_ARTIFACT_DIR: ${{ runner.temp }}/ci-evidence
          CODEXIA_CI_ARTIFACT_KIND: evidence
        run: node scripts/ci/evidence/download-artifacts.mjs
      - name: Certify every required exact-source matrix element
        if: needs.plan.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CODEXIA_EXPECTED_BASE: ${{ github.event.pull_request.base.sha || '' }}
          CODEXIA_PUSH_BASE: ${{ github.event.before || '' }}
          CODEXIA_REQUIRED_RESULTS: ${{ toJSON(needs) }}
          CODEXIA_CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
          CODEXIA_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci/certification/certify.mjs
      - name: Certify reused merged PR proof
        if: needs.plan.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/certification/reuse-merged-pr.mjs certify
      - name: Record measured workflow timings in the job log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/dashboard/measure.mjs
