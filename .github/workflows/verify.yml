name: Verify Codexia
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codexia-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: test ! -d modules && test ! -d packages/core && test ! -d buildkit
  unit:
    runs-on: ubuntu-24.04
    needs: plan
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: codexia_test
          POSTGRES_USER: codexia
          POSTGRES_PASSWORD: codexia
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U codexia -d codexia_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CODEXIA_TEST_DATABASE_URL: postgres://codexia:codexia@127.0.0.1:5432/codexia_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.0'}
      - run: corepack enable && corepack pnpm@12.10.1 --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:backend && pnpm test
  types:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.0'}
      - run: corepack enable && corepack pnpm@12.10.1 --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm typecheck:tests && pnpm typecheck:safety
  build:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.0'}
      - run: corepack enable && corepack pnpm@12.10.1 --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm audit:core
  browser:
    name: browser-${{ matrix.engine }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: codexia_test
          POSTGRES_USER: codexia
          POSTGRES_PASSWORD: codexia
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U codexia -d codexia_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CODEXIA_E2E_DATABASE_URL: postgres://codexia:codexia@127.0.0.1:5432/codexia_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.0'}
      - run: corepack enable && corepack pnpm@12.10.1 --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm build
      - run: pnpm exec playwright test --config tests/e2e/playwright.config.ts --project ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.engine }}
          path: test-results
          if-no-files-found: ignore
  oci:
    needs: plan
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: codexia_test
          POSTGRES_USER: codexia
          POSTGRES_PASSWORD: codexia
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U codexia -d codexia_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CODEXIA_TEST_DATABASE_URL: postgres://codexia:codexia@127.0.0.1:5432/codexia_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.0'}
      - run: docker build --build-arg CODEXIA_PRODUCER_REVISION=${{ github.event.pull_request.head.sha || github.sha }} -f Dockerfile.backend -t codexia-backend-ci .
      - run: bash scripts/verify-backend-image.sh docker codexia-backend-ci
  certification:
    if: always()
    needs: [plan, unit, types, build, browser, oci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.0'}
      - env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/certify-ci.mjs
