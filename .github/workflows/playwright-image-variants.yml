name: Publish controlled Playwright image variants (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: mirror
            browser: all
          - variant: ubuntu
            browser: chromium
          - variant: ubuntu
            browser: webkit
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable variant and measure compressed manifest size
        env:
          VARIANT: ${{ matrix.variant }}
          BROWSER: ${{ matrix.browser }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/playwright-$VARIANT-$BROWSER"
          if [[ "$VARIANT" == mirror ]]; then
            docker pull mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
            docker tag mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 "$image:pw-1.65.1"
            docker push "$image:pw-1.65.1"
            digest="$(docker buildx imagetools inspect "$image:pw-1.65.1" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          else
            metadata="$RUNNER_TEMP/$BROWSER.json"
            docker buildx build --platform linux/amd64 \
              -f .github/docker/playwright-ubuntu-minimal.Dockerfile \
              --build-arg PLAYWRIGHT_VERSION=1.65.1 --build-arg "BROWSER=$BROWSER" \
              -t "$image:pw-1.65.1" --metadata-file "$metadata" --push .
            digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          docker buildx imagetools inspect "$image@$digest" > "$RUNNER_TEMP/inspect.txt"
          docker pull "$image@$digest"
          bytes="$(docker image inspect "$image@$digest" --format '{{.Size}}')"
          mib="$(awk -v n="$bytes" 'BEGIN { printf "%.1f", n / 1048576 }')"
          echo "Uncompressed image size: $mib MiB" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "### $VARIANT / $BROWSER"
            echo "\`$image@$digest\`"
            echo 'Source Playwright: 1.65.1; platform linux/amd64'
          } >> "$GITHUB_STEP_SUMMARY"
