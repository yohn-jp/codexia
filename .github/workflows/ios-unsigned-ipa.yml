name: iOS unsigned IPA

on:
  pull_request:
    paths:
      - .github/workflows/ios-unsigned-ipa.yml
      - app/native/**
      - scripts/ios/**
      - app/src/entries/mobile-native.tsx
      - app/src/oauth.ts
      - app/src/persistence/PersistenceEntry.tsx
  workflow_dispatch:
    inputs:
      profile:
        description: Frontend module profile
        required: true
        type: choice
        options:
          - core
          - full
        default: core

permissions:
  contents: read

concurrency:
  group: ios-unsigned-ipa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Select pinned Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 27\.'
          xcodebuild -showsdks | grep -E 'iphoneos27\.'
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Capacitor toolchain
        working-directory: app/native
        run: npm ci
      - name: Build the selected browser profile and native Mobile bundle
        env:
          CODEXIA_PROFILE: ${{ inputs.profile || 'core' }}
        run: |
          node scripts/ci-workspace.mjs build-workspace
          node scripts/profile-build.mjs --profile "$CODEXIA_PROFILE"
          pnpm --filter @codexia/app build
          CODEXIA_UI=mobile pnpm --filter @codexia/app exec vite build --config vite.native.config.ts
      - name: Validate native web bundle
        run: |
          node --test scripts/ios/*.test.mjs
          node scripts/ios/validate-web-bundle.mjs app/dist/ios-web
      - name: Generate bundled iOS project
        working-directory: app/native
        run: |
          npx cap add ios
          npx cap sync ios
          node scripts/configure-oauth-callback.mjs ios/App/App/Info.plist
          npm test
      - name: Build without Apple signing credentials
        working-directory: app/native
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build/DerivedData
          IPHONEOS_DEPLOYMENT_TARGET=27.0
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build
      - name: Package and validate unsigned IPA
        env:
          CODEXIA_PROFILE: ${{ inputs.profile || 'core' }}
        run: |
          node scripts/ios/package-unsigned-ipa.mjs \
            --app app/native/build/DerivedData/Build/Products/Release-iphoneos/App.app \
            --out "$RUNNER_TEMP/codexia-ios-artifact" \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --profile "$CODEXIA_PROFILE"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: codexia-ios-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/codexia-ios-artifact/
          if-no-files-found: error
          retention-days: 7
