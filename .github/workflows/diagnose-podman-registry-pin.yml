name: Diagnose Podman restore fixture pin
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/diagnose-podman-registry-pin.yml']
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect official versioned manifests
        shell: bash
        run: |
          set -uo pipefail
          for version in v6.2.0 v6.2.1; do
            ref="quay.io/podman/stable:$version"
            printf '\n=== %s ===\n' "$ref"
            docker buildx imagetools inspect "$ref" || true
          done
          printf '\n=== previously pinned digest ===\n'
          docker buildx imagetools inspect 'quay.io/podman/stable@sha256:a02eea67f0ebb539679b938f58acf47a566fb8876e3223ce527fc725826556f0' || true
