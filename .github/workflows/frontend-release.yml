name: Codexia UI Static Assets
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Initial Frontend Preflight {0}', inputs.preflight_run_id) || '' }}
on:
  workflow_dispatch:
    inputs:
      preflight_run_id:
        description: Reviewed runtime lifecycle Preflight run ID
        required: true
        type: string
      approval_phrase:
        description: PUBLISH_INITIAL_FRONTEND
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - app/**
      - edge/frontend/**
      - profiles/**
      - modules/**
      - packages/core/**
      - packages/http-contract/src/**/*.tsp
      - packages/http-contract/src/fastify-schema.mjs
      - packages/http-contract/tspconfig.yaml
      - packages/http-contract/package.json
      - packages/http-contract/scripts/generate*.mjs
      - packages/contracts/**
      - packages/module-runtime/**
      - packages/persistence-contracts/**
      - packages/persistence-postgres/**
      # Test-only files are not source-bound runtime or host-lifecycle inputs.
      - '!app/**/test/**'
      - '!app/**/tests/**'
      - '!app/**/*.test.*'
      - '!modules/**/test/**'
      - '!modules/**/tests/**'
      - '!modules/**/*.test.*'
      - '!packages/**/test/**'
      - '!packages/**/tests/**'
      - '!packages/**/*.test.*'
      - 'app/src/**/test/**'
      - 'app/src/**/tests/**'
      - 'modules/**/src/**/test/**'
      - 'modules/**/src/**/tests/**'
      # Restore shipped public assets and source helpers only within the frontend closure.
      - 'app/public/**'
      - 'packages/core/src/**/test/**'
      - 'packages/core/src/**/tests/**'
      - 'packages/contracts/src/**/test/**'
      - 'packages/contracts/src/**/tests/**'
      - 'packages/module-runtime/src/**/test/**'
      - 'packages/module-runtime/src/**/tests/**'
      - 'packages/persistence-postgres/src/**/test/**'
      - 'packages/persistence-postgres/src/**/tests/**'
      # Build-emitted source and test files remain runtime package inputs.
      - 'packages/persistence-contracts/src/**'
      - deploy/cloudflare/**
      - deploy/frontend-compatibility.json
      - deploy/production.json
      - scripts/deployment/bootstrap/public-env.mjs
      - scripts/ci/impact/contract.mjs
      - scripts/ci/evidence/artifact-selection.mjs
      - scripts/ci/evidence/download-artifacts*.mjs
      - scripts/ci/evidence/package.json
      - scripts/release/components/policy.mjs
      - scripts/release/components/version*.mjs
      - scripts/release/components/record.mjs
      - scripts/release/components/verify-source.mjs
      - scripts/github/repository.mjs
      - scripts/github/octokit.mjs
      - scripts/github/paginate-actions.mjs
      - scripts/ci/evidence/github-rest-sdk.mjs
      - scripts/release/frontend/deployment-rollback.mjs
      - scripts/release/frontend/initial-publication.mjs
      - scripts/verification/infrastructure/deployment-config.mjs
      - scripts/verification/artifacts/frontend*.mjs
      - scripts/release/frontend/promotion-contract.test.mjs
      - scripts/release/frontend/promotion-handoff.test.mjs
      - scripts/build/frontend/oauth-config.mjs
      - scripts/build/frontend/oauth-config.test.mjs
      - scripts/release/components/record-model*.mjs
      - scripts/ci/certification/reuse-merged-pr*.mjs
      - scripts/release/frontend/verify-compatibility*.mjs
      - scripts/release/backend/update-identity*.mjs
      - scripts/verification/infrastructure/identity-probe-client.mjs
      - scripts/build/frontend/build.mjs
      - scripts/build/packaging/profile-build.mjs
      - scripts/shared/read-regular-file.mjs
      - scripts/build/packaging/profile-package.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/verify.yml
      - .github/workflows/frontend-release.yml
      - .github/workflows/production-preflight.yml
      - deploy/release-impact-paths.json
      - scripts/release/components/impact.mjs
      - scripts/release/components/impact.test.mjs
      - scripts/release/components/source-gate.mjs
      - scripts/release/components/source-gate.test.mjs
  workflow_run:
    workflows: [Verify Codexia]
    types: [completed]
    # Only completed main-source Verify runs can authorize publication.
    # PR Verify completions have no release authority and need no run event.
    branches: [main]
permissions:
  contents: read
env:
  CODEXIA_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  CODEXIA_VERIFY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
concurrency:
  group: codexia-frontend-source-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    name: Authorize exact-source frontend release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.repository.id == github.repository_id &&
      github.event.workflow_run.repository.owner.id == github.repository_owner_id &&
      github.event.workflow_run.head_repository.id == github.repository_id &&
      github.event.workflow_run.head_repository.owner.id == github.repository_owner_id &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      affected: ${{ steps.gate.outputs.affected }}
      verify-run-id: ${{ steps.gate.outputs.verify-run-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Verify completed source and select changed frontend paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/components/source-gate.mjs frontend
  preflight:
    name: Verify production Access and identity paths
    needs: source
    if: needs.source.result == 'success' && needs.source.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: codexia-production
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.promotion.outputs.artifactId }}
      artifact-digest: ${{ steps.promotion.outputs.artifactDigest }}
      artifact-name: ${{ steps.promotion.outputs.artifactName }}
      producer-run-id: ${{ steps.promotion.outputs.producerRunId }}
      producer-attempt: ${{ steps.promotion.outputs.producerAttempt }}
      producer-sha: ${{ steps.promotion.outputs.producerSha }}
      producer-version: ${{ steps.promotion.outputs.producerVersion }}
      producer-pr-number: ${{ steps.promotion.outputs.producerPrNumber }}
      producer-workflow-id: ${{ steps.promotion.outputs.producerWorkflowId }}
      producer-verify-run-id: ${{ steps.promotion.outputs.producerVerifyRunId }}
      producer-proof-run-id: ${{ steps.promotion.outputs.producerProofRunId }}
      producer-tree: ${{ steps.promotion.outputs.producerTree }}
      producer-base-sha: ${{ steps.promotion.outputs.producerBaseSha }}
      producer-plan-digest: ${{ steps.promotion.outputs.producerPlanDigest }}
      producer-verify-attempt: ${{ steps.promotion.outputs.producerVerifyAttempt }}
      producer-event: ${{ steps.promotion.outputs.promoted == 'true' && 'pull_request' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Load reviewed production OAuth settings
        run: node scripts/deployment/bootstrap/public-env.mjs
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Verify the selected production Cloudflare ingress
        env:
          CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN }}
        run: node scripts/release/frontend/initial-publication.mjs observe-ingress
      - name: Probe production identity endpoints and Access boundary
        id: probe
        env:
          CODEXIA_ACCESS_CLIENT_ID: ${{ secrets.CODEXIA_ACCESS_CLIENT_ID }}
          CODEXIA_ACCESS_CLIENT_SECRET: ${{ secrets.CODEXIA_ACCESS_CLIENT_SECRET }}
        run: node scripts/release/frontend/verify-compatibility.mjs preflight
      - name: Select exact tested PR frontend artifact
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_LIVE_FRONTEND_VERSION: ${{ steps.probe.outputs.frontendVersion }}
          CODEXIA_LIVE_FRONTEND_SOURCE_SHA: ${{ steps.probe.outputs.frontendSourceSha }}
          CODEXIA_LIVE_FRONTEND_PROFILE: ${{ steps.probe.outputs.frontendProfile }}
          CODEXIA_LIVE_FRONTEND_API_EPOCH: ${{ steps.probe.outputs.frontendApiEpoch }}
        run: node scripts/verification/artifacts/frontend.mjs select-promotion
  build:
    name: Build and verify UI assets
    # The certified main archive must be available even while production is blocked.
    needs: source
    if: always() && (github.event_name == 'pull_request' || (needs.source.result == 'success' && needs.source.outputs.affected == 'true'))
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    env:
      # Read-only checkout is mounted from the host with a different UID.
      # Trust only this exact checkout for Git calls launched by build scripts.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-name: ${{ steps.producer.outputs.artifact-name }}
      producer-run-id: ${{ steps.producer.outputs.run-id }}
      producer-attempt: ${{ steps.producer.outputs.attempt }}
      producer-sha: ${{ steps.producer.outputs.source-sha }}
      producer-version: ${{ steps.producer.outputs.version }}
      producer-event: ${{ steps.producer.outputs.event }}
      producer-pr-number: ${{ steps.producer.outputs.pr-number }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'workflow_run' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Load reviewed production OAuth settings
        run: node scripts/deployment/bootstrap/public-env.mjs
      - name: Prepare locked pnpm toolchain
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI without building the API
        env:
          CODEXIA_PROFILE: full
        run: pnpm run build:frontend
      # Shared route/Worker checks are owned by Verify's unit-root task.
      # The exact main-source certification gate requires that proof before deploy.
      - name: Install pinned Wrangler
        run: npm ci --prefix edge/frontend
      - name: Validate Wrangler assets-only bundle
        run: edge/frontend/node_modules/.bin/wrangler deploy --dry-run --config edge/frontend/wrangler.jsonc --outdir "$RUNNER_TEMP/codexia-frontend-worker"
      - name: Confirm preinstalled Chromium runtime
        run: |
          test -d /ms-playwright
          node -e 'const {chromium}=require("@playwright/test"); chromium.launch({headless:true}).then(async b=>{await b.close()}).catch(e=>{console.error(e);process.exitCode=1})'
      - name: Exercise actual static asset server and browser entrypoints
        run: node edge/frontend/test/static-smoke.mjs
      - name: Exercise OAuth authorization from static browser shells
        run: node edge/frontend/test/oauth-static-smoke.mjs
      - name: Identify immutable frontend artifact for this producer attempt
        id: producer
        env:
          CODEXIA_PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEXIA_PRODUCER_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "run-id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source-sha=$CODEXIA_PRODUCER_SHA" >> "$GITHUB_OUTPUT"
          echo "event=$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
          producer_version=$(node -p "require('./app/dist/desktop/update-identity.json').version")
          echo "version=$producer_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "pr-number=$CODEXIA_PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "artifact-name=codexia-frontend-pr-$CODEXIA_PR_NUMBER-$GITHUB_RUN_ID-$CODEXIA_PRODUCER_SHA-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          else
            echo "artifact-name=codexia-frontend-$CODEXIA_SOURCE_SHA-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: ${{ steps.producer.outputs.artifact-name }}
          path: app/dist
          if-no-files-found: error
          retention-days: 14
  # Independent source certification still gates deployment after build selection.
  deploy:
    name: Deploy UI Static Assets
    needs: [source, preflight, build]
    if: >-
      github.event_name == 'workflow_run' && needs.source.result == 'success' &&
      needs.source.outputs.affected == 'true' && needs.preflight.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: codexia-production
      cancel-in-progress: false
      queue: max
    environment: codexia-production
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      CODEXIA_FRONTEND_SOURCE_VERIFY_RUN_ID: ${{ needs.preflight.outputs.producer-verify-run-id }}
      CODEXIA_FRONTEND_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact-id || needs.build.outputs.artifact-id }}
      CODEXIA_FRONTEND_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact-digest || needs.build.outputs.artifact-digest }}
      CODEXIA_FRONTEND_ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact-name || needs.build.outputs.artifact-name }}
      CODEXIA_FRONTEND_PRODUCER_EVENT: ${{ needs.preflight.outputs.producer-event || needs.build.outputs.producer-event }}
      CODEXIA_FRONTEND_PRODUCER_RUN_ID: ${{ needs.preflight.outputs.producer-run-id || needs.build.outputs.producer-run-id }}
      CODEXIA_FRONTEND_PRODUCER_ATTEMPT: ${{ needs.preflight.outputs.producer-attempt || needs.build.outputs.producer-attempt }}
      CODEXIA_FRONTEND_PRODUCER_SHA: ${{ needs.preflight.outputs.producer-sha || needs.build.outputs.producer-sha }}
      CODEXIA_FRONTEND_PRODUCER_VERSION: ${{ needs.preflight.outputs.producer-version || needs.build.outputs.producer-version }}
      CODEXIA_FRONTEND_PRODUCER_PR_NUMBER: ${{ needs.preflight.outputs.producer-pr-number || needs.build.outputs.producer-pr-number }}
      CODEXIA_FRONTEND_PRODUCER_WORKFLOW_ID: ${{ needs.preflight.outputs.producer-workflow-id }}
      CODEXIA_FRONTEND_PRODUCER_TREE: ${{ needs.preflight.outputs.producer-tree }}
      CODEXIA_FRONTEND_PRODUCER_BASE_SHA: ${{ needs.preflight.outputs.producer-base-sha }}
      CODEXIA_FRONTEND_PR_VERIFY_RUN_ID: ${{ needs.preflight.outputs.producer-proof-run-id }}
      CODEXIA_FRONTEND_VERIFY_ATTEMPT: ${{ needs.preflight.outputs.producer-verify-attempt }}
      CODEXIA_FRONTEND_VERIFY_PLAN_DIGEST: ${{ needs.preflight.outputs.producer-plan-digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Load reviewed production OAuth settings
        run: node scripts/deployment/bootstrap/public-env.mjs
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Recheck component source after acquiring the deployment slot
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/components/source-gate.mjs frontend
      - name: Install pinned Wrangler
        if: steps.freshness.outputs.affected == 'true'
        run: npm ci --prefix edge/frontend
      - name: Verify exact frontend artifact provenance
        if: steps.freshness.outputs.affected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_VERIFY_RUN_ID: ${{ needs.preflight.outputs.producer-verify-run-id || needs.source.outputs.verify-run-id }}
          CODEXIA_FRONTEND_CERTIFIED_VERIFY_RUN_ID: ${{ needs.source.outputs.verify-run-id }}
        run: node scripts/verification/artifacts/frontend.mjs
      - name: Verify live backend API compatibility before switching UI
        id: compatibility
        if: steps.freshness.outputs.affected == 'true'
        env:
          CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN }}
          CODEXIA_ACCESS_CLIENT_ID: ${{ secrets.CODEXIA_ACCESS_CLIENT_ID }}
          CODEXIA_ACCESS_CLIENT_SECRET: ${{ secrets.CODEXIA_ACCESS_CLIENT_SECRET }}
        run: |
          node scripts/release/frontend/initial-publication.mjs observe-ingress
          node scripts/release/frontend/verify-compatibility.mjs
      - name: Pin active Worker deployment before the publication attempt
        id: before-deploy
        if: steps.compatibility.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN }}
          CODEXIA_FRONTEND_ROLLBACK_STATE: ${{ runner.temp }}/codexia-frontend-before-deploy.json
        run: node scripts/release/frontend/deployment-rollback.mjs capture
      - name: Deploy static assets only
        id: deploy-assets
        if: steps.before-deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: edge/frontend/node_modules/.bin/wrangler deploy --config edge/frontend/wrangler.jsonc --tag "frontend-$CODEXIA_FRONTEND_ARTIFACT_DIGEST"
      - name: Verify deployed frontend identity
        id: verify-deployed
        if: always() && steps.compatibility.outcome == 'success'
        env:
          CODEXIA_ACCESS_CLIENT_ID: ${{ secrets.CODEXIA_ACCESS_CLIENT_ID }}
          CODEXIA_ACCESS_CLIENT_SECRET: ${{ secrets.CODEXIA_ACCESS_CLIENT_SECRET }}
        run: node scripts/release/frontend/verify-compatibility.mjs deployed
      - name: Recover the prior Worker on publication or identity verification failure
        if: >-
          always() && steps.before-deploy.outcome == 'success' &&
          (steps.deploy-assets.outcome == 'failure' || steps.verify-deployed.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN }}
          CODEXIA_FRONTEND_ROLLBACK_STATE: ${{ runner.temp }}/codexia-frontend-before-deploy.json
        run: node scripts/release/frontend/deployment-rollback.mjs restore
      - name: Record independent frontend release
        if: always() && steps.compatibility.outcome == 'success' && steps.verify-deployed.outcome == 'success' && (steps.deploy-assets.outcome == 'success' || steps.compatibility.outputs.deploy == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_FRONTEND_VERIFY_RUN_ID: ${{ needs.preflight.outputs.producer-verify-run-id || needs.source.outputs.verify-run-id }}
        run: node scripts/release/components/record.mjs frontend

  initial-frontend:
    name: Publish canonical frontend for initial owner enrollment
    if: github.event_name == 'workflow_dispatch' && github.event.repository.name == 'codexia' && github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: codexia-production
    concurrency:
      group: codexia-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
      packages: read
      id-token: write
    steps:
      - name: Require current main and reviewed publication approval
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL: ${{ inputs.approval_phrase }}
          PREFLIGHT_RUN: ${{ inputs.preflight_run_id }}
        run: |
          set -euo pipefail
          [[ "$APPROVAL" == PUBLISH_INITIAL_FRONTEND ]]
          [[ "$PREFLIGHT_RUN" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load the reviewed runtime Preflight candidate and plan
        id: preflight
        uses: $/.github/actions/reviewed-preflight
        with:
          run-id: ${{ inputs.preflight_run_id }}
          management: runtime
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Load reviewed production OAuth settings
        run: node scripts/deployment/bootstrap/public-env.mjs
      - name: Install frozen evidence-reader dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Install pinned Wrangler
        run: npm ci --prefix edge/frontend
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read certified source and candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_PREFLIGHT_REQUEST: ${{ steps.preflight.outputs.request }}
        run: node scripts/deployment/preflight/run.mjs candidate
      - name: Prepare runtime pinned SSH
        id: runtime
        env:
          CODEXIA_DEPLOY_HOST: ${{ vars.CODEXIA_DEPLOY_HOST }}
          CODEXIA_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_DEPLOY_SSH_PRIVATE_KEY }}
          CODEXIA_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash deploy/ansible/prepare-deploy-ssh.sh
      - name: Require immutable GitHub OIDC claims for Tailscale
        env:
          CODEXIA_TAILSCALE_CLIENT_ID: ${{ vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID }}
          CODEXIA_TAILSCALE_ENVIRONMENT: codexia-production
        run: node scripts/deployment/preflight/tailscale-oidc.mjs
      - name: Connect the existing protected management plane
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ format('api.tailscale.com/{0}', vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID) }}
          tags: tag:ci
          ping: ${{ steps.runtime.outputs.host }}
      - name: Prepare the pinned read-only Ansible inventory
        env:
          SSH_USER: codexia
        run: |
          set -euo pipefail
          bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/codexia-ansible" -r deploy/ansible/requirements.txt
          echo "$RUNNER_TEMP/codexia-ansible/bin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/codexia-preflight-inventory.yml" <<EOF_INVENTORY
          all:
            hosts:
              codexia:
                ansible_host: codexia-target
                ansible_user: $SSH_USER
                ansible_ssh_use_tty: false
                ansible_ssh_common_args: '-F "$RUNNER_TEMP/codexia-ssh/config"'
          EOF_INVENTORY
      - name: Observe existing host evidence
        env:
          CODEXIA_PREFLIGHT_TARGET_HOST: ${{ steps.runtime.outputs.host }}
        run: node scripts/deployment/preflight/run.mjs host
      - name: Admit reviewed R5 and publish the canonical frontend
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_PREFLIGHT_REQUEST: ${{ steps.preflight.outputs.request }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN }}
          CODEXIA_ACCESS_CLIENT_ID: ${{ secrets.CODEXIA_ACCESS_CLIENT_ID }}
          CODEXIA_ACCESS_CLIENT_SECRET: ${{ secrets.CODEXIA_ACCESS_CLIENT_SECRET }}
          CODEXIA_INITIAL_FRONTEND_APPROVAL: ${{ inputs.approval_phrase }}
          CODEXIA_BOOTSTRAP_PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          CODEXIA_BOOTSTRAP_PREFLIGHT_ATTEMPT: ${{ steps.preflight.outputs.attempt }}
          CODEXIA_BOOTSTRAP_PLAN_SHA256: ${{ steps.preflight.outputs.plan-sha256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deployment/preflight/run.mjs initial-frontend
