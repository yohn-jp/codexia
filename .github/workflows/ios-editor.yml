name: Native iOS
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: Approved public HTTPS API origin for the unsigned app
        type: string
        required: false
      oauth_client_id:
        description: Registered public iOS OAuth client ID
        type: string
        required: false
  pull_request:
    paths:
      - 'ios/CodexiaEditor/**'
      - 'ios/CodexiaApp/**'
      - 'ios/CodexiaTransport/**'
      - '.github/workflows/ios-editor.yml'
permissions:
  contents: read
concurrency:
  group: ios-editor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  editor:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and native toolchain
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          xcodebuild -version | grep -E '^Xcode 27\.'
          xcrun --sdk iphonesimulator --show-sdk-version | grep -E '^27(\.|$)'
          swift --version
      - name: Build for iOS Simulator
        working-directory: ios/CodexiaEditor
        run: xcodebuild -scheme CodexiaEditor -destination 'generic/platform=iOS Simulator' -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build
      - name: Test state model
        working-directory: ios/CodexiaEditor
        run: swift test --force-resolved-versions --jobs 4
      - name: Select and boot Simulator
        id: simulator_boot
        timeout-minutes: 10
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          DEVICE_ID=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(x["udid"] for runtime, devices in d["devices"].items() if ".iOS-27-" in runtime for x in devices if x["name"].startswith("iPhone")))' "$RUNNER_TEMP/devices.json")
          echo "EDITOR_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Test UIKit adapter on Simulator
        if: ${{ !cancelled() && steps.simulator_boot.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: ios/CodexiaEditor
        run: xcodebuild -scheme CodexiaEditor -destination "platform=iOS Simulator,id=$EDITOR_SIMULATOR_ID" -onlyUsePackageVersionsFromResolvedFile -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/editor-package.xcresult" test
      - name: Test SwiftUI shell, draft navigation and scene on Simulator
        if: ${{ !cancelled() && steps.simulator_boot.outcome == 'success' }}
        timeout-minutes: 15
        run: xcodebuild -project ios/CodexiaApp/CodexiaApp.xcodeproj -scheme CodexiaAppUI -destination "platform=iOS Simulator,id=$EDITOR_SIMULATOR_ID" -onlyUsePackageVersionsFromResolvedFile -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/editor-app.xcresult" test
      - name: Retain Simulator results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-simulator-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/editor-package.xcresult
            ${{ runner.temp }}/editor-app.xcresult
          retention-days: 14
  native-ipa:
    name: Native unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and ARM64 iOS toolchain
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(uname -m)" = arm64
          xcodebuild -version | grep -E '^Xcode 27\.'
          xcrun --sdk iphoneos --show-sdk-version | grep -E '^27(\.|$)'
          swift --version
      - name: Validate public build configuration
        id: configuration
        env:
          API_ORIGIN: ${{ inputs.api_origin }}
          OAUTH_CLIENT_ID: ${{ inputs.oauth_client_id }}
        run: |
          python3 - <<'PY'
          from os import environ
          from urllib.parse import urlsplit

          origin = environ.get("API_ORIGIN", "")
          client = environ.get("OAUTH_CLIENT_ID", "")
          if bool(origin) != bool(client):
              raise SystemExit("Supply both the HTTPS API origin and public OAuth client ID.")
          if origin:
              parts = urlsplit(origin)
              if (len(origin) > 512 or not origin.isascii() or any(c.isspace() for c in origin)
                  or parts.scheme != "https" or not parts.hostname or parts.username is not None
                  or parts.password is not None or parts.path not in ("", "/")
                  or parts.query or parts.fragment or "?" in origin or "#" in origin):
                  raise SystemExit("The API origin must be an exact HTTPS origin.")
              if not client.isascii() or not (1 <= len(client) <= 128) or any(not 33 <= ord(c) <= 126 for c in client):
                  raise SystemExit("The public OAuth client ID is invalid.")
          with open(environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print("variant=" + ("configured" if origin else "unconfigured-proof"), file=out)
          PY
      - name: Archive native app for iPhone
        env:
          API_ORIGIN: ${{ inputs.api_origin }}
          OAUTH_CLIENT_ID: ${{ inputs.oauth_client_id }}
        run: |
          xcodebuild -project ios/CodexiaApp/CodexiaApp.xcodeproj -scheme CodexiaAppUI \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CodexiaNative.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/codexia-native-packages" \
            -onlyUsePackageVersionsFromResolvedFile \
            "CODEXIA_API_ORIGIN=$API_ORIGIN" "CODEXIA_OAUTH_CLIENT_ID=$OAUTH_CLIENT_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= archive
      - name: Certify native unsigned IPA and archive contents
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_API_ORIGIN: ${{ inputs.api_origin }}
          EXPECTED_OAUTH_CLIENT_ID: ${{ inputs.oauth_client_id }}
        run: |
          lock=ios/CodexiaApp/CodexiaApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git ls-files --error-unmatch "$lock" >/dev/null
          git diff --exit-code -- "$lock"
          swift ios/CodexiaApp/Scripts/package-unsigned-ipa.swift \
            "$RUNNER_TEMP/CodexiaNative.xcarchive/Products/Applications/CodexiaApp.app" \
            "$RUNNER_TEMP/codexia-native-ipa" "$EXPECTED_SHA" "$(xcodebuild -version)" "$(swift --version)" "$lock"
      - name: Retain unsigned native archive evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codexia-native-unsigned-${{ steps.configuration.outputs.variant }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/codexia-native-ipa
          if-no-files-found: error
          retention-days: 14
