name: Verify deployment cutover

on:
  workflow_call:
    inputs:
      fixtures:
        description: Exact-source fixture selection from Verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixtures:
    name: Verify selected deployment fixtures
    runs-on: ${{ contains(inputs.fixtures, '"kind":"rootless"') && 'ubuntu-26.04' || 'ubuntu-24.04' }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Install disposable host capabilities
        if: contains(inputs.fixtures, '"kind":"rootless"')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            age podman uidmap netavark aardvark-dns passt slirp4netns fuse-overlayfs dbus-user-session jq
      - name: Run selected deployment fixtures
        env:
          CODEXIA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CODEXIA_CI_DEPLOYMENT_FIXTURES: ${{ inputs.fixtures }}
        run: node scripts/ci/execution/deployment-fixtures.mjs
      - name: Upload source- and run-bound fixture observations
        if: always() && contains(inputs.fixtures, '"kind":"rootless"')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cutover-fixtures-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cutover-fixtures/*/codexia-epoch-cutover-evidence/*.json
          if-no-files-found: error
          retention-days: 14
