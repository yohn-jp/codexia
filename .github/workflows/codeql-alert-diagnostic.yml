name: CodeQL alert diagnostic (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/codeql-alert-diagnostic.yml'
permissions:
  contents: read
  checks: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print existing CodeQL check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/check-runs/137421481826/annotations --jq '.[] | {path, start_line, end_line, annotation_level, title, message}'
