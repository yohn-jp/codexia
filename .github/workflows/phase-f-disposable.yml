name: Phase F disposable updater lifecycle
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase-f-disposable.yml
      - .github/workflows/full-model-oci-acceptance.yml
      - .github/workflows/verify.yml
      - .github/workflows/backend-release.yml
      - deploy/ansible/test-phase-f-disposable.sh
      - docs/deployment/PHASE-F-DISPOSABLE-CI.md
      - deploy/postgres/**
      - deploy/quadlet/**
      - deploy/update-compatibility.json
      - deploy/updater/**
      - scripts/backend-update-identity*.mjs
      - scripts/ci-contract.mjs
      - scripts/phase-f-disposable.test.mjs
      - scripts/phase-f-fetch-loader.mjs
      - scripts/phase-f-test-channel.mjs
      - scripts/publish-stable-channel.mjs
      - scripts/release-policy.mjs
      - scripts/standalone-update-controller.mjs
      - scripts/update-channel.mjs
      - scripts/update-release-policy.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-f-disposable.yml
      - .github/workflows/full-model-oci-acceptance.yml
      - .github/workflows/verify.yml
      - .github/workflows/backend-release.yml
      - deploy/ansible/test-phase-f-disposable.sh
      - docs/deployment/PHASE-F-DISPOSABLE-CI.md
      - deploy/postgres/**
      - deploy/quadlet/**
      - deploy/update-compatibility.json
      - deploy/updater/**
      - scripts/backend-update-identity*.mjs
      - scripts/ci-contract.mjs
      - scripts/phase-f-disposable.test.mjs
      - scripts/phase-f-fetch-loader.mjs
      - scripts/phase-f-test-channel.mjs
      - scripts/publish-stable-channel.mjs
      - scripts/release-policy.mjs
      - scripts/standalone-update-controller.mjs
      - scripts/update-channel.mjs
      - scripts/update-release-policy.mjs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: phase-f-disposable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  full-model-oci:
    name: Reuse the pinned Full model OCI lifecycle proof
    uses: ./.github/workflows/full-model-oci-acceptance.yml
    permissions:
      contents: read

  rootless-updater-lifecycle:
    name: Signed update, rollback, interruption, and drift on disposable rootless systemd
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Check out exact source without persistent credentials
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Test the Phase F workflow, helper, and URL-scoped metadata shim
        run: |
          set -euo pipefail
          bash -n deploy/ansible/test-phase-f-disposable.sh
          node --test scripts/phase-f-disposable.test.mjs
      - name: Run signed lifecycle and failure recovery against actual pinned release images
        env:
          CODEXIA_DISPOSABLE_HOST: phase-f-integration
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/ansible/test-phase-f-disposable.sh
      - name: Upload signed disposable evidence without private key material
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: phase-f-disposable-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexia-phase-f-evidence/
          if-no-files-found: error
          retention-days: 7
