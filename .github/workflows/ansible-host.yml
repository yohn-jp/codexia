name: Verify Ansible Host
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/shared/python-env.sh
      - deploy/ansible/site.yml
      - deploy/ansible/host.yml
      - deploy/ansible/host-validate.yml
      - deploy/ansible/host-contract.py
      - deploy/ansible/test-host-integration.sh
      - deploy/ansible/requirements.txt
      - .github/workflows/ansible-host.yml
  push:
    branches: [main]
    paths:
      - scripts/shared/python-env.sh
      - deploy/ansible/site.yml
      - deploy/ansible/host.yml
      - deploy/ansible/host-validate.yml
      - deploy/ansible/host-contract.py
      - deploy/ansible/test-host-integration.sh
      - deploy/ansible/requirements.txt
      - .github/workflows/ansible-host.yml
permissions:
  contents: read
concurrency:
  group: ansible-host-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  standalone-host:
    name: Verify real Ubuntu rootless host convergence
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - uses: actions/setup-node@v7.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Resolve reusable independent PR proof
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/certification/reuse-merged-pr.mjs dedicated
      - name: Install supported Ansible control environment
        if: steps.reuse.outputs.eligible != 'true'
        run: |
          bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/codexia-ansible" -r deploy/ansible/requirements.txt mitogen==0.3.55
          python="$RUNNER_TEMP/codexia-ansible/bin/python"
          plugin_dir=$("$python" -c 'import ansible_mitogen, os; print(os.path.join(os.path.dirname(ansible_mitogen.__file__), "plugins", "strategy"))')
          test -f "$plugin_dir/mitogen_linear.py"
          "$python" -c 'from importlib.metadata import version; assert version("mitogen") == "0.3.55"'
          {
            echo "ANSIBLE_STRATEGY=mitogen_linear"
            echo "ANSIBLE_STRATEGY_PLUGINS=$plugin_dir"
          } >> "$GITHUB_ENV"
          echo "HOST_ANSIBLE_PROFILE strategy=mitogen_linear"
      - name: Exercise host stage twice and run Quadlet with Actions-only environment isolation
        if: steps.reuse.outputs.eligible != 'true'
        env:
          CODEXIA_HOST_PROOF_MODE: actions-fixture
          ANSIBLE_PLAYBOOK: ${{ runner.temp }}/codexia-ansible/bin/ansible-playbook
        run: bash deploy/ansible/test-host-integration.sh
