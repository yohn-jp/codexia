name: Stage protected first-owner assets
on:
  workflow_dispatch:
    inputs:
      request:
        description: Exact lifecycle candidate request with install intent (JSON)
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  stage:
    name: Certify and stage detached owner setup Worker
    if: github.repository == 'yohn-jp/codexia' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: codexia-bootstrap-edge
    concurrency:
      group: codexia-production
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      CODEXIA_PREFLIGHT_REQUEST: ${{ inputs.request }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          pnpm install --frozen-lockfile
          npm ci --prefix edge/frontend
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify the exact-source Full backend and frontend producer proofs
        env:
          CODEXIA_REPOSITORY_ID: ${{ github.repository_id }}
          VITE_CODEXIA_OAUTH_ISSUER: ${{ vars.VITE_CODEXIA_OAUTH_ISSUER }}
          VITE_CODEXIA_OAUTH_CLIENT_ID: ${{ vars.VITE_CODEXIA_OAUTH_CLIENT_ID }}
          VITE_CODEXIA_API_AUDIENCE: ${{ vars.VITE_CODEXIA_API_AUDIENCE }}
          VITE_CODEXIA_OAUTH_DESKTOP_REDIRECT_URI: ${{ vars.VITE_CODEXIA_OAUTH_DESKTOP_REDIRECT_URI }}
          VITE_CODEXIA_OAUTH_SCOPES: ${{ vars.VITE_CODEXIA_OAUTH_SCOPES }}
        run: node scripts/deployment/preflight/run.mjs candidate
      - name: Stage only the verified owner setup files without any route or public preview
        env:
          CODEXIA_CUTOVER_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_CUTOVER_CLOUDFLARE_TARGET }}
          CODEXIA_PUBLIC_ORIGIN: ${{ vars.CODEXIA_PUBLIC_ORIGIN }}
          CODEXIA_CUTOVER_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_CUTOVER_CLOUDFLARE_READ_TOKEN }}
          CODEXIA_OWNER_SETUP_WORKER_TOKEN: ${{ secrets.CODEXIA_OWNER_SETUP_WORKER_TOKEN }}
        run: node scripts/deployment/bootstrap/stage-owner-setup.mjs
