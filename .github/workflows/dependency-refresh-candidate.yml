name: Dependency refresh candidate (temporary)
on:
  pull_request:
    paths:
      - .github/workflows/dependency-refresh-candidate.yml
      - scripts/dependency-refresh-candidate.mjs
permissions:
  contents: read
jobs:
  npm:
    if: github.head_ref == 'chore/dependency-refresh-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Generate compatible workspace and Worker dependency refresh
        run: |
          corepack enable
          corepack pnpm@12.10.1 --version
          node scripts/dependency-refresh-candidate.mjs npm
          pnpm -r update --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
          npm install --prefix edge/frontend --package-lock-only --ignore-scripts
          npm update --prefix edge/frontend --package-lock-only --ignore-scripts
          node scripts/dependency-refresh-candidate.mjs emit
  go:
    if: github.head_ref == 'chore/dependency-refresh-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: buildkit/frontend/go.mod
          cache: false
      - name: Inspect Go updates and generate patch-compatible module graph
        run: |
          cd buildkit/frontend
          GOTOOLCHAIN=local go list -m -u all
          GOTOOLCHAIN=local go get -u=patch ./...
          GOTOOLCHAIN=local go mod tidy
          GOTOOLCHAIN=local go test ./...
          cd ../..
          node scripts/dependency-refresh-candidate.mjs emit
  infra:
    if: github.head_ref == 'chore/dependency-refresh-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Inspect infrastructure release registries and current image digests
        run: |
          node scripts/dependency-refresh-candidate.mjs infra
          node scripts/dependency-refresh-candidate.mjs emit
