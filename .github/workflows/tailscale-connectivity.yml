name: Tailscale connectivity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  connectivity:
    name: Verify Tailnet SSH reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    if: github.ref == 'refs/heads/main'
    environment: codexia-production

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned SSH identity
        id: target
        env:
          CODEXIA_DEPLOY_HOST: ${{ vars.CODEXIA_DEPLOY_HOST }}
          CODEXIA_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_DEPLOY_SSH_PRIVATE_KEY }}
          CODEXIA_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash deploy/ansible/prepare-deploy-ssh.sh
      - name: Connect to Tailscale using GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ format('api.tailscale.com/{0}', secrets.TS_OAUTH_CLIENT_ID) }}
          tags: tag:ci
          ping: ${{ steps.target.outputs.host }}

      - name: Verify pinned public-key SSH as codexia
        run: ssh -F "$RUNNER_TEMP/codexia-ssh/config" codexia-target 'test "$(id -un)" = codexia'

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/codexia-ssh"
