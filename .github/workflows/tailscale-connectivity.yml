name: Tailscale connectivity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  connectivity:
    name: Verify Tailnet SSH reachability
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: codexia-production

    steps:
      - name: Connect to Tailscale using GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: api.tailscale.com/Ts4P9VFjmJ11CNTRL-khX5P9DgL421CNTRL
          tags: tag:ci
          ping: 100.100.1.68

      - name: Verify TCP/22 reachability (no SSH authentication)
        shell: bash
        run: |
          set -euo pipefail
          tailscale status
          timeout 10 bash -c 'echo > /dev/tcp/100.100.1.68/22'

      - name: Verify pinned public-key SSH as codexia
        shell: bash
        env:
          CODEXIA_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_DEPLOY_SSH_PRIVATE_KEY }}
          CODEXIA_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$CODEXIA_DEPLOY_SSH_PRIVATE_KEY" ]] || { echo 'Dedicated deployment SSH key is unavailable' >&2; exit 1; }
          [[ -n "$CODEXIA_DEPLOY_SSH_KNOWN_HOSTS" ]] || { echo 'Pinned deployment known_hosts entry is unavailable' >&2; exit 1; }
          ssh_dir="$RUNNER_TEMP/codexia-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$CODEXIA_DEPLOY_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$CODEXIA_DEPLOY_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh-keygen -F 100.100.1.68 -f "$ssh_dir/known_hosts" >/dev/null
          timeout 20 ssh \
            -i "$ssh_dir/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            codexia@100.100.1.68 'test "$(id -un)" = codexia'

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/codexia-ssh"
