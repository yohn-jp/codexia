name: Publish Codexia OCI
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: codexia-oci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-source:
    name: Verified release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Require exact successful main source, native, OCI and browser verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/components/verify-source.mjs
      - name: Require enabled Immutable Releases before publication
        env:
          CODEXIA_RELEASE_IMMUTABILITY_READ_TOKEN: ${{ secrets.CODEXIA_RELEASE_IMMUTABILITY_READ_TOKEN }}
        run: node scripts/release/components/codexiactl-release.mjs check-setting
  publish:
    name: Publish ${{ matrix.profile }}
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Validate release tag and determine image
        id: image
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Unsupported release tag' >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/$PROFILE" >> "$GITHUB_OUTPUT"
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Build and verify the exact release image against PostgreSQL
        env:
          OCI_ENGINE: docker
          CODEXIA_PROFILE: ${{ matrix.profile }}
          CODEXIA_OCI_IMAGE: codexia-ci:${{ matrix.profile }}
        run: |
          bash scripts/verification/runtime/oci.sh
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$CODEXIA_OCI_IMAGE")" = linux/amd64
      - name: Recheck immutable tag before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/components/verify-source.mjs
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          PROFILE: ${{ matrix.profile }}
        run: |
          node scripts/verification/artifacts/unpublished-image.mjs
          docker tag "codexia-ci:$PROFILE" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:$TAG"
          echo "Published $IMAGE:$TAG from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  codexiactl:
    name: Build and attest the verified Linux CLI
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cmd/codexiactl/go.mod
          cache: false
      - name: Build and verify the exact release binary
        env:
          CODEXIACTL_BUILD_SOURCE: ${{ github.sha }}
          CODEXIACTL_BUILD_VERSION: ${{ github.ref_name }}
          CODEXIACTL_BUILD_APP_CLIENT_ID: ${{ vars.CODEXIACTL_GITHUB_APP_CLIENT_ID }}
        run: bash scripts/ci/execution/verify-codexiactl.sh "$RUNNER_TEMP/codexiactl-release"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/codexiactl-release/codexiactl-linux-amd64
      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: codexiactl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexiactl-release/
          if-no-files-found: error
          retention-days: 7
  release:
    name: Publish verified Release
    needs: [verify-source, publish, codexiactl]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Require the exact CLI build artifact ID
        env:
          CODEXIACTL_ARTIFACT_ID: ${{ needs.codexiactl.outputs.artifact-id }}
        run: |
          if [[ ! "$CODEXIACTL_ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ ]]; then
            echo 'The successful CLI build did not supply an immutable artifact ID.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.codexiactl.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/codexiactl-release
      - name: Recheck the exact verified tag source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/components/verify-source.mjs
      - name: Publish or verify the immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_RELEASE_IMMUTABILITY_READ_TOKEN: ${{ secrets.CODEXIA_RELEASE_IMMUTABILITY_READ_TOKEN }}
        run: node scripts/release/components/codexiactl-release.mjs reconcile
