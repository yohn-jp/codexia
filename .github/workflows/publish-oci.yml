name: Publish Codexia OCI
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: codexia-oci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-source:
    name: Verified release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Require exact successful main source, native, OCI and browser verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-source.mjs
  publish:
    name: Publish ${{ matrix.profile }}
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - uses: docker/setup-buildx-action@v3
      - name: Validate release tag and determine image
        id: image
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Unsupported release tag' >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/$PROFILE" >> "$GITHUB_OUTPUT"
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Build and verify the exact release image against PostgreSQL
        env:
          OCI_ENGINE: docker
          CODEXIA_PROFILE: ${{ matrix.profile }}
          CODEXIA_OCI_IMAGE: codexia-ci:${{ matrix.profile }}
        run: |
          bash scripts/verify-oci.sh
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$CODEXIA_OCI_IMAGE")" = linux/amd64
      - name: Recheck immutable tag before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-source.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          PROFILE: ${{ matrix.profile }}
        run: |
          node scripts/verify-unpublished-image.mjs
          docker tag "codexia-ci:$PROFILE" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:$TAG"
          echo "Published $IMAGE:$TAG from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  release:
    name: Publish verified Release
    needs: [verify-source, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Publish only after both verified images succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-release-source.mjs
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing Release retained unchanged.'
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
