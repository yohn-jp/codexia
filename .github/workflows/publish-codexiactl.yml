name: Publish CodexiaCTL
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codexiactl-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-source:
    # Design-only commits must not republish the non-conforming CLI.
    # Remove the hold together with the automatic tag hold after integrated acceptance.
    if: false && github.repository == 'yohn-jp/codexia' && startsWith(github.ref, 'refs/tags/v0.1.')
    name: Verified CLI release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Require exact verified main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/components/verify-source.mjs
  codexiactl:
    name: Build and attest the verified Linux CLI
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cmd/codexiactl/go.mod
          cache: false
      - name: Build and verify the exact release binary
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIACTL_BUILD_SOURCE: ${{ github.sha }}
          CODEXIACTL_BUILD_VERSION: ${{ github.ref_name }}
          CODEXIACTL_BUILD_APP_CLIENT_ID: ${{ vars.CODEXIACTL_GITHUB_APP_CLIENT_ID }}
        run: bash scripts/ci/execution/verify-codexiactl.sh "$RUNNER_TEMP/codexiactl-release"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/codexiactl-release/codexiactl-linux-amd64
      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: codexiactl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexiactl-release/
          if-no-files-found: error
          retention-days: 7
  release:
    name: Publish verified Release
    needs: [verify-source, codexiactl]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Require the exact CLI build artifact ID
        env:
          CODEXIACTL_ARTIFACT_ID: ${{ needs.codexiactl.outputs.artifact-id }}
        run: |
          if [[ ! "$CODEXIACTL_ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ ]]; then
            echo 'The successful CLI build did not supply an immutable artifact ID.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.codexiactl.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/codexiactl-release
      - name: Recheck the exact verified tag source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/components/verify-source.mjs
      - name: Publish or verify the immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/components/codexiactl-release.mjs reconcile
