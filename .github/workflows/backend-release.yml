name: Codexia Backend Image
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.backend
      - .dockerignore
      - Dockerfile.backend.dockerignore
      - deploy/backend/**
      - deploy/fixtures/sshfs-server/**
      - scripts/verification/artifacts/sshfs-fixture*.mjs
      - packages/**
      - modules/**
      - '!modules/story/src/browser.tsx'
      # Test-only files are not source-bound runtime or host-lifecycle inputs.
      - '!modules/**/test/**'
      - '!modules/**/tests/**'
      - '!modules/**/*.test.*'
      - '!packages/**/test/**'
      - '!packages/**/tests/**'
      - '!packages/**/*.test.*'
      - 'modules/**/src/**/test/**'
      - 'modules/**/src/**/tests/**'
      - 'packages/**/src/**/test/**'
      - 'packages/**/src/**/tests/**'
      # Build-emitted source and test files remain runtime package inputs.
      - 'packages/api/src/**'
      - 'packages/persistence-contracts/src/**'
      - profiles/**
      - scripts/build/packaging/profile-build.mjs
      - scripts/shared/read-regular-file.mjs
      - scripts/build/packaging/profile-package.mjs
      - scripts/verification/dependencies/runtime-package-closure.mjs
      - scripts/verification/dependencies/audit-runtime.mjs
      - scripts/verification/runtime/backend-image.sh
      - scripts/release/backend/update-identity*.mjs
      - scripts/release/components/version*.mjs
      - scripts/release/components/record.mjs
      - scripts/release/backend/registry-tag.mjs
      - deploy/update-compatibility.json
      - scripts/release/components/verify-source.mjs
      - scripts/github/repository.mjs
      - scripts/github/octokit.mjs
      - scripts/github/paginate-actions.mjs
      - scripts/ci/evidence/github-rest-sdk.mjs
      - scripts/release/components/policy.mjs
      - scripts/ci/impact/contract.mjs
      - scripts/ci/evidence/artifact-selection.mjs
      - scripts/ci/evidence/download-artifacts*.mjs
      - scripts/ci/evidence/package.json
      - scripts/verification/artifacts/backend*.mjs
      - scripts/release/backend/resolve-promotion*.mjs
      - scripts/deployment/handoff/verify-promotion.mjs
      - scripts/release/backend/verify-existing.mjs
      - scripts/release/backend/verify-existing.test.mjs
      - scripts/release/backend/image-inspection.mjs
      - scripts/release/backend/image-inspection.test.mjs
      - scripts/release/backend/verify-image-identity.mjs
      - scripts/deployment/admission/validate.mjs
      - scripts/deployment/admission/certificate.mjs
      - scripts/deployment/admission/create-certificates.mjs
      - scripts/deployment/handoff/verify-push.mjs
      - scripts/deployment/admission/validate.test.mjs
      - scripts/deployment/admission/certificate.test.mjs
      - scripts/deployment/admission/contract.test.mjs
      - scripts/deployment/admission/documentation.test.mjs
      - scripts/deployment/recovery/backup.test.mjs
      - scripts/deployment/recovery/recovery.test.mjs
      - scripts/deployment/handoff/backend-contract.test.mjs
      - scripts/deployment/handoff/verify-push.test.mjs
      - .github/workflows/backend-deployment-handoff.yml
      - scripts/release/components/record-model.mjs
      - scripts/release/components/record-model.test.mjs
      - scripts/verification/artifacts/frontend.mjs
      - scripts/ci/certification/reuse-merged-pr.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/backend-release.yml
      - deploy/release-impact-paths.json
      - scripts/release/components/impact.mjs
      - scripts/release/components/impact.test.mjs
      - scripts/release/components/source-gate.mjs
      - scripts/release/components/source-gate.test.mjs
      - scripts/shared/python-env.sh
      - .github/workflows/push-app-lifecycle.yml
      - deploy/ansible/**
      - deploy/backup/**
      - deploy/postgres/**
      - deploy/quadlet/**
      - docs/deployment/PUSH-DEPLOYMENT.sdoc
      - docs/deployment/IAC.sdoc
      - scripts/deployment/lifecycle/app*.mjs
      - scripts/deployment/lifecycle/auth-oidc.mjs
      - scripts/verification/runtime/better-auth-fixture.sh
  workflow_run:
    workflows: [Verify Codexia]
    types: [completed]
    # Only completed main-source Verify runs can authorize publication.
    # PR Verify completions have no release authority and need no run event.
    branches: [main]
permissions:
  contents: read
env:
  CODEXIA_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  CODEXIA_VERIFY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
concurrency:
  group: codexia-backend-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    name: Authorize exact-source backend release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.repository.id == github.repository_id &&
      github.event.workflow_run.repository.owner.id == github.repository_owner_id &&
      github.event.workflow_run.head_repository.id == github.repository_id &&
      github.event.workflow_run.head_repository.owner.id == github.repository_owner_id &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      affected: ${{ steps.gate.outputs.affected }}
      verify-run-id: ${{ steps.gate.outputs.verify-run-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Verify completed source and select changed backend paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/components/source-gate.mjs backend
  promotion:
    name: Resolve verified backend promotion
    needs: source
    if: needs.source.result == 'success' && needs.source.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      promoted: ${{ steps.resolve.outputs.promoted == 'true' && steps.handoff.outcome == 'success' && steps.handoff.outputs.artifact-id != '' }}
      handoff-artifact-id: ${{ steps.handoff.outputs.artifact-id }}
      producer-sha: ${{ steps.resolve.outputs.promoted == 'true' && steps.handoff.outcome == 'success' && steps.resolve.outputs.sourceSha || '' }}
      producer-version: ${{ steps.resolve.outputs.promoted == 'true' && steps.handoff.outcome == 'success' && steps.resolve.outputs.version || '' }}
      producer-event: ${{ steps.resolve.outputs.promoted == 'true' && steps.handoff.outcome == 'success' && 'pull_request' || 'workflow_run' }}
      producer-run-id: ${{ steps.resolve.outputs.workflowRunId }}
      producer-attempt: ${{ steps.resolve.outputs.workflowAttempt }}
      producer-workflow-id: ${{ steps.resolve.outputs.workflowId }}
      producer-pr-number: ${{ steps.resolve.outputs.prNumber }}
      producer-verify-run-id: ${{ steps.resolve.outputs.verifyRunId }}
      producer-proof-run-id: ${{ steps.resolve.outputs.proofRunId }}
      producer-verify-attempt: ${{ steps.resolve.outputs.verifyAttempt }}
      producer-plan-digest: ${{ steps.resolve.outputs.planDigest }}
      producer-tree: ${{ steps.resolve.outputs.sourceTree }}
      producer-base-sha: ${{ steps.resolve.outputs.mergeBaseSha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - uses: docker/setup-buildx-action@v4.4.1
        if: github.event_name == 'workflow_run'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Resolve exact tested backend promotion or select main build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_BACKEND_PROMOTION_DIR: ${{ runner.temp }}/backend-promotion
        run: node scripts/release/backend/resolve-promotion.mjs
      - uses: actions/upload-artifact@v7.0.2
        id: handoff
        if: steps.resolve.outputs.promoted == 'true'
        continue-on-error: true
        with:
          name: codexia-backend-promotion-${{ github.event.workflow_run.head_sha }}-attempt-${{ github.run_attempt }}
          compression-level: 0
          path: ${{ runner.temp }}/backend-promotion/
          if-no-files-found: error
          retention-days: 2
      - name: Fall back to the exact main build when no usable handoff was uploaded
        if: steps.resolve.outputs.promoted == 'true' && (steps.handoff.outcome != 'success' || steps.handoff.outputs.artifact-id == '')
        run: echo 'Promotion handoff unavailable. The exact main-source backend build will run.' >> "$GITHUB_STEP_SUMMARY"
  build-test:
    name: Build and test backend OCI image (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [source, promotion]
    if: >-
      always() && (github.event_name == 'pull_request' ||
      (needs.source.result == 'success' && needs.source.outputs.affected == 'true' &&
      !(needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true')))
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      # The backend build installs the locked dependencies inside Docker.
      # Host identity and smoke probes use Node's standard library only.
      - name: Build API-only image
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version="$(node scripts/release/components/version.mjs backend)"
          echo "CODEXIA_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          # The Docker driver retains its local build cache and writes the
          # result directly to the local image store. Avoid exporting large
          # intermediate layers or a second docker-container builder tarball.
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 \
            --build-arg "CODEXIA_RELEASE_VERSION=$version" \
            --build-arg "CODEXIA_PRODUCER_REVISION=$SOURCE_SHA" \
            --build-arg "PROFILE=$PROFILE" \
            --tag codexia-backend-ci --file Dockerfile.backend .
      - name: Verify API image before publication
        env:
          PROFILE: ${{ matrix.profile }}
        run: bash scripts/verification/runtime/backend-image.sh docker codexia-backend-ci "$(git rev-parse HEAD)" "$PROFILE"
      - name: Verify embedded identity without starting image code
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          PROFILE: ${{ matrix.profile }}
        run: node scripts/release/backend/verify-image-identity.mjs codexia-backend-ci "$SOURCE_SHA" "$CODEXIA_RELEASE_VERSION" "$PROFILE"
      - name: Save the exact tested image for publication
        run: |
          set -o pipefail
          if command -v pigz >/dev/null 2>&1; then
            docker save codexia-backend-ci | pigz -1 -p 2 > "$RUNNER_TEMP/codexia-backend-image.tar.gz"
          else
            docker save codexia-backend-ci | gzip -1 > "$RUNNER_TEMP/codexia-backend-image.tar.gz"
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: codexia-backend-image-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}-${{ matrix.profile }}-attempt-${{ github.run_attempt }}
          compression-level: 0
          path: ${{ runner.temp }}/codexia-backend-image.tar.gz
          if-no-files-found: error
          retention-days: 2
  publish:
    name: Publish immutable GHCR image
    needs: [source, build-test, promotion]
    outputs:
      certified-image: ${{ steps.push-image.outputs.image }}
      certified-full-image: ${{ steps.push-image.outputs.full-image }}
      producer-sha: ${{ steps.push-image.outputs.producer-sha }}
      producer-version: ${{ steps.push-image.outputs.producer-version }}
      producer-event: ${{ steps.push-image.outputs.producer-event }}
    if: >-
      always() && github.event_name == 'workflow_run' &&
      needs.source.result == 'success' && needs.source.outputs.affected == 'true' &&
      ((needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true' && needs.build-test.result == 'skipped') ||
      ((needs.promotion.result != 'success' || needs.promotion.outputs.promoted != 'true') && needs.build-test.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Require complete exact-source main verification
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/components/source-gate.mjs backend
      - name: Verify exact tested Core and Full image artifacts
        if: ${{ steps.freshness.outputs.affected == 'true' && (needs.promotion.result != 'success' || needs.promotion.outputs.promoted != 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_BACKEND_ARTIFACT_DIR: ${{ runner.temp }}/backend-images
          CODEXIA_BACKEND_ARTIFACT_MANIFEST: ${{ runner.temp }}/backend-images/codexia-backend-build.json
        run: node scripts/verification/artifacts/backend.mjs
      - uses: actions/download-artifact@v8.0.2
        if: ${{ steps.freshness.outputs.affected == 'true' && needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true' }}
        with:
          artifact-ids: ${{ needs.promotion.outputs.handoff-artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/backend-promotion
      - name: Recheck promoted backend producer provenance and identity
        if: ${{ steps.freshness.outputs.affected == 'true' && needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_BACKEND_PROMOTION_DIR: ${{ runner.temp }}/backend-promotion
        run: |
          if ! node scripts/deployment/handoff/verify-promotion.mjs; then
            echo 'Post-selection promotion recheck failed. The build matrix was skipped, so this run will not fall back to rebuilding.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: docker/login-action@v4.8.0
        if: steps.freshness.outputs.affected == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-addressed image
        id: push-image
        if: steps.freshness.outputs.affected == 'true'
        env:
          MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
          PROMOTED: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true' }}
          PRODUCER_SHA: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true' && needs.promotion.outputs.producer-sha || github.event.workflow_run.head_sha }}
          PRODUCER_VERSION: ${{ needs.promotion.outputs.producer-version }}
          PRODUCER_EVENT: ${{ needs.promotion.outputs.producer-event }}
          CODEXIA_BACKEND_PROMOTION_DIR: ${{ runner.temp }}/backend-promotion
          CODEXIA_BACKEND_ARTIFACT_MANIFEST: ${{ runner.temp }}/backend-images/codexia-backend-build.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          IMAGE="ghcr.io/${owner,,}/codexia-backend"
          if [[ "$PROMOTED" != true ]]; then
            PRODUCER_VERSION="$(node scripts/release/components/version.mjs backend)"
            PRODUCER_EVENT=workflow_run
            PRODUCER_SHA="$MAIN_SHA"
          fi
          {
            echo "producer-sha=$PRODUCER_SHA"
            echo "producer-version=$PRODUCER_VERSION"
            echo "producer-event=$PRODUCER_EVENT"
          } >> "$GITHUB_OUTPUT"
          export CODEXIA_RELEASE_VERSION="$PRODUCER_VERSION"
          for profile in core full; do
            if [[ "$PROMOTED" == true ]]; then
              cat "$RUNNER_TEMP/backend-promotion/$profile-codexia-backend-image.tar.gz" | gzip -dc | docker load
            else
              gzip -dc "$RUNNER_TEMP/backend-images/$profile/codexia-backend-image.tar.gz" | docker load
            fi
            tag="sha-$MAIN_SHA"
            if [[ "$profile" == full ]]; then tag="$tag-full"; fi
            tested_id="$(docker image inspect --format '{{.Id}}' codexia-backend-ci)"
            digest="$(node scripts/release/backend/registry-tag.mjs "$tag")"
            if [[ "$digest" == absent ]]; then
              docker tag codexia-backend-ci "$IMAGE:$tag"
              docker push "$IMAGE:$tag"
              digest="$(node scripts/release/backend/registry-tag.mjs "$tag")"
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              docker pull "$IMAGE@$digest"
              test "$(docker image inspect --format '{{.Id}}' "$IMAGE@$digest")" = "$tested_id"
            else
              # Retry or partial publication: never replace an existing SHA tag.
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              docker pull "$IMAGE@$digest"
              if [[ "$(docker image inspect --format '{{.Id}}' "$IMAGE@$digest")" != "$tested_id" ]]; then
                node scripts/release/backend/verify-existing.mjs "$IMAGE@$digest" "$MAIN_SHA" "$PRODUCER_SHA" "$PRODUCER_VERSION" "$profile" "$PRODUCER_EVENT"
              fi
            fi
            if [[ "$profile" == core ]]; then
              echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
            else
              echo "full-image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
            fi
            docker buildx imagetools inspect "$IMAGE@$digest"
            echo "Published $IMAGE:$tag ($profile, $digest), producer $PRODUCER_SHA, main authority $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Record independent backend release
        if: steps.freshness.outputs.affected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_CERTIFIED_IMAGE: ${{ steps.push-image.outputs.image }}
          CODEXIA_CERTIFIED_FULL_IMAGE: ${{ steps.push-image.outputs.full-image }}
          CODEXIA_BACKEND_PRODUCER_EVENT: ${{ steps.push-image.outputs.producer-event }}
          CODEXIA_BACKEND_PRODUCER_SHA: ${{ steps.push-image.outputs.producer-sha }}
          CODEXIA_BACKEND_PRODUCER_VERSION: ${{ steps.push-image.outputs.producer-version }}
          CODEXIA_BACKEND_PROMOTION_DIR: ${{ runner.temp }}/backend-promotion
          CODEXIA_BACKEND_ARTIFACT_MANIFEST: ${{ runner.temp }}/backend-images/codexia-backend-build.json
        run: node scripts/release/components/record.mjs backend

      - name: Create certified Core and Full push handoff
        if: steps.freshness.outputs.affected == 'true'
        env:
          CODEXIA_CERTIFIED_IMAGE: ${{ steps.push-image.outputs.image }}
          CODEXIA_CERTIFIED_FULL_IMAGE: ${{ steps.push-image.outputs.full-image }}
          CODEXIA_BACKEND_PRODUCER_EVENT: ${{ steps.push-image.outputs.producer-event }}
          CODEXIA_BACKEND_PRODUCER_SHA: ${{ steps.push-image.outputs.producer-sha }}
          CODEXIA_BACKEND_PRODUCER_VERSION: ${{ steps.push-image.outputs.producer-version }}
          CODEXIA_BACKEND_PROMOTION_DIR: ${{ runner.temp }}/backend-promotion
          CODEXIA_BACKEND_ARTIFACT_MANIFEST: ${{ runner.temp }}/backend-images/codexia-backend-build.json
          CODEXIA_DEPLOYMENT_CERTIFICATE_DIR: ${{ runner.temp }}/backend-deployment-certificates
        run: node scripts/deployment/admission/create-certificates.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: steps.freshness.outputs.affected == 'true'
        with:
          name: codexia-backend-deployment-certificate-${{ github.event.workflow_run.head_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          compression-level: 9
          path: ${{ runner.temp }}/backend-deployment-certificates
          if-no-files-found: error
          retention-days: 14
