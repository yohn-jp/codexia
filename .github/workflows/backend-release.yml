name: Codexia Backend Image
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.backend
      - .dockerignore
      - Dockerfile.backend.dockerignore
      - deploy/backend/**
      - packages/**
      - modules/**
      - '!modules/story/src/browser.tsx'
      - profiles/**
      - scripts/profile-build.mjs
      - scripts/profile-package.mjs
      - scripts/runtime-package-closure.mjs
      - scripts/verify-backend-image.sh
      - scripts/backend-update-identity*.mjs
      - scripts/component-release-version*.mjs
      - scripts/record-component-release.mjs
      - scripts/backend-registry-tag.mjs
      - deploy/update-compatibility.json
      - scripts/verify-release-source.mjs
      - scripts/release-policy.mjs
      - scripts/ci-contract.mjs
      - scripts/ci-artifact-selection.mjs
      - scripts/download-ci-artifacts*.mjs
      - scripts/verify-backend-artifacts*.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/backend-release.yml
  workflow_run:
    workflows: [Verify Codexia]
    types: [completed]
permissions:
  contents: read
env:
  CODEXIA_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
  CODEXIA_VERIFY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
concurrency:
  group: codexia-backend-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    name: Authorize exact-source backend release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      affected: ${{ steps.gate.outputs.affected }}
      verify-run-id: ${{ steps.gate.outputs.verify-run-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Verify completed source and select changed backend paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-source-gate.mjs backend
  build-test:
    name: Build and test backend OCI image (${{ matrix.profile }})
    needs: source
    if: always() && (github.event_name == 'pull_request' || (needs.source.result == 'success' && needs.source.outputs.affected == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      # The backend build installs the locked dependencies inside Docker.
      # Host identity and smoke probes use Node's standard library only.
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build API-only image
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          PROFILE: ${{ matrix.profile }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version="$(node scripts/component-release-version.mjs backend)"
          echo "CODEXIA_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --load --build-arg "CODEXIA_RELEASE_VERSION=$version" --build-arg "CODEXIA_PRODUCER_REVISION=$SOURCE_SHA" --build-arg "PROFILE=$PROFILE" --tag codexia-backend-ci --file Dockerfile.backend .
      - name: Verify API image before publication
        env:
          PROFILE: ${{ matrix.profile }}
        run: bash scripts/verify-backend-image.sh docker codexia-backend-ci "$(git rev-parse HEAD)" "$PROFILE"
      - name: Save the exact tested image for publication
        if: github.event_name == 'workflow_run'
        run: docker save codexia-backend-ci | gzip > "$RUNNER_TEMP/codexia-backend-image.tar.gz"
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_run'
        with:
          name: codexia-backend-image-${{ github.event.workflow_run.head_sha }}-${{ matrix.profile }}-attempt-${{ github.run_attempt }}
          compression-level: 0
          path: ${{ runner.temp }}/codexia-backend-image.tar.gz
          if-no-files-found: error
          retention-days: 2
  publish:
    name: Publish immutable GHCR image
    needs: [source, build-test]
    outputs:
      certified-image: ${{ steps.push-image.outputs.image }}
      certified-full-image: ${{ steps.push-image.outputs.full-image }}
    if: needs.source.result == 'success' && needs.source.outputs.affected == 'true' && needs.build-test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Require complete exact-source main verification
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_COMMIT_RELEASE: '1'
        run: node scripts/verify-release-source.mjs
      - name: Verify exact tested Core and Full image artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_BACKEND_ARTIFACT_DIR: ${{ runner.temp }}/backend-images
        run: node scripts/verify-backend-artifacts.mjs
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-addressed image
        id: push-image
        env:
          IMAGE: ghcr.io/yohn-jp/codexia-backend
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CODEXIA_RELEASE_VERSION="$(node scripts/component-release-version.mjs backend)"
          for profile in core full; do
            gzip -dc "$RUNNER_TEMP/backend-images/$profile/codexia-backend-image.tar.gz" | docker load
            tag="sha-$SOURCE_SHA"
            if [[ "$profile" == full ]]; then tag="$tag-full"; fi
            tested_id="$(docker image inspect --format '{{.Id}}' codexia-backend-ci)"
            digest="$(node scripts/backend-registry-tag.mjs "$tag")"
            if [[ "$digest" == absent ]]; then
              docker tag codexia-backend-ci "$IMAGE:$tag"
              docker push "$IMAGE:$tag"
              digest="$(node scripts/backend-registry-tag.mjs "$tag")"
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              docker pull "$IMAGE@$digest"
              test "$(docker image inspect --format '{{.Id}}' "$IMAGE@$digest")" = "$tested_id"
            else
              # Retry or partial publication: never replace an existing SHA tag.
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              docker pull "$IMAGE@$digest"
              if [[ "$(docker image inspect --format '{{.Id}}' "$IMAGE@$digest")" != "$tested_id" ]]; then
                bash scripts/verify-backend-image.sh docker "$IMAGE@$digest" "$SOURCE_SHA" "$profile"
              fi
            fi
            if [[ "$profile" == core ]]; then
              echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
            else
              echo "full-image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
            fi
            docker buildx imagetools inspect "$IMAGE@$digest"
            echo "Published $IMAGE:$tag ($profile, $digest) from $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Record independent backend release
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_CERTIFIED_IMAGE: ${{ steps.push-image.outputs.image }}
          CODEXIA_CERTIFIED_FULL_IMAGE: ${{ steps.push-image.outputs.full-image }}
        run: node scripts/record-component-release.mjs backend

  stable-channel:
    name: Advertise certified stable backend
    needs: publish
    if: github.event_name == 'workflow_run' && github.ref == 'refs/heads/main' && vars.CODEXIA_STABLE_CHANNEL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: codexia-stable-channel
    concurrency:
      group: codexia-stable-channel-writer
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign and atomically publish certified release
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_CHANNEL_SIGNING_KEY: ${{ secrets.CODEXIA_CHANNEL_SIGNING_KEY }}
          CODEXIA_CHANNEL_MODE: publish
          CODEXIA_CERTIFIED_IMAGE: ${{ needs.publish.outputs.certified-image }}
          CODEXIA_CERTIFIED_FULL_IMAGE: ${{ needs.publish.outputs.certified-full-image }}
        run: node scripts/publish-stable-channel.mjs
