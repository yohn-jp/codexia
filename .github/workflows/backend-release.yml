name: Codexia Backend Image
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.backend
      - deploy/backend/**
      - packages/**
      - modules/**
      - profiles/**
      - scripts/profile-build.mjs
      - scripts/profile-package.mjs
      - scripts/runtime-package-closure.mjs
      - scripts/verify-backend-image.sh
      - scripts/backend-update-identity*.mjs
      - deploy/update-compatibility.json
      - scripts/verify-release-source.mjs
      - scripts/release-policy.mjs
      - scripts/ci-contract.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/backend-release.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.backend
      - deploy/backend/**
      - packages/**
      - modules/**
      - profiles/**
      - scripts/profile-build.mjs
      - scripts/profile-package.mjs
      - scripts/runtime-package-closure.mjs
      - scripts/verify-backend-image.sh
      - scripts/backend-update-identity*.mjs
      - deploy/update-compatibility.json
      - scripts/verify-release-source.mjs
      - scripts/release-policy.mjs
      - scripts/ci-contract.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/backend-release.yml
permissions:
  contents: read
concurrency:
  group: codexia-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-test:
    name: Build and test backend OCI image (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Prepare locked pnpm toolchain
        run: |
          corepack enable
          corepack pnpm@12.10.1 --version
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build API-only image
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROFILE: ${{ matrix.profile }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          docker buildx build --platform linux/amd64 --load --build-arg "CODEXIA_PRODUCER_REVISION=$SOURCE_SHA" --build-arg "PROFILE=$PROFILE" --tag codexia-backend-ci --file Dockerfile.backend .
      - name: Verify API image before publication
        env:
          PROFILE: ${{ matrix.profile }}
        run: bash scripts/verify-backend-image.sh docker codexia-backend-ci "$(git rev-parse HEAD)" "$PROFILE"
      - name: Save the exact tested image for publication
        if: github.event_name == 'push'
        run: docker save codexia-backend-ci | gzip > "$RUNNER_TEMP/codexia-backend-image.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: codexia-backend-image-${{ github.sha }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/codexia-backend-image.tar.gz
          if-no-files-found: error
          retention-days: 2
  publish:
    name: Publish immutable GHCR image
    needs: build-test
    outputs:
      certified-image: ${{ steps.push-image.outputs.image }}
      certified-full-image: ${{ steps.push-image.outputs.full-image }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Require complete exact-source main verification
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_COMMIT_RELEASE: '1'
        run: node scripts/verify-release-source.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: codexia-backend-image-${{ github.sha }}-*
          path: ${{ runner.temp }}/backend-images
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-addressed image
        id: push-image
        env:
          IMAGE: ghcr.io/yohn-jp/codexia-backend
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for profile in core full; do
            gzip -dc "$RUNNER_TEMP/backend-images/codexia-backend-image-$SOURCE_SHA-$profile/codexia-backend-image.tar.gz" | docker load
            tag="sha-$SOURCE_SHA"
            if [[ "$profile" == full ]]; then tag="$tag-full"; fi
            tested_id="$(docker image inspect --format '{{.Id}}' codexia-backend-ci)"
            docker tag codexia-backend-ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag" | tee "$RUNNER_TEMP/push.log"
            digest="$(sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}) size: [0-9]+.*$/\1/p' "$RUNNER_TEMP/push.log" | tail -1)"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker pull "$IMAGE@$digest"
            test "$(docker image inspect --format '{{.Id}}' "$IMAGE@$digest")" = "$tested_id"
            if [[ "$profile" == core ]]; then
              echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
            else
              echo "full-image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
            fi
            docker buildx imagetools inspect "$IMAGE@$digest"
            echo "Published $IMAGE:$tag ($profile, $digest) from $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          done

  stable-channel:
    name: Advertise certified stable backend
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CODEXIA_STABLE_CHANNEL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: codexia-stable-channel
    concurrency:
      group: codexia-stable-channel-writer
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign and atomically publish certified release
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_CHANNEL_SIGNING_KEY: ${{ secrets.CODEXIA_CHANNEL_SIGNING_KEY }}
          CODEXIA_CHANNEL_MODE: publish
          CODEXIA_CERTIFIED_IMAGE: ${{ needs.publish.outputs.certified-image }}
          CODEXIA_CERTIFIED_FULL_IMAGE: ${{ needs.publish.outputs.certified-full-image }}
        run: node scripts/publish-stable-channel.mjs
