name: Codexia Backend Image
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.backend
      - .dockerignore
      - Dockerfile.backend.dockerignore
      - deploy/backend/**
      - packages/**
      - modules/**
      - '!modules/story/src/browser.tsx'
      - profiles/**
      - scripts/profile-build.mjs
      - scripts/profile-package.mjs
      - scripts/runtime-package-closure.mjs
      - scripts/verify-backend-image.sh
      - scripts/backend-update-identity*.mjs
      - scripts/component-release-version*.mjs
      - scripts/record-component-release.mjs
      - scripts/backend-registry-tag.mjs
      - deploy/update-compatibility.json
      - scripts/verify-release-source.mjs
      - scripts/release-policy.mjs
      - scripts/ci-contract.mjs
      - scripts/ci-artifact-selection.mjs
      - scripts/download-ci-artifacts*.mjs
      - scripts/verify-backend-artifacts*.mjs
      - scripts/resolve-backend-promotion*.mjs
      - scripts/verify-backend-promotion-handoff.mjs
      - scripts/publish-stable-channel.mjs
      - scripts/phase-f-test-channel.mjs
      - scripts/phase-f-disposable.test.mjs
      - scripts/component-release-record.test.mjs
      - scripts/publish-stable-channel.test.mjs
      - scripts/verify-frontend-artifact.mjs
      - scripts/reuse-pr-verification.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/backend-release.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.backend
      - .dockerignore
      - Dockerfile.backend.dockerignore
      - deploy/backend/**
      - packages/**
      - modules/**
      - '!modules/story/src/browser.tsx'
      - profiles/**
      - scripts/profile-build.mjs
      - scripts/profile-package.mjs
      - scripts/runtime-package-closure.mjs
      - scripts/verify-backend-image.sh
      - scripts/backend-update-identity*.mjs
      - scripts/component-release-version*.mjs
      - scripts/record-component-release.mjs
      - scripts/backend-registry-tag.mjs
      - deploy/update-compatibility.json
      - scripts/verify-release-source.mjs
      - scripts/release-policy.mjs
      - scripts/ci-contract.mjs
      - scripts/ci-artifact-selection.mjs
      - scripts/download-ci-artifacts*.mjs
      - scripts/verify-backend-artifacts*.mjs
      - scripts/resolve-backend-promotion*.mjs
      - scripts/verify-backend-promotion-handoff.mjs
      - scripts/publish-stable-channel.mjs
      - scripts/phase-f-test-channel.mjs
      - scripts/phase-f-disposable.test.mjs
      - scripts/component-release-record.test.mjs
      - scripts/publish-stable-channel.test.mjs
      - scripts/verify-frontend-artifact.mjs
      - scripts/reuse-pr-verification.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/backend-release.yml
permissions:
  contents: read
concurrency:
  group: codexia-backend-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  promotion:
    name: Resolve verified backend promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      promoted: ${{ steps.resolve.outputs.promoted == 'true' && steps.handoff.outcome == 'success' }}
      producer-sha: ${{ steps.resolve.outputs.promoted == 'true' && steps.handoff.outcome == 'success' && steps.resolve.outputs.sourceSha || '' }}
      producer-version: ${{ steps.resolve.outputs.promoted == 'true' && steps.handoff.outcome == 'success' && steps.resolve.outputs.version || '' }}
      producer-event: ${{ steps.resolve.outputs.promoted == 'true' && steps.handoff.outcome == 'success' && 'pull_request' || 'push' }}
      producer-run-id: ${{ steps.resolve.outputs.workflowRunId }}
      producer-attempt: ${{ steps.resolve.outputs.workflowAttempt }}
      producer-workflow-id: ${{ steps.resolve.outputs.workflowId }}
      producer-pr-number: ${{ steps.resolve.outputs.prNumber }}
      producer-verify-run-id: ${{ steps.resolve.outputs.verifyRunId }}
      producer-proof-run-id: ${{ steps.resolve.outputs.proofRunId }}
      producer-verify-attempt: ${{ steps.resolve.outputs.verifyAttempt }}
      producer-plan-digest: ${{ steps.resolve.outputs.planDigest }}
      producer-tree: ${{ steps.resolve.outputs.sourceTree }}
      producer-base-sha: ${{ steps.resolve.outputs.mergeBaseSha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - uses: docker/setup-buildx-action@v4.4.1
        if: github.event_name == 'push'
      - name: Resolve exact tested backend promotion or select main build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_REPOSITORY_ID: ${{ github.repository_id }}
          CODEXIA_BACKEND_PROMOTION_DIR: ${{ runner.temp }}/backend-promotion
        run: node scripts/resolve-backend-promotion.mjs
      - uses: actions/upload-artifact@v7.0.2
        id: handoff
        if: steps.resolve.outputs.promoted == 'true'
        continue-on-error: true
        with:
          name: codexia-backend-promotion-${{ github.sha }}-attempt-${{ github.run_attempt }}
          compression-level: 0
          path: ${{ runner.temp }}/backend-promotion/
          if-no-files-found: error
          retention-days: 2
      - name: Fall back to the exact main build if handoff upload fails
        if: steps.resolve.outputs.promoted == 'true' && steps.handoff.outcome != 'success'
        run: echo 'Promotion handoff upload failed; the exact main-source backend build will run.' >> "$GITHUB_STEP_SUMMARY"
  build-test:
    name: Build and test backend OCI image (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: promotion
    if: ${{ always() && (github.event_name == 'pull_request' || !(needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      # The backend build installs the locked dependencies inside Docker.
      # Host identity and smoke probes use Node's standard library only.
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build API-only image
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROFILE: ${{ matrix.profile }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version="$(node scripts/component-release-version.mjs backend)"
          echo "CODEXIA_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --load --build-arg "CODEXIA_RELEASE_VERSION=$version" --build-arg "CODEXIA_PRODUCER_REVISION=$SOURCE_SHA" --build-arg "PROFILE=$PROFILE" --tag codexia-backend-ci --file Dockerfile.backend .
      - name: Verify API image before publication
        env:
          PROFILE: ${{ matrix.profile }}
        run: bash scripts/verify-backend-image.sh docker codexia-backend-ci "$(git rev-parse HEAD)" "$PROFILE"
      - name: Save the exact tested image for publication
        run: docker save codexia-backend-ci | gzip > "$RUNNER_TEMP/codexia-backend-image.tar.gz"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: codexia-backend-image-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.profile }}-attempt-${{ github.run_attempt }}
          compression-level: 0
          path: ${{ runner.temp }}/codexia-backend-image.tar.gz
          if-no-files-found: error
          retention-days: 2
  publish:
    name: Publish immutable GHCR image
    needs: [build-test, promotion]
    outputs:
      certified-image: ${{ steps.push-image.outputs.image }}
      certified-full-image: ${{ steps.push-image.outputs.full-image }}
      producer-sha: ${{ steps.push-image.outputs.producer-sha }}
      producer-version: ${{ steps.push-image.outputs.producer-version }}
      producer-event: ${{ steps.push-image.outputs.producer-event }}
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && ((needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true' && needs.build-test.result == 'skipped') || ((needs.promotion.result != 'success' || needs.promotion.outputs.promoted != 'true') && needs.build-test.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Require complete exact-source main verification
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_COMMIT_RELEASE: '1'
        run: node scripts/verify-release-source.mjs
      - name: Verify exact tested Core and Full image artifacts
        if: ${{ needs.promotion.result != 'success' || needs.promotion.outputs.promoted != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_BACKEND_ARTIFACT_DIR: ${{ runner.temp }}/backend-images
        run: node scripts/verify-backend-artifacts.mjs
      - uses: actions/download-artifact@v7.0.0
        if: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true' }}
        with:
          name: codexia-backend-promotion-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-promotion
      - name: Recheck promoted backend producer provenance and identity
        if: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_REPOSITORY_ID: ${{ github.repository_id }}
          CODEXIA_BACKEND_PROMOTION_DIR: ${{ runner.temp }}/backend-promotion
        run: node scripts/verify-backend-promotion-handoff.mjs
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-addressed image
        id: push-image
        env:
          IMAGE: ghcr.io/yohn-jp/codexia-backend
          MAIN_SHA: ${{ github.sha }}
          PROMOTED: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true' }}
          PRODUCER_SHA: ${{ needs.promotion.result == 'success' && needs.promotion.outputs.promoted == 'true' && needs.promotion.outputs.producer-sha || github.sha }}
          PRODUCER_VERSION: ${{ needs.promotion.outputs.producer-version }}
          PRODUCER_EVENT: ${{ needs.promotion.outputs.producer-event }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$PROMOTED" != true ]]; then
            PRODUCER_VERSION="$(node scripts/component-release-version.mjs backend)"
            PRODUCER_EVENT=push
            PRODUCER_SHA="$MAIN_SHA"
          fi
          echo "producer-sha=$PRODUCER_SHA" >> "$GITHUB_OUTPUT"
          echo "producer-version=$PRODUCER_VERSION" >> "$GITHUB_OUTPUT"
          echo "producer-event=$PRODUCER_EVENT" >> "$GITHUB_OUTPUT"
          export CODEXIA_RELEASE_VERSION="$PRODUCER_VERSION"
          for profile in core full; do
            if [[ "$PROMOTED" == true ]]; then
              cat "$RUNNER_TEMP/backend-promotion/$profile-codexia-backend-image.tar.gz" | gzip -dc | docker load
            else
              gzip -dc "$RUNNER_TEMP/backend-images/$profile/codexia-backend-image.tar.gz" | docker load
            fi
            tag="sha-$MAIN_SHA"
            if [[ "$profile" == full ]]; then tag="$tag-full"; fi
            tested_id="$(docker image inspect --format '{{.Id}}' codexia-backend-ci)"
            digest="$(node scripts/backend-registry-tag.mjs "$tag")"
            if [[ "$digest" == absent ]]; then
              docker tag codexia-backend-ci "$IMAGE:$tag"
              docker push "$IMAGE:$tag"
              digest="$(node scripts/backend-registry-tag.mjs "$tag")"
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              docker pull "$IMAGE@$digest"
              test "$(docker image inspect --format '{{.Id}}' "$IMAGE@$digest")" = "$tested_id"
            else
              # Retry or partial publication: never replace an existing SHA tag.
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              docker pull "$IMAGE@$digest"
              test "$(docker image inspect --format '{{.Id}}' "$IMAGE@$digest")" = "$tested_id"
            fi
            if [[ "$profile" == core ]]; then
              echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
            else
              echo "full-image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
            fi
            docker buildx imagetools inspect "$IMAGE@$digest"
            echo "Published $IMAGE:$tag ($profile, $digest), producer $PRODUCER_SHA, main authority $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Record independent backend release
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_CERTIFIED_IMAGE: ${{ steps.push-image.outputs.image }}
          CODEXIA_CERTIFIED_FULL_IMAGE: ${{ steps.push-image.outputs.full-image }}
          CODEXIA_BACKEND_PRODUCER_EVENT: ${{ steps.push-image.outputs.producer-event }}
          CODEXIA_BACKEND_PRODUCER_SHA: ${{ steps.push-image.outputs.producer-sha }}
          CODEXIA_BACKEND_PRODUCER_VERSION: ${{ steps.push-image.outputs.producer-version }}
          CODEXIA_BACKEND_PROMOTION_DIR: ${{ runner.temp }}/backend-promotion
        run: node scripts/record-component-release.mjs backend

  stable-channel:
    name: Advertise certified stable backend
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CODEXIA_STABLE_CHANNEL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: codexia-stable-channel
    concurrency:
      group: codexia-stable-channel-writer
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign and atomically publish certified release
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_CHANNEL_SIGNING_KEY: ${{ secrets.CODEXIA_CHANNEL_SIGNING_KEY }}
          CODEXIA_CHANNEL_MODE: publish
          CODEXIA_CERTIFIED_IMAGE: ${{ needs.publish.outputs.certified-image }}
          CODEXIA_CERTIFIED_FULL_IMAGE: ${{ needs.publish.outputs.certified-full-image }}
          CODEXIA_BACKEND_PRODUCER_SHA: ${{ needs.publish.outputs.producer-sha }}
          CODEXIA_BACKEND_PRODUCER_VERSION: ${{ needs.publish.outputs.producer-version }}
        run: node scripts/publish-stable-channel.mjs
