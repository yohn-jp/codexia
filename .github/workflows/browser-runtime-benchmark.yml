name: Browser runner A/B/C benchmark
on:
  pull_request:
    paths:
      - .github/workflows/browser-runtime-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-runtime-benchmark-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# All variants use the same immutable PR head, Postgres 17, Playwright 1.65.1,
# Node/pnpm versions and real ui-v1 Chromium/WebKit acceptance specifications.
jobs:
  docker:
    name: A Docker / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: codexia_test
          POSTGRES_USER: codexia
          POSTGRES_PASSWORD: codexia
        options: >-
          --health-cmd "pg_isready -U codexia -d codexia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      CODEXIA_PROFILE: core
      CODEXIA_E2E_DATABASE_URL: postgres://codexia:codexia@postgres:5432/codexia_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          pnpm install --frozen-lockfile
      - name: Build matching Core application
        run: pnpm build
      - name: Run real browser acceptance
        run: node scripts/run-browser-shard.mjs --profile core --suite "${{ matrix.browser == 'webkit' && 'webkit' || 'ui-v1' }}" --prebuilt --ci-fixture

  host:
    name: ${{ matrix.mode == 'all' && 'B Host all' || 'C Host selective' }} / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: all
            browser: chromium
          - mode: all
            browser: webkit
          - mode: selective
            browser: chromium
          - mode: selective
            browser: webkit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: codexia_test
          POSTGRES_USER: codexia
          POSTGRES_PASSWORD: codexia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexia -d codexia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      CODEXIA_PROFILE: core
      CODEXIA_E2E_DATABASE_URL: postgres://codexia:codexia@postgres:5432/codexia_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Match isolated Postgres hostname contract
        run: echo '127.0.0.1 postgres' | sudo tee -a /etc/hosts
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          pnpm install --frozen-lockfile
      - name: Install Playwright browsers and OS dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.mode }}" == all ]]; then
            pnpm exec playwright install --with-deps
          else
            pnpm exec playwright install --with-deps "${{ matrix.browser }}"
          fi
      - name: Build matching Core application
        run: pnpm build
      - name: Run real browser acceptance
        run: node scripts/run-browser-shard.mjs --profile core --suite "${{ matrix.browser == 'webkit' && 'webkit' || 'ui-v1' }}" --prebuilt --ci-fixture
