name: Security scans (Trivy and Gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    name: Trivy (dependencies and IaC)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Select exact-source security scope
        id: scope
        env:
          CODEXIA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CODEXIA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/ci/impact/security-admission.mjs
      - name: Scan repository
        if: steps.scope.outputs.trivy == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.76.2
          scanners: vuln,misconfig
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          hide-progress: true
      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && steps.scope.outputs.trivy == 'true' && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-filesystem

  gitleaks:
    name: Gitleaks (Git history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # PRs scan every commit reachable from the head but absent from the
      # exact base. Main retains full-history scanning. Never guess a range.
      - name: Verify exact Git history scan scope
        id: history
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          # Emit merge-result patches without restricting ancestry traversal.
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
            printf 'log_opts=--diff-merges=first-parent HEAD\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid PR base identity' >&2; exit 1; }
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid PR head identity' >&2; exit 1; }
          git cat-file -e "${PR_BASE_SHA}^{commit}"
          git cat-file -e "${PR_HEAD_SHA}^{commit}"
          git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA" >/dev/null
          [[ "$(git rev-list --count "${PR_BASE_SHA}..${PR_HEAD_SHA}")" -gt 0 ]] || {
            echo 'PR contains no verifiable commits to scan' >&2
            exit 1
          }
          printf 'log_opts=--diff-merges=first-parent %s..%s\n' "$PR_BASE_SHA" "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Scan Git history
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP,dst=/reports" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config /repo/.gitleaks.toml --log-opts "${{ steps.history.outputs.log_opts }}" --redact=100 --report-format sarif \
              --report-path /reports/gitleaks.sarif --exit-code 0 /repo
      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: ${{ runner.temp }}/gitleaks.sarif
          category: gitleaks-history
      - name: Summarize redacted historical findings
        if: always()
        shell: bash
        env:
          GITLEAKS_SARIF: ${{ runner.temp }}/gitleaks.sarif
        run: |
          if [[ -f "$GITLEAKS_SARIF" ]]; then
            jq -r '.runs[].results[]? | [.ruleId, (.locations[0].physicalLocation.artifactLocation.uri // "unknown"), (.locations[0].physicalLocation.region.startLine // 0)] | @tsv' "$GITLEAKS_SARIF"
          fi
