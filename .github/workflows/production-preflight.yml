name: Production Access Preflight
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Access-only probe or lifecycle observation and planning
        type: choice
        options: [access, lifecycle]
        default: access
      management:
        description: Runtime SSH for installed hosts; administrator SSH only for an unconstructed host
        type: choice
        options: [runtime, bootstrap]
        default: runtime
      intent:
        description: Lifecycle operation to plan
        type: choice
        options: [install, adopt, update, maintenance, restore]
        default: install
      window_id:
        description: Existing approved window ID (required for restoration with a window)
        type: string
      window_start:
        description: Approved window start in UTC ISO 8601 (when required)
        type: string
      window_end:
        description: Approved window end in UTC ISO 8601 (when required)
        type: string
      prior_publisher:
        description: Installed backend publisher run when planning an existing deployment
        type: string
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ inputs.mode == 'lifecycle' && 'codexia-production' || 'codexia-access-preflight' }}
  cancel-in-progress: false
  queue: max
jobs:
  probe:
    name: Verify production Access and identity paths
    if: github.event.repository.name == 'codexia' && github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'access'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: codexia-production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Load reviewed production OAuth settings
        run: node scripts/deployment/bootstrap/public-env.mjs
      - name: Verify the selected production Cloudflare ingress
        env:
          CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN }}
        run: node scripts/release/frontend/initial-publication.mjs observe-ingress
      - name: Probe production identity endpoints and Access boundary
        env:
          CODEXIA_ACCESS_CLIENT_ID: ${{ secrets.CODEXIA_ACCESS_CLIENT_ID }}
          CODEXIA_ACCESS_CLIENT_SECRET: ${{ secrets.CODEXIA_ACCESS_CLIENT_SECRET }}
        run: node scripts/release/frontend/verify-compatibility.mjs preflight

  lifecycle-candidate:
    name: Verify certified candidate pair before observing the production host
    if: github.event.repository.name == 'codexia' && github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: codexia-production
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Load reviewed production OAuth settings
        run: node scripts/deployment/bootstrap/public-env.mjs
      - name: Install frozen evidence-reader dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read certified source and candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_PREFLIGHT_INTENT: ${{ inputs.intent }}
          CODEXIA_WINDOW_ID: ${{ inputs.window_id }}
          CODEXIA_WINDOW_START: ${{ inputs.window_start }}
          CODEXIA_WINDOW_END: ${{ inputs.window_end }}
          CODEXIA_PRIOR_PUBLISHER: ${{ inputs.prior_publisher }}
        run: node scripts/deployment/preflight/run.mjs candidate
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lifecycle-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexia-lifecycle-candidate.json
          if-no-files-found: error
          retention-days: 14

  lifecycle-host:
    name: Observe the pinned production host without mutation
    needs: lifecycle-candidate
    if: github.event.repository.name == 'codexia' && github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.management == 'bootstrap' && 'codexia-bootstrap' || 'codexia-production' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Prepare runtime pinned SSH
        if: inputs.management == 'runtime'
        id: runtime
        env:
          CODEXIA_DEPLOY_HOST: ${{ vars.CODEXIA_DEPLOY_HOST }}
          CODEXIA_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_DEPLOY_SSH_PRIVATE_KEY }}
          CODEXIA_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash deploy/ansible/prepare-deploy-ssh.sh
      - name: Prepare independent administrator pinned SSH without the bootstrap bundle
        if: inputs.management == 'bootstrap'
        id: bootstrap
        env:
          CODEXIA_DEPLOY_HOST: ${{ vars.CODEXIA_BOOTSTRAP_HOST }}
          CODEXIA_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.CODEXIA_BOOTSTRAP_SSH_PRIVATE_KEY }}
          CODEXIA_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.CODEXIA_BOOTSTRAP_SSH_KNOWN_HOSTS }}
          CODEXIA_PREFLIGHT_SSH_USER: ${{ vars.CODEXIA_BOOTSTRAP_SSH_USER }}
        run: bash deploy/ansible/prepare-deploy-ssh.sh --preflight-admin
      - name: Require immutable GitHub OIDC claims for Tailscale
        env:
          CODEXIA_TAILSCALE_CLIENT_ID: ${{ vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID }}
          CODEXIA_TAILSCALE_ENVIRONMENT: ${{ inputs.management == 'bootstrap' && 'codexia-bootstrap' || 'codexia-production' }}
        run: node scripts/deployment/preflight/tailscale-oidc.mjs
      - name: Connect the existing protected management plane
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ format('api.tailscale.com/{0}', vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID) }}
          tags: tag:ci
          ping: ${{ steps.runtime.outputs.host || steps.bootstrap.outputs.host }}
      - name: Verify independent bootstrap identity and noninteractive sudo
        if: inputs.management == 'bootstrap'
        env:
          EXPECTED_USER: ${{ steps.bootstrap.outputs.user }}
        run: |
          set -euo pipefail
          actual=$(ssh -F "$RUNNER_TEMP/codexia-ssh/config" codexia-target 'id -un')
          [[ "$actual" == "$EXPECTED_USER" ]] || { echo 'The VM returned an unexpected SSH identity.' >&2; exit 1; }
          ssh -F "$RUNNER_TEMP/codexia-ssh/config" codexia-target 'sudo -n true'
      - name: Prepare the pinned read-only Ansible inventory
        env:
          SSH_USER: ${{ inputs.management == 'runtime' && 'codexia' || steps.bootstrap.outputs.user }}
        run: |
          set -euo pipefail
          bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/codexia-ansible" -r deploy/ansible/requirements.txt
          echo "$RUNNER_TEMP/codexia-ansible/bin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/codexia-preflight-inventory.yml" <<EOF_INVENTORY
          all:
            hosts:
              codexia:
                ansible_host: codexia-target
                ansible_user: $SSH_USER
                ansible_ssh_use_tty: false
                ansible_ssh_common_args: '-F "$RUNNER_TEMP/codexia-ssh/config"'
          EOF_INVENTORY
      - name: Observe existing host evidence
        env:
          CODEXIA_PREFLIGHT_TARGET_HOST: ${{ steps.runtime.outputs.host || steps.bootstrap.outputs.host }}
          CODEXIA_PREFLIGHT_INTENT: ${{ inputs.intent }}
        run: node scripts/deployment/preflight/run.mjs host
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lifecycle-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexia-lifecycle-host.json
          if-no-files-found: error
          retention-days: 14

  lifecycle-plan:
    name: Compute the read-only lifecycle plan from fresh host and certified candidate evidence
    needs: [lifecycle-candidate, lifecycle-host]
    if: always() && !cancelled() && github.event.repository.name == 'codexia' && github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: codexia-production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Load reviewed production OAuth settings
        run: node scripts/deployment/bootstrap/public-env.mjs
      - name: Install frozen evidence-reader dependencies
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        if: needs.lifecycle-host.result == 'success'
        with:
          name: lifecycle-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8.0.2
        if: needs.lifecycle-candidate.result == 'success'
        with:
          name: lifecycle-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Compute the lifecycle plan without deployment credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXIA_PREFLIGHT_MANAGEMENT: ${{ inputs.management }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET: ${{ vars.CODEXIA_DEPLOYMENT_CLOUDFLARE_TARGET }}
          CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN: ${{ secrets.CODEXIA_DEPLOYMENT_CLOUDFLARE_READ_TOKEN }}
          CODEXIA_ACCESS_CLIENT_ID: ${{ secrets.CODEXIA_ACCESS_CLIENT_ID }}
          CODEXIA_ACCESS_CLIENT_SECRET: ${{ secrets.CODEXIA_ACCESS_CLIENT_SECRET }}
          CODEXIA_DEPLOYMENT_PRESERVATION: ${{ secrets.CODEXIA_DEPLOYMENT_PRESERVATION }}
        run: node scripts/deployment/preflight/run.mjs plan
      - name: Retain redacted evidence, including a safe stop
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lifecycle-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codexia-lifecycle-preflight.json
          if-no-files-found: error
          retention-days: 30
