name: Benchmark Nx and minimum CI inputs
on:
  pull_request:
    paths:
      - .github/workflows/ci-execution-experiment.yml
      - scripts/ci/benchmark/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-execution-experiment-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  nx:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Install frozen product dependencies
        run: |
          corepack enable
          corepack pnpm@12.21.0 install --frozen-lockfile
      - name: Compare pnpm and Nx with verified output equivalence
        run: bash scripts/ci/benchmark/nx-build.sh
      - name: Compare Nx dependency graph and affected tasks with canonical contracts
        run: node scripts/ci/benchmark/nx-graph.mjs "$RUNNER_TEMP/nx-candidate"
      - name: Verify local static validation reuse and invalidation
        run: bash scripts/ci/benchmark/nx-validation.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: nx-candidate-lock-and-output-digests
          path: ${{ runner.temp }}/nx-candidate
          retention-days: 2
          if-no-files-found: error
  checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Compare exact-source full, blobless and sparse checkout
        env:
          BENCH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCH_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: bash scripts/ci/benchmark/checkout-inputs.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: checkout-input-proof-and-timing
          path: ${{ runner.temp }}/checkout-candidate
          retention-days: 2
          if-no-files-found: error
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
      - name: Compare fresh full and Core-filtered pnpm installs
        run: |
          corepack enable
          corepack pnpm@12.21.0 --version
          bash scripts/ci/benchmark/pnpm-filter.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pnpm-filter-comparison
          path: ${{ runner.temp }}/pnpm-filter-candidate
          retention-days: 2
          if-no-files-found: error
