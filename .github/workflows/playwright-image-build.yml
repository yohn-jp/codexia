name: Build minimal Playwright images (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimal-playwright-image-build
  cancel-in-progress: false

jobs:
  publish:
    name: Publish minimal ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Resolve lockfile-pinned browser version and image name
        id: image
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').devDependencies['@playwright/test']")"
          test "$version" = '1.65.1' || { echo 'Update both the MCR digest and comparison workflow for the new Playwright version' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/playwright-$BROWSER" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke test and publish selected browser
        id: publish
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/playwright-image-$BROWSER.json"
          docker buildx build \
            --file .github/docker/playwright-minimal.Dockerfile \
            --platform linux/amd64 \
            --build-arg "PLAYWRIGHT_VERSION=$VERSION" \
            --build-arg "BROWSER=$BROWSER" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:pw-$VERSION" \
            --metadata-file "$metadata" \
            --push .
          digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Missing pushed image digest' >&2; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$digest" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### $BROWSER: published and browser smoke-tested"
            echo ''
            echo "\`$IMAGE@$digest\`"
            echo ''
            echo "Playwright: $VERSION / source: $GITHUB_SHA / platform: linux/amd64"
          } >> "$GITHUB_STEP_SUMMARY"
