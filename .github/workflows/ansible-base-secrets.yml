name: Verify Ansible Base Secrets
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/shared/python-env.sh
      - deploy/ansible/site.yml
      - deploy/ansible/base-*.yml
      - deploy/ansible/managed-bootstrap-secrets.*
      - deploy/ansible/auth-runtime.yml
      - deploy/ansible/provision-auth-database.sh
      - deploy/ansible/auth-runtime.env.j2
      - deploy/ansible/bootstrap-auth-registration.sh
      - deploy/ansible/grant-passkey-owner.sh
      - deploy/ansible/require-clean-api-target.sh
      - deploy/ansible/verify-base-*.yml
      - deploy/ansible/check_postgres_volume.py
      - deploy/ansible/verify-postgres-roles.sql
      - deploy/ansible/test_postgres_volume_layout.py
      - deploy/ansible/test-base-*.sh
      - deploy/ansible/test-publication-gate-fixture.sh
      - scripts/deployment/ssh/install-cloudflared.sh
      - deploy/ansible/test-auth-runtime-integration.sh
      - deploy/ansible/requirements.txt
      - deploy/ansible/ci-mitogen-playbook.sh
      - deploy/ansible/inventory.example.yml
      - deploy/quadlet/**
      - deploy/systemd/**
      - deploy/ansible/prepare-api-gate.yml
      - deploy/ansible/codexia-api-gate*
      - cmd/codexiactl/assets/codexia-cloudflared.service
      - deploy/postgres/**
      - packages/persistence-postgres/migrations/**
      - .github/workflows/ansible-base-secrets.yml
  push:
    branches: [main]
    paths:
      - scripts/shared/python-env.sh
      - deploy/ansible/site.yml
      - deploy/ansible/base-*.yml
      - deploy/ansible/managed-bootstrap-secrets.*
      - deploy/ansible/auth-runtime.yml
      - deploy/ansible/provision-auth-database.sh
      - deploy/ansible/auth-runtime.env.j2
      - deploy/ansible/bootstrap-auth-registration.sh
      - deploy/ansible/grant-passkey-owner.sh
      - deploy/ansible/require-clean-api-target.sh
      - deploy/ansible/verify-base-*.yml
      - deploy/ansible/check_postgres_volume.py
      - deploy/ansible/verify-postgres-roles.sql
      - deploy/ansible/test_postgres_volume_layout.py
      - deploy/ansible/test-base-*.sh
      - deploy/ansible/test-publication-gate-fixture.sh
      - scripts/deployment/ssh/install-cloudflared.sh
      - deploy/ansible/test-auth-runtime-integration.sh
      - deploy/ansible/requirements.txt
      - deploy/ansible/ci-mitogen-playbook.sh
      - deploy/ansible/inventory.example.yml
      - deploy/quadlet/**
      - deploy/systemd/**
      - deploy/ansible/prepare-api-gate.yml
      - deploy/ansible/codexia-api-gate*
      - cmd/codexiactl/assets/codexia-cloudflared.service
      - deploy/postgres/**
      - packages/persistence-postgres/migrations/**
      - .github/workflows/ansible-base-secrets.yml
permissions:
  contents: read
concurrency:
  group: ansible-base-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rootless-secrets:
    name: Verify rootless Podman, PostgreSQL, and the publication gate
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - uses: actions/setup-node@v7.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: '24.22.3'
      - name: Install frozen CI evidence dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: corepack pnpm@12.21.0 --filter @codexia/ci-evidence --fail-if-no-match install --prod --frozen-lockfile --ignore-scripts
      - name: Resolve reusable independent PR proof
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/certification/reuse-merged-pr.mjs dedicated
      - name: Prepare disposable runtime
        if: steps.reuse.outputs.eligible != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap netavark aardvark-dns passt slirp4netns fuse-overlayfs dbus-user-session jq acl
          sudo bash scripts/shared/python-env.sh create python3 /opt/codexia-ansible -r deploy/ansible/requirements.txt mitogen==0.3.55
          test -x deploy/ansible/ci-mitogen-playbook.sh
          bash -n deploy/ansible/ci-mitogen-playbook.sh
          # site.yml loads auth-runtime dynamically; parse it before creating the VM fixture.
          /opt/codexia-ansible/bin/ansible-playbook -i localhost, --syntax-check /dev/stdin <<YAML
          - hosts: localhost
            gather_facts: false
            tasks:
              - ansible.builtin.import_tasks: "$GITHUB_WORKSPACE/deploy/ansible/auth-runtime.yml"
          YAML
          phase_started=$SECONDS
          fixture_user=codexia-phase-b-test
          # The hosted runner's /etc/skel contains developer toolchains; this service needs an empty home.
          fixture_skel=$(mktemp -d "$RUNNER_TEMP/codexia-base-skel.XXXXXX")
          sudo useradd --create-home --skel "$fixture_skel" --user-group --groups '' --shell /bin/bash \
            --key SUB_UID_COUNT=65536 --key SUB_GID_COUNT=65536 "$fixture_user"
          touch "$RUNNER_TEMP/codexia-phase-b-fixture-created"
          rmdir "$fixture_skel"
          test "$(id -G "$fixture_user")" = "$(id -g "$fixture_user")"
          for mappings in /etc/subuid /etc/subgid; do
            awk -F: -v user="$fixture_user" '$1 == user && $3 >= 65536 { found = 1 } END { exit !found }' "$mappings"
          done
          printf 'ANSIBLE_BASE_TIMING phase=fixture-account seconds=%s\n' "$((SECONDS - phase_started))"
          phase_started=$SECONDS
          fixture_uid=$(id -u "$fixture_user")
          fixture_home=$(getent passwd "$fixture_user" | cut -d: -f6)
          sudo install -d -m 0755 "/run/systemd/system/user@${fixture_uid}.service.d"
          cat <<EOF | sudo tee "/run/systemd/system/user@${fixture_uid}.service.d/10-codexia-ci-xdg.conf" >/dev/null
          [Service]
          Environment=HOME=$fixture_home
          Environment=XDG_CONFIG_HOME=$fixture_home/.config
          Environment=XDG_RUNTIME_DIR=/run/user/$fixture_uid
          EOF
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$fixture_user"
          sudo systemctl start "user@${fixture_uid}.service"
          printf 'ANSIBLE_BASE_TIMING phase=start-user-manager seconds=%s\n' "$((SECONDS - phase_started))"
          if sudo -u "$fixture_user" sudo -n true 2>/dev/null; then
            echo 'The rootless fixture account unexpectedly has sudo privileges' >&2
            exit 1
          fi
          for attempt in $(seq 1 20); do
            if sudo -u "$fixture_user" env HOME="$(getent passwd "$fixture_user" | cut -d: -f6)" XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" systemctl --user show --property=Version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          sudo -u "$fixture_user" env HOME="$(getent passwd "$fixture_user" | cut -d: -f6)" XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" systemctl --user show --property=Version
          manager_pid=$(sudo systemctl show --property=MainPID --value "user@${fixture_uid}.service")
          test "$manager_pid" -gt 1
          manager_process_env=$(sudo cat "/proc/$manager_pid/environ" | tr '\0' '\n')
          printf '%s\n' 'Fixture manager process environment before import:'
          printf '%s\n' "$manager_process_env" | grep -E '^(HOME|XDG_CONFIG_HOME|XDG_RUNTIME_DIR)='
          sudo -u "$fixture_user" env HOME="$fixture_home" XDG_CONFIG_HOME="$fixture_home/.config" XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" systemctl --user import-environment HOME XDG_CONFIG_HOME XDG_RUNTIME_DIR
          manager_env=$(sudo -u "$fixture_user" env HOME="$fixture_home" XDG_CONFIG_HOME="$fixture_home/.config" XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" systemctl --user show-environment)
          printf '%s\n' "$manager_env" | grep -E '^(HOME|XDG_CONFIG_HOME|XDG_RUNTIME_DIR)='
          for expected in "HOME=$fixture_home" "XDG_CONFIG_HOME=$fixture_home/.config" "XDG_RUNTIME_DIR=/run/user/$fixture_uid"; do
            if ! grep -Fxq "$expected" <<<"$manager_env"; then
              printf 'Fixture user manager environment is missing %s; full relevant values follow:\n' "$expected" >&2
              printf '%s\n' "$manager_env" | grep -E '^(HOME|XDG_CONFIG_HOME|XDG_RUNTIME_DIR)=' >&2 || true
              exit 1
            fi
          done
          printf '%s\n' "$manager_process_env" | grep -E '^(HOME|XDG_CONFIG_HOME|XDG_RUNTIME_DIR)='
          for expected in "HOME=$fixture_home" "XDG_CONFIG_HOME=$fixture_home/.config" "XDG_RUNTIME_DIR=/run/user/$fixture_uid"; do
            if ! grep -Fxq "$expected" <<<"$manager_process_env"; then
              printf 'Fixture user manager process environment is missing %s; full relevant values follow:\n' "$expected" >&2
              printf '%s\n' "$manager_process_env" | grep -E '^(HOME|XDG_CONFIG_HOME|XDG_RUNTIME_DIR)=' >&2 || true
              exit 1
            fi
          done
      - name: Select pinned Mitogen and protected CI SSH options
        if: steps.reuse.outputs.eligible != 'true'
        run: |
          set -euo pipefail
          fixture_user=codexia-phase-b-test
          # The local strategy executes modules with the Ansible playbook cwd.
          # Grant only pathname traversal to the disposable rootless identity;
          # existing file ACLs and secret input permissions remain unchanged.
          dir="$GITHUB_WORKSPACE/deploy/ansible"
          while [[ "$dir" != /home && "$dir" != / ]]; do
            sudo setfacl -m "u:$fixture_user:--x" "$dir"
            dir=${dir%/*}
          done
          sudo -u "$fixture_user" test -x "$GITHUB_WORKSPACE/deploy/ansible"
          plugin_path=$(/opt/codexia-ansible/bin/python -c 'import ansible_mitogen, os; print(os.path.join(os.path.dirname(ansible_mitogen.__file__), "plugins", "strategy"))')
          test -f "$plugin_path/mitogen_linear.py"
          /opt/codexia-ansible/bin/python -c 'from importlib.metadata import version; assert version("mitogen") == "0.3.55"'
          ssh_dir=$(mktemp -d /tmp/codexia-ci-ssh.XXXXXX)
          chmod 0700 "$ssh_dir"
          printf 'ANSIBLE_STRATEGY=mitogen_linear\n' >> "$GITHUB_ENV"
          printf 'ANSIBLE_STRATEGY_PLUGINS=%s\n' "$plugin_path" >> "$GITHUB_ENV"
          printf 'ANSIBLE_SSH_PIPELINING=True\n' >> "$GITHUB_ENV"
          printf 'ANSIBLE_HOST_KEY_CHECKING=True\n' >> "$GITHUB_ENV"
          printf 'ANSIBLE_SSH_ARGS=-C -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=%s/%%C\n' "$ssh_dir" >> "$GITHUB_ENV"
          echo "CODEXIA_CI_SSH_CONTROL_DIR=$ssh_dir" >> "$GITHUB_ENV"
          echo "ANSIBLE_BASE_OPTIMIZATION strategy=mitogen_linear pipelining=true controlpersist=60s facts=user-only secrets=batched"
      - name: Check PostgreSQL volume layout
        if: steps.reuse.outputs.eligible != 'true'
        run: |
          python3 deploy/ansible/test_postgres_volume_layout.py -v
      - name: Exercise rootless convergence through a separate bootstrap account
        if: steps.reuse.outputs.eligible != 'true'
        env:
          ANSIBLE_PLAYBOOK: ${{ github.workspace }}/deploy/ansible/ci-mitogen-playbook.sh
          ANSIBLE_REAL_PLAYBOOK: /opt/codexia-ansible/bin/ansible-playbook
          CODEXIA_SERVICE_USER: codexia-phase-b-test
        run: |
          fixture_uid=$(id -u "$CODEXIA_SERVICE_USER")
          phase_started=$SECONDS
          env XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" GITHUB_ACTIONS=true CODEXIA_DISPOSABLE_HOST=base-integration ANSIBLE_PLAYBOOK="$ANSIBLE_PLAYBOOK" bash deploy/ansible/test-base-secrets-integration.sh
          printf 'ANSIBLE_BASE_TIMING phase=secret-convergence seconds=%s\n' "$((SECONDS - phase_started))"
          printf '%s\n' 'Rootless secret convergence test process exited successfully.'
          phase_started=$SECONDS
          env XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" GITHUB_ACTIONS=true CODEXIA_DISPOSABLE_HOST=base-integration ANSIBLE_PLAYBOOK="$ANSIBLE_PLAYBOOK" bash deploy/ansible/test-base-runtime-integration.sh
          printf 'ANSIBLE_BASE_TIMING phase=runtime-convergence seconds=%s\n' "$((SECONDS - phase_started))"
      - name: Remove the disposable fixture user even after test failure
        if: always() && steps.reuse.outputs.eligible != 'true'
        run: |
          fixture_user=codexia-phase-b-test
          fixture_marker="$RUNNER_TEMP/codexia-phase-b-fixture-created"
          if test -f "$fixture_marker"; then
            if id "$fixture_user" >/dev/null 2>&1; then
              fixture_uid=$(id -u "$fixture_user")
              sudo loginctl disable-linger "$fixture_user" || true
              sudo systemctl stop "user@${fixture_uid}.service" || true
              sudo rm -f "/run/systemd/system/user@${fixture_uid}.service.d/10-codexia-ci-xdg.conf"
              sudo rmdir "/run/systemd/system/user@${fixture_uid}.service.d" 2>/dev/null || true
              sudo loginctl kill-user "$fixture_user" 2>/dev/null || true
              sudo pkill -KILL -u "$fixture_user" 2>/dev/null || true
              sudo userdel --remove "$fixture_user" || true
            fi
            rm -f "$fixture_marker"
          fi
          if [[ -n "${CODEXIA_CI_SSH_CONTROL_DIR:-}" ]]; then
            rm -rf -- "$CODEXIA_CI_SSH_CONTROL_DIR"
          fi
