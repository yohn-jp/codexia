name: Verify Ansible Base Secrets
on:
  pull_request:
    branches: [main]
    paths:
      - deploy/ansible/**
      - deploy/quadlet/**
      - deploy/postgres/**
      - scripts/verify-deployment-config.mjs
      - .github/workflows/ansible-base-secrets.yml
  push:
    branches: [main]
    paths:
      - deploy/ansible/**
      - deploy/quadlet/**
      - deploy/postgres/**
      - scripts/verify-deployment-config.mjs
      - .github/workflows/ansible-base-secrets.yml
permissions:
  contents: read
jobs:
  rootless-secrets:
    name: Verify rootless Podman, PostgreSQL, and Tunnel Quadlets
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap netavark aardvark-dns passt slirp4netns fuse-overlayfs dbus-user-session jq
          sudo python3 -m venv /opt/codexia-ansible
          if test -f deploy/ansible/requirements.txt; then
            sudo /opt/codexia-ansible/bin/pip install -r deploy/ansible/requirements.txt
          else
            sudo /opt/codexia-ansible/bin/pip install ansible-core==2.21.6
          fi
          fixture_user=codexia-phase-b-test
          test -z "$(id -u "$fixture_user" 2>/dev/null || true)"
          test ! -e /etc/sudoers.d/codexia-phase-b-test
          sudo useradd --create-home --shell /bin/bash "$fixture_user"
          touch "$RUNNER_TEMP/codexia-phase-b-fixture-created"
          subuid_max=$(awk -F: 'BEGIN { max = 100000 } { end = $2 + $3; if (end > max) max = end } END { print max }' /etc/subuid)
          subgid_max=$(awk -F: 'BEGIN { max = 100000 } { end = $2 + $3; if (end > max) max = end } END { print max }' /etc/subgid)
          subuid_start=$(( (subuid_max + 65535) / 65536 * 65536 ))
          subgid_start=$(( (subgid_max + 65535) / 65536 * 65536 ))
          sudo usermod --add-subuids "$subuid_start-$((subuid_start + 65535))" --add-subgids "$subgid_start-$((subgid_start + 65535))" "$fixture_user"
          printf '%s ALL=(ALL) NOPASSWD: ALL\n' "$fixture_user" | sudo tee /etc/sudoers.d/codexia-phase-b-test >/dev/null
          sudo chmod 0440 /etc/sudoers.d/codexia-phase-b-test
          sudo visudo -cf /etc/sudoers.d/codexia-phase-b-test
          sudo loginctl enable-linger "$fixture_user"
          fixture_uid=$(id -u "$fixture_user")
          sudo systemctl start "user@${fixture_uid}.service"
          for attempt in $(seq 1 20); do
            if sudo -u "$fixture_user" env HOME="$(getent passwd "$fixture_user" | cut -d: -f6)" XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" systemctl --user show --property=Version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          sudo -u "$fixture_user" env HOME="$(getent passwd "$fixture_user" | cut -d: -f6)" XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" systemctl --user show --property=Version
      - name: Check Phase B syntax and local safeguards
        run: |
          /opt/codexia-ansible/bin/ansible-playbook -i deploy/ansible/inventory.example.yml deploy/ansible/site.yml --syntax-check
          python3 deploy/ansible/test_postgres_volume_layout.py -v
          ANSIBLE_PLAYBOOK=/opt/codexia-ansible/bin/ansible-playbook bash deploy/ansible/test-tunnel-dependency.sh
          node scripts/verify-deployment-config.mjs
      - name: Exercise real rootless secrets and Phase B resources as the disposable fixture user
        env:
          ANSIBLE_PLAYBOOK: /opt/codexia-ansible/bin/ansible-playbook
        run: |
          fixture_user=codexia-phase-b-test
          fixture_uid=$(id -u "$fixture_user")
          fixture_home=$(getent passwd "$fixture_user" | cut -d: -f6)
          sudo -u "$fixture_user" env HOME="$fixture_home" USER="$fixture_user" LOGNAME="$fixture_user" TMPDIR=/tmp XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" GITHUB_ACTIONS=true CODEXIA_DISPOSABLE_HOST=phase-b-integration ANSIBLE_PLAYBOOK="$ANSIBLE_PLAYBOOK" bash deploy/ansible/test-base-secrets-integration.sh
          sudo -u "$fixture_user" env HOME="$fixture_home" USER="$fixture_user" LOGNAME="$fixture_user" TMPDIR=/tmp XDG_RUNTIME_DIR="/run/user/$fixture_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" GITHUB_ACTIONS=true CODEXIA_DISPOSABLE_HOST=phase-b-integration ANSIBLE_PLAYBOOK="$ANSIBLE_PLAYBOOK" bash deploy/ansible/test-base-runtime-integration.sh
      - name: Remove the disposable fixture user even after test failure
        if: always()
        run: |
          fixture_user=codexia-phase-b-test
          fixture_marker="$RUNNER_TEMP/codexia-phase-b-fixture-created"
          if test -f "$fixture_marker"; then
            if id "$fixture_user" >/dev/null 2>&1; then
              fixture_uid=$(id -u "$fixture_user")
              sudo loginctl disable-linger "$fixture_user" || true
              sudo systemctl stop "user@${fixture_uid}.service" || true
              sudo userdel --remove "$fixture_user" || true
            fi
            rm -f "$fixture_marker"
            sudo rm -f /etc/sudoers.d/codexia-phase-b-test
          fi
