name: Verify Ansible Base Secrets
on:
  pull_request:
    branches: [main]
    paths:
      - deploy/ansible/**
      - .github/workflows/ansible-base-secrets.yml
  push:
    branches: [main]
    paths:
      - deploy/ansible/**
      - .github/workflows/ansible-base-secrets.yml
permissions:
  contents: read
jobs:
  rootless-secrets:
    name: Verify real rootless Podman secret convergence
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap netavark aardvark-dns passt slirp4netns fuse-overlayfs dbus-user-session
          python3 -m venv "$RUNNER_TEMP/codexia-ansible"
          if test -f deploy/ansible/requirements.txt; then
            "$RUNNER_TEMP/codexia-ansible/bin/pip" install -r deploy/ansible/requirements.txt
          else
            "$RUNNER_TEMP/codexia-ansible/bin/pip" install ansible-core==2.21.6
          fi
          sudo loginctl enable-linger "$(id -un)"
      - name: Exercise real secret lifecycle without production credentials
        env:
          ANSIBLE_PLAYBOOK: ${{ runner.temp }}/codexia-ansible/bin/ansible-playbook
        run: bash deploy/ansible/test-base-secrets-integration.sh
