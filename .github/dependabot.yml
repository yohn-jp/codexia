version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  # Independent npm project, not part of the root pnpm workspace.
  # Wrangler is build/deployment tooling (devDependency), not a runtime API package.
  - package-ecosystem: npm
    directory: /edge/frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      edge-development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /cmd/codexiactl
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3

  # Pinned, reviewable runtime base-image updates for Playwright CI.
  - package-ecosystem: docker
    directory: /.github/docker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
