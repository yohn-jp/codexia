name: Read reviewed lifecycle Preflight
description: Bind a reviewed immutable Preflight run to the current protected main and management identity
inputs:
  run-id:
    description: Reviewed Preflight workflow dispatch run ID (first attempt)
    required: true
  management:
    description: Expected pinned bootstrap or runtime management identity
    required: true
outputs:
  run-id:
    description: Preflight producer run
    value: ${{ inputs.run-id }}
  attempt:
    description: Immutable reviewed attempt
    value: ${{ steps.producer.outputs.attempt }}
  request:
    description: Certified candidate references, intent and window
    value: ${{ steps.receipt.outputs.request }}
  plan-sha256:
    description: Digest of the reviewed plan
    value: ${{ steps.receipt.outputs.plan-sha256 }}
runs:
  using: composite
  steps:
    - id: producer
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PREFLIGHT_RUN: ${{ inputs.run-id }}
      run: |
        set -euo pipefail
        [[ "$PREFLIGHT_RUN" =~ ^[1-9][0-9]{0,15}$ ]]
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN" |
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg id "$PREFLIGHT_RUN" '
            (.id | tostring) == $id and .repository.full_name == $repo and .head_repository.full_name == $repo and
            .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $sha and
            .path == ".github/workflows/production-preflight.yml" and .status == "completed" and
            .conclusion == "success" and .run_attempt == 1' >/dev/null
        echo 'attempt=1' >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v8.0.2
      with:
        name: lifecycle-preflight-${{ inputs.run-id }}-1
        path: ${{ runner.temp }}/reviewed-preflight
        github-token: ${{ github.token }}
        run-id: ${{ inputs.run-id }}
    - id: receipt
      shell: bash
      env:
        PREFLIGHT_RUN: ${{ inputs.run-id }}
        MANAGEMENT: ${{ inputs.management }}
      run: |
        set -euo pipefail
        receipt="$RUNNER_TEMP/reviewed-preflight/codexia-lifecycle-preflight.json"
        jq -e --arg sha "$GITHUB_SHA" --arg management "$MANAGEMENT" --arg id "$PREFLIGHT_RUN" '
          .sourceSha == $sha and (.runId | tostring) == $id and .attempt == 1 and .management == $management and
          .request.intent == .plan.intent and .request.window == .plan.window and
          (.planSha256 | test("^[a-f0-9]{64}$"))' "$receipt" >/dev/null
        echo "request=$(jq -c '.request' "$receipt")" >> "$GITHUB_OUTPUT"
        echo "plan-sha256=$(jq -r '.planSha256' "$receipt")" >> "$GITHUB_OUTPUT"
