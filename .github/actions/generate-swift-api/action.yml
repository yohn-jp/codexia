name: Generate native API client
description: Build the SwiftPM sources from the checked-out TypeSpec contract
inputs:
  check:
    description: Repeat generation and compare the complete Swift source trees
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 24.22.3
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.13'
    - shell: bash
      env:
        CHECK: ${{ inputs.check }}
      run: |
        corepack enable
        pnpm --filter @codexia/http-contract install --frozen-lockfile
        bash scripts/shared/python-env.sh create python3 "$RUNNER_TEMP/codexia-ios-yaml" PyYAML==6.0.3
        export PATH="$RUNNER_TEMP/codexia-ios-yaml/bin:$PATH"
        if [[ "$CHECK" == true ]]; then
          ios/CodexiaTransport/generate.sh --check
        else
          ios/CodexiaTransport/generate.sh
        fi
