---
- name: Install boot and poll units after successful initialization
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/updater/{{ item }}.example"
    dest: "{{ unit_dir }}/{{ item }}"
    mode: '0600'
  loop:
    - codexia-updater-boot.service
    - codexia-updater.service
    - codexia-updater.timer
- name: Enable recovery on reboot but leave polling disabled
  ansible.builtin.systemd_service:
    name: codexia-updater-boot.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
