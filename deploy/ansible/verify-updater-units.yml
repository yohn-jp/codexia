---
- name: Inspect the updater systemd unit source closure
  ansible.builtin.stat:
    path: "{{ unit_dir }}/{{ item }}"
    checksum_algorithm: sha256
  loop:
    - codexia-updater-boot.service
    - codexia-updater.service
    - codexia-updater.timer
  register: installed_updater_units
- name: Refuse to reload an unreviewed updater unit
  ansible.builtin.assert:
    that:
      - item.stat.exists or (allow_missing_updater_units | default(false) | bool)
      - not item.stat.exists or (item.stat.isreg | default(false))
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or item.stat.mode == '0600'
      - not item.stat.exists or item.stat.checksum == (lookup('ansible.builtin.file', repo_root + '/deploy/updater/' + item.item + '.example', rstrip=false) | hash('sha256'))
    fail_msg: Installed updater units differ from the reviewed repository; use the approved maintain stage.
  loop: "{{ installed_updater_units.results }}"
- name: Inspect effective updater unit drop-ins
  ansible.builtin.command:
    argv: [systemctl, --user, show, --property=DropInPaths, --value, "{{ item }}"]
  loop: "{{ installed_updater_units.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  register: updater_unit_dropins
  changed_when: false
  failed_when: updater_unit_dropins.rc != 0
- name: Refuse unreviewed updater unit overrides
  ansible.builtin.assert:
    that:
      - item.stdout | trim == ''
    fail_msg: Updater systemd unit has an unreviewed drop-in; single-writer and polling behavior are not verified.
  loop: "{{ updater_unit_dropins.results }}"
