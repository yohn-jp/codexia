---
- name: Inspect the database image, mounts, networks, ports, environment and secret references
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - --format
      - >-
        {% raw %}{"image":{{json .Config.Image}},
        "mounts":{{json .Mounts}},
        "networks":{{json .NetworkSettings.Networks}},
        "ports":{{json .HostConfig.PortBindings}},
        "environment":{{json .Config.Env}},
        "secrets":{{json .Config.Secrets}}}{% endraw %}
      - codexia-db
  register: base_runtime_db_inspection
  changed_when: false
  no_log: true
- name: Decode the selected database container fields
  ansible.builtin.set_fact:
    base_runtime_db_container: "{{ base_runtime_db_inspection.stdout | from_json }}"
  no_log: true
- name: Reject any implicit PostgreSQL image change
  ansible.builtin.assert:
    that:
      # Podman 5.7 reports a digest-only reference in Config.Image for some
      # rootless containers. Both accepted forms pin the same manifest digest.
      - base_runtime_db_container.image in [
          'docker.io/library/postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536',
          'docker.io/library/postgres@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536'
        ]
    fail_msg: The existing database container does not use the repository's verified PostgreSQL image pin.
- name: Inspect the current administrator secret identity
  ansible.builtin.command:
    argv: [podman, secret, inspect, --format, "{% raw %}{{.ID}}{% endraw %}", codexia-postgres-admin-password]
  register: base_runtime_db_admin_secret_id
  changed_when: false
- name: Inspect the current application secret identity
  ansible.builtin.command:
    argv: [podman, secret, inspect, --format, "{% raw %}{{.ID}}{% endraw %}", codexia-postgres-app-password]
  register: base_runtime_db_app_secret_id
  changed_when: false
- name: Reject database container storage, network, or port drift
  ansible.builtin.assert:
    that:
      - >-
        (base_runtime_db_container.mounts
        | selectattr('Type', 'equalto', 'volume')
        | selectattr('Name', 'equalto', 'codexia-postgres')
        | selectattr('Destination', 'equalto', '/var/lib/postgresql/data')
        | list | length) == 1
      - >-
        (base_runtime_db_container.mounts
        | selectattr('Type', 'equalto', 'volume')
        | list | length) == 1
      - >-
        (base_runtime_db_container.mounts
        | selectattr('Destination', 'match', '^/var/lib/postgresql(/|$)')
        | list | length) == 1
      - >-
        (base_runtime_db_container.mounts
        | selectattr('Destination', 'equalto', '/docker-entrypoint-initdb.d/010-create-app-role.sh')
        | selectattr('Type', 'equalto', 'bind')
        | selectattr('Source', 'equalto', '/etc/codexia/postgres/010-create-app-role.sh')
        | selectattr('RW', 'equalto', false)
        | list | length) == 1
      - base_runtime_db_container.networks.keys() | list == ['codexia-data']
      - base_runtime_db_container.ports is none or base_runtime_db_container.ports == {}
      - >-
        (base_runtime_db_container.environment | select('equalto', 'PGDATA=/var/lib/postgresql/data/pgdata') | list | length) == 1
      - >-
        (base_runtime_db_container.environment | select('equalto', 'POSTGRES_DB=codexia') | list | length) == 1
      - >-
        (base_runtime_db_container.environment | select('equalto', 'POSTGRES_USER=codexia_admin') | list | length) == 1
      - >-
        (base_runtime_db_container.environment | select('equalto', 'POSTGRES_PASSWORD_FILE=/run/secrets/admin-password') | list | length) == 1
      - (base_runtime_db_container.secrets | length) == 2
      - >-
        (base_runtime_db_container.secrets
        | selectattr('Name', 'equalto', 'codexia-postgres-admin-password')
        | selectattr('ID', 'equalto', base_runtime_db_admin_secret_id.stdout)
        | list | length) == 1
      - >-
        (base_runtime_db_container.secrets
        | selectattr('Name', 'equalto', 'codexia-postgres-app-password')
        | selectattr('ID', 'equalto', base_runtime_db_app_secret_id.stdout)
        | list | length) == 1
    fail_msg: Database container has unexpected PGDATA, storage, network, port, or current secret identity configuration.
