---
- name: Run the protected first-owner handoff on the declared rootless host
  hosts: codexia
  gather_facts: false
  any_errors_fatal: true
  vars_files: [repository-vars.yml]
  vars:
    owner_setup_home: "{{ codexia_service_home }}"
    owner_setup_operations:
      owner-setup: ['--converge', "{{ codexia_auth_bootstrap_image }}", 'NEW_APPROVED', "{{ codexia_owner_setup_age_recipient | default('') }}"]
      prepare-activation: ['--prepare-activation', "{{ codexia_auth_bootstrap_image }}"]
  tasks:
    - name: Require a single pinned host and separately approved owner operation
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - not ansible_check_mode
          - codexia_service_user == 'codexia'
          - codexia_service_uid is integer and codexia_service_uid > 0
          - owner_setup_home == '/home/codexia'
          - codexia_owner_setup_approved is sameas true
          - codexia_owner_setup_operation in owner_setup_operations
          - codexia_auth_bootstrap_image is match(codexia_image_pattern)
          - codexia_owner_setup_expected_origin is match('^https://[^/]+$')
          - codexia_owner_setup_expected_web_client_id is match('^[a-zA-Z0-9._:/|+-]+$')
          - codexia_owner_setup_expected_web_redirect_uris is sequence and codexia_owner_setup_expected_web_redirect_uris is not string
          - codexia_owner_setup_expected_web_redirect_uris | length > 0
          - codexia_expected_owner_setup_checkpoint is mapping
          - codexia_expected_owner_secret_set_sha256 is match('^[a-f0-9]{64}$')
          - codexia_owner_setup_operation != 'owner-setup' or codexia_owner_setup_edge_approved | default(false) is sameas true
          - codexia_owner_setup_operation != 'owner-setup' or codexia_owner_setup_age_recipient is match('^age1[0-9a-z]+$')
        fail_msg: Owner handoff requires the pinned rootless account, certified Full image and protected enrollment approval.

    - name: Stage the read-only observer for the locked owner operation
      become: true
      become_user: "{{ codexia_service_user }}"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/preflight-observe.py"
        dest: "{{ owner_setup_home }}/.local/bin/codexia-preflight-observe"
        mode: '0700'

    - name: Stage the canonical Owner setup operator for the local handoff
      when: codexia_owner_setup_operation == 'owner-setup'
      become: true
      become_user: "{{ codexia_service_user }}"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/owner-setup.sh"
        dest: "{{ owner_setup_home }}/.local/bin/codexia-owner-setup"
        mode: '0700'

    - name: Run the canonical operator operation under its host lock
      become: true
      become_user: "{{ codexia_service_user }}"
      environment:
        CODEXIA_IMAGE_REPOSITORY: "{{ codexia_image_repository }}"
        CODEXIA_TARGET_REPOSITORY: "{{ codexia_target_repository }}"
        CODEXIA_TARGET_REPOSITORY_ID: "{{ codexia_target_repository_id }}"
        CODEXIA_TARGET_OWNER_ID: "{{ codexia_target_owner_id }}"
        HOME: "{{ owner_setup_home }}"
        XDG_CONFIG_HOME: "{{ owner_setup_home }}/.config"
        XDG_DATA_HOME: "{{ owner_setup_home }}/.local/share"
        XDG_STATE_HOME: "{{ owner_setup_home }}/.local/state"
        XDG_RUNTIME_DIR: "/run/user/{{ codexia_service_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ codexia_service_uid }}/bus"
        CODEXIA_OWNER_SETUP_EXPECTED_ORIGIN: "{{ codexia_owner_setup_expected_origin }}"
        CODEXIA_OWNER_SETUP_EXPECTED_WEB_CLIENT_ID: "{{ codexia_owner_setup_expected_web_client_id }}"
        CODEXIA_OWNER_SETUP_EXPECTED_WEB_REDIRECT_URIS: "{{ codexia_owner_setup_expected_web_redirect_uris | join(',') }}"
        CODEXIA_OWNER_SETUP_EXPECTED_SECRET_SET_SHA256: "{{ codexia_expected_owner_secret_set_sha256 }}"
        CODEXIA_OWNER_SETUP_EXPECTED_CHECKPOINT: "{{ codexia_expected_owner_setup_checkpoint | to_json }}"
      ansible.builtin.command:
        argv: "{{ ['bash', '-c', lookup('ansible.builtin.file', playbook_dir + '/owner-setup.sh'), 'codexia-owner-setup'] + owner_setup_operations[codexia_owner_setup_operation] }}"
        expand_argument_vars: false
      register: owner_setup_command
      changed_when: owner_setup_command.stdout != ''
