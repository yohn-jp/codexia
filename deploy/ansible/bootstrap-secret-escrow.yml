---
- name: Capture the credential generation on the independently observed VM
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../backup/bootstrap_snapshot.py') }}"
      - "{{ 'seal' if codexia_stage == 'bootstrap' else 'identity' }}"
      - "{{ lookup('ansible.builtin.env', 'CODEXIA_BOOTSTRAP_ESCROW_HOST_ID') }}"
      - "{{ lookup('ansible.builtin.env', 'CODEXIA_BOOTSTRAP_ESCROW_RECIPIENT') }}"
    expand_argument_vars: false
  register: bootstrap_escrow_snapshot
  no_log: true
  changed_when: false

# The remote command above has no S3 credential. The pinned local transport
# receives ciphertext or a redacted identity and inherits only the controller's credential.
- name: Verify off-VM readback or the independently restored current generation
  delegate_to: localhost
  become: false
  environment: {}
  no_log: true
  ansible.builtin.command:
    argv: >-
      {{ [lookup('ansible.builtin.env', 'RUNNER_TEMP') + '/bootstrap-s3/bin/python',
          playbook_dir + '/../backup/bootstrap_escrow.py']
         + (['upload', '--receipt', lookup('ansible.builtin.env', 'CONTROL') + '/escrow-receipt.json']
            if codexia_stage == 'bootstrap' else ['check']) }}
    stdin: "{{ bootstrap_escrow_snapshot.stdout }}"
    expand_argument_vars: false
  changed_when: false
