---
- name: Require private control-node preflight password and restore receipt files
  ansible.builtin.assert:
    that:
      - codexia_postgres_preflight_password_rotation_file is string
      - codexia_postgres_preflight_password_rotation_file.startswith('/')
      - codexia_preflight_password_restore_receipt_file is string
      - codexia_preflight_password_restore_receipt_file.startswith('/')
  no_log: true
- name: Inspect preflight password and restore receipt on the control node
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - "{{ codexia_postgres_preflight_password_rotation_file }}"
    - "{{ codexia_preflight_password_restore_receipt_file }}"
  register: preflight_password_rotation_inputs
  delegate_to: localhost
  become: false
  no_log: true
- name: Require regular protected preflight rotation inputs with bounded sizes
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.mode in ['0400', '0600']
      - item.stat.size > 0
      - item.stat.size <= 65536
  loop: "{{ preflight_password_rotation_inputs.results }}"
  no_log: true
- name: Require a 32-byte hexadecimal preflight password with an optional final newline
  ansible.builtin.assert:
    that:
      - preflight_password_rotation_inputs.results[0].stat.size in [64, 65]
  no_log: true
