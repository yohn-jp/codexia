---
- name: Require the admitted rootless target before bootstrap credential handling
  ansible.builtin.assert:
    that:
      - codexia_stage == 'bootstrap'
      - codexia_bootstrap_stages is defined
      - codexia_secrets_approved is sameas true
      - codexia_bootstrap_host_id is match('^[a-f0-9]{64}$')
      - codexia_bootstrap_secret_hashes is mapping
      - codexia_service_user == 'codexia' and home == '/home/codexia'
      - codexia_service_uid is integer and codexia_service_uid > 0
      - not ansible_check_mode

- name: Match the effective service UID to the approved production profile
  ansible.builtin.command:
    argv: [id, -u]
  register: managed_bootstrap_uid
  changed_when: false
  failed_when: managed_bootstrap_uid.rc != 0 or managed_bootstrap_uid.stdout != codexia_service_uid | string

- name: Create the private helper and deployment state directories
  ansible.builtin.file:
    path: "{{ home }}/{{ item }}"
    state: directory
    mode: '0700'
  loop: [.local/bin, .local/state/codexia-deploy]

- name: Install the VM credential helper
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/ansible/managed-bootstrap-secrets.py"
    dest: "{{ home }}/.local/bin/codexia-bootstrap-secrets"
    mode: '0700'

- name: Generate missing fresh-install secrets or verify existing Podman identities under the deployment lock
  ansible.builtin.command:
    argv:
      - "{{ home }}/.local/bin/codexia-bootstrap-secrets"
      - "{{ {'host': codexia_bootstrap_host_id, 'hashes': codexia_bootstrap_secret_hashes} | to_json }}"
      - "{{ 'install' if codexia_owner_setup_install_intent | default(false) and codexia_database_initialization_approved | default(false) else 'adopt' }}"
    expand_argument_vars: false
  register: managed_bootstrap_secrets
  changed_when: managed_bootstrap_secrets.stdout == 'INITIALIZED'
  no_log: true
