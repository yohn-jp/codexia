---
# Read-only admission shared with the canonical base-runtime container validators.
# The disposable lifecycle fixture has its own isolated base admission.
- name: Inspect every canonical base Quadlet without following links
  ansible.builtin.stat:
    path: "{{ quadlet_dir }}/{{ item }}"
    follow: false
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  loop:
    - codexia.network
    - codexia-data.network
    - codexia-postgres.volume
    - codexia-data.volume
    - codexia-history.volume
    - codexia-db.container
  register: codexia_deploy_base_quadlets
  changed_when: false

- name: Require every base Quadlet to match the reviewed repository source
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.checksum | default('') == (lookup('ansible.builtin.file', repo_root + '/deploy/quadlet/' + item.item, rstrip=false) | hash('sha256'))
    fail_msg: The deployed base Quadlet is missing or differs from its reviewed repository source.
  loop: "{{ codexia_deploy_base_quadlets.results }}"

- name: Read the generated PostgreSQL service origin
  ansible.builtin.command:
    argv: [systemctl, --user, show, --property=SourcePath, --value, codexia-db.service]
  register: codexia_deploy_base_db_source
  changed_when: false

- name: Require PostgreSQL to originate from its canonical rootless Quadlet
  ansible.builtin.assert:
    that:
      - codexia_deploy_base_db_source.rc == 0
      - codexia_deploy_base_db_source.stdout == quadlet_dir + '/codexia-db.container'
    fail_msg: PostgreSQL is not generated from its canonical rootless Quadlet.

- name: Reuse the canonical PostgreSQL container image, secret, network and volume checks
  ansible.builtin.include_tasks: verify-base-db-container.yml

- name: Verify the canonical private network isolation before deployment
  ansible.builtin.command:
    argv: [podman, network, inspect, --format, "{% raw %}{{.Name}}|{{.Driver}}|{{.Internal}}{% endraw %}", "{{ item.name }}"]
  loop:
    - {name: codexia, expected: 'codexia|bridge|false'}
    - {name: codexia-data, expected: 'codexia-data|bridge|true'}
  register: codexia_deploy_base_networks
  changed_when: false
  failed_when: codexia_deploy_base_networks.rc != 0 or codexia_deploy_base_networks.stdout != item.expected

- name: Require the independent host Cloudflare connector
  ansible.builtin.command:
    argv: [systemctl, is-active, codexia-cloudflared.service]
  register: codexia_deploy_cloudflared
  changed_when: false
  failed_when: codexia_deploy_cloudflared.rc != 0 or codexia_deploy_cloudflared.stdout != 'active'

- name: Require the product gate to be explicitly open or closed
  ansible.builtin.command:
    argv: [sudo, -n, /usr/local/sbin/codexia-api-gate, status]
  register: codexia_deploy_publication_gate
  changed_when: false
  failed_when: codexia_deploy_publication_gate.rc != 0 or codexia_deploy_publication_gate.stdout not in ['open', 'closed']

- name: Reject an obsolete rootless application Tunnel
  ansible.builtin.command:
    argv: [podman, container, exists, codexia-tunnel]
  register: codexia_deploy_legacy_tunnel
  changed_when: false
  failed_when: codexia_deploy_legacy_tunnel.rc not in [0, 1]

- name: Require the rootless application Tunnel to be retired
  ansible.builtin.assert:
    that: codexia_deploy_legacy_tunnel.rc == 1
    fail_msg: The obsolete rootless application Tunnel remains; the Cloudflare host connector is the only deployment path.
