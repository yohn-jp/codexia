---
- name: Require explicit approval for PostgreSQL app password rotation
  ansible.builtin.assert:
    that:
      - codexia_app_password_rotation_approved | default(false) | bool
      - not ansible_check_mode
      - journal.stat.exists
    fail_msg: PostgreSQL app password rotation requires an initialized controller, verified backup and restore receipt, and explicit approval.
- name: Verify installed reviewed sources and units without changing them
  ansible.builtin.include_tasks: verify-updater-inputs.yml
- name: Verify installed reviewed updater units
  ansible.builtin.include_tasks: verify-updater-units.yml
- name: Validate the protected app password and restore receipt inputs
  ansible.builtin.include_tasks: validate-app-password-rotation-inputs.yml
- name: Create private rotation candidate parent outside all container mounts
  ansible.builtin.file:
    path: "{{ config_dir }}/maintenance/candidates"
    state: directory
    mode: '0700'
- name: Allocate private app password rotation candidate
  ansible.builtin.tempfile:
    state: directory
    path: "{{ config_dir }}/maintenance/candidates"
    prefix: postgres-app-password-
  register: app_password_rotation_candidate
- name: Apply the backup-gated PostgreSQL app password transaction
  block:
    - name: Create private candidate directories
      ansible.builtin.file:
        path: "{{ app_password_rotation_candidate.path }}/{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - credentials
        - quadlet
    - name: Stage the replacement app password without logging or diff
      ansible.builtin.copy:
        src: "{{ codexia_postgres_app_password_rotation_file }}"
        dest: "{{ app_password_rotation_candidate.path }}/credentials/postgres-app-password"
        mode: '0600'
      no_log: true
      diff: false
    - name: Stage the exact private isolated restore receipt without logging or diff
      ansible.builtin.copy:
        src: "{{ codexia_app_password_restore_receipt_file }}"
        dest: "{{ app_password_rotation_candidate.path }}/restore-receipt.json"
        mode: '0600'
      no_log: true
      diff: false
    - name: Stage the observed PostgreSQL Quadlet source for locked ownership validation
      ansible.builtin.copy:
        src: "{{ quadlet_dir }}/codexia-db.container"
        dest: "{{ app_password_rotation_candidate.path }}/quadlet/codexia-db.container"
        remote_src: true
        mode: '0600'
    - name: Write the strict app password maintenance manifest
      ansible.builtin.copy:
        content: >-
          {{
            {
              'format': 'codexia-updater-maintenance/v1',
              'candidateRoot': app_password_rotation_candidate.path,
              'sourceDir': source_dir,
              'unitDir': unit_dir,
              'configPath': config_path,
              'rotatePostgresAppPassword': true,
              'appPasswordFile': app_password_rotation_candidate.path + '/credentials/postgres-app-password',
              'restoreReceiptFile': app_password_rotation_candidate.path + '/restore-receipt.json',
              'databaseQuadletFile': app_password_rotation_candidate.path + '/quadlet/codexia-db.container'
            } | to_nice_json
          }}
          {{ '\n' }}
        dest: "{{ app_password_rotation_candidate.path }}/manifest.json"
        mode: '0600'
    - name: Rotate PostgreSQL app password and verify recovery state under the canonical host lock
      ansible.builtin.command:
        argv: [sh, "{{ updater }}", maintain, "{{ config_path }}", "{{ app_password_rotation_candidate.path }}/manifest.json"]
      environment: "{{ updater_env }}"
      register: app_password_rotation_result
      changed_when: true
      no_log: true
    - name: Require a successful PostgreSQL app password transaction
      ansible.builtin.assert:
        that: (app_password_rotation_result.stdout | from_json).postgresAppPasswordRotated
  always:
    - name: Remove staged app password and restore evidence
      ansible.builtin.file:
        path: "{{ app_password_rotation_candidate.path }}"
        state: absent
      no_log: true
