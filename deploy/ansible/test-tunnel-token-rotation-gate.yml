---
- name: Test Tunnel token rotation approval gates before input staging
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    codexia_tunnel_token_rotation_approved: "{{ lookup('env', 'CODEXIA_TEST_TUNNEL_TOKEN_APPROVED') | default(false) | bool }}"
    ansible_check_mode: "{{ lookup('env', 'CODEXIA_TEST_TUNNEL_TOKEN_CHECK_MODE') | default(false) | bool }}"
    journal:
      stat:
        exists: true
  tasks:
    - name: Exercise the production Tunnel token rotation gate
      ansible.builtin.import_tasks: rotate-tunnel-token.yml
