---
- name: Require explicit schema approval and exact private release record
  ansible.builtin.assert:
    that:
      - codexia_database_initialization_approved | default(false) | bool
      - codexia_installed_release_file is defined
      - codexia_installed_release_file is string
      - codexia_installed_release_file is match('^/[^\\r\\n]+$')
  no_log: true
- name: Verify prepared updater sources and configuration
  ansible.builtin.include_tasks: verify-updater-inputs.yml
- name: Require disabled updater configuration
  ansible.builtin.assert:
    that: not ((saved_config.content | b64decode | from_json).enabled | bool)
- name: Verify the existing canonical database storage, private network and credential identities
  ansible.builtin.include_tasks: verify-base-db-container.yml
- name: Stage the exact signed release privately
  ansible.builtin.tempfile:
    state: directory
    path: "{{ config_dir }}"
    prefix: fresh-schema-
  register: fresh_schema_dir
- name: Initialize through the canonical locked migration authority
  block:
    - name: Copy exact signed release record
      ansible.builtin.copy:
        src: "{{ codexia_installed_release_file }}"
        dest: "{{ fresh_schema_dir.path }}/release.json"
        mode: '0600'
      no_log: true
    - name: Run fresh-only migration in the verified image without starting the API
      ansible.builtin.command:
        argv: [sh, "{{ updater }}", initialize-schema, "{{ config_path }}", "{{ fresh_schema_dir.path }}/release.json", --approved]
      register: fresh_schema_result
      changed_when: (fresh_schema_result.stdout | from_json).applied | length > 0
    - name: Verify exact schema result without declaring writer activation
      ansible.builtin.assert:
        that:
          - (fresh_schema_result.stdout | from_json).format == 'codexia-fresh-schema/v1'
          - not (fresh_schema_result.stdout | from_json).activated
    - name: Converge preflight SELECT grants for the newly created schema
      ansible.builtin.include_tasks: preflight.yml
      vars:
        preflight_verify_only: false
    - name: Verify effective read-only preflight grants
      ansible.builtin.include_tasks: preflight.yml
      vars:
        preflight_verify_only: true
  always:
    - name: Remove only the temporary release directory
      ansible.builtin.file:
        path: "{{ fresh_schema_dir.path }}"
        state: absent
