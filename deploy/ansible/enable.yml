---
- name: Require explicit live acceptance approval
  ansible.builtin.assert:
    that: codexia_acceptance_approved | default(false) | bool
- name: Verify public origin reaches the installed release through Access
  ansible.builtin.uri:
    url: "{{ codexia_frontend_origin }}/api/version"
    headers:
      CF-Access-Client-Id: "{{ lookup('ansible.builtin.file', codexia_access_id_file) }}"
      CF-Access-Client-Secret: "{{ lookup('ansible.builtin.file', codexia_access_secret_file) }}"
    follow_redirects: none
    return_content: true
    status_code: 200
  register: live_api
  no_log: true
- name: Compare deployed API identity with committed controller state
  ansible.builtin.assert:
    that:
      - live_api.json.name == 'codexia'
      - live_api.json.version == status.state.installed.version
      - live_api.json.profile == status.state.installed.profile
      - live_api.json.apiEpoch == status.state.installed.apiEpoch
      - (live_api.json.browserAuth | default('token')) == codexia_browser_auth.mode
  vars:
    status: "{{ controller_status.stdout | from_json }}"
- name: Enable the controller configuration
  ansible.builtin.copy:
    content: "{{ desired_config | combine({'enabled': true}) | to_nice_json }}\n"
    dest: "{{ config_path }}"
    mode: '0600'
- name: Resume only a paused controller via its locked command
  ansible.builtin.command:
    argv: [sh, "{{ updater }}", resume, "{{ config_path }}"]
  changed_when: true
  when: (controller_status.stdout | from_json).state.paused
- name: Enable periodic polling
  ansible.builtin.systemd_service:
    name: codexia-updater.timer
    scope: user
    enabled: true
    state: started
