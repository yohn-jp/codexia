---
- name: Require explicit restore drill approval and protected recovery inputs
  ansible.builtin.assert:
    that:
      - codexia_restore_drill_approved | default(false) | bool
      - codexia_backup_directory is string
      - codexia_backup_directory is match('^/[^\r\n]+$')
      - codexia_recovery_identity_file is string
      - codexia_recovery_identity_file is match('^/[^\r\n]+$')
    fail_msg: Provide explicit drill approval, an off-VM backup directory, and an externally managed recovery identity file.
  delegate_to: localhost
  become: false
  no_log: true
- name: Inspect the recovery inputs on the isolated drill host
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - {path: "{{ codexia_backup_directory }}", type: directory}
    - {path: "{{ codexia_recovery_identity_file }}", type: identity}
  register: codexia_restore_input_stats
  delegate_to: localhost
  become: false
  no_log: true
- name: Observe the isolated recovery user's numeric identity
  ansible.builtin.command:
    argv: [id, -u]
  register: codexia_restore_local_uid
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true
- name: Require an external backup directory and private recovery identity file
  ansible.builtin.assert:
    that:
      - codexia_restore_input_stats.results[0].stat.isdir | default(false)
      - not (codexia_restore_input_stats.results[0].stat.islnk | default(false))
      - codexia_restore_input_stats.results[1].stat.isreg | default(false)
      - not (codexia_restore_input_stats.results[1].stat.islnk | default(false))
      - codexia_restore_input_stats.results[1].stat.mode in ['0400', '0600']
      - codexia_restore_input_stats.results[1].stat.uid == codexia_restore_local_uid.stdout | int
    fail_msg: The recovery key must be a regular non-symlink file owned by the local recovery user with mode 0400 or 0600.
  delegate_to: localhost
  become: false
  no_log: true
- name: Validate the reviewed candidate and protected inputs for optional API verification
  ansible.builtin.assert:
    that:
      - codexia_restore_candidate_image is string
      - codexia_restore_candidate_image is match('^ghcr\.io/yohn-jp/codexia-backend@sha256:[a-f0-9]{64}$')
      - codexia_restore_candidate_ledger is string
      - codexia_restore_candidate_ledger is match('^sha256:[a-f0-9]{64}$')
      - codexia_restore_candidate_settings is string
      - codexia_restore_candidate_settings is match('^/[^\r\n]+$')
      - codexia_restore_candidate_introspection_secret_file is string
      - codexia_restore_candidate_introspection_secret_file is match('^/[^\r\n]+$')
  when: >-
    codexia_restore_candidate_image is defined or codexia_restore_candidate_ledger is defined or
    codexia_restore_candidate_settings is defined or codexia_restore_candidate_introspection_secret_file is defined
  delegate_to: localhost
  become: false
  no_log: true
- name: Run the restore only in isolated scratch storage on the recovery host
  ansible.builtin.command:
    argv: >-
      {{ ['bash', repo_root + '/deploy/backup/backup.sh', 'drill', codexia_backup_directory, codexia_recovery_identity_file, '--approved']
         + (['--candidate-full-image', codexia_restore_candidate_image, '--candidate-ledger', codexia_restore_candidate_ledger,
             '--candidate-api-ready', '--candidate-runtime-settings', codexia_restore_candidate_settings,
             '--candidate-introspection-secret-file', codexia_restore_candidate_introspection_secret_file]
             if codexia_restore_candidate_image is defined else []) }}
  register: codexia_restore_drill_result
  changed_when: true
  delegate_to: localhost
  become: false
  no_log: true
- name: Require encrypted artifact fingerprints to match the isolated restore
  ansible.builtin.assert:
    that:
      - "'Isolated restore verified: database and history fingerprints match' in codexia_restore_drill_result.stdout_lines"
      - codexia_restore_candidate_image is not defined or 'Isolated candidate API readiness verified' in codexia_restore_drill_result.stdout_lines
    fail_msg: Isolated restore verification failed; production storage was not used.
  delegate_to: localhost
  become: false
  no_log: true
- name: Extract the restored ciphertext manifest identity
  ansible.builtin.set_fact:
    codexia_restore_manifest_lines: "{{ codexia_restore_drill_result.stdout_lines | select('match', '^Verified checksum manifest sha256: [a-f0-9]{64}$') | list }}"
  delegate_to: localhost
  become: false
  no_log: true
- name: Reject missing or ambiguous restore evidence
  ansible.builtin.assert:
    that: codexia_restore_manifest_lines | length == 1
  delegate_to: localhost
  become: false
- name: Validate the explicitly selected private receipt output path
  ansible.builtin.assert:
    that:
      - codexia_restore_receipt_output_file is string
      - codexia_restore_receipt_output_file is match('^/[^\r\n]+$')
  when: codexia_restore_receipt_output_file is defined
  delegate_to: localhost
  become: false
  no_log: true
- name: Inspect receipt output without following links
  ansible.builtin.stat:
    path: "{{ codexia_restore_receipt_output_file }}"
    follow: false
  register: codexia_restore_receipt_stat
  when: codexia_restore_receipt_output_file is defined
  delegate_to: localhost
  become: false
  no_log: true
- name: Refuse to overwrite existing restore evidence
  ansible.builtin.assert:
    that: not codexia_restore_receipt_stat.stat.exists
  when: codexia_restore_receipt_output_file is defined
  delegate_to: localhost
  become: false
- name: Save exact receipt only after successful restore and cleanup
  ansible.builtin.copy:
    dest: "{{ codexia_restore_receipt_output_file }}"
    content: >-
      {{ {'format': 'codexia-restore-receipt/v1', 'checksumManifestSha256': (codexia_restore_manifest_lines[0].split(' ') | last)}
         | combine({'readyImageDigest': (codexia_restore_candidate_image.split('@') | last),
                    'verifiedLedger': codexia_restore_candidate_ledger} if codexia_restore_candidate_image is defined else {})
         | to_json }}
    mode: '0600'
    force: false
  register: codexia_restore_receipt_written
  when: codexia_restore_receipt_output_file is defined
  delegate_to: localhost
  become: false
  no_log: true
- name: Require newly written receipt
  ansible.builtin.assert:
    that: codexia_restore_receipt_written.changed
  when: codexia_restore_receipt_output_file is defined
  delegate_to: localhost
  become: false
