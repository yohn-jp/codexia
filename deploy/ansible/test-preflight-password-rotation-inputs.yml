---
- name: Test protected PostgreSQL preflight-password input validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    codexia_postgres_preflight_password_rotation_file: "{{ lookup('env', 'CODEXIA_TEST_PREFLIGHT_PASSWORD_FILE') }}"
    codexia_preflight_password_restore_receipt_file: "{{ lookup('env', 'CODEXIA_TEST_PREFLIGHT_RESTORE_RECEIPT_FILE') }}"
  tasks:
    - name: Run the production preflight rotation input validator
      ansible.builtin.import_tasks: validate-preflight-password-rotation-inputs.yml
