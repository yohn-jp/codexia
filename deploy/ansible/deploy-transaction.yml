      const [image, previousImage, identity, authSettingsSha256, backupRunId] = process.argv.slice(2);
      if (!/^[a-f0-9]{64}$/.test(authSettingsSha256)) process.exit(2);
      process.stdout.write(JSON.stringify({format: 'codexia-push-deployment/v1', image, previousImage,
        identity: JSON.parse(identity), authMode: "better-auth", authSettingsSha256,
        ...(backupRunId && {backupRunId})}) + '\n');
      NODE
      then
        restore_previous || echo 'Previous API recovery failed after release record failure' >&2
        echo 'Could not commit the successful deployment record; previous Quadlet was restored' >&2
        exit 1
      fi
      if ! chmod 0600 "$release_state.tmp" || ! mv -f -- "$release_state.tmp" "$release_state"; then
        restore_previous || echo 'Previous API recovery failed after release record failure' >&2
        echo 'Could not commit the successful deployment record; previous Quadlet was restored' >&2
        exit 1
      fi
      if ! node - "$transaction_intent" <<'NODE'
      const fs = require('node:fs');
      const target = process.argv[2];
      const value = JSON.parse(fs.readFileSync(target, 'utf8'));
      if (value.format !== 'codexia-deploy-transaction/v1' || value.phase !== 'pending') process.exit(2);
      const temporary = `${target}.tmp`;
      fs.writeFileSync(temporary, JSON.stringify({...value, phase: 'committed'}) + '\n', {mode: 0o600, flag: 'wx'});
      fs.renameSync(temporary, target);
      NODE
      then
        restore_previous || echo 'Previous API recovery failed after transaction commit failure' >&2
        echo 'Could not commit the deployment transaction intent; previous Quadlet was restored' >&2
        exit 1
      fi
      rm -f -- "$transaction_intent" "$transaction_intent.tmp" "$release_state.tmp" "$state_dir/rollback-api.container" "$state_dir/rollback-release.json" || echo 'Committed deployment cleanup was incomplete; next deployment will finish it' >&2
      echo "UPDATED $candidate_image"
  args:
    executable: /bin/bash
  register: codexia_deploy_transaction
  changed_when: "'UPDATED ' in codexia_deploy_transaction.stdout"
  failed_when: false
  no_log: true

- name: Report only an allowlisted deployment transaction failure stage
  ansible.builtin.fail:
    msg: >-
      Deployment transaction failed during
      {{ 'host lock admission' if 'Another Codexia deployment or backup holds the host lock' in (codexia_deploy_transaction.stderr | default('')) else
         'first activation requires a clean API target' if 'first activation requires a clean API target' in (codexia_deploy_transaction.stderr | default('')) else
         'first activation approval window expired' if 'First activation approval window expired before publication' in (codexia_deploy_transaction.stderr | default('')) else
         'stale admission' if 'Stale deployment admission' in (codexia_deploy_transaction.stderr | default('')) else
         'Better Auth settings snapshot' if 'Better Auth settings snapshot is invalid' in (codexia_deploy_transaction.stderr | default('')) else
         'Better Auth migration' if 'Better Auth migrations failed' in (codexia_deploy_transaction.stderr | default('')) else
         'Better Auth client registration verification' if 'Better Auth schema or registered clients failed verification' in (codexia_deploy_transaction.stderr | default('')) else
         'base runtime admission (history volume)' if 'Deployment base runtime requires the rootless history volume' in (codexia_deploy_transaction.stderr | default('')) else
         'base runtime admission (PostgreSQL)' if 'Deployment base runtime requires a healthy rootless PostgreSQL Quadlet' in (codexia_deploy_transaction.stderr | default('')) else
         'base runtime admission (Tunnel)' if 'Deployment base runtime requires the rootless Tunnel Quadlet' in (codexia_deploy_transaction.stderr | default('')) else
         'base runtime admission (generated units)' if 'Deployment base runtime requires canonical generated PostgreSQL and Tunnel units' in (codexia_deploy_transaction.stderr | default('')) else
         'off-VM backup admission' if 'Off-VM backup admission failed; candidate was not applied' in (codexia_deploy_transaction.stderr | default('')) else
         'encrypted backup' if 'Encrypted backup failed; candidate was not applied' in (codexia_deploy_transaction.stderr | default('')) else
         'fresh database schema initialization' if 'Fresh database initialization failed' in (codexia_deploy_transaction.stderr | default('')) else
         'candidate API startup' if 'Candidate API failed to start' in (codexia_deploy_transaction.stderr | default('')) else
         'candidate API readiness' if 'Candidate API readiness failed' in (codexia_deploy_transaction.stderr | default('')) else
         'candidate image identity verification' if 'Candidate API image identity did not match' in (codexia_deploy_transaction.stderr | default('')) else
         'application Tunnel startup' if 'Application Tunnel did not start' in (codexia_deploy_transaction.stderr | default('')) else
         'deployment record commit' if 'Could not commit the successful deployment record' in (codexia_deploy_transaction.stderr | default('')) else
         'an unclassified transaction command' }}
      (cause: {{ 'PostgreSQL authentication' if 'password authentication failed' in (codexia_deploy_transaction.stderr | default('')) else
                 'PostgreSQL connectivity' if 'ECONNREFUSED' in (codexia_deploy_transaction.stderr | default('')) or 'could not translate host name' in (codexia_deploy_transaction.stderr | default('')) else
                 'PostgreSQL authorization' if 'permission denied for schema' in (codexia_deploy_transaction.stderr | default('')) or 'must be owner of' in (codexia_deploy_transaction.stderr | default('')) else
                 'migration packaging' if 'ERR_MODULE_NOT_FOUND' in (codexia_deploy_transaction.stderr | default('')) or 'Cannot find package' in (codexia_deploy_transaction.stderr | default('')) else
                 'container secret or file permissions' if 'EACCES' in (codexia_deploy_transaction.stderr | default('')) or 'permission denied' in (codexia_deploy_transaction.stderr | default('')) else
                 'database pristine-schema guard' if 'untracked database objects' in (codexia_deploy_transaction.stderr | default('')) or 'not pristine' in (codexia_deploy_transaction.stderr | default('')) else
                 'run the approved base stage with verified production data under the codexia service account' if 'Deployment base runtime requires' in (codexia_deploy_transaction.stderr | default('')) else
                 'container runtime or unclassified initializer error' }}, exit code {{ codexia_deploy_transaction.rc | default('unknown') }}).
  when: (codexia_deploy_transaction.rc | default(1) | int) != 0

- name: Report the admitted image deployment result
  ansible.builtin.debug:
    msg: "{{ 'Updated' if codexia_deploy_transaction.changed else 'Verified already active' }} image {{ codexia_image }}."
