---
- name: Require a verification-only, run-bound Full image proof
  ansible.builtin.assert:
    that:
      - ansible_facts.user_id == 'codexia'
      - codexia_service_user == 'codexia'
      - codexia_lifecycle_verification_file is string and codexia_lifecycle_verification_file is match('^/[^\r\n]+$')
      - codexia_lifecycle_candidate_key is string and codexia_lifecycle_candidate_key in ['head', 'prior', 'failed', 'app-update', 'auth-primary', 'auth-update', 'auth-failed']
      - not ansible_check_mode
    fail_msg: Disposable lifecycle deployment requires the rootless codexia identity and verified image evidence.

- name: Read the run-bound lifecycle image proof from the workflow workspace
  ansible.builtin.slurp:
    src: "{{ codexia_lifecycle_verification_file }}"
  delegate_to: localhost
  become: false
  register: codexia_lifecycle_verification_source
  no_log: true

- name: Require the PR image or compatible image to match its verification proof
  ansible.builtin.assert:
    that:
      - codexia_lifecycle_verification.format == 'codexia-push-app-lifecycle-evidence/v1'
      - codexia_lifecycle_verification.repository == codexia_target_repository
      - codexia_lifecycle_verification.repositoryId == codexia_target_repository_id | int
      - codexia_lifecycle_verification.ownerId == codexia_target_owner_id | int
      - codexia_lifecycle_verification.sourceSha == lookup('ansible.builtin.env', 'CODEXIA_LIFECYCLE_SOURCE_SHA')
      - codexia_lifecycle_verification.runId == lookup('ansible.builtin.env', 'GITHUB_RUN_ID') | int
      - codexia_lifecycle_verification.runAttempt == lookup('ansible.builtin.env', 'GITHUB_RUN_ATTEMPT') | int
      - codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].profile == 'full'
      - codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].image is match(codexia_image_pattern)
      - codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].identity.profile == 'full'
      - codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].identity.platform == 'linux/amd64'
      - codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].identity.sourceSha is match('^[a-f0-9]{40}$')
      - codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].identity.migrationFingerprint is match('^sha256:[a-f0-9]{64}$')
      - codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].identity.apiEpoch is integer
      - codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].identity.persistenceFormat is integer
    fail_msg: Lifecycle image is not bound to this run or lacks a complete Full identity.
  vars:
    codexia_lifecycle_verification: "{{ codexia_lifecycle_verification_source.content | b64decode | from_json }}"

- name: Select the current disposable lifecycle candidate identity
  ansible.builtin.set_fact:
    codexia_image: "{{ codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].image }}"
    codexia_profile: full
    codexia_source_sha: "{{ codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].identity.sourceSha }}"
    codexia_deployed_ui_epoch: "{{ codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].identity.apiEpoch }}"
    codexia_lifecycle_fixture: true
    codexia_deployment_certificate_source:
      content: "{{ {'identity': codexia_lifecycle_verification.candidates[codexia_lifecycle_candidate_key].identity} | to_json | b64encode }}"
  vars:
    codexia_lifecycle_verification: "{{ codexia_lifecycle_verification_source.content | b64decode | from_json }}"

# The shared transaction performs preparation, pull, immutable digest and
# embedded identity verification, compatibility and approval checks itself.
# Do not repeat those operations in the disposable admission wrapper.
- name: Apply or recover the API Quadlet under the shared host lock
  ansible.builtin.include_tasks: deploy-transaction.yml
