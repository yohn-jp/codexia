---
- name: Require explicit maintenance approval for the acceptance exercise
  ansible.builtin.assert:
    that:
      - codexia_maintenance_approved | default(false) | bool
      - not ((saved_config.content | b64decode | from_json).enabled | bool)
      - (controller_status.stdout | from_json).state.paused
- name: Require the periodic poll timer to be inactive
  ansible.builtin.command:
    argv: [systemctl, --user, is-active, codexia-updater.timer]
  register: acceptance_timer
  changed_when: false
  failed_when: acceptance_timer.rc not in [3, 4]
- name: Execute the explicit signed-channel acceptance exercise under the updater lock
  ansible.builtin.command:
    argv: [sh, "{{ updater }}", "{{ codexia_stage }}", "{{ config_path }}"]
  changed_when: true
- name: Verify the resulting live topology and paused controller
  ansible.builtin.include_tasks: verify.yml
- name: Confirm the exercise has not enabled polling
  ansible.builtin.assert:
    that:
      - (controller_status.stdout | from_json).state.paused
      - not ((saved_config.content | b64decode | from_json).enabled | bool)
