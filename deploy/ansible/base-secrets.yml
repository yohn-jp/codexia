---
# Database Podman secrets are the VM's durable identity inputs, not a rotation mechanism.
- name: Require explicit secret convergence and rootless service identity
  ansible.builtin.assert:
    that:
      - codexia_secrets_approved | default(false) | bool
      - not ansible_check_mode
      - codexia_service_user is defined
      - codexia_service_user is string and codexia_service_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - codexia_service_uid is integer and codexia_service_uid > 0
      - codexia_service_home == '/home/' + codexia_service_user
    fail_msg: Use the existing rootless service identity and explicitly approve base-secret convergence.
- name: Verify the declared rootless service account matches inventory
  ansible.builtin.command:
    argv: [getent, passwd, "{{ codexia_service_user }}"]
  register: base_secret_service_identity
  changed_when: false
  failed_when: >-
    base_secret_service_identity.rc != 0 or
    base_secret_service_identity.stdout.split(':') | length != 7 or
    base_secret_service_identity.stdout.split(':')[2] | int != codexia_service_uid or
    base_secret_service_identity.stdout.split(':')[5] != codexia_service_home
- name: Require actual rootless Podman
  ansible.builtin.command:
    argv: [podman, info, --format, "{% raw %}{{.Host.Security.Rootless}}{% endraw %}"]
  register: base_secret_rootless
  changed_when: false
  failed_when: base_secret_rootless.rc != 0 or base_secret_rootless.stdout != 'true'
- name: Observe existing Codexia data and runtime identities before secret mutation
  ansible.builtin.command:
    argv: [podman, "{{ item.kind }}", exists, "{{ item.name }}"]
  loop:
    - {kind: volume, name: codexia-postgres}
    - {kind: volume, name: codexia-data}
    - {kind: volume, name: codexia-history}
    - {kind: container, name: codexia-db}
    - {kind: container, name: codexia-api}
  register: base_secret_runtime
  changed_when: false
  failed_when: base_secret_runtime.rc not in [0, 1]
- name: Validate and converge all base credentials without exposing their contents
  no_log: true
  diff: false
  vars:
    base_secret_sources:
      codexia-postgres-admin-password: "{{ codexia_postgres_admin_password_file }}"
      codexia-postgres-app-password: "{{ codexia_postgres_app_password_file }}"
    # Read exact text (including a possible final newline) for adoption.
    base_secret_value: "{{ lookup('ansible.builtin.file', base_secret_sources[item], rstrip=false) | string }}"
  block:
    - name: Validate every secret source path before reading values
      ansible.builtin.assert:
        that:
          - item.value is string
          - item.value is match('^/[^\r\n]+$')
      loop: "{{ base_secret_sources | dict2items }}"
    - name: Inspect protected secret input metadata on the control node
      ansible.builtin.stat:
        path: "{{ item.value }}"
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop: "{{ base_secret_sources | dict2items }}"
      register: base_secret_input_files
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Require regular private input files without symlinks
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.mode in ['0400', '0600']
        fail_msg: Secret inputs must be regular, non-symlink files with mode 0400 or 0600.
      loop: "{{ base_secret_input_files.results }}"
    - name: Validate every credential before any creation
      ansible.builtin.assert:
        that:
          - base_secret_value | length <= 8192
          - base_secret_value is match('^[!-~]+(?:\n)?\Z')
          - not item.startswith('codexia-postgres-') or base_secret_value is match('^[a-fA-F0-9]{64}(?:\n)?\Z')
      loop: "{{ base_secret_sources.keys() | list }}"
    - name: Require separate database credentials
      ansible.builtin.assert:
        that:
          - (lookup('ansible.builtin.file', base_secret_sources['codexia-postgres-admin-password']) | trim) != (lookup('ansible.builtin.file', base_secret_sources['codexia-postgres-app-password']) | trim)
    - name: Observe exact existing secret identities
      ansible.builtin.command:
        argv: [podman, secret, exists, "{{ item }}"]
      loop: "{{ base_secret_sources.keys() | list }}"
      register: base_secrets
      changed_when: false
      failed_when: base_secrets.rc not in [0, 1]
    - name: Refuse implicit replacement of credentials for existing resources
      ansible.builtin.assert:
        that:
          - existing_resources | length == 0 or missing_secrets | length == 0
        fail_msg: Existing application data or runtime with a missing base secret requires explicit recovery.
      vars:
        existing_resources: "{{ base_secret_runtime.results | selectattr('rc', 'equalto', 0) | map(attribute='item.name') | list }}"
        missing_secrets: "{{ base_secrets.results | selectattr('rc', 'equalto', 1) | map(attribute='item') | list }}"
    - name: Read existing secret content only into protected task memory
      ansible.builtin.command:
        argv: [podman, secret, inspect, --showsecret, "{{ item.item }}"]
      loop: "{{ base_secrets.results | selectattr('rc', 'equalto', 0) | list }}"
      register: base_existing_secrets
      changed_when: false
    - name: Verify all existing credentials before creating any missing credential
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json | length) == 1
          - (item.stdout | from_json | first).Spec.Name == item.item.item
          - (item.stdout | from_json | first).SecretData == (lookup('ansible.builtin.file', base_secret_sources[item.item.item], rstrip=false) | string)
        fail_msg: Existing secret differs from declared input; implicit rotation is forbidden.
      loop: "{{ base_existing_secrets.results }}"
    - name: Create only missing credentials for the admitted resources
      ansible.builtin.command:
        argv: [podman, secret, create, "{{ item.item }}", '-']
        expand_argument_vars: false
        stdin: "{{ lookup('ansible.builtin.file', base_secret_sources[item.item], rstrip=false) | string }}"
        stdin_add_newline: false
      loop: "{{ base_secrets.results | selectattr('rc', 'equalto', 1) | list }}"
    - name: Verify resulting secret content and exact name
      ansible.builtin.command:
        argv: [podman, secret, inspect, --showsecret, "{{ item }}"]
      loop: "{{ base_secret_sources.keys() | list }}"
      register: base_verified_secret
      changed_when: false
      failed_when: >-
        base_verified_secret.rc != 0 or
        (base_verified_secret.stdout | from_json | length) != 1 or
        (base_verified_secret.stdout | from_json | first).Spec.Name != item or
        (base_verified_secret.stdout | from_json | first).SecretData != base_secret_value
- name: Report successful base credential convergence without secret contents
  ansible.builtin.debug:
    msg: Verified three canonical base Podman secret identities. No existing secret was rotated.
