---
- name: Require explicit approval for PostgreSQL preflight-password rotation
  ansible.builtin.assert:
    that:
      - codexia_preflight_password_rotation_approved | default(false) | bool
      - not ansible_check_mode
      - journal.stat.exists
    fail_msg: PostgreSQL preflight-password rotation requires an initialized controller, verified backup and restore receipt, and explicit approval.
- name: Verify installed reviewed sources and units before preflight-password rotation
  ansible.builtin.include_tasks: verify-updater-inputs.yml
- name: Verify installed updater units before preflight-password rotation
  ansible.builtin.include_tasks: verify-updater-units.yml
- name: Validate protected preflight password and restore receipt inputs
  ansible.builtin.include_tasks: validate-preflight-password-rotation-inputs.yml
- name: Create private rotation candidate parent outside container mounts
  ansible.builtin.file:
    path: "{{ config_dir }}/maintenance/candidates"
    state: directory
    mode: '0700'
- name: Allocate private preflight-password rotation candidate
  ansible.builtin.tempfile:
    state: directory
    path: "{{ config_dir }}/maintenance/candidates"
    prefix: postgres-preflight-password-
  register: preflight_password_rotation_candidate
- name: Apply backup-gated PostgreSQL preflight-password transaction
  block:
    - name: Create private candidate directories
      ansible.builtin.file:
        path: "{{ preflight_password_rotation_candidate.path }}/{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - credentials
        - quadlet
    - name: Stage replacement preflight password without logging or diff
      ansible.builtin.copy:
        src: "{{ codexia_postgres_preflight_password_rotation_file }}"
        dest: "{{ preflight_password_rotation_candidate.path }}/credentials/postgres-preflight-password"
        mode: '0600'
      no_log: true
      diff: false
    - name: Stage exact private isolated restore receipt without logging or diff
      ansible.builtin.copy:
        src: "{{ codexia_preflight_password_restore_receipt_file }}"
        dest: "{{ preflight_password_rotation_candidate.path }}/restore-receipt.json"
        mode: '0600'
      no_log: true
      diff: false
    - name: Stage observed PostgreSQL Quadlet source for locked ownership validation
      ansible.builtin.copy:
        src: "{{ quadlet_dir }}/codexia-db.container"
        dest: "{{ preflight_password_rotation_candidate.path }}/quadlet/codexia-db.container"
        remote_src: true
        mode: '0600'
    - name: Write strict preflight-password maintenance manifest
      ansible.builtin.copy:
        content: >-
          {{
            {
              'format': 'codexia-updater-maintenance/v1',
              'candidateRoot': preflight_password_rotation_candidate.path,
              'sourceDir': source_dir,
              'unitDir': unit_dir,
              'configPath': config_path,
              'rotatePostgresPreflightPassword': true,
              'preflightPasswordFile': preflight_password_rotation_candidate.path + '/credentials/postgres-preflight-password',
              'restoreReceiptFile': preflight_password_rotation_candidate.path + '/restore-receipt.json',
              'databaseQuadletFile': preflight_password_rotation_candidate.path + '/quadlet/codexia-db.container'
            } | to_nice_json
          }}
          {{ '\n' }}
        dest: "{{ preflight_password_rotation_candidate.path }}/manifest.json"
        mode: '0600'
    - name: Rotate preflight password and verify recovery under the canonical host lock
      ansible.builtin.command:
        argv: [sh, "{{ updater }}", maintain, "{{ config_path }}", "{{ preflight_password_rotation_candidate.path }}/manifest.json"]
      environment: "{{ updater_env }}"
      register: preflight_password_rotation_result
      changed_when: true
      no_log: true
    - name: Require successful PostgreSQL preflight-password transaction
      ansible.builtin.assert:
        that: (preflight_password_rotation_result.stdout | from_json).postgresPreflightPasswordRotated
  always:
    - name: Remove staged preflight password and restore evidence
      ansible.builtin.file:
        path: "{{ preflight_password_rotation_candidate.path }}"
        state: absent
      no_log: true
