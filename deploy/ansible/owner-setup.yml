---
- name: Observe the canonical rootless bridge gateways used by the publication proxy
  ansible.builtin.command:
    argv: [podman, network, inspect, --format, "{% raw %}{{range .Subnets}}{{println .Gateway}}{{end}}{% endraw %}", "{{ item }}"]
  loop: [codexia, codexia-data]
  register: owner_setup_bridge_gateways
  changed_when: false
  failed_when: >-
    owner_setup_bridge_gateways.rc != 0 or
    owner_setup_bridge_gateways.stdout_lines | length != 1 or
    owner_setup_bridge_gateways.stdout is not match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')

- name: Stage the private nonsecret setup-only OAuth configuration
  ansible.builtin.copy:
    content: "CODEXIA_OWNER_SETUP_WEB_REDIRECT_URIS={{ codexia_owner_setup_web_redirect_uris | join(',') }}\n"
    dest: "{{ home }}/.config/codexia-auth/owner-setup.env"
    mode: '0600'
    force: false

- name: Stage the exact immutable setup-only Quadlet for the protected API slot
  vars:
    owner_setup_publication_peers: "{{ owner_setup_bridge_gateways.results | map(attribute='stdout') | list | join(',') }}"
  ansible.builtin.template:
    src: "{{ repo_root }}/deploy/ansible/owner-setup.container.j2"
    dest: "{{ home }}/.config/codexia-auth/owner-setup.container"
    mode: '0600'
    force: false

- name: Install the protected owner setup operator operation
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/ansible/owner-setup.sh"
    dest: "{{ home }}/.local/bin/codexia-owner-setup"
    mode: '0700'

- name: Stage the existing read-only observer for Owner handoff verification
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/ansible/preflight-observe.py"
    dest: "{{ home }}/.local/bin/codexia-preflight-observe"
    mode: '0700'

- name: Initialize a verified new setup installation without issuing the grant
  vars:
    resume: "{{ codexia_expected_bootstrap_resume | default({}) }}"
  environment:
    CODEXIA_OWNER_SETUP_EXPECTED_ORIGIN: "{{ codexia_owner_setup_expected_origin | default('') }}"
    CODEXIA_OWNER_SETUP_EXPECTED_WEB_CLIENT_ID: "{{ codexia_owner_setup_expected_web_client_id | default('') }}"
    CODEXIA_OWNER_SETUP_EXPECTED_WEB_REDIRECT_URIS: "{{ codexia_owner_setup_expected_web_redirect_uris | default([]) | join(',') }}"
  ansible.builtin.command:
    argv: >-
      {{ [home + '/.local/bin/codexia-owner-setup', '--initialize', codexia_auth_bootstrap_image]
         + (['--resume-bootstrap', resume.clusterId + ':' + resume.databaseOid,
             resume.migrationFingerprint] if resume else []) }}
    expand_argument_vars: false
  register: owner_setup_initialization
  changed_when: owner_setup_initialization.stdout != ''

- name: Converge owner setup without passing the key to Ansible
  when: codexia_owner_setup_approved | default(false)
  ansible.builtin.command:
    argv:
      - "{{ home }}/.local/bin/codexia-owner-setup"
      - --converge
      - "{{ codexia_auth_bootstrap_image }}"
      - NEW_APPROVED
      - "{{ codexia_owner_setup_age_recipient }}"
    expand_argument_vars: false
  changed_when: true
