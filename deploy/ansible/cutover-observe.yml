---
- name: Read the installed Codexia cutover baseline
  hosts: codexia
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Require one target and an explicit protected local evidence path
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - codexia_cutover_observation_file is defined
          - codexia_cutover_observation_file is string
          - codexia_cutover_observation_file is match('^/[^\r\n]+$')
          - not ansible_check_mode
        fail_msg: Select exactly one Codexia host and an absolute localhost path for the observation.

    - name: Read the target account facts
      ansible.builtin.setup:
        gather_subset: ['!all', '!min', 'user']

    - name: Confirm the connection uses the canonical non-root account
      ansible.builtin.assert:
        that:
          - ansible_facts.user_id == 'codexia'
          - ansible_facts.user_uid | int > 0
          - ansible_facts.user_dir is match('^/[^\r\n]+$')
          - ansible_facts.user_dir == (codexia_service_home | default(ansible_facts.user_dir))
          - ansible_facts.user_uid | int == (codexia_service_uid | default(ansible_facts.user_uid) | int)
        fail_msg: Connect directly over pinned SSH as the declared Codexia service account.

    - name: Observe rootless Podman, systemd and PostgreSQL without changing application state
      ansible.builtin.script:
        cmd: cutover-observe.sh
        executable: /bin/bash
      environment:
        HOME: "{{ ansible_facts.user_dir }}"
        XDG_CONFIG_HOME: "{{ ansible_facts.user_dir }}/.config"
        XDG_DATA_HOME: "{{ ansible_facts.user_dir }}/.local/share"
        XDG_STATE_HOME: "{{ ansible_facts.user_dir }}/.local/state"
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"
      register: cutover_host_observation
      changed_when: false
      no_log: true

    - name: Write only the redacted observation to the controller
      ansible.builtin.copy:
        content: "{{ cutover_host_observation.stdout | from_json | to_json }}\n"
        dest: "{{ codexia_cutover_observation_file }}"
        mode: '0600'
      delegate_to: localhost
      no_log: true
