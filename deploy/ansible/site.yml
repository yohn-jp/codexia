---
- name: Converge the standalone Codexia updater on an existing rootless VM
  # Explicit recovery dispatch must not depend on the failed source VM or its inventory.
  hosts: "{{ 'localhost' if (codexia_stage | default('')) == 'restore-drill' else 'codexia' }}"
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    home: "{{ codexia_service_home | default(ansible_facts.user_dir) }}"
    config_dir: "{{ home }}/.config/codexia-updater"
    state_dir: "{{ home }}/.local/state/codexia-updater"
    quadlet_dir: "{{ home }}/.config/containers/systemd"
    unit_dir: "{{ home }}/.config/systemd/user"
    source_dir: /opt/codexia-updater
    config_path: "{{ config_dir }}/config.json"
    updater: "{{ source_dir }}/deploy/updater/codexia-updater"
    maintenance_dir: "{{ state_dir }}/maintenance"
    desired_proxy_quadlet: "{{ lookup('ansible.builtin.file', repo_root + '/deploy/updater/codexia-api-proxy.container.example') | replace('ghcr.io/yohn-jp/codexia-backend@sha256:REPLACE_WITH_VERIFIED_DIGEST', codexia_proxy_image) + '\n' }}"
    runtime: "{{ codexia_runtime | default({}) }}"
    updater_env:
      XDG_RUNTIME_DIR: "/run/user/{{ codexia_service_uid | default(ansible_facts.user_uid) }}"
      XDG_STATE_HOME: "{{ home }}/.local/state"
    service_runtime_env:
      HOME: "{{ home }}"
      XDG_CONFIG_HOME: "{{ home }}/.config"
      XDG_DATA_HOME: "{{ home }}/.local/share"
      XDG_STATE_HOME: "{{ home }}/.local/state"
      XDG_RUNTIME_DIR: "/run/user/{{ codexia_service_uid | default(ansible_facts.user_uid) }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ codexia_service_uid | default(ansible_facts.user_uid) }}/bus"
    desired_config:
      format: codexia-standalone-updater/v1
      enabled: false
      stateFile: "{{ state_dir }}/controller.json"
      routeFile: "{{ state_dir }}/route"
      quadletDirectory: "{{ quadlet_dir }}"
      publicKeyFile: "{{ config_dir }}/channel-public.pem"
      githubTokenFile: "{{ config_dir }}/github-read-token"
      frontendIdentityUrl: "{{ codexia_frontend_origin }}/desktop/update-identity.json"
      accessClientIdFile: "{{ config_dir }}/access-client-id"
      accessClientSecretFile: "{{ config_dir }}/access-client-secret"
      observeMilliseconds: "{{ codexia_observe_milliseconds | default(300000) }}"
      initialSlot: blue
      browserAuth: "{{ codexia_browser_auth }}"
      runtime: "{{ runtime }}"
  # Source fact gathering runs before user_uid/user_dir exist. Privileged host setup
  # and the independent recovery drill must not inherit source runtime paths.
  environment: "{{ updater_env if codexia_stage not in ['host', 'restore-drill'] and ansible_facts.user_uid is defined and ansible_facts.user_dir is defined else {} }}"
  tasks:
    - name: Require the explicit local recovery stage and actual execution
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'localhost'
          - not ansible_check_mode
        fail_msg: Run restore-drill explicitly on the isolated local recovery host; check mode does not verify a restore.
      when: codexia_stage == 'restore-drill'
    - name: Run the isolated recovery drill on the Ansible recovery host
      ansible.builtin.include_tasks: restore-drill.yml
      when: codexia_stage == 'restore-drill'
    - name: End recovery drill before querying or changing the source VM
      ansible.builtin.meta: end_host
      when: codexia_stage == 'restore-drill'
    - name: Gather facts only for source VM operations
      ansible.builtin.setup:
    - name: Inspect host and existing runtime without converging application state
      ansible.builtin.include_tasks: inspect.yml
      when: codexia_stage == 'inspect'
    - name: End read-only inspection before any convergence task
      ansible.builtin.meta: end_host
      when: codexia_stage == 'inspect'
    - name: Converge the supported host baseline without touching application services
      ansible.builtin.include_tasks: host.yml
      when: codexia_stage == 'host'
    - name: End host convergence before any application task
      ansible.builtin.meta: end_host
      when: codexia_stage == 'host'
    - name: Require explicit standalone deployment inputs
      ansible.builtin.assert:
        that:
          - ansible_facts.user_uid | int != 0
          - codexia_stage in ['secrets', 'base', 'prepare', 'initialize', 'bootstrap-preflight', 'enable', 'verify', 'maintain', 'backup', 'pause', 'resume', 'rollback', 'acceptance-update', 'acceptance-rollback']
          - codexia_stage in ['secrets', 'base'] or codexia_frontend_origin is match('^https://[a-z0-9.-]+(:[0-9]+)?$')
          - codexia_stage in ['secrets', 'base'] or codexia_proxy_image is match('^ghcr\.io/yohn-jp/codexia-backend@sha256:[a-f0-9]{64}$')
          - codexia_stage in ['secrets', 'base'] or codexia_browser_auth.mode in ['token', 'cloudflare-access']
          - (codexia_observe_milliseconds | default(300000)) is integer
          - (codexia_observe_milliseconds | default(300000)) >= 60000
          - (codexia_observe_milliseconds | default(300000)) <= 3600000
    - name: Validate the shared runtime contract before application convergence
      ansible.builtin.include_tasks: validate-runtime.yml
      when: codexia_stage not in ['secrets', 'base']
    - name: Check rootless prerequisites (do not replace the existing host installation)
      ansible.builtin.command:
        argv: [sh, -ec, 'command -v podman; command -v flock; node -e "if (parseInt(process.versions.node,10) < 22) process.exit(1)"']
      changed_when: false
      check_mode: false
      become: "{{ codexia_stage in ['secrets', 'base'] }}"
      become_user: "{{ codexia_service_user if codexia_stage in ['secrets', 'base'] else omit }}"
      environment: "{{ service_runtime_env if codexia_stage in ['secrets', 'base'] else updater_env }}"
      when: codexia_stage != 'base'
    - name: Check rootless systemd
      ansible.builtin.command:
        argv: [systemctl, --user, show, --property=Version]
      changed_when: false
      check_mode: false
      become: "{{ codexia_stage in ['secrets', 'base'] }}"
      become_user: "{{ codexia_service_user if codexia_stage in ['secrets', 'base'] else omit }}"
      environment: "{{ service_runtime_env if codexia_stage in ['secrets', 'base'] else updater_env }}"
    - name: Converge base Podman secrets before application initialization
      ansible.builtin.include_tasks:
        file: base-secrets.yml
        apply:
          become: true
          become_user: "{{ codexia_service_user }}"
          environment: "{{ service_runtime_env }}"
      when: codexia_stage == 'secrets'
    - name: End secret convergence before application or updater operations
      ansible.builtin.meta: end_host
      when: codexia_stage == 'secrets'
    - name: Converge canonical rootless networks, volumes, PostgreSQL, and Tunnel Quadlets
      ansible.builtin.include_tasks:
        file: base-runtime.yml
        apply:
          become: true
          become_user: "{{ codexia_service_user }}"
          environment: "{{ service_runtime_env }}"
      when: codexia_stage == 'base'
    - name: End base convergence before application or updater operations
      ansible.builtin.meta: end_host
      when: codexia_stage == 'base'
    - name: Check for durable controller state
      ansible.builtin.stat:
        path: "{{ state_dir }}/controller.json"
      register: journal
    - name: Require pre-journal bootstrap preflight
      ansible.builtin.assert:
        that:
          - not journal.stat.exists
        fail_msg: The explicit bootstrap preflight is only for a pre-journal legacy deployment.
      when: codexia_stage == 'bootstrap-preflight'
    - name: Verify a distinct signed bootstrap candidate without stopping the existing writer
      ansible.builtin.include_tasks: bootstrap-preflight.yml
      when: codexia_stage == 'bootstrap-preflight' and not ansible_check_mode
    - name: End bootstrap preflight before other lifecycle operations
      ansible.builtin.meta: end_host
      when: codexia_stage == 'bootstrap-preflight'
    - name: Prepare an uninitialized host
      ansible.builtin.include_tasks: prepare.yml
      when: codexia_stage in ['prepare', 'initialize'] and not journal.stat.exists
    - name: Initialize the exclusive writer
      ansible.builtin.include_tasks: initialize.yml
      when: codexia_stage == 'initialize' and not journal.stat.exists and not ansible_check_mode
    - name: Require an existing controller for initialized lifecycle operations
      ansible.builtin.assert:
        that: journal.stat.exists
      when: codexia_stage in ['verify', 'maintain', 'enable', 'pause', 'resume', 'rollback', 'acceptance-update', 'acceptance-rollback']
    - name: Verify preflight role and secret after initialization without changing them
      ansible.builtin.include_tasks: preflight.yml
      vars:
        preflight_verify_only: true
      when: journal.stat.exists and codexia_stage != 'backup'
    - name: Maintain updater source, configuration and systemd units through the locked controller
      ansible.builtin.include_tasks: maintenance.yml
      when: codexia_stage == 'maintain' and journal.stat.exists and not ansible_check_mode
    - name: Verify initialized controller
      ansible.builtin.include_tasks: verify.yml
      when: journal.stat.exists and codexia_stage != 'backup'
    - name: Ensure boot and poll units after initialization (also repairs interrupted unit installation)
      ansible.builtin.include_tasks: install-units.yml
      when: codexia_stage == 'initialize' and not ansible_check_mode
    - name: Exercise a compatible update or rollback without enabling automatic polling
      ansible.builtin.include_tasks: acceptance.yml
      when: codexia_stage in ['acceptance-update', 'acceptance-rollback'] and not ansible_check_mode
    - name: Enable automatic updates only after live acceptance
      ansible.builtin.include_tasks: enable.yml
      when: codexia_stage == 'enable' and not ansible_check_mode
    - name: Run the controller-locked encrypted backup lifecycle
      ansible.builtin.include_tasks: backup.yml
      when: codexia_stage == 'backup' and not ansible_check_mode
    - name: Run the controller-locked pause, resume or rollback lifecycle
      ansible.builtin.include_tasks: lifecycle.yml
      when: codexia_stage in ['pause', 'resume', 'rollback'] and not ansible_check_mode
