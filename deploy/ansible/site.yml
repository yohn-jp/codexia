---
- name: Converge the Codexia push-deployment runtime
  # Recovery is always local; host, bootstrap and deployment target the declared VM.
  hosts: "{{ 'localhost' if (codexia_stage | default('')) in ['restore-drill', 'deploy-lifecycle-fixture'] else 'codexia' }}"
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars_files: [repository-vars.yml]
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    home: "{{ codexia_service_home | default(ansible_facts.user_dir | default('')) }}"
    quadlet_dir: "{{ home }}/.config/containers/systemd"
    service_runtime_env:
      CODEXIA_IMAGE_REPOSITORY: "{{ codexia_image_repository }}"
      CODEXIA_TARGET_REPOSITORY: "{{ codexia_target_repository }}"
      CODEXIA_TARGET_REPOSITORY_ID: "{{ codexia_target_repository_id }}"
      CODEXIA_TARGET_OWNER_ID: "{{ codexia_target_owner_id }}"
      HOME: "{{ home }}"
      XDG_CONFIG_HOME: "{{ home }}/.config"
      XDG_DATA_HOME: "{{ home }}/.local/share"
      XDG_STATE_HOME: "{{ home }}/.local/state"
      XDG_RUNTIME_DIR: "/run/user/{{ codexia_service_uid | default(ansible_facts.user_uid | default(0)) }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ codexia_service_uid | default(ansible_facts.user_uid | default(0)) }}/bus"
  environment: "{{ service_runtime_env if (codexia_stage | default('')) in ['secrets', 'base', 'deploy', 'deploy-lifecycle-fixture'] and ansible_facts.user_uid is defined else {} }}"
  tasks:
    - name: Reject unsupported or obsolete deployment operations
      ansible.builtin.assert:
        that:
          - codexia_stage in ['inspect', 'bootstrap', 'host', 'secrets', 'base', 'auth-runtime', 'deploy', 'deploy-lifecycle-fixture', 'restore-drill']
        fail_msg: Select a supported operation from the Ansible inventory example.

    - name: Require local execution for a restore drill
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'localhost'
          - not ansible_check_mode
        fail_msg: Restore drills run on an isolated local recovery host.
      when: codexia_stage == 'restore-drill'

    - name: Verify an encrypted backup in isolated recovery storage
      ansible.builtin.include_tasks: restore-drill.yml
      when: codexia_stage == 'restore-drill'

    - name: End isolated recovery before connecting to the VM
      ansible.builtin.meta: end_host
      when: codexia_stage == 'restore-drill'

    - name: Gather target host facts
      ansible.builtin.setup:
        # Host inspection needs platform/service facts. Convergence and deployment
        # require the effective user only; avoid full discovery per rollout.
        gather_subset: "{{ ['!all', '!min', 'user', 'distribution', 'architecture', 'service_mgr'] if codexia_stage in ['inspect', 'host', 'bootstrap'] else ['!all', '!min', 'user'] }}"
      become: "{{ codexia_stage == 'deploy-lifecycle-fixture' }}"
      become_user: "{{ codexia_service_user | default('codexia') }}"

    - name: Inspect the current host without mutation
      ansible.builtin.include_tasks: inspect.yml
      when: codexia_stage == 'inspect'

    - name: Inspect the retired deployment journal before ordinary convergence
      ansible.builtin.stat:
        path: "{{ home }}/.local/state/codexia-deploy/cutover-transaction.json"
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      become: "{{ ansible_facts.user_id != (codexia_service_user | default('codexia')) }}"
      become_user: root
      register: codexia_retired_journal
      when: codexia_stage in ['bootstrap', 'host', 'secrets', 'base', 'auth-runtime']

    - name: Reject ordinary convergence when a retired deployment journal remains
      ansible.builtin.assert:
        that:
          - not codexia_retired_journal.stat.exists
        fail_msg: Retired deployment journal requires explicit operator recovery before ordinary convergence.
      when: codexia_stage in ['bootstrap', 'host', 'secrets', 'base', 'auth-runtime']

    - name: Require the certified browser client before fresh install convergence
      ansible.builtin.assert:
        that:
          - codexia_public_origin == codexia_owner_setup_expected_origin
          - (codexia_oauth_owner_client_ids.split(',') | first) == codexia_owner_setup_expected_web_client_id
          - (codexia_owner_setup_web_redirect_uris | unique | sort) == (codexia_owner_setup_expected_web_redirect_uris | sort)
        fail_msg: Browser setup origin, Web client or callback list differs from the certified frontend.
      when:
        - codexia_stage == 'bootstrap'
        - codexia_bootstrap_stages is defined
        - codexia_owner_setup_install_intent | default(false)

    - name: Converge the rootless host account and dependencies
      ansible.builtin.include_tasks: host.yml
      when: >-
        codexia_stage == 'host' or
        (codexia_stage == 'bootstrap' and 'host' in (codexia_bootstrap_stages | default(['host', 'secrets', 'base', 'auth-runtime'])))

    - name: Converge the protected runtime SSH key when the existing host stage is not required
      ansible.builtin.include_tasks: deploy-ssh-key.yml
      when:
        - codexia_stage == 'bootstrap'
        - codexia_bootstrap_stages is defined
        - "'host' not in codexia_bootstrap_stages"
        - codexia_deploy_ssh_public_key is defined
        - codexia_host_approved | default(false) | bool

    - name: Converge managed credentials on every admitted R4 run
      when: codexia_stage == 'bootstrap' and codexia_managed_bootstrap_secrets | default(false)
      become: true
      become_user: "{{ codexia_service_user }}"
      environment: "{{ service_runtime_env }}"
      block:
        - ansible.builtin.include_tasks: managed-bootstrap-secrets.yml

    - name: Install only explicitly authorized base credentials
      ansible.builtin.include_tasks:
        file: base-secrets.yml
        apply:
          become: true
          become_user: "{{ codexia_service_user }}"
          environment: "{{ service_runtime_env }}"
      when: >-
        codexia_stage == 'secrets' or
        (codexia_stage == 'bootstrap' and not (codexia_managed_bootstrap_secrets | default(false)) and 'secrets' in (codexia_bootstrap_stages | default(['host', 'secrets', 'base', 'auth-runtime'])))

    - name: Converge an observed absent Codexia database before base and auth initialization
      ansible.builtin.include_tasks:
        file: recreate-missing-app-database.yml
        apply:
          become: true
          become_user: "{{ codexia_service_user }}"
          environment: "{{ service_runtime_env }}"
      when: codexia_stage == 'bootstrap' and codexia_expected_absent_database is defined

    - name: Converge canonical database, networks, volumes and Tunnel Quadlets
      ansible.builtin.include_tasks:
        file: base-runtime.yml
        apply:
          become: true
          become_user: "{{ codexia_service_user }}"
          environment: "{{ service_runtime_env }}"
      when: >-
        (codexia_stage == 'base' and not (codexia_backup_runtime_approved | default(false) is sameas true)) or
        (codexia_stage == 'bootstrap' and 'base' in (codexia_bootstrap_stages | default(['host', 'secrets', 'base', 'auth-runtime'])))

    - name: Provision the backup runtime on an explicitly approved ACTIVE installation
      ansible.builtin.include_tasks:
        file: backup-runtime.yml
        apply:
          become: "{{ ansible_facts.user_id != (codexia_service_user | default('codexia')) }}"
          become_user: "{{ codexia_service_user | default('codexia') }}"
          environment: "{{ service_runtime_env }}"
      vars:
        backup_config: "{{ home }}/.config/codexia-backup"
        backup_root: "{{ home }}/.local/share/codexia-backup"
        backup_staging: "{{ codexia_backup_staging_directory | default(backup_root + '/staging') }}"
        backup_venv: "{{ backup_root }}/sdk-{{ lookup('ansible.builtin.file', repo_root + '/deploy/backup/requirements.lock', rstrip=false) | hash('sha256') }}"
      when: codexia_stage == 'base' and codexia_backup_runtime_approved | default(false) is sameas true

    - name: Provision Better Auth runtime role, schema, and protected secrets before first activation
      ansible.builtin.include_tasks:
        file: auth-runtime.yml
        apply:
          become: "{{ ansible_facts.user_id != codexia_service_user }}"
          become_user: "{{ codexia_service_user }}"
          environment: "{{ service_runtime_env }}"
      when: >-
        codexia_stage == 'auth-runtime' or (codexia_stage == 'bootstrap' and
        'auth-runtime' in (codexia_bootstrap_stages | default(['host', 'secrets', 'base', 'auth-runtime']))
        and codexia_auth_runtime_approved | default(false) | bool)

    - name: Require a certified immutable release for the push deployment
      ansible.builtin.assert:
        that:
          - ansible_facts.user_id == 'codexia'
          - codexia_service_user == 'codexia'
          - codexia_image_repository | length > 0
          - codexia_image is match(codexia_image_pattern)
          - codexia_source_sha is match('^[a-f0-9]{40}$')
          - codexia_profile == 'full'
          - codexia_verified_main_sha is match('^[a-f0-9]{40}$')
          - codexia_deployed_ui_epoch is integer and codexia_deployed_ui_epoch > 0
          - codexia_deployment_certificate_file is string and codexia_deployment_certificate_file is match('^/[^\\r\\n]+$')
          - not ansible_check_mode
        fail_msg: Push deployment requires the rootless service identity, certified image, and exact-main provenance.
      when: codexia_stage == 'deploy'

    - name: Deploy the certified image under a serialized host lock
      ansible.builtin.include_tasks:
        file: deploy.yml
        apply:
          environment: "{{ service_runtime_env }}"
      when: codexia_stage == 'deploy'

    - name: Allow the disposable app lifecycle fixture stage
      ansible.builtin.assert:
        that:
          - codexia_stage == 'deploy-lifecycle-fixture'
          - inventory_hostname == 'localhost'
          - ansible_connection == 'local'
          - lookup('ansible.builtin.env', 'GITHUB_ACTIONS') == 'true'
          - codexia_actions_repository is match('^[A-Za-z0-9-]+/codexia$')
          - codexia_target_repository_id is match('^[1-9][0-9]*$')
          - codexia_target_owner_id is match('^[1-9][0-9]*$')
          - lookup('ansible.builtin.env', 'GITHUB_EVENT_NAME') in ['pull_request', 'workflow_dispatch']
          - lookup('ansible.builtin.env', 'GITHUB_RUN_ID') is match('^[1-9][0-9]*$')
          - lookup('ansible.builtin.env', 'GITHUB_SHA') is match('^[a-f0-9]{40}$')
        fail_msg: The verification-only deployment stage is restricted to its run-bound disposable GitHub Actions fixture.
      when: codexia_stage == 'deploy-lifecycle-fixture'

    - name: Run the shared deployment transaction for verified disposable OCI images
      ansible.builtin.include_tasks:
        file: deploy-lifecycle-fixture.yml
        apply:
          become: true
          become_user: "{{ codexia_service_user }}"
          environment: "{{ service_runtime_env | combine({'PATH': codexia_lifecycle_fault_path ~ ':' ~ lookup('ansible.builtin.env', 'PATH')}) if codexia_lifecycle_fault_path is defined else service_runtime_env }}"
      when: codexia_stage == 'deploy-lifecycle-fixture'
