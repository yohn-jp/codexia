---
# The controller binds positive absence to the reviewed R4 plan. This is not
# an extra approval; the existing database-initialization approval authorizes it.
- name: Require approved new installation on the pinned absent database
  ansible.builtin.assert:
    that:
      - codexia_stage == 'bootstrap'
      - codexia_database_initialization_approved | default(false) | bool
      - codexia_auth_runtime_approved | default(false) | bool
      - codexia_owner_setup_install_intent | default(false) | bool
      - codexia_expected_absent_database is string
      - codexia_expected_absent_database is match('^(absent|[1-9][0-9]{0,19})$')
      - not ansible_check_mode
    fail_msg: DB absence convergence requires the reviewed R4 installation and initialization approval.

- name: Verify the existing PostgreSQL container before logical database recreation
  ansible.builtin.include_tasks: verify-base-db-container.yml
  when: codexia_expected_absent_database != 'absent'

- name: Ensure the deployment lock directory exists
  ansible.builtin.file:
    path: "{{ home }}/.local/state/codexia-deploy"
    state: directory
    mode: '0700'

- name: Verify and prepare the publication gate before absent database recovery
  ansible.builtin.include_tasks: prepare-api-gate.yml

- name: Recheck database absence, clean the obsolete API slot and recreate only the missing logical database
  ansible.builtin.command:
    argv: [/usr/bin/python3, '-', "{{ codexia_expected_absent_database }}"]
    stdin: "{{ lookup('ansible.builtin.file', repo_root + '/deploy/ansible/reset-absent-app-database.py', rstrip=false) }}"
    expand_argument_vars: false
  register: absent_database_reset
  changed_when: "'CONVERGED_ABSENT_DATABASE' in absent_database_reset.stdout"
