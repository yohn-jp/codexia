---
- name: Require explicit backup approval and protected external inputs
  ansible.builtin.assert:
    that:
      - codexia_backup_approved | default(false) | bool
      - codexia_backup_destination is string
      - codexia_backup_destination is match('^/[^\r\n]+$')
      - codexia_backup_recipient is string
      - codexia_backup_recipient is match('^age1[0-9a-z]+$')
    fail_msg: Provide explicit approval, an existing off-VM mount path, and an externally managed age recipient.
  no_log: true
- name: Inspect the declared backup destination without following links
  ansible.builtin.stat:
    path: "{{ codexia_backup_destination }}"
    follow: false
  register: codexia_backup_destination_stat
  no_log: true
- name: Require an existing real destination directory
  ansible.builtin.assert:
    that:
      - codexia_backup_destination_stat.stat.isdir | default(false)
      - not (codexia_backup_destination_stat.stat.islnk | default(false))
    fail_msg: Backup destination must be an existing directory on an approved off-VM filesystem.
  no_log: true
- name: Observe whether a controller journal already exists
  ansible.builtin.stat:
    path: "{{ state_dir }}/controller.json"
    follow: false
  register: codexia_backup_journal
- name: Refuse an unknown controller journal path
  ansible.builtin.assert:
    that:
      - not codexia_backup_journal.stat.exists or (codexia_backup_journal.stat.isreg | default(false))
      - not (codexia_backup_journal.stat.islnk | default(false))
    fail_msg: Existing controller state must be a regular file before backup.
  no_log: true
- name: Observe controller state before taking the backup window
  ansible.builtin.command:
    argv: ["{{ updater }}", status, "{{ config_path }}"]
  register: codexia_backup_before
  changed_when: false
  no_log: true
  when: codexia_backup_journal.stat.exists
- name: Require the signed release record for a pre-journal legacy backup
  ansible.builtin.assert:
    that:
      - codexia_installed_release_file is defined
      - codexia_installed_release_file is string
      - codexia_installed_release_file is match('^/[^\r\n]+$')
    fail_msg: A pre-journal backup requires the exact signed legacy release record.
  no_log: true
  when: not codexia_backup_journal.stat.exists
- name: Inspect the signed release input on the control node
  ansible.builtin.stat:
    path: "{{ codexia_installed_release_file }}"
    follow: false
    checksum_algorithm: sha1
  register: codexia_backup_release_source
  delegate_to: localhost
  become: false
  no_log: true
  when: not codexia_backup_journal.stat.exists
- name: Require a regular signed release input
  ansible.builtin.assert:
    that:
      - codexia_backup_release_source.stat.isreg | default(false)
      - not (codexia_backup_release_source.stat.islnk | default(false))
    fail_msg: The legacy release record must be a regular non-symlink file.
  no_log: true
  when: not codexia_backup_journal.stat.exists
- name: Inspect any previously staged legacy release record
  ansible.builtin.stat:
    path: "{{ config_dir }}/backup-installed-release.json"
    follow: false
    checksum_algorithm: sha1
  register: codexia_backup_release_staged
  no_log: true
  when: not codexia_backup_journal.stat.exists
- name: Reject any staged signed release record that differs from the declared input
  ansible.builtin.assert:
    that:
      - not codexia_backup_release_staged.stat.exists or (codexia_backup_release_staged.stat.isreg | default(false))
      - not codexia_backup_release_staged.stat.exists or not (codexia_backup_release_staged.stat.islnk | default(false))
      - not codexia_backup_release_staged.stat.exists or codexia_backup_release_staged.stat.checksum == codexia_backup_release_source.stat.checksum
      - not codexia_backup_release_staged.stat.exists or codexia_backup_release_staged.stat.mode == '0600'
      - not codexia_backup_release_staged.stat.exists or codexia_backup_release_staged.stat.pw_name == codexia_service_user
    fail_msg: A different pre-journal release record is already staged; it was not overwritten.
  no_log: true
  when: not codexia_backup_journal.stat.exists
- name: Stage only the exact signed legacy release input
  ansible.builtin.copy:
    src: "{{ codexia_installed_release_file }}"
    dest: "{{ config_dir }}/backup-installed-release.json"
    mode: '0600'
    force: false
  register: codexia_backup_release_copy
  no_log: true
  when: not codexia_backup_journal.stat.exists and not codexia_backup_release_staged.stat.exists
- name: Run the controller-locked backup window
  ansible.builtin.command:
    argv:
      - "{{ updater }}"
      - backup
      - "{{ config_path }}"
      - "{{ config_dir }}/backup-installed-release.json"
      - "{{ codexia_backup_destination }}"
      - "{{ codexia_backup_recipient }}"
      - --approved
  register: codexia_backup_result
  changed_when: true
  no_log: true
  when: not codexia_backup_journal.stat.exists
- name: Run the controller-locked backup window for an initialized service
  ansible.builtin.command:
    argv:
      - "{{ updater }}"
      - backup
      - "{{ config_path }}"
      - "{{ codexia_backup_destination }}"
      - "{{ codexia_backup_recipient }}"
      - --approved
  register: codexia_backup_result
  changed_when: true
  no_log: true
  when: codexia_backup_journal.stat.exists
- name: Verify the prior controller journal, pause state, route and writer were restored
  ansible.builtin.command:
    argv: ["{{ updater }}", status, "{{ config_path }}"]
  register: codexia_backup_after
  changed_when: false
  no_log: true
  when: codexia_backup_journal.stat.exists
- name: Require backup recovery to preserve controller and writer ownership
  ansible.builtin.assert:
    that:
      - (codexia_backup_after.stdout | from_json).state.journal == (codexia_backup_before.stdout | from_json).state.journal
      - (codexia_backup_after.stdout | from_json).state.paused == (codexia_backup_before.stdout | from_json).state.paused
      - (codexia_backup_after.stdout | from_json).state.lastError == (codexia_backup_before.stdout | from_json).state.lastError
      - (codexia_backup_after.stdout | from_json).observed == (codexia_backup_before.stdout | from_json).observed
    fail_msg: Backup completed without restoring the exact prior controller state and single-writer topology.
  no_log: true
  when: codexia_backup_journal.stat.exists
- name: Verify the signed legacy release is serving again after a pre-journal backup
  ansible.builtin.command:
    argv:
      - "{{ updater }}"
      - verify-legacy
      - "{{ config_path }}"
      - "{{ config_dir }}/backup-installed-release.json"
  register: codexia_backup_legacy_after
  changed_when: false
  no_log: true
  when: not codexia_backup_journal.stat.exists
- name: Report encrypted backup completion without exposing destination inputs
  ansible.builtin.debug:
    msg: Encrypted backup completed under the updater lock; controller journal, pause state, timer state, route and writer were restored.
