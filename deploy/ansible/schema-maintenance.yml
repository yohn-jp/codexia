---
- name: Require explicit schema-maintenance approval and exact evidence inputs
  ansible.builtin.assert:
    that:
      - codexia_maintenance_approved | default(false) | bool
      - codexia_schema_target_release_file is defined
      - codexia_schema_target_release_file is string
      - codexia_schema_target_release_file is match('^/[^\r\n]+$')
      - codexia_restore_receipt_file is defined
      - codexia_restore_receipt_file is string
      - codexia_restore_receipt_file is match('^/[^\r\n]+$')
    fail_msg: Provide explicit approval, the signed target release, and the exact isolated restore receipt.
  no_log: true
- name: Verify reviewed updater sources and configuration before schema maintenance
  ansible.builtin.include_tasks: verify-updater-inputs.yml
- name: Stage schema release and restore receipt privately
  ansible.builtin.tempfile:
    state: directory
    path: "{{ config_dir }}"
    prefix: schema-maintenance-
  register: schema_maintenance_dir
- name: Execute the locked additive schema maintenance transaction
  block:
    - name: Copy exact signed target release and restore receipt
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ schema_maintenance_dir.path }}/{{ item.name }}"
        mode: '0600'
      loop:
        - {src: "{{ codexia_schema_target_release_file }}", name: target-release.json}
        - {src: "{{ codexia_restore_receipt_file }}", name: restore-receipt.json}
      no_log: true
    - name: Apply and verify the same-epoch additive schema transition
      ansible.builtin.command:
        argv: [sh, "{{ updater }}", schema-maintenance, "{{ config_path }}", "{{ schema_maintenance_dir.path }}/target-release.json", "{{ schema_maintenance_dir.path }}/restore-receipt.json", --approved]
      register: schema_maintenance_result
      changed_when: (schema_maintenance_result.stdout | from_json).committed
      no_log: true
    - name: Require a committed schema maintenance result
      ansible.builtin.assert:
        that:
          - (schema_maintenance_result.stdout | from_json).format == 'codexia-schema-maintenance/v1'
          - (schema_maintenance_result.stdout | from_json).committed
  always:
    - name: Remove staged schema maintenance evidence
      ansible.builtin.file:
        path: "{{ schema_maintenance_dir.path }}"
        state: absent
