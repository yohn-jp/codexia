---
- name: Apply an approved pair maintenance phase
  hosts: codexia
  gather_facts: false
  any_errors_fatal: true
  vars:
    home: "{{ ansible_facts.user_dir }}"
    state_dir: "{{ home }}/.local/state/codexia-deploy"
    quadlet_dir: "{{ home }}/.config/containers/systemd"
    candidate_unit: >-
      {{ quadlet_dir + '/codexia-api.container'
         if cutover_request.priorImage == cutover_request.candidateImage
         else state_dir + '/candidate-cutover-' + cutover_request.candidateImage.split('@sha256:')[-1] + '.container' }}
    runtime_environment:
      HOME: "{{ home }}"
      XDG_CONFIG_HOME: "{{ home }}/.config"
      XDG_DATA_HOME: "{{ home }}/.local/share"
      XDG_STATE_HOME: "{{ home }}/.local/state"
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"
      CODEXIA_PUSH_STATE_DIR: "{{ state_dir }}"
      CODEXIA_PUSH_QUADLET_DIR: "{{ quadlet_dir }}"
      CODEXIA_BACKUP_DESTINATION: "{{ lookup('ansible.builtin.env', 'CODEXIA_BACKUP_DESTINATION') }}"
      CODEXIA_BACKUP_RECIPIENT: "{{ lookup('ansible.builtin.env', 'CODEXIA_BACKUP_AGE_RECIPIENT') }}"
  tasks:
    - name: Require one protected controller request and one target
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - cutover_request is mapping
          - cutover_output_file is match('^/[^\r\n]+$')
          - cutover_operation in ['stage', 'observe', 'admit', 'checkpoint', 'apply', 'open-tunnel', 'recover-quiesce', 'recover', 'publishing', 'finish']
          - cutover_operation == 'observe' or cutover_request.candidateImage is match('^ghcr\.io/yohn-jp/codexia-backend@sha256:[a-f0-9]{64}$')
          - cutover_operation == 'observe' or cutover_request.settingsSha256 is match('^[a-f0-9]{64}$')
          - not ansible_check_mode

    - name: Read the service account facts
      ansible.builtin.setup:
        gather_subset: ['!all', '!min', 'user']

    - name: Confirm connection uses the canonical non-root account
      ansible.builtin.assert:
        that:
          - ansible_facts.user_id == 'codexia'
          - ansible_facts.user_uid | int > 0
          - ansible_facts.user_dir == (codexia_service_home | default(ansible_facts.user_dir))

    - name: Create a private invocation directory in canonical deployment state
      ansible.builtin.tempfile:
        state: directory
        path: "{{ state_dir }}"
        prefix: cutover-invocation-
      register: cutover_invocation

    - name: Execute the approved host operation
      environment: "{{ runtime_environment | combine({'CODEXIA_BACKUP_PROGRAM': cutover_invocation.path + '/backup.sh'}) }}"
      block:
        - name: Copy versioned helpers into the private invocation
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ cutover_invocation.path }}/{{ item | basename }}"
            mode: '0700'
          loop: "{{ ['cutover-host.sh', '../backup/backup.sh'] + query('ansible.builtin.fileglob', 'cutover-*.py') }}"

        - name: Supply the canonical API Quadlet for rendering under the host lock
          ansible.builtin.copy:
            src: ../quadlet/codexia-api.container
            dest: "{{ cutover_invocation.path }}/template.container"
            mode: '0600'
          when: cutover_operation == 'stage'

        - name: Bind the protected request to the canonical Quadlet and stage input paths
          ansible.builtin.copy:
            content: >-
              {{ cutover_request | combine({'candidateUnit': candidate_unit,
                'stageUnit': cutover_invocation.path + '/template.container'}) | to_json }}
            dest: "{{ cutover_invocation.path }}/request.json"
            mode: '0600'
          no_log: true
          when: cutover_operation != 'observe'

        - name: Verify and execute the host checkpoint under the canonical host lock
          ansible.builtin.command:
            argv: >-
              {{ [cutover_invocation.path + '/cutover-host.sh', cutover_operation]
                 + ([cutover_invocation.path + '/request.json'] if cutover_operation != 'observe' else []) }}
          register: host_result
          no_log: true
          changed_when: cutover_operation != 'observe'

        - name: Write the allowlisted result on the protected controller
          ansible.builtin.copy:
            content: "{{ (host_result.stdout | from_json) | to_json }}\n"
            dest: "{{ cutover_output_file }}"
            mode: '0600'
          delegate_to: localhost
          no_log: true
      always:
        - name: Remove invocation inputs and helpers
          ansible.builtin.file:
            path: "{{ cutover_invocation.path }}"
            state: absent
