---
- name: Inspect the legacy Tunnel Quadlet without following symlinks
  ansible.builtin.stat:
    path: "{{ quadlet_dir }}/codexia-tunnel.container"
    follow: false
  register: tunnel_legacy_stat
- name: Require a real legacy Tunnel Quadlet
  ansible.builtin.assert:
    that:
      - tunnel_legacy_stat.stat.exists
      - tunnel_legacy_stat.stat.isreg | default(false)
      - not (tunnel_legacy_stat.stat.islnk | default(false))
    fail_msg: Tunnel Quadlet must be a regular non-symlink file before cutover.
- name: Read the existing Tunnel Quadlet before writer cutover
  ansible.builtin.slurp:
    path: "{{ quadlet_dir }}/codexia-tunnel.container"
  register: tunnel_legacy_quadlet
- name: Require the canonical legacy dependency pair before cutover
  ansible.builtin.assert:
    that:
      - "(tunnel_legacy_quadlet.content | b64decode | split('\n') | select('equalto', 'Requires=codexia-api.service') | list | length) == 1"
      - "(tunnel_legacy_quadlet.content | b64decode | split('\n') | select('equalto', 'After=network-online.target codexia-api.service') | list | length) == 1"
      - "'Requires=codexia-api-proxy.service' not in (tunnel_legacy_quadlet.content | b64decode | split('\n'))"
      - "'After=network-online.target codexia-api-proxy.service' not in (tunnel_legacy_quadlet.content | b64decode | split('\n'))"
    fail_msg: Tunnel Quadlet is not in the canonical legacy state; restore it through the documented maintenance procedure.
