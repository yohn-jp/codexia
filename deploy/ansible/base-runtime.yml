---
- name: Require explicit approval for rootless base runtime convergence
  ansible.builtin.assert:
    that:
      - codexia_base_approved | default(false) | bool
      - not ansible_check_mode
      - codexia_service_user is defined
      - codexia_service_user is string and codexia_service_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - codexia_service_uid is integer and codexia_service_uid > 0
      - codexia_service_home == '/home/' + codexia_service_user
    fail_msg: Use the existing rootless service identity and explicitly approve base runtime convergence from the bootstrap account.
- name: Verify the declared rootless service account matches inventory
  ansible.builtin.command:
    argv: [getent, passwd, "{{ codexia_service_user }}"]
  register: base_runtime_service_identity
  changed_when: false
  failed_when: >-
    base_runtime_service_identity.rc != 0 or
    base_runtime_service_identity.stdout.split(':') | length != 7 or
    base_runtime_service_identity.stdout.split(':')[2] | int != codexia_service_uid or
    base_runtime_service_identity.stdout.split(':')[5] != codexia_service_home
- name: Require the repository-validated PostgreSQL image digest
  ansible.builtin.assert:
    that:
      - "'Image=docker.io/library/postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536' in (lookup('ansible.builtin.file', repo_root + '/deploy/quadlet/codexia-db.container', rstrip=false) | split('\n'))"
    fail_msg: A pinned base image input differs from the reviewed repository design; no runtime resources will be changed.
- name: Require actual rootless Podman
  ansible.builtin.command:
    argv: [podman, info, --format, "{% raw %}{{.Host.Security.Rootless}}{% endraw %}"]
  register: base_runtime_rootless
  changed_when: false
  failed_when: base_runtime_rootless.rc != 0 or base_runtime_rootless.stdout != 'true'
- name: Require all fixed base secret identities in one read-only module invocation
  # Preserve the original fail-closed presence check for every secret, while
  # avoiding four separate Ansible task/module round-trips per convergence.
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -eu
      - -c
      - >-
        for secret in codexia-postgres-admin-password codexia-postgres-app-password; do
          podman secret exists "$secret";
        done
    expand_argument_vars: false
  register: base_runtime_secrets
  changed_when: false
  failed_when: base_runtime_secrets.rc != 0
- name: Observe fixed network identities before any runtime mutation
  ansible.builtin.command:
    argv: [podman, network, exists, "{{ item }}"]
  loop: [codexia, codexia-data]
  register: base_runtime_networks
  changed_when: false
  failed_when: base_runtime_networks.rc not in [0, 1]
- name: Inspect existing network identities and isolation settings
  ansible.builtin.command:
    argv:
      - podman
      - network
      - inspect
      - --format
      - "{% raw %}{{.Name}}|{{.Driver}}|{{.Internal}}{% endraw %}"
      - "{{ item.item }}"
  loop: "{{ base_runtime_networks.results | selectattr('rc', 'equalto', 0) | list }}"
  register: base_runtime_network_details
  changed_when: false
- name: Reject network identity or reachability drift
  ansible.builtin.assert:
    that:
      - item.stdout.split('|') | length == 3
      - item.stdout.split('|')[0] == item.item.item
      - item.stdout.split('|')[1] == 'bridge'
      - item.stdout.split('|')[2] == ('true' if item.item.item == 'codexia-data' else 'false')
    fail_msg: Existing Codexia network differs from the canonical private network contract.
  loop: "{{ base_runtime_network_details.results }}"
- name: Observe fixed persistent volume identities before any runtime mutation
  ansible.builtin.command:
    argv: [podman, volume, exists, "{{ item }}"]
  loop: [codexia-postgres, codexia-data, codexia-history]
  register: base_runtime_volumes
  changed_when: false
  failed_when: base_runtime_volumes.rc not in [0, 1]
- name: Inspect existing persistent volume names and mountpoints
  ansible.builtin.command:
    argv:
      - podman
      - volume
      - inspect
      - --format
      - "{% raw %}{{.Name}}|{{.Mountpoint}}{% endraw %}"
      - "{{ item.item }}"
  loop: "{{ base_runtime_volumes.results | selectattr('rc', 'equalto', 0) | list }}"
  register: base_runtime_volume_details
  changed_when: false
- name: Reject unexpected persistent volume identities
  ansible.builtin.assert:
    that:
      - item.stdout.split('|') | length == 2
      - item.stdout.split('|')[0] == item.item.item
      - item.stdout.split('|')[1] is match('^/.+')
    fail_msg: Existing Codexia volume identity or mountpoint is invalid; no volume will be replaced.
  loop: "{{ base_runtime_volume_details.results }}"
- name: Observe the database container identity
  ansible.builtin.command:
    argv: [podman, container, exists, codexia-db]
  register: base_runtime_db_container
  changed_when: false
  failed_when: base_runtime_db_container.rc not in [0, 1]
- name: Inspect the database systemd service state
  ansible.builtin.command:
    argv: [systemctl, --user, is-active, codexia-db.service]
  register: base_runtime_db_service
  changed_when: false
  failed_when: base_runtime_db_service.rc not in [0, 3, 4]
  check_mode: false
- name: Require the database container to remain under its generated systemd unit
  ansible.builtin.assert:
    that:
      - >-
        (base_runtime_db_container.rc == 0 and base_runtime_db_service.rc == 0) or
        (base_runtime_db_container.rc == 1 and base_runtime_db_service.rc != 0)
    fail_msg: Existing database container and generated systemd unit disagree; operator recovery is required.
- name: Verify the existing database container before any runtime mutation
  ansible.builtin.include_tasks: verify-base-db-container.yml
  when: base_runtime_db_container.rc == 0
- name: Require the existing database volume to contain an adoptable cluster or be empty
  ansible.builtin.command:
    argv:
      - podman
      - unshare
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', repo_root + '/deploy/ansible/check_postgres_volume.py', rstrip=false) }}"
      - "{{ (base_runtime_volume_details.results | selectattr('item.item', 'equalto', 'codexia-postgres') | map(attribute='stdout') | first).split('|')[1] }}"
  register: base_runtime_pgdata_before
  changed_when: false
  failed_when: base_runtime_pgdata_before.rc != 0
  when: "'codexia-postgres' in (base_runtime_volumes.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list)"
- name: Reject an unknown or incompatible database volume layout before installing files
  ansible.builtin.assert:
    that:
      - (base_runtime_pgdata_before.stdout | from_json).state in ['empty', 'ready']
      - base_runtime_db_container.rc != 0 or (base_runtime_pgdata_before.stdout | from_json).state == 'ready'
    fail_msg: Existing PostgreSQL volume data is not a canonical PostgreSQL 17 cluster; no DB service will be started.
  when: base_runtime_pgdata_before is not skipped
- name: Inspect every existing base Quadlet before changing host files or Podman resources
  ansible.builtin.stat:
    path: "{{ quadlet_dir }}/{{ item }}"
    follow: false
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  loop:
    - codexia.network
    - codexia-data.network
    - codexia-postgres.volume
    - codexia-data.volume
    - codexia-history.volume
    - codexia-db.container
  register: base_runtime_existing_quadlets
- name: Reject symlinked or special existing base Quadlets before mutation
  ansible.builtin.assert:
    that:
      - not item.stat.exists or ((item.stat.isreg | default(false)) and not (item.stat.islnk | default(false)))
    fail_msg: Existing base Quadlet must be a regular file, not a symlink or special file.
  loop: "{{ base_runtime_existing_quadlets.results }}"
- name: Require the source Quadlet for an already running base container
  ansible.builtin.assert:
    that:
      - base_runtime_existing_quadlets.results[item.index].stat.exists
      - base_runtime_existing_quadlets.results[item.index].stat.isreg | default(false)
      - not (base_runtime_existing_quadlets.results[item.index].stat.islnk | default(false))
    fail_msg: An existing base container must already have its generated Quadlet file.
  loop:
    - {name: codexia-db, index: 5}
  when: base_runtime_db_container.rc == 0
- name: Reject any existing base Quadlet drift before mutation
  ansible.builtin.assert:
    that:
      - item.stat.checksum is defined
      - item.stat.checksum == (lookup('ansible.builtin.file', repo_root + '/deploy/quadlet/' + item.item, rstrip=false) | hash('sha256'))
    fail_msg: Existing Codexia Quadlet differs from the reviewed source; no runtime resources were changed.
  loop: "{{ base_runtime_existing_quadlets.results | selectattr('stat.exists', 'equalto', true) | list }}"
- name: Require explicit approval before PostgreSQL would initialize an empty data volume
  ansible.builtin.assert:
    that: codexia_database_initialization_approved | default(false) | bool
    fail_msg: Explicit approval is required before initializing an empty PostgreSQL volume.
  when: >-
    base_runtime_db_container.rc == 1 and
    (base_runtime_pgdata_before is skipped or (base_runtime_pgdata_before.stdout | from_json).state == 'empty')
- name: Converge the independent management connector and closed product publication gate
  ansible.builtin.include_tasks: prepare-api-gate.yml
- name: Inspect the PostgreSQL init-script directory without following links
  become: true
  become_user: root
  ansible.builtin.stat:
    path: /etc/codexia
    follow: false
  register: base_runtime_init_parent
- name: Reject a symlinked or non-directory PostgreSQL config parent
  ansible.builtin.assert:
    that:
      - not base_runtime_init_parent.stat.exists or ((base_runtime_init_parent.stat.isdir | default(false)) and not (base_runtime_init_parent.stat.islnk | default(false)))
    fail_msg: The PostgreSQL config parent must be a real directory.
- name: Inspect the PostgreSQL init-script directory without following links
  become: true
  become_user: root
  ansible.builtin.stat:
    path: /etc/codexia/postgres
    follow: false
  register: base_runtime_init_directory
- name: Reject a symlinked or non-directory PostgreSQL init-script path
  ansible.builtin.assert:
    that:
      - not base_runtime_init_directory.stat.exists or ((base_runtime_init_directory.stat.isdir | default(false)) and not (base_runtime_init_directory.stat.islnk | default(false)))
    fail_msg: The PostgreSQL init-script path must be a real directory.
- name: Inspect the existing PostgreSQL initializer without following links
  become: true
  become_user: root
  ansible.builtin.stat:
    path: /etc/codexia/postgres/010-create-app-role.sh
    follow: false
    checksum_algorithm: sha1
  register: base_runtime_existing_init_script
- name: Reject a symlinked or special existing PostgreSQL initializer
  ansible.builtin.assert:
    that:
      - not base_runtime_existing_init_script.stat.exists or ((base_runtime_existing_init_script.stat.isreg | default(false)) and not (base_runtime_existing_init_script.stat.islnk | default(false)))
      - not base_runtime_existing_init_script.stat.exists or base_runtime_existing_init_script.stat.checksum == (lookup('ansible.builtin.file', repo_root + '/deploy/postgres/010-create-app-role.sh', rstrip=false) | hash('sha1'))
    fail_msg: The PostgreSQL initializer must be a regular file, not a symlink or special file.
- name: Ensure the PostgreSQL config parent is traversable by the rootless service account
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/codexia
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Create the rootless Quadlet and PostgreSQL init-script directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ quadlet_dir }}", mode: '0700'}
- name: Create the protected PostgreSQL init-script directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/codexia/postgres
    state: directory
    owner: "{{ codexia_service_user }}"
    group: root
    mode: '0750'
- name: Install the canonical app-role initializer only when absent
  become: true
  become_user: root
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/postgres/010-create-app-role.sh"
    dest: /etc/codexia/postgres/010-create-app-role.sh
    owner: "{{ codexia_service_user }}"
    group: root
    mode: '0555'
    force: false
# The service UID maps to container root, not postgres (UID 999).
# The canonical script has no credentials; the host parent remains 0750.
- name: Ensure the init script is readable inside the rootless database container
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/codexia/postgres/010-create-app-role.sh
    state: file
    owner: "{{ codexia_service_user }}"
    group: root
    mode: '0555'
- name: Verify the existing init script without replacing it
  become: true
  become_user: root
  ansible.builtin.stat:
    path: /etc/codexia/postgres/010-create-app-role.sh
    follow: false
    checksum_algorithm: sha1
  register: base_runtime_init_script
- name: Reject an unexpected existing PostgreSQL initializer
  ansible.builtin.assert:
    that:
      - base_runtime_init_script.stat.mode == '0555'
      - base_runtime_init_script.stat.pw_name == codexia_service_user
      - base_runtime_init_script.stat.checksum == (lookup('ansible.builtin.file', repo_root + '/deploy/postgres/010-create-app-role.sh', rstrip=false) | hash('sha1'))
    fail_msg: Existing PostgreSQL init script differs from the canonical initializer; it was not overwritten.
- name: Install missing canonical network, volume, and database Quadlets
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/quadlet/{{ item }}"
    dest: "{{ quadlet_dir }}/{{ item }}"
    mode: '0600'
    force: false
  loop:
    - codexia.network
    - codexia-data.network
    - codexia-postgres.volume
    - codexia-data.volume
    - codexia-history.volume
    - codexia-db.container
  register: base_runtime_quadlet_copies
- name: Create only missing fixed Podman networks
  ansible.builtin.command:
    argv: [podman, network, create, --driver, bridge, codexia]
  when: base_runtime_networks.results[0].rc == 1
  changed_when: true
- name: Create only the missing internal PostgreSQL network
  ansible.builtin.command:
    argv: [podman, network, create, --driver, bridge, --internal, codexia-data]
  when: base_runtime_networks.results[1].rc == 1
  changed_when: true
- name: Create only missing fixed Podman volumes
  ansible.builtin.command:
    argv: [podman, volume, create, "{{ item.item }}"]
  loop: "{{ base_runtime_volumes.results | selectattr('rc', 'equalto', 1) | list }}"
  changed_when: true
- name: Reload generated rootless systemd units without restarting existing containers
  ansible.builtin.command:
    argv: [systemctl, --user, daemon-reload]
  changed_when: false
  when: >-
    (base_runtime_quadlet_copies.results | selectattr('changed', 'equalto', true) | list | length > 0) or
    base_runtime_db_service.rc == 4
- name: Start PostgreSQL only when its container does not already exist
  ansible.builtin.systemd_service:
    name: codexia-db.service
    scope: user
    state: started
  when: base_runtime_db_container.rc == 1
- name: Wait for the permanent PostgreSQL server to accept TCP connections
  ansible.builtin.command:
    argv: [podman, exec, codexia-db, pg_isready, -h, 127.0.0.1, -U, codexia_admin, -d, codexia]
  register: base_runtime_pg_ready
  changed_when: false
  retries: 60
  delay: 2
  until: base_runtime_pg_ready.rc == 0
  check_mode: false
- name: Verify the resulting database container before using its data
  ansible.builtin.include_tasks: verify-base-db-container.yml
- name: Inspect the PostgreSQL volume after safe creation or adoption
  ansible.builtin.command:
    argv:
      - podman
      - volume
      - inspect
      - --format
      - "{% raw %}{{.Name}}|{{.Mountpoint}}{% endraw %}"
      - codexia-postgres
  register: base_runtime_pg_volume
  changed_when: false
- name: Recheck the PostgreSQL volume layout without modifying data
  ansible.builtin.command:
    argv:
      - podman
      - unshare
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', repo_root + '/deploy/ansible/check_postgres_volume.py', rstrip=false) }}"
      - "{{ base_runtime_pg_volume.stdout.split('|')[1] }}"
  register: base_runtime_pgdata_after_start
  changed_when: false
  failed_when: base_runtime_pgdata_after_start.rc != 0
- name: Require the adopted or freshly initialized cluster to remain PostgreSQL 17
  ansible.builtin.assert:
    that:
      - (base_runtime_pgdata_after_start.stdout | from_json).state == 'ready'
      - (base_runtime_pgdata_after_start.stdout | from_json).version == '17'
    fail_msg: PostgreSQL did not leave an adoptable version-17 data directory; no schema migration was attempted.
- name: Verify the private administrator can authenticate with its existing secret
  no_log: true
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - codexia-db
      - sh
      - -ec
      - "export PGPASSWORD=\"$(cat /run/secrets/admin-password)\"; exec psql -X -qAt -h 127.0.0.1 -U codexia_admin -d codexia -c 'SELECT current_user'"
    expand_argument_vars: false
  register: base_runtime_admin_login
  changed_when: false
  failed_when: base_runtime_admin_login.rc != 0 or base_runtime_admin_login.stdout != 'codexia_admin'
  check_mode: false
- name: Use the installed administrator secret for local PostgreSQL management
  ansible.builtin.set_fact:
    base_runtime_admin_psql:
      - podman
      - exec
      - -i
      - codexia-db
      - sh
      - -ec
      - 'export PGPASSWORD="$(cat /run/secrets/admin-password)"; exec psql -X -v ON_ERROR_STOP=1 "$@"'
      - sh
      - -U
      - codexia_admin
- name: Inspect the application role before handling a retryable empty-cluster initialization
  ansible.builtin.command:
    argv: "{{ base_runtime_admin_psql + ['-qAt', '-d', 'postgres', '-c', \"SELECT count(*) FROM pg_roles WHERE rolname='codexia'\"] }}"
  register: base_runtime_app_role_count
  changed_when: false
- name: Inspect the existing application database owner
  ansible.builtin.command:
    argv: "{{ base_runtime_admin_psql + ['-qAt', '-d', 'postgres', '-c', \"SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname='codexia'\"] }}"
  register: base_runtime_app_database_owner
  changed_when: false
- name: Count application objects before any missing-role repair
  ansible.builtin.command:
    argv: "{{ base_runtime_admin_psql + ['-qAt', '-d', 'codexia', '-c', base_runtime_object_count_sql] }}"
  vars:
    base_runtime_object_count_sql: >-
        SELECT count(*) FROM (
          SELECT c.oid FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
            AND n.nspname !~ '^pg_toast' AND c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
          UNION ALL
          SELECT p.oid FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') AND n.nspname !~ '^pg_toast'
          UNION ALL
          SELECT t.oid FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
          WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
            AND n.nspname !~ '^pg_toast' AND t.typelem = 0
        ) AS application_objects
  register: base_runtime_application_object_count
  changed_when: false
- name: Require explicit approval and a pristine schema before creating a missing application role
  ansible.builtin.assert:
    that:
      - codexia_database_initialization_approved | default(false) | bool
      - base_runtime_app_database_owner.stdout == 'codexia_admin'
      - base_runtime_application_object_count.stdout | int == 0
    fail_msg: Missing application role is recoverable only for an explicitly approved empty PostgreSQL database.
  when: base_runtime_app_role_count.stdout == '0'
- name: Reconcile a missing application role after an interrupted fresh initdb transaction
  no_log: true
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - -i
      - codexia-db
      - sh
      - -ec
      - >-
        export PGPASSWORD="$(cat /run/secrets/admin-password)" PG_APP_PASSWORD="$(cat /run/secrets/app-password)";
        exec psql -X -v ON_ERROR_STOP=1 -U codexia_admin -d postgres
    expand_argument_vars: false
    stdin: |-
      \getenv app_password PG_APP_PASSWORD
      BEGIN;
      SELECT format('CREATE ROLE codexia LOGIN PASSWORD %L', :'app_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'codexia') \gexec
      ALTER DATABASE codexia OWNER TO codexia;
      COMMIT;
  register: base_runtime_app_role_recovery
  changed_when: true
  when: base_runtime_app_role_count.stdout == '0'
- name: Verify app and administrator role attributes without changing database state
  no_log: true
  ansible.builtin.command:
    argv: [podman, exec, -i, codexia-db, sh, -ec, 'export PGPASSWORD="$(cat /run/secrets/admin-password)"; exec psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -U codexia_admin -d codexia']
    expand_argument_vars: false
    stdin: "{{ lookup('ansible.builtin.file', repo_root + '/deploy/ansible/verify-postgres-roles.sql', rstrip=false) }}"
  register: base_runtime_role_verification
  changed_when: false
  check_mode: false
- name: Verify the app role can authenticate with its existing secret
  no_log: true
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - codexia-db
      - sh
      - -ec
      - "export PGPASSWORD=\"$(cat /run/secrets/app-password)\"; exec psql -X -qAt -h 127.0.0.1 -U codexia -d codexia -c 'SELECT current_user'"
    expand_argument_vars: false
  register: base_runtime_app_login
  changed_when: false
  failed_when: base_runtime_app_login.rc != 0 or base_runtime_app_login.stdout != 'codexia'
  check_mode: false
- name: Read packaged PostgreSQL migration files from the reviewed control-node checkout
  ansible.builtin.find:
    paths: "{{ repo_root }}/packages/persistence-postgres/migrations"
    patterns: '[0-9]*.sql'
    file_type: file
  register: base_runtime_expected_migration_files
  delegate_to: localhost
  become: false
  changed_when: false
- name: Require a nonempty packaged PostgreSQL migration set
  ansible.builtin.assert:
    that: base_runtime_expected_migration_files.matched | int > 0
    fail_msg: Packaged PostgreSQL migration identity is unavailable; database adoption is blocked.
- name: Calculate immutable packaged PostgreSQL migration checksums
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
  loop: "{{ base_runtime_expected_migration_files.files }}"
  register: base_runtime_expected_migration_stats
  delegate_to: localhost
  become: false
  changed_when: false
- name: Build the exact packaged PostgreSQL migration identity map
  ansible.builtin.set_fact:
    base_runtime_expected_migration_ledger: >-
      {{ dict(
        base_runtime_expected_migration_stats.results | map(attribute='item.path') | map('basename')
        | zip(base_runtime_expected_migration_stats.results | map(attribute='stat.checksum'))
      ) }}
- name: Observe whether the application schema ledger exists without creating it
  ansible.builtin.command:
    argv: "{{ base_runtime_admin_psql + ['-qAt', '-d', 'codexia', '-c', \"SELECT to_regclass('public.codexia_schema_migrations') IS NOT NULL\"] }}"
  register: base_runtime_schema_present
  changed_when: false
- name: Count untracked user schema objects when no migration ledger exists
  ansible.builtin.command:
    argv: "{{ base_runtime_admin_psql + ['-qAt', '-d', 'codexia', '-c', base_runtime_untracked_objects_sql] }}"
  vars:
    base_runtime_untracked_objects_sql: >-
        SELECT count(*) FROM (
          SELECT c.oid FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
            AND n.nspname !~ '^pg_toast' AND c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
          UNION ALL
          SELECT p.oid FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') AND n.nspname !~ '^pg_toast'
          UNION ALL
          SELECT t.oid FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
          WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
            AND n.nspname !~ '^pg_toast' AND t.typelem = 0
        ) AS untracked
  register: base_runtime_untracked_schema_objects
  changed_when: false
  when: base_runtime_schema_present.stdout == 'f'
- name: Reject untracked application schema without a migration ledger
  ansible.builtin.assert:
    that:
      - base_runtime_untracked_schema_objects.stdout | int == 0
    fail_msg: Existing PostgreSQL application objects have no migration ledger and cannot be adopted safely.
  when: base_runtime_schema_present.stdout == 'f'
- name: Read the existing migration ledger without changing the database
  ansible.builtin.command:
    argv: "{{ base_runtime_admin_psql + ['-qAt', '-d', 'codexia', '-c', base_runtime_migration_ledger_sql] }}"
  vars:
    base_runtime_migration_ledger_sql: >-
        SELECT coalesce(
          json_agg(json_build_object('version', version, 'checksum', btrim(checksum)) ORDER BY version),
          '[]'::json
        )::text
        FROM public.codexia_schema_migrations
  register: base_runtime_schema_ledger_rows
  changed_when: false
  when: base_runtime_schema_present.stdout == 't'
- name: Reject missing, changed, or newer PostgreSQL migrations without repair
  ansible.builtin.assert:
    that:
      - >-
        (base_runtime_schema_ledger_rows.stdout | from_json
        | items2dict(key_name='version', value_name='checksum')) == base_runtime_expected_migration_ledger
    fail_msg: PostgreSQL schema migration ledger differs from the packaged release; no schema changes were made.
  when: base_runtime_schema_present.stdout == 't'
- name: Report safe base runtime adoption without mutating database schema
  ansible.builtin.debug:
    msg: Verified canonical rootless networks, exact persistent volume names, pinned PostgreSQL 17, exact schema migration identity when present, and separate database roles. Existing database data and credentials were preserved.
