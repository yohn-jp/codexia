---
- name: Test PostgreSQL app-password rotation approval gates before staging
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    codexia_postgres_app_password_rotation_file: "{{ lookup('env', 'CODEXIA_TEST_APP_PASSWORD_FILE') }}"
    codexia_app_password_restore_receipt_file: "{{ lookup('env', 'CODEXIA_TEST_RESTORE_RECEIPT_FILE') }}"
  tasks:
    - name: Validate protected rotation inputs with the production validator
      ansible.builtin.import_tasks: validate-app-password-rotation-inputs.yml
