---
- name: Require explicit approval for standalone API token rotation
  ansible.builtin.assert:
    that:
      - codexia_api_auth_token_rotation_approved | default(false) | bool
      - not ansible_check_mode
      - journal.stat.exists
    fail_msg: API token rotation requires an initialized reviewed controller, a paused writer, and explicit approval.
- name: Verify installed reviewed sources and units without changing them
  ansible.builtin.include_tasks: verify-updater-inputs.yml
- name: Verify installed reviewed updater units
  ansible.builtin.include_tasks: verify-updater-units.yml
- name: Validate protected API token file before staging
  ansible.builtin.include_tasks: validate-api-auth-token-rotation-inputs.yml
- name: Create private API token staging parent
  ansible.builtin.file:
    path: "{{ config_dir }}/maintenance/candidates"
    state: directory
    mode: '0700'
- name: Allocate private API token rotation candidate
  ansible.builtin.tempfile:
    state: directory
    path: "{{ config_dir }}/maintenance/candidates"
    prefix: api-auth-token-
  register: api_auth_token_candidate
- name: Apply the locked standalone API token transaction
  block:
    - name: Create private API token credential directory
      ansible.builtin.file:
        path: "{{ api_auth_token_candidate.path }}/credentials"
        state: directory
        mode: '0700'
    - name: Stage replacement token without logging or diff
      ansible.builtin.copy:
        src: "{{ codexia_api_auth_token_rotation_file }}"
        dest: "{{ api_auth_token_candidate.path }}/credentials/api-auth-token"
        mode: '0600'
      no_log: true
      diff: false
    - name: Write the strict API token maintenance manifest
      ansible.builtin.copy:
        content: >-
          {{
            {
              'format': 'codexia-updater-maintenance/v1',
              'candidateRoot': api_auth_token_candidate.path,
              'sourceDir': source_dir,
              'unitDir': unit_dir,
              'configPath': config_path,
              'rotateApiAuthToken': true,
              'apiAuthTokenFile': api_auth_token_candidate.path + '/credentials/api-auth-token'
            } | to_nice_json
          }}
          {{ '\n' }}
        dest: "{{ api_auth_token_candidate.path }}/manifest.json"
        mode: '0600'
    - name: Rotate only the canonical Podman API token under the updater lock
      ansible.builtin.command:
        argv: [sh, "{{ updater }}", maintain, "{{ config_path }}", "{{ api_auth_token_candidate.path }}/manifest.json"]
      environment: "{{ updater_env }}"
      register: api_auth_token_rotation_result
      changed_when: true
      no_log: true
      diff: false
    - name: Require authenticated replacement token and serving verification
      ansible.builtin.assert:
        that: (api_auth_token_rotation_result.stdout | from_json).apiAuthTokenRotated
  always:
    - name: Remove staged API token after the transaction
      ansible.builtin.file:
        path: "{{ api_auth_token_candidate.path }}"
        state: absent
      no_log: true
