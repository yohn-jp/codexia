---
- name: Inspect the existing Tunnel runtime configuration and secret references
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - --format
      - >-
        {% raw %}{"image":{{json .Config.Image}},
        "networks":{{json .NetworkSettings.Networks}},
        "ports":{{json .HostConfig.PortBindings}},
        "mounts":{{json .Mounts}},
        "secrets":{{json .Config.Secrets}},
        "create_command":{{json .Config.CreateCommand}},
        "read_only":{{json .HostConfig.ReadonlyRootfs}}}{% endraw %}
      - codexia-tunnel
  register: base_runtime_tunnel_inspection
  changed_when: false
  no_log: true
- name: Decode the selected Tunnel container fields
  ansible.builtin.set_fact:
    base_runtime_tunnel_container: "{{ base_runtime_tunnel_inspection.stdout | from_json }}"
  no_log: true
- name: Inspect the current canonical Tunnel secret identity
  ansible.builtin.command:
    argv: [podman, secret, inspect, --format, "{% raw %}{{.ID}}{% endraw %}", codexia-tunnel-token]
  register: base_runtime_tunnel_secret_id
  changed_when: false
- name: Reject existing Tunnel runtime drift before any host mutation
  ansible.builtin.assert:
    that:
      - base_runtime_tunnel_container.image == 'docker.io/cloudflare/cloudflared@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344'
      - (base_runtime_tunnel_container.networks | dict2items | map(attribute='key') | list | sort) == ['codexia']
      - >-
        base_runtime_tunnel_container.ports ==
        {'2000/tcp': [{'HostIp': '127.0.0.1', 'HostPort': '2000'}]}
      - (base_runtime_tunnel_container.secrets | default([], true) | length) == 1
      - (base_runtime_tunnel_container.secrets | default([], true) | first).Name == 'codexia-tunnel-token'
      - (base_runtime_tunnel_container.secrets | default([], true) | first).ID == base_runtime_tunnel_secret_id.stdout
      - >-
        (base_runtime_tunnel_container.create_command | default([], true)
        | select('equalto', 'codexia-tunnel-token,type=mount,target=/run/secrets/token')
        | list | length) == 1 or
        (base_runtime_tunnel_container.create_command | default([], true)
        | select('equalto', '--secret=codexia-tunnel-token,type=mount,target=/run/secrets/token')
        | list | length) == 1
      - (base_runtime_tunnel_container.mounts | selectattr('Type', 'equalto', 'volume') | list | length) == 0
      - (base_runtime_tunnel_container.mounts | selectattr('Type', 'equalto', 'bind') | rejectattr('Destination', 'equalto', '/run/secrets/token') | list | length) == 0
      - base_runtime_tunnel_container.read_only is true
    fail_msg: Existing Tunnel image, private network, loopback-only port, protected token mount or read-only root filesystem differs from the canonical runtime; no host resources were changed.
