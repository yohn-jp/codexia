---
- name: Require a maintenance window and verified backup/runtime review
  ansible.builtin.assert:
    that:
      - codexia_maintenance_approved | default(false) | bool
      - codexia_installed_release_file is defined
      - codexia_restore_receipt_file is defined
      - codexia_restore_receipt_file is string
      - codexia_restore_receipt_file is match('^/[^\r\n]+$')
    fail_msg: Verify the offline backup and legacy runtime settings before approving maintenance.
- name: Install the selected signed-channel release record
  ansible.builtin.copy:
    src: "{{ codexia_installed_release_file }}"
    dest: "{{ config_dir }}/installed-release.json"
    mode: '0600'
- name: Verify the reviewed updater source and recovery unit inputs
  ansible.builtin.include_tasks: verify-updater-inputs.yml
- name: Refuse drift in any existing boot and poll units
  ansible.builtin.include_tasks: verify-updater-units.yml
  vars:
    allow_missing_updater_units: true
- name: Provision boot recovery before any disruptive cutover
  ansible.builtin.include_tasks: install-units.yml
  vars:
    recovery_install_only: true
- name: Stage the protected restore receipt on the source host
  ansible.builtin.tempfile:
    state: directory
    path: "{{ config_dir }}"
    prefix: cutover-proof-
  register: codexia_cutover_proof_dir
- name: Require exact restored backup before legacy writer disruption
  block:
    - name: Copy the isolated recovery host's receipt from the trusted control node
      ansible.builtin.copy:
        src: "{{ codexia_restore_receipt_file }}"
        dest: "{{ codexia_cutover_proof_dir.path }}/restore.json"
        mode: '0600'
      no_log: true
    - name: Verify evidence and perform the exclusive durable cutover in one locked operation
      ansible.builtin.command:
        argv: [sh, "{{ updater }}", cutover, "{{ config_path }}", "{{ config_dir }}/installed-release.json", "{{ codexia_cutover_proof_dir.path }}/restore.json", --approved]
      register: cutover_result
      changed_when: true
      no_log: true
    - name: Require successful private activation and Tunnel handoff
      ansible.builtin.assert:
        that:
          - (cutover_result.stdout | from_json).activated
  always:
    - name: Remove only the temporary cutover receipt directory
      ansible.builtin.file:
        path: "{{ codexia_cutover_proof_dir.path }}"
        state: absent
