---
- name: Require explicit credential rotation approval
  ansible.builtin.assert:
    that:
      - codexia_probe_credential_rotation_approved | default(false) | bool
      - not ansible_check_mode
    fail_msg: Probe credential rotation requires an initialized reviewed runtime and explicit approval.
- name: Verify installed reviewed sources and units without changing them
  ansible.builtin.include_tasks: verify-updater-inputs.yml
- name: Verify installed reviewed units
  ansible.builtin.include_tasks: verify-updater-units.yml
- name: Validate protected credential inputs
  vars:
    probe_inputs:
      - {name: github-read-token, src: "{{ codexia_github_token_file }}"}
      - {name: access-client-id, src: "{{ codexia_access_id_file }}"}
      - {name: access-client-secret, src: "{{ codexia_access_secret_file }}"}
  block:
    - name: Require absolute credential input paths
      ansible.builtin.assert:
        that:
          - item.src is string
          - item.src.startswith('/')
      loop: "{{ probe_inputs }}"
      no_log: true
    - name: Inspect private input files on the control node
      ansible.builtin.stat:
        path: "{{ item.src }}"
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop: "{{ probe_inputs }}"
      register: probe_input_stats
      delegate_to: localhost
      become: false
      no_log: true
    - name: Require regular non-symlink input files with private permissions
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.mode in ['0400', '0600']
          - item.stat.size > 0
          - item.stat.size <= 8192
      loop: "{{ probe_input_stats.results }}"
      no_log: true
    - name: Create private staging parent
      ansible.builtin.file:
        path: "{{ maintenance_dir }}/candidates"
        state: directory
        mode: '0700'
    - name: Allocate private credential candidate
      ansible.builtin.tempfile:
        state: directory
        path: "{{ maintenance_dir }}/candidates"
        prefix: credentials-
      register: probe_candidate
    - name: Apply credential-only candidate
      block:
        - name: Create private credential directory
          ansible.builtin.file:
            path: "{{ probe_candidate.path }}/credentials"
            state: directory
            mode: '0700'
        - name: Stage protected inputs without logging or diff
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ probe_candidate.path }}/credentials/{{ item.name }}"
            mode: '0600'
          loop: "{{ probe_inputs }}"
          no_log: true
          diff: false
        - name: Write the credential-only maintenance manifest
          ansible.builtin.copy:
            content: "{{ {'format': 'codexia-updater-maintenance/v1', 'candidateRoot': probe_candidate.path, 'sourceDir': source_dir, 'unitDir': unit_dir, 'configPath': config_path, 'rotateProbeCredentials': true} | to_json }}\n"
            dest: "{{ probe_candidate.path }}/manifest.json"
            mode: '0600'
        - name: Rotate and verify the paired credentials under the installed updater lock
          ansible.builtin.command:
            argv: [sh, "{{ updater }}", maintain, "{{ config_path }}", "{{ probe_candidate.path }}/manifest.json"]
          register: probe_rotation
          changed_when: true
          no_log: true
        - name: Require successful credential-only transaction
          ansible.builtin.assert:
            that: (probe_rotation.stdout | from_json).probeCredentialsRotated
      always:
        - name: Remove staged new credentials
          ansible.builtin.file:
            path: "{{ probe_candidate.path }}"
            state: absent
          no_log: true
