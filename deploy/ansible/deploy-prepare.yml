---
- name: Recover interrupted deployment before preparing target state
  when: codexia_expected_first_activation is not defined and codexia_expected_recovery_activation is not defined
  ansible.builtin.command:
    argv: [bash, -s]
    stdin: "{{ lookup('ansible.builtin.file', repo_root + '/deploy/ansible/push-deployment-recover.sh') }}"
  environment:
    CODEXIA_PUSH_STATE_DIR: "{{ home }}/.local/state/codexia-deploy"
    CODEXIA_PUSH_QUADLET_DIR: "{{ quadlet_dir }}"
  register: codexia_deploy_recovery
  changed_when: "'RECOVERED_PREVIOUS_RELEASE' in codexia_deploy_recovery.stdout or 'CLEANED_COMMITTED_TRANSACTION' in codexia_deploy_recovery.stdout"

- name: Resume an interrupted backup before observing the installed API
  when: codexia_expected_recovery_activation is not defined
  ansible.builtin.command:
    argv: [bash, -s, --, recover]
    stdin: "{{ lookup('ansible.builtin.file', repo_root + '/deploy/backup/backup-runner.sh') }}"
  environment:
    HOME: "{{ home }}"
  changed_when: false
  no_log: true

- name: Create push deployment state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: codexia
    group: "{{ codexia_service_group | default('codexia') }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ home }}/.local/state/codexia-deploy", mode: '0700'}
    - {path: "{{ home }}/.local/bin", mode: '0700'}
    - {path: "{{ home }}/.config/systemd/user", mode: '0700'}

- name: Stage the read-only observer for locked activation checks
  when: codexia_expected_first_activation is defined or codexia_expected_recovery_activation is defined
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/ansible/preflight-observe.py"
    dest: "{{ home }}/.local/bin/codexia-preflight-observe"
    owner: codexia
    group: "{{ codexia_service_group | default('codexia') }}"
    mode: '0700'

- name: Install the interrupted deployment recovery helper
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/ansible/push-deployment-recover.sh"
    dest: "{{ home }}/.local/bin/codexia-deploy-recover"
    owner: codexia
    group: "{{ codexia_service_group | default('codexia') }}"
    mode: '0700'
