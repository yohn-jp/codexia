all:
  children:
    codexia:
      hosts:
        standalone:
          ansible_host: codexia.example.invalid
          ansible_user: codexia
      vars:
        codexia_stage: prepare
        # Base runtime convergence is a separate pre-initialization stage.
        codexia_base_approved: false
        codexia_frontend_origin: https://codexia.example.invalid
        codexia_browser_auth:
          mode: token
        # Pin a certified backend digest for the private proxy.
        codexia_proxy_image: ghcr.io/yohn-jp/codexia-backend@sha256:REPLACE_WITH_VERIFIED_DIGEST
        # Base secrets: exact protected file content; do not commit these inputs.
        codexia_secrets_approved: false
        codexia_auth_token_file: /private/api-auth-token
        codexia_tunnel_token_file: /private/tunnel-token
        codexia_postgres_admin_password_file: /private/postgres-admin-password
        codexia_postgres_app_password_file: /private/postgres-app-password
        # Private control-node files; use Ansible Vault for the secret variable.
        codexia_public_key_file: /private/channel-public.pem
        codexia_github_token_file: /private/github-read-token
        codexia_access_id_file: /private/access-client-id
        codexia_access_secret_file: /private/access-client-secret
        # codexia_preflight_password: supply via encrypted extra-vars (64 hex chars)
        # Initialize only after a verified offline backup and runtime review.
        codexia_maintenance_approved: false
        codexia_acceptance_approved: false
        # codexia_installed_release_file: /private/installed-release.json
