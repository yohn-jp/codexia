all:
  children:
    codexia:
      hosts:
        node:
          ansible_host: codexia.example.invalid
          ansible_user: codexia-bootstrap  # Existing SSH identity with sudo for initial provisioning
      vars:
        # Supported stages: inspect, bootstrap, host, secrets, base, auth-runtime, deploy, restore-drill.
        codexia_stage: inspect
        codexia_service_user: codexia
        codexia_service_group: codexia
        codexia_service_uid: 1001
        codexia_service_gid: 1001
        codexia_service_home: /home/codexia
        # Public half of the dedicated protected workflow key, when managed here.
        # codexia_deploy_ssh_public_key: "ssh-ed25519 <public-key>"
        codexia_host_approved: false
        codexia_create_service_account: false
        codexia_secrets_approved: false
        codexia_base_approved: false
        # After ACTIVE, enable the VM backup runtime in the protected base operation.
        # Supply the public age recipient and allowed policy per deploy/backup/CONSOLE.md.
        codexia_backup_runtime_approved: false
        codexia_database_initialization_approved: false
        # On a fresh database, supply the reviewed immutable Full digest and
        # approve database initialization. Podman fetches that digest when missing.
        # codexia_auth_bootstrap_image: ghcr.io/yohn-jp/codexia-backend@sha256:<digest>
        codexia_auth_runtime_approved: false
        codexia_auth_database_url_file: /private/codexia-auth-database-url
        codexia_auth_secret_file: /private/codexia-auth-secret
        codexia_oidc_client_secret_file: /private/codexia-oidc-client-secret
        codexia_oauth_introspection_client_secret_file: /private/codexia-oauth-introspection-client-secret
        codexia_public_origin: https://codexia.example.invalid
        codexia_oidc_issuer: https://idp.example.invalid/oidc
        codexia_oidc_client_id: codexia-web
        codexia_oauth_introspection_client_id: codexia-resource-server
        # For setup-only browser enrollment, omit all OIDC settings and set
        # legacy registration pending false. These approvals default to false.
        # codexia_owner_setup_approved: true
        # codexia_owner_setup_edge_approved: true
        # codexia_owner_setup_age_recipient: age1<reviewed-owner-public-recipient>
        # codexia_owner_setup_web_redirect_uris:
        #   - https://codexia.example.invalid/desktop/
        # For legacy first enrollment, stage these three private files on the controller:
        # bootstrap.env, tls.crt and tls.key. Keep the directory configured on
        # finalization so Ansible removes the enrollment copies from the VM.
        # codexia_auth_enrollment_files_dir: /private/codexia-enrollment
        codexia_auth_registration_pending: true
        # After enrollment, set pending to false and use the returned internal ID.
        # codexia_oauth_owner_subject: enrolled-owner-id
        codexia_oauth_owner_client_ids: codexia-web,codexia-ios
        # Optional after owner enrollment, for separately registered MCP clients.
        # codexia_oauth_mcp_client_ids: approved-mcp-client
        # codexia_oauth_mcp_project_assignments:
        #   approved-mcp-client: [00000000-0000-4000-8000-000000000001]
        # Optional: match the API resource URI registered with the provider.
        # codexia_api_audience: https://codexia.example.invalid/api
        # Required only for explicitly approved base-secret convergence.
        codexia_tunnel_token_file: /private/tunnel-token
        codexia_postgres_admin_password_file: /private/postgres-admin-password
        codexia_postgres_app_password_file: /private/postgres-app-password
        # Protected push-deployment parameters are supplied at execution,
        # not stored as credentials or production values in this inventory.
        # First activation uses these approvals to verify and start on the
        # separately initialized application database.
        codexia_initial_install_approved: false
