all:
  children:
    codexia:
      hosts:
        node:
          ansible_host: codexia.example.invalid
          ansible_user: codexia
      vars:
        # Supported stages: inspect, host, secrets, base, auth-runtime, deploy, restore-drill.
        codexia_stage: inspect
        codexia_service_user: codexia
        codexia_service_group: codexia
        codexia_service_uid: 1001
        codexia_service_gid: 1001
        codexia_service_home: /home/codexia
        codexia_host_approved: false
        codexia_create_service_account: false
        codexia_secrets_approved: false
        codexia_base_approved: false
        codexia_database_initialization_approved: false
        # Better Auth provisioning creates only the runtime role/schema and
        # rootless secrets; migrations and service activation are separate.
        codexia_auth_runtime_approved: false
        codexia_auth_database_url_file: /private/codexia-auth-database-url
        codexia_auth_secret_file: /private/codexia-auth-secret
        codexia_oidc_client_secret_file: /private/codexia-oidc-client-secret
        codexia_oauth_introspection_client_secret_file: /private/codexia-oauth-introspection-client-secret
        codexia_public_origin: https://codexia.example.invalid
        codexia_oidc_issuer: https://codexia.example.invalid/api/auth
        codexia_oidc_client_id: codexia-web
        codexia_oauth_introspection_client_id: codexia-resource-server
        codexia_oauth_owner_subject: owner-subject-from-provider
        codexia_oauth_owner_client_ids: codexia-web,codexia-ios
        # Optional: match the API resource URI registered with the provider.
        # codexia_api_audience: https://codexia.example.invalid/api
        # Required only for explicitly approved base-secret convergence.
        codexia_auth_token_file: /private/api-auth-token
        codexia_tunnel_token_file: /private/tunnel-token
        codexia_postgres_admin_password_file: /private/postgres-admin-password
        codexia_postgres_app_password_file: /private/postgres-app-password
        # Protected push-deployment parameters are supplied at execution,
        # not stored as credentials or production values in this inventory.
        codexia_initial_install_approved: false
