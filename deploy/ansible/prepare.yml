---
- name: Require a distinct preflight credential
  ansible.builtin.assert:
    that:
      - codexia_preflight_password is match('^[a-fA-F0-9]{64}$')
  no_log: true
- name: Verify existing database and networks
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [podman, exec, codexia-db, pg_isready, -U, codexia, -d, codexia]
    - [podman, network, exists, codexia]
    - [podman, network, exists, codexia-data]
    - [podman, volume, exists, codexia-data]
    - [podman, volume, exists, codexia-history]
    - [podman, secret, exists, codexia-auth-token]
    - [podman, secret, exists, codexia-postgres-app-password]
  changed_when: false
  check_mode: false
- name: Refuse preparation while the updater timer is active
  ansible.builtin.command:
    argv: [systemctl, --user, is-active, codexia-updater.timer]
  register: timer
  changed_when: false
  failed_when: timer.rc not in [3, 4]
  check_mode: false
- name: Create the fixed updater source directory
  become: true
  ansible.builtin.file:
    path: "{{ source_dir }}"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    mode: '0750'
- name: Create updater source and private runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ source_dir }}/deploy"
    - "{{ source_dir }}/deploy/updater"
    - "{{ source_dir }}/scripts"
    - "{{ config_dir }}"
    - "{{ state_dir }}"
    - "{{ quadlet_dir }}"
    - "{{ unit_dir }}"
- name: Install canonical updater runtime from the checked-out source
  ansible.builtin.copy:
    src: "{{ repo_root }}/{{ item }}"
    dest: "{{ source_dir }}/{{ item }}"
    mode: '0600'
  loop:
    - deploy/updater/codexia-updater
    - deploy/updater/standalone-updater.mjs
    - deploy/updater/standalone-host.mjs
    - deploy/updater/proxy.mjs
    - deploy/updater/standalone-backup.sh
    - scripts/standalone-update-controller.mjs
    - scripts/update-host-state.mjs
    - scripts/update-channel.mjs
    - scripts/update-release-policy.mjs
- name: Validate the browser authentication configuration before cutover
  ansible.builtin.command:
    argv:
      - node
      - --input-type=module
      - -e
      - |
        import { PodmanStandaloneHost } from './deploy/updater/standalone-host.mjs';
        new PodmanStandaloneHost(JSON.parse(process.argv[1]));
      - "{{ desired_config | to_json }}"
    chdir: "{{ source_dir }}"
  changed_when: false
  when: not ansible_check_mode
- name: Install private configuration and credentials
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ config_dir }}/{{ item.dest }}"
    mode: '0600'
  loop:
    - {src: "{{ codexia_public_key_file }}", dest: channel-public.pem}
    - {src: "{{ codexia_github_token_file }}", dest: github-read-token}
    - {src: "{{ codexia_access_id_file }}", dest: access-client-id}
    - {src: "{{ codexia_access_secret_file }}", dest: access-client-secret}
  no_log: true
  diff: false
- name: Install disabled desired configuration
  ansible.builtin.copy:
    content: "{{ desired_config | to_nice_json }}\n"
    dest: "{{ config_path }}"
    mode: '0600'
- name: Initialize blocked route without replacing an existing route
  ansible.builtin.copy:
    content: "blocked\n"
    dest: "{{ state_dir }}/route"
    mode: '0600'
    force: false
- name: Verify the route is blocked before initialization
  ansible.builtin.command:
    argv: [cat, "{{ state_dir }}/route"]
  register: route
  changed_when: false
  failed_when: route.stdout != 'blocked'
  when: not ansible_check_mode
- name: Inspect existing preflight Podman secret
  ansible.builtin.command:
    argv: [podman, secret, exists, codexia-postgres-preflight-password]
  register: secret_exists
  changed_when: false
  failed_when: secret_exists.rc not in [0, 1]
  check_mode: false
- name: Read existing preflight secret without exposing it
  ansible.builtin.command:
    argv: [podman, secret, inspect, --showsecret, codexia-postgres-preflight-password]
  register: existing_secret
  changed_when: false
  no_log: true
  check_mode: false
  when: secret_exists.rc == 0
- name: Reject implicit preflight password rotation
  ansible.builtin.assert:
    that: (existing_secret.stdout | from_json | first).SecretData == codexia_preflight_password
  no_log: true
  when: secret_exists.rc == 0
- name: Reject reuse of the existing writer credential
  ansible.builtin.command:
    argv: [podman, exec, -i, codexia-db, sh, -ec, 'IFS= read -r candidate; test "$candidate" != "$(cat /run/secrets/app-password)"']
    expand_argument_vars: false
    stdin: "{{ codexia_preflight_password }}"
  changed_when: false
  no_log: true
  check_mode: false
- name: Converge dedicated database role (never rotate it)
  ansible.builtin.command:
    argv: [podman, exec, -i, codexia-db, sh, -ec, 'export PGPASSWORD="$(cat /run/secrets/admin-password)"; exec psql -X -qAt -v ON_ERROR_STOP=1 -U codexia_admin -d codexia']
    expand_argument_vars: false
    stdin: "{{ '\\set preflight_password ' ~ codexia_preflight_password ~ '\n' ~ lookup('ansible.builtin.file', repo_root + '/deploy/updater/provision-preflight-role.sql') }}"
  register: db_role
  changed_when: "'changed' in db_role.stdout_lines"
  no_log: true
  when: not ansible_check_mode
- name: Prove the actual TCP login is read-only
  ansible.builtin.command:
    argv: [podman, exec, -i, codexia-db, sh, -ec, 'IFS= read -r PGPASSWORD; export PGPASSWORD; exec psql -X -qAt -h 127.0.0.1 -U codexia_preflight -d codexia -c "SELECT current_user || chr(58) || current_setting(''transaction_read_only'')"']
    expand_argument_vars: false
    stdin: "{{ codexia_preflight_password }}"
  register: login
  changed_when: false
  failed_when: login.rc != 0 or login.stdout != 'codexia_preflight:on'
  no_log: true
  when: not ansible_check_mode
- name: Create preflight Podman secret only when absent
  ansible.builtin.command:
    argv: [podman, secret, create, codexia-postgres-preflight-password, '-']
    expand_argument_vars: false
    stdin: "{{ codexia_preflight_password }}"
    stdin_add_newline: false
  no_log: true
  when: secret_exists.rc == 1 and not ansible_check_mode
- name: Install the private proxy Quadlet without starting it
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', repo_root + '/deploy/updater/codexia-api-proxy.container.example') | replace('ghcr.io/yohn-jp/codexia-backend@sha256:REPLACE_WITH_VERIFIED_DIGEST', codexia_proxy_image) }}\n"
    dest: "{{ quadlet_dir }}/codexia-api-proxy.container"
    mode: '0600'
