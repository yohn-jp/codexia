    get:
      operationId: get_resource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: resource
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name:
                    type: integer
