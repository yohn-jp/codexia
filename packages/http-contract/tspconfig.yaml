kind: project
entrypoint: src/main.tsp
emit:
  - "@typespec/openapi3"
output-dir: "{project-root}/.tsp-output"
warn-as-error: true
options:
  "@typespec/openapi3":
    openapi-versions:
      - "3.1.0"
    file-type: "yaml"
    output-file: "codexia.openapi.yaml"
    operation-id-strategy: "explicit-only"
    emitter-output-dir: "{project-root}/openapi"
